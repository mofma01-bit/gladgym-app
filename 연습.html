<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GLAD 트레이너 연습</title>
<link rel="icon" href="icon-192.png">
<style>
/* GLAD 트레이너 연습 — 진짜 앱(가짜 회원 샘플 · 저장 안 됨)을 옆에 띄우고 단계마다 눌러 보며 배운다 (2026-11-06 대표 「직접 눌러 보는 프로그램 · 나란히 놓고」) */
:root{--bg:#121211;--card:#1b1a18;--c2:#23211e;--line:#34322d;--cream:#fffcf8;--sub:#c6bdb2;--gold:#f0d3a0;--gold-2:#d6b87e;--teal:#a9d8e6;--ok:#8fd19e;--blue:#d6ecff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--cream);font:15px/1.6 "Pretendard","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .lg{border:1px solid #5a4c33;color:var(--gold);border-radius:8px;padding:3px 10px;font-weight:900;letter-spacing:.14em;font-size:13px}
.top b{font-size:17px}.top .sp{flex:1}
.top select{background:var(--c2);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px;max-width:62vw}
.prog{min-width:120px;font-size:13px;color:var(--sub)}.prog i{display:block;height:6px;border-radius:9px;background:#2a2824;margin-top:3px;overflow:hidden}.prog u{display:block;height:100%;background:var(--gold);transition:width .3s}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:16px max(16px,env(safe-area-inset-left));height:calc(100% - 60px)}
@media(max-width:900px){.lay{grid-template-columns:1fr;height:auto}}
.steps{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.chh{font-size:20px;font-weight:900}.chh small{display:block;font-size:14px;color:var(--gold);font-weight:800;margin-top:2px}
.st{border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--sub);font-size:14.5px;background:none;text-align:left;color:var(--sub)}
.st.ok{color:var(--ok)}.st.ok::before{content:'✓ '}
.st.now{border-color:var(--gold-2);background:#221e16;color:var(--cream);display:flex;gap:10px;padding:12px}
.st .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2a1c14;font-weight:900;display:flex;align-items:center;justify-content:center}
.st.now b{font-size:16.5px;display:block}.st.now .d{color:var(--sub);font-size:14.5px;margin-top:2px}
.tip{display:block;margin-top:8px;padding:8px 10px;border-radius:9px;background:rgba(70,150,230,.14);border:1px solid #4f8fd0;color:var(--blue);font-size:14px;font-weight:700}
.hint{display:none;margin-top:8px;color:var(--gold);font-weight:800;font-size:14px}.hint.on{display:block;animation:hb .5s 2}
@keyframes hb{50%{transform:translateX(4px)}}
.nx{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.st.now>div:last-child{flex:1;min-width:0}.free{justify-content:flex-end}      /* 단추는 오른쪽 (2026-11-06 13:41 대표) */
.btn{border-radius:12px;min-height:44px;padding:0 16px;font-weight:900;border:1px solid var(--line);background:var(--c2);color:var(--cream)}
.btn.g{background:linear-gradient(180deg,#f3d9a8,#e2c184);color:#2a1c14;border:0}
.btn.s{min-height:36px;font-size:13.5px;font-weight:800;color:var(--sub)}
.free{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13.5px;margin-top:4px}
.done{border:1px solid #3d6b49;background:#16241a;border-radius:12px;padding:14px;color:var(--ok);font-weight:900}
.stage{display:flex;align-items:flex-start;justify-content:center;gap:18px;min-height:0}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px}
.ph .lab{font-size:13.5px;font-weight:900;color:var(--gold)}.ph .lab small{color:var(--sub);font-weight:600;margin-left:6px}
.fr{width:390px;height:844px;border-radius:34px;border:3px solid #3a3731;overflow:hidden;background:#000;transform-origin:top center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.fr iframe{width:390px;height:844px;border:0;display:block}
.arr{align-self:center;font-size:34px;color:var(--gold);font-weight:900;text-align:center}.arr small{display:block;font-size:12.5px;color:var(--sub)}
.pics{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pic{position:relative;width:250px}.pic img{width:100%;border-radius:18px;border:2px solid #3a3731;display:block}
.pic .cap,.cap{font-size:14px;font-weight:800;margin-top:6px}.pic .no,.dpic .no{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#2a1c14;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(240,211,160,.35)}
.dpic{position:relative;width:min(100%,980px)}.pic .im{position:relative}.pic .im img{display:block}.dpic img{width:100%;border-radius:14px;border:2px solid #3a3731;display:block}
.ring{position:absolute;border:3px solid var(--gold);border-radius:14px;box-shadow:0 0 14px rgba(240,211,160,.7)}

/* 설명 : 화면 = 1 : 1 · PC 에서 글을 크게 (2026-11-06 13:40 대표 「설명이랑 화면이 1:1」) · 둘 나란히 장은 화면 쪽을 넓게 */
@media(min-width:901px){body.duo .lay{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}}.stage{flex-wrap:wrap;min-width:0}
@media(min-width:1100px){.steps{padding:6px 8px 20px;gap:10px}.chh{font-size:27px}.chh small{font-size:17px;margin-top:6px}
 .st{font-size:17px;padding:12px 16px}.st.now{padding:18px 18px}.st .n{width:36px;height:36px;font-size:17px}.st.now b{font-size:22px}.st.now .d{font-size:18px;line-height:1.65;margin-top:6px}
 .tip{font-size:16px;padding:10px 14px}.hint{font-size:16px}.btn{min-height:52px;font-size:17px;padding:0 22px}.btn.s{min-height:42px;font-size:15px}.free{font-size:15px}.done{font-size:18px}}
[hidden]{display:none!important}
/* 아이폰 사파리 모양(그림) — 배경은 우리 앱 화면 */
.ios{position:relative;width:250px;height:541px;border-radius:30px;border:2px solid #3a3731;overflow:hidden;background:#000 center top/cover no-repeat}
.ios .dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.ios .sbar{position:absolute;left:0;right:0;bottom:0;height:74px;background:rgba(36,36,38,.96);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:6px}
.ios .url{width:86%;height:26px;border-radius:9px;background:#3a3a3c;color:#ddd;font-size:11px;display:flex;align-items:center;justify-content:center}
.ios .ico{display:flex;justify-content:space-between;width:82%;color:#0a84ff;font-size:17px}
.ios .sheet{position:absolute;left:0;right:0;bottom:0;background:#2c2c2e;border-radius:14px 14px 0 0;padding:12px 12px 22px;color:#fff;font-size:12.5px}
.ios .sheet .row{display:flex;justify-content:space-between;align-items:center;background:#3a3a3c;border-radius:10px;padding:10px 12px;margin-top:6px}
.ios .sheet .row.hl{box-shadow:0 0 0 3px var(--gold)}
.ios .dlg{position:absolute;left:0;right:0;top:0;height:60%;background:#1c1c1e;color:#fff;font-size:12.5px;padding:10px 12px}
.ios .dlg .bar{display:flex;justify-content:space-between;color:#0a84ff;font-weight:700}.ios .dlg .bar b{color:#fff}.ios .dlg .bar .add{box-shadow:0 0 0 3px var(--gold);border-radius:6px;padding:0 5px}
.ios .dlg .app{display:flex;gap:10px;align-items:center;margin-top:16px;background:#2c2c2e;border-radius:10px;padding:10px}
.ios .dlg .app i{width:44px;height:44px;border-radius:10px;background:#1a1917 url(icon-192.png) center/cover}
</style></head><body>
<div class="top"><span class="lg">GLAD GYM</span><b>트레이너 연습</b><span class="sp"></span>
  <select id="chsel" aria-label="장 고르기"></select>
  <span id="who" style="font-size:12.5px;color:var(--sub)"></span><div class="prog"><span id="progt">0 / 0 장</span><i><u id="progb" style="width:0"></u></i></div></div>
<div class="lay">
  <div class="steps" id="steps"></div>
  <div class="stage" id="stage">
    <div class="ph" id="phtr"><div class="lab">트레이너 앱<small>연습용 · 저장 안 됨</small></div><div class="fr" id="frtr"><iframe id="ftr" title="트레이너 앱 연습"></iframe></div></div>
    <div class="arr" id="arr" hidden>→<small>바로</small></div>
    <div class="ph" id="phm" hidden><div class="lab">회원 앱<small>같은 가짜 회원</small></div><div class="fr" id="frm"><iframe id="fm" title="회원 앱 연습"></iframe></div></div>
    <div class="pics" id="pics" hidden></div>
  </div>
</div>
<script>
/* ── 두 화면이 같이 쓰는 연습 자료 (앱 샘플 모드가 window.parent.__연습 을 본다) ── */
window.__연습 = { P: null, mid: null, 바뀜: (w, 표) => 바뀜(w, 표) };
const $ = s => document.querySelector(s), ftr = $('#ftr'), fm = $('#fm');
const 앱주소 = who => 'index.html?sample=1' + (who === 'tr' ? '&who=tr' : '') + '&t=' + Date.now();
const 창 = w => w === 'm' ? fm.contentWindow : ftr.contentWindow;
const 문서 = w => { try{ return 창(w).document; }catch(e){ return null; } };
const 값 = (w, js) => { try{ return 창(w).eval(js); }catch(e){ return undefined; } };      /* 앱 안 let 변수(S 등)는 window 에 안 붙어 eval 로 읽는다 */
const 있나 = (w, sel) => { const d = 문서(w); return !!(d && d.querySelector(sel)); };
const 시트열림 = w => { const d = 문서(w), s = d && d.getElementById('sheet'); return !!(s && s.classList.contains('open')); };
const 회원앱바꿀때 = { t: 0 };
function 회원새로(){ try{ if(fm.contentWindow && fm.getAttribute('src')){ fm.contentWindow.location.replace(앱주소('m')); return; } }catch(e){} fm.src = 앱주소('m'); }      /* replace = 뒤로 기록 안 남김 */
function 바뀜(w, 표){ if(w !== ftr.contentWindow || $('#phm').hidden) return; clearTimeout(회원앱바꿀때.t); 회원앱바꿀때.t = setTimeout(() => { 회원새로(); }, 500); }

/* ── 장 · 단계 ── 단계 = { t 제목, d 설명, tip, 곳 'tr'|'m', 목표 (눌러야 할 곳 · 반짝), 끝 (다 됐나 — 없으면 「다음」 단추) } */
const 장들 = [
 { 제목:'앱 설치하기 — 나 · 회원', 목표:'내 폰에 앱을 깔고, 회원에게 안드로이드 · 아이폰 설치를 안내할 수 있다', 사진:true, 단계:[
   { t:'링크 보내기', d:'데스크 오른쪽 위 「앱 설치 링크」 → 회원 앱 / 트레이너 데스크 · QR 을 찍게 하거나 「복사」해서 카톡으로 보내요', tip:'카톡 안에서 열려도 사파리 · 크롬으로 저절로 넘어가요', 그림:'링크' },
   { t:'안드로이드 (삼성 인터넷)', d:'① 주소창 오른쪽 ⬇ (설치) 를 누르고 ② 「앱스 화면에 이 웹페이지를 추가할까요?」 → 「추가」', tip:'크롬이면 오른쪽 위 ⋮ → 「앱 설치」 → 「설치」 · 로그인 화면의 「＋ 이 기기에 앱 설치하기」 도 같아요', 그림:'삼성' },
   { t:'아이폰 · 아이패드 (사파리)', d:'① 아래 가운데 공유 ⬆ ② 메뉴를 올려 「홈 화면에 추가」 ③ 오른쪽 위 「추가」', tip:'아이패드는 공유 ⬆ 가 오른쪽 위에 있어요 · 사파리로 열어야 해요', 그림:'아이폰' },
   { t:'첫 로그인', d:'홈 화면의 「GLAD GYM」 아이콘으로 열고 → 전화번호 → 문자로 온 번호 · 한 번만 하면 다음부터 바로 열려요', tip:'설치 뒤에는 꼭 홈 화면 아이콘으로 열어요 (카톡 링크로 열면 다시 로그인할 수 있어요)', 그림:'아이콘' } ] },
 { 제목:'준비 — 연습 화면 알기', 목표:'오른쪽 앱이 연습용이라는 것과 윗줄을 안다', 단계:[
   { t:'오른쪽은 진짜 앱이에요', d:'가짜 회원(윤서아)으로 열린 연습용이라 무엇을 눌러도 저장 · 발송이 안 돼요 · 반짝이는 곳을 눌러 따라 하세요', tip:'아래 「자유롭게 눌러 보기」를 켜면 아무 데나 눌러 볼 수 있어요' },
   { t:'내 이름 동그라미', d:'윗줄 오른쪽 동그라미 — 내 이름 · 로그아웃이 여기 있어요 · 눌러 보세요', 목표:'[data-act="trme"]', 끝:() => 시트열림('tr') },
   { t:'창 닫기', d:'「닫기」 — 창 바깥(어두운 곳)을 눌러도 닫혀요', 끝:() => !시트열림('tr'), 목표:'#sheet [data-act="close"]' } ] },
 { 제목:'메뉴 둘러보기 — 아래 탭 다섯', 목표:'탭 다섯이 각각 무엇을 하는 곳인지 안다', 단계:[
   { t:'「회원」 탭', d:'담당 회원 · ★ 즐겨찾기 · 신규 · 재등록 · 안 본 기록 · 전체 회원 검색', 목표:'[data-act="ttab:t_members"]', 끝:() => 값('tr', 'S.screen') === 't_members' },
   { t:'「피드백」 탭', d:'회원 피드백 요청 · 이번 주 피드백 남길 수업 · 식단 피드백', 목표:'[data-act="ttab:t_feed"]', 끝:() => 값('tr', 'S.screen') === 't_feed', tip:'빨간 점 = 남길 피드백이 있어요' },
   { t:'「루틴」 탭', d:'루틴 만들기 · 지정 / 스트레칭 루틴 / 나만의 스트레칭 종목', 목표:'[data-act="ttab:t_routine"]', 끝:() => 값('tr', 'S.screen') === 't_routine' },
   { t:'「상담」 탭', d:'상담지 열 회원 검색 · 종이 상담지 올리기 · 최근 상담', 목표:'[data-act="ttab:t_consult"]', 끝:() => 값('tr', 'S.screen') === 't_consult' },
   { t:'「오늘」 탭', d:'회원 검색 · 기록 중인 수업 · 오늘 수업 예약(내 것 · 시간순)', 목표:'[data-act="ttab:t_today"]', 끝:() => 값('tr', 'S.screen') === 't_today', tip:'예약은 10분마다 전산에서 새로 받아요' } ] },
 { 제목:'회원 화면 읽기', 목표:'회원 한 명의 화면에서 필요한 것을 바로 찾는다', 단계:[
   { t:'회원 열기', d:'「회원」 탭에서 윤서아 회원 줄을 눌러요', 준비:() => 탭('t_members'), 목표:() => 회원줄(), 끝:() => 값('tr', 'S.screen') === 't_member' },
   { t:'단추 셋', d:'수업 시작 · 루틴 지정(개인운동 · 다음 수업) · 1RM 측정 — 확인했으면 「다음」', 목표:'.tmb' },
   { t:'지난 기록 카드', d:'지난 수업 한 장 — 날짜 · 몸 그림 · 무게 표 · 수업 메모', 목표:() => { const d = 문서('tr'), h = d && d.querySelector('.tlh'); return h ? (h.closest('.card, button, [data-act]') || h.parentElement) : null; }, tip:'카드를 누르면 그날 기록 · 피드백을 볼 수 있어요' },
   { t:'회원 자료 펼치기', d:'상담일지 · 운동계획 · 식단 · 오운완 · 스트레칭 · 인바디 · 체형분석이 이 안에', 목표:'[data-act="tmfold"]', 끝:() => { const d = 문서('tr'), b = d && d.querySelector('[data-act="tmfold"]'); return !!(b && /접기/.test(b.innerText)); } } ] },
 { 제목:'수업 시작하기', 목표:'상황에 맞는 방법으로 수업을 연다', 단계:[
   { t:'「수업 시작」', d:'회원 화면 금색 단추 — 무엇으로 시작할지 고르는 창이 떠요', 준비:() => 회원열기(), 목표:'[data-act^="tstartask:"]', 끝:() => 시트열림('tr') && 있나('tr', '#sheet [data-act^="tstartrecs"]') },
   { t:'시작 갈래 보기', d:'맨 위 = 다음 수업 루틴 · 루틴에서 · 받은 루틴표 · 지난 기록에서 · 빈 운동 · 준비운동 먼저 — 「다음」', 목표:'#sheetbox', tip:'같은 날 기록이 있으면 「이어서 기록 / 새로 기록」을 물어요' },
   { t:'「지난 기록에서」', d:'지난 수업을 그대로 가져와 시작해요', 목표:'#sheet [data-act^="tstartrecs"]', 끝:() => 있나('tr', '#sheet [data-act^="tstartrec:"]') },
   { t:'「시작 ›」', d:'그날 종목 · 무게가 그대로 채워져요', 목표:'#sheet [data-act^="tstartrec:"]', 끝:() => 값('tr', 'S.screen') === 'workout' } ] },
 { 제목:'기록하기 (플래너)', 목표:'무게 · 횟수를 가장 빨리 적는다', 단계:[
