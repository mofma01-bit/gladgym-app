<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* 폭 360 보다 좁은 폰(옛 아이폰 SE 320)은 화면을 360 폭으로 줄여 그린다 — 글씨를 하나하나 줄이지 않는다 */
try{ if(Math.min(screen.width, window.innerWidth || screen.width) < 360) document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=360, viewport-fit=cover'); }catch(e){}
/* 아이폰은 글씨 16px 미만인 입력 칸을 누르면 화면을 저절로 확대한다(누른 뒤 화면이 옆으로 밀린다). maximum-scale=1 이면 그 확대만 꺼지고 손가락 확대는 그대로 된다 — 아이폰에만 건다(안드로이드에선 손가락 확대까지 막힌다). 2026-10-10 기종 조사 */
try{ if(/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)){ const v = document.querySelector('meta[name="viewport"]'); v.setAttribute('content', v.getAttribute('content') + ', maximum-scale=1'); } }catch(e){}</script>
<meta name="theme-color" content="#131312">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700&display=swap"
  rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">

<style>
:root{color-scheme:dark;
  /* 바닥을 한 단씩 올렸다 — 어둡되 지하실처럼 눌리지 않게 */
  --dark:#1e1e1b; --dark-2:#282824; --dark-3:#33332e; --dark-4:#41413b;
  --brown:#5a3a2e; --gold:#f0d3a0; --gold-2:#d6b87e; --gold-dim:#332b1d;
  --teal:#a9d8e6; --teal-dim:#1e343b;
  --cream:#fffcf8; --sub:#c6bdb2; --line:#3c3b36;
  --warn:#dda08d; --stage:#141412;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--stage);color:var(--cream);
  font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:500;line-height:1.6;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

#frame{width:100%;max-width:400px;height:min(860px,100vh);background:var(--dark);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  border:1px solid var(--line);border-radius:26px}
@media (max-width:440px){ #frame{max-width:none;height:100vh;height:100dvh;border:none;border-radius:0} }
@supports (padding: env(safe-area-inset-bottom)){
  /* ⛔ 앞에 #frame 을 붙여 둔다 — 이 줄이 아래 `#top{padding:13px 16px}` 보다 먼저 나와서, 같은 무게면 아래 것이 이겨 위쪽 여백이 사라졌다.
     홈 화면에 추가한 아이폰(노치)에서 윗줄이 시계 · 노치 밑으로 들어가 잘렸다 (2026-10-08 대표 「아이폰 미니에서 상단이 잘려」) */
  #frame #tabs{padding-bottom:calc(13px + env(safe-area-inset-bottom))}
  #frame #foot{padding-bottom:calc(11px + env(safe-area-inset-bottom))}
  #frame #top{padding-top:calc(13px + env(safe-area-inset-top))}
  #frame #sheetbox{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  #frame #splash{padding-top:env(safe-area-inset-top)}
}

#top{background:#1a1a17;border-bottom:1px solid var(--line);padding:13px 16px;
  display:flex;align-items:center;gap:11px;flex:none;min-height:52px}
#top .ttl{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
#top .ttl small{display:block;font-size:11.5px;font-weight:500;color:var(--gold-2);letter-spacing:0}
#top .sub{font-size:13px;font-weight:500;color:var(--sub);margin-left:auto;text-align:right}
#top .tbtn{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;color:var(--gold-2);
  border:1px solid var(--line);border-radius:8px;padding:6px 11px}
#top .tbtn:active{background:var(--dark-3)}
#top .tm{font-size:15px;font-weight:700;color:var(--gold);margin-left:auto}
#top .back{font-size:25px;color:var(--cream);width:36px;height:36px;flex:none;line-height:1;border-radius:50%;border:1px solid #57524a;background:#262521;display:flex;align-items:center;justify-content:center;padding:0 2px 4px 0}
#top .logo{font-size:10.5px;letter-spacing:.2em;color:var(--gold-2);font-weight:700;
  border:1px solid var(--line);border-radius:7px;padding:5px 8px;flex:none}
#top .logo:active{background:var(--dark-3)}
#top .tright{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
#top .sub + .tright{margin-left:10px}
#top .topme{width:32px;height:32px;border-radius:50%;flex:none;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gold-2);background:#221f1a}
#top .topme img{width:100%;height:100%;object-fit:cover;display:block}#top .topme b{font-size:13.5px;font-weight:800;color:var(--gold)}
#top .topme:active{transform:scale(.94)}
#top .ttl:empty{display:none}

.search{background:var(--dark-3);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;font-size:14.5px;font-weight:500;color:var(--cream);width:100%}
.search::placeholder{color:#6f6a63}
.fld{display:flex;flex-direction:column;gap:6px}
.fld .fn{font-size:12.5px;font-weight:500;color:var(--sub)}
.calc{background:var(--dark-2);border:1px solid var(--gold-2);border-radius:13px;padding:14px;
  display:flex;flex-direction:column;gap:9px}
.crow{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow .ck{font-size:13px;font-weight:500;color:var(--sub);flex:1}
.crow .cv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.crow .cv.g{color:var(--gold);font-size:17px}
.crow .cs{font-size:12px;font-weight:500;color:var(--sub)}
.calc .kedit{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.calc .kedit .ku{font-size:12px;font-weight:500;color:var(--sub)}
.calc input.kin{width:74px;background:var(--dark-3);border:1px solid var(--gold-2);border-radius:8px;
  padding:7px 8px;font-size:16px;font-weight:700;color:var(--gold);text-align:right;
  font-variant-numeric:tabular-nums;font-family:inherit}
.calc input.kin::placeholder{color:var(--gold);opacity:.6;font-weight:700}
.calc .stp{width:31px;height:31px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);
  background:var(--dark-3);color:var(--cream);font-size:17px;font-weight:700;line-height:1;font-family:inherit}
.calc .stp:active{background:var(--gold-2);color:#fff}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mac div{background:var(--dark-3);border:1px solid var(--line);border-radius:10px;padding:10px;
  display:flex;flex-direction:column;gap:2px;align-items:center}
.mac .n{font-size:12px;font-weight:500;color:var(--sub)}
.mac .v{font-size:17px;font-weight:900;color:var(--gold)}
.mac .u{font-size:11.5px;font-weight:500;color:var(--sub)}

.bar{height:9px;border-radius:5px;background:#2f2f2a;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.bar i.over{background:var(--warn)}
#main.lite .bar{background:#eadfcd}
.kcard{background:#1f1f1c;border:1px solid #35342e;border-radius:13px;padding:15px;
  display:flex;flex-direction:column;gap:10px}
#main.lite .kcard{background:#fff;border-color:#e6ddcf}
.kbig{display:flex;align-items:baseline;gap:8px}
.kbig .v{font-size:29px;font-weight:900;letter-spacing:-.03em}
.kbig .v.g{color:var(--gold)}
.kbig .v.w{color:var(--warn)}
.kbig .u{font-size:13px;font-weight:500;color:var(--sub)}
#main.lite .kbig .v{color:#2b231c}
#main.lite .kbig .v.g{color:#8a5a2b}
#main.lite .kbig .u{color:#7b6c5d}
.krow{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500}
.krow .k{color:var(--sub);flex:1}
#main.lite .krow .k{color:#7b6c5d}
.krow .v{font-weight:700;font-variant-numeric:tabular-nums}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m3 > div{display:flex;flex-direction:column;gap:5px}
.m3 .t{font-size:12px;font-weight:600;color:var(--sub)}
#main.lite .m3 .t{color:#7b6c5d}
.req{color:var(--gold)}

#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:13px}
#main.lite{background:#fbf7f0;color:#2b231c}
#main.lite .card{background:#fff;border-color:#e6ddcf}
#main.lite .card .nm{color:#2b231c}
#main.lite .card .sm{color:#7b6c5d}
#main.lite .lbl{color:#7b6c5d}
#main.lite .note{background:#fff;border-color:#e6ddcf;color:#7b6c5d}
#main.lite .note b{color:#8a5a2b}
#main.lite .hr{background:#e6ddcf}
#main.lite .empty{color:#a0917f}
#main.lite .chip{background:#fff;border-color:#e6ddcf;color:#7b6c5d}
#main.lite .chip.on{background:#f6ead4;border-color:var(--gold-2);color:#8a5a2b}
#main.lite textarea{background:#fff;border-color:#e6ddcf;color:#2b231c}
#main.lite .search{background:#fff;border-color:#e6ddcf;color:#2b231c}
#main.lite .wk{background:#fff;border-color:#e6ddcf}
#main.lite .wkhd .d{background:#f6efe3;color:#2b231c}
#main.lite .wkhd button{color:#8a7c6c}
#main.lite .wkd .dn{color:#a0917f}
#main.lite .wkd .dnum{color:#a0917f}
#main.lite .wkd .dnum.has{color:#2b231c}
#main.lite .wkd>button.sel{background:#f6efe3}
#main.lite .wkd>button.sel .dn{color:#2b231c}
#main.lite .dsum{background:#e6ddcf}
#main.lite .dsum>div{background:#fff}
#main.lite .dsum .k{color:#a0917f}
#main.lite .dsum .v{color:#8a5a2b}
#main.lite .dsum .v small{color:#a0917f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto}
.big2{position:relative;overflow:hidden;border-radius:16px;padding:15px 13px 13px;min-height:112px;
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid #e0cfb4;
  background:linear-gradient(120deg,#f8efe0,#f1e3cd)}
.big2.b{background:linear-gradient(120deg,#eef2f6,#dfe8ef);border-color:#cfdbe4}
.big2 .ic{font-size:24px;line-height:1.1}
.big2 b{font-size:15.5px;font-weight:900;letter-spacing:-.03em;color:#3a2a1e}
.big2 i{font-style:normal;font-size:11.5px;font-weight:600;color:#8a7663;line-height:1.4}
.mealcd{background:#fff;border:1px solid #e6ddcf;border-radius:15px;padding:0;overflow:hidden;flex:0 0 auto}
.mealcd .hd2{display:flex;align-items:baseline;gap:8px;padding:12px 14px 9px}
.mealcd .hd2 .n{font-size:14.5px;font-weight:800;color:#2b231c;letter-spacing:-.02em}
.mealcd .hd2 .t{font-size:11.5px;font-weight:600;color:#a0917f}
.mealcd .hd2 .k{margin-left:auto;font-size:15px;font-weight:900;color:#8a5a2b;font-variant-numeric:tabular-nums}
.mealcd .ph{width:100%;display:block;max-height:190px;object-fit:cover}
.frow2{display:flex;align-items:baseline;gap:9px;padding:9px 14px;border-top:1px solid #f0e8db;width:100%;text-align:left}
.frow2 .fn2{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#2b231c}
.frow2 .fq{font-size:11.5px;font-weight:600;color:#a0917f;flex:none}
.frow2 .fk{font-size:13px;font-weight:800;color:#8a5a2b;flex:none;font-variant-numeric:tabular-nums}
/* ── 사진 위 음식 표시 ── 인스타 태그처럼 */
.tagwrap{position:relative;display:block;flex:none;line-height:0;border-radius:14px;overflow:hidden}
.tagwrap .tagph{width:100%;display:block;border-radius:14px}
.tagwrap.on{cursor:crosshair;box-shadow:0 0 0 2px var(--gold)}
/* 식단 카드 안에서는 사진을 자르지 않는다 — 자르면 표시한 자리가 어긋난다 */
.mealcd .tagwrap,.mealcd .tagwrap .tagph{border-radius:0}
.nopic.tagph{width:100%;height:180px}
.tdot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--gold);
  transform:translate(-50%,-50%);z-index:2;
  border:2.5px solid rgba(20,18,14,.85);box-shadow:0 1px 4px rgba(0,0,0,.55)}
.ftag{position:absolute;z-index:3;transform:translate(11px,-50%);
  display:inline-flex;align-items:center;gap:4px;max-width:62%;
  font-size:11.5px;font-weight:700;line-height:1.25;color:#fffcf8;
  background:rgba(24,21,17,.88);border-radius:999px;padding:5px 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  backdrop-filter:blur(3px);box-shadow:0 1px 5px rgba(0,0,0,.45)}
.ftag.lft{transform:translate(calc(-100% - 11px),-50%)}
.ftag em{font-style:normal;font-weight:800;color:var(--gold)}
.taghint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:13px;font-weight:700;color:#fffcf8;background:rgba(24,21,17,.78);
  border-radius:999px;padding:9px 16px;line-height:1.2;white-space:nowrap}
/* 사진 시트 안 합계 줄 */
.msum{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;flex:none;
  background:var(--gold-dim);border:1px solid #4a3d22;border-radius:11px;padding:10px 12px}
.msum b{font-size:17px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.msum span{font-size:12px;font-weight:600;color:var(--sub)}
.addf{width:100%;padding:11px 14px;border-top:1px dashed #e0d3bd;font-size:13px;font-weight:700;color:#8a5a2b;text-align:left}
.fitem{display:flex;align-items:baseline;gap:9px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.fitem .n2{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--cream)}
.fitem .n2 small{display:block;font-size:11.5px;font-weight:600;color:#8f8a83;margin-top:1px}
.fitem .k2{font-size:14px;font-weight:800;color:var(--gold);flex:none;font-variant-numeric:tabular-nums}
.qbig{display:flex;align-items:center;justify-content:center;gap:10px}
.qbig .v2{font-size:30px;font-weight:900;color:var(--gold);min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.qbig .gin{width:104px;font-size:28px;font-weight:900;color:var(--gold);text-align:center;
  background:var(--dark-3);border:1px solid var(--line);border-radius:12px;padding:6px 4px;
  font-family:inherit;font-variant-numeric:tabular-nums}
.qbig .gu{font-size:15px;font-weight:800;color:#8f8a83}
.qbig button{width:44px;height:44px;border-radius:50%;background:var(--dark-3);border:1px solid var(--line);
  color:var(--cream);font-size:22px;font-weight:700;line-height:1;font-family:inherit}
.shot2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;flex:0 0 auto;
  border-radius:18px;padding:16px 18px 34px;min-height:112px;position:relative;overflow:hidden;
  background:linear-gradient(115deg,#f8efe0 0%,#f3e6d2 55%,#eddcc4 100%);border:1px solid #e0cfb4}
.shot2 .pic{flex:none;display:flex;align-items:center;justify-content:center;
  width:86px;height:70px;animation:sdBob 3.4s ease-in-out infinite}
.shot2 .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.shot2 .tx b{font-size:18px;font-weight:900;letter-spacing:-.03em;color:#3a2a1e}
.shot2 .tx i{font-style:normal;font-size:12.5px;font-weight:600;color:#8a7663;line-height:1.45}
.shot2 .go{position:absolute;right:16px;bottom:13px;background:var(--brown);color:#f6ead4;
  font-size:12.5px;font-weight:800;border-radius:999px;padding:6px 13px}
.shot2::after{content:'';position:absolute;top:-30%;bottom:-30%;width:30%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);
  animation:ggShine 4.2s ease-in-out infinite}
@keyframes sdBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){ .shot2::after,.shot2 .pic{animation:none} }

.shot{width:100%;border-radius:12px;display:block;background:#0e0e0d}
.mealgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mealcard{border:1px solid #e6ddcf;border-radius:12px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column}
.mealcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.mealcard .cap{padding:8px 10px;font-size:12.5px;font-weight:700;color:#2b231c}
.mealcard .cap span{display:block;font-weight:500;color:#7b6c5d;font-size:11.5px}
.mrow{display:flex;align-items:center;gap:11px;background:var(--dark-2);border:1px solid var(--line);
  border-radius:12px;padding:10px;width:100%;text-align:left}
.mrow img{width:58px;height:58px;border-radius:9px;object-fit:cover;flex:none;background:#0e0e0d}
.nopic{display:flex;align-items:center;justify-content:center;background:var(--dark-3);overflow:hidden}
.nopic svg{width:68%;height:auto}
.mrow .nopic{width:58px;height:58px;border-radius:9px;flex:none;border:1px solid var(--line)}
.nopic.ph{width:100%;height:150px}
.nopic.shot{width:100%;height:190px;border-radius:12px;border:1px solid var(--line)}
.bcmp .cel .nopic{width:100%;aspect-ratio:3/4}
.phstrip .pt .nopic{width:100%;height:106px}
.mrow .nm{font-size:14px;font-weight:700}
.mrow .sm{font-size:12.5px;font-weight:500;color:var(--sub)}
.shotbtn{width:100%;border:1px dashed var(--gold-2);border-radius:12px;background:#f6ead4;
  padding:18px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#8a5a2b}
.shotbtn .ic{font-size:24px}
.shotbtn .t{font-size:15px;font-weight:700}
.shotbtn .s{font-size:12.5px;font-weight:500}
#foot{flex:none;border-top:1px solid #46453f;background:#242420;padding:11px 14px;display:flex;gap:9px;
  box-shadow:0 -6px 16px rgba(0,0,0,.35)}
#tabs{flex:none;background:var(--brown);border-top:1px solid #6b4436;display:flex;
  box-shadow:0 -6px 16px rgba(0,0,0,.45)}
#tabs button{flex:1;padding:12px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:12.5px;font-weight:700;color:#d6c2b6;position:relative}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34px;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
#tabs button .ic{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
  height:22px;transition:transform .16s ease}
#tabs button.on .ic{transform:translateY(-1px) scale(1.06)}
#tabs button:active .ic{transform:scale(.9)}
#tabs button .bd{position:absolute;transform:translate(14px,-4px);width:9px;height:9px;
  border-radius:50%;background:var(--teal);border:2px solid var(--brown)}

.lbl{font-size:13.5px;font-weight:700;color:#a9a29a;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;margin-top:9px}
.lbl::before{content:'';width:3px;height:14px;border-radius:2px;background:#7a4d3c;flex:none}
.lbl.plain{margin-top:0}
.lbl.plain::before{display:none}
.h1{font-size:21px;font-weight:900;letter-spacing:-.03em;line-height:1.3}
.h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
.h2 small{font-weight:500;color:var(--sub);font-size:13px}

.card{background:#1f1f1c;border:1px solid #35342e;border-radius:13px;padding:14px 15px;
  display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:active{background:#262622}
.card.gold{border-color:var(--gold-2);background:var(--gold-dim)}
.card.teal{border-color:#3a5b66;background:var(--teal-dim)}
.card.dim{opacity:.45}
.card.plan{border-left:3px solid #7a4d3c}
.card .nm{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.card .nm.g{color:var(--gold)}
.card .nm.t{color:var(--teal)}
.card .sm{font-size:13px;font-weight:500;color:#8f8a83;line-height:1.6}
.rowc{display:flex;flex-direction:row;align-items:center;gap:11px}
.rowc > div{flex:1;min-width:0;text-align:left}
.rowc .rt{margin-left:auto;text-align:right;font-size:13px;font-weight:600;color:#8f8a83;flex:none}

.tile{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;padding:15px;
  display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:13px;font-weight:500;color:var(--sub)}
.tile .v{font-size:27px;font-weight:900;letter-spacing:-.03em}
.tile .v.g{color:var(--gold)}
.tile .v small{font-size:14px;font-weight:500;color:var(--sub);letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.btn{flex:1;text-align:center;border-radius:12px;padding:14px 10px;font-size:15.5px;font-weight:700;
  letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--teal);color:#0d2027}
.btn.gold{background:var(--gold);color:#241a08}
.btn.sub{background:var(--dark-3);color:var(--teal);border:1px solid var(--line)}
.btn.ghost{background:var(--dark-2);color:var(--sub);border:1px solid var(--line)}
.btn.kakao{background:#FEE500;color:#1c1a17}
.btn.blue{background:#4d7f96;color:#f2fafd}
.anatab{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;flex:0 0 auto;margin-bottom:3px}
.anatab.four{grid-template-columns:repeat(4,1fr)}.anatab.four button{font-size:13px;letter-spacing:-.03em}
.anatab button{padding:13px 4px 12px;border-radius:14px;font-size:14px;font-weight:800;
  letter-spacing:-.03em;border:1px solid var(--line);background:var(--dark-2);color:#8b8379;
  display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1}
.anatab button .ic3{display:block;opacity:.55}
.anatab button.on .ic3{opacity:1}
.anatab button.ex.on{background:linear-gradient(140deg,#7d5f38 0%,#5e4128 100%);
  border-color:#a2814f;color:#fdf3e3;box-shadow:0 4px 13px rgba(125,95,56,.4)}
.anatab button.lg.on{background:linear-gradient(140deg,#5c6a52 0%,#3d4736 100%);
  color:#eaf0e4;border-color:#6f8062}
.anatab button.bd.on{background:linear-gradient(140deg,#4d7f96 0%,#35586a 100%);
  border-color:#7fb0c6;color:#f2fafd;box-shadow:0 4px 13px rgba(77,127,150,.4)}
.bcmp{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:0 0 auto}
.bcmp .cel{background:#0e0e0d;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column}
.bcmp .cel .hd2{display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:8px 10px;background:var(--dark-3);width:100%}
.bcmp .cel .hd2 b{font-size:12.5px;font-weight:800;color:var(--cream)}
.bcmp .cel .hd2 i{font-style:normal;font-size:11.5px;font-weight:700;color:#8bbdd2}
.bcmp .cel img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#000}
/* 비포·애프터 각각 넘기기 (2026-09-18 대표: 「왼쪽 오른쪽 각각넘겨가며 비교할 수 있게」) */
.bcmp .cnav{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 6px 0}
.bcmp .cnav button{width:34px;height:30px;border-radius:9px;background:var(--dark-3);color:var(--gold);
  font-size:18px;font-weight:800;line-height:30px;padding:0}
.bcmp .cnav button:disabled{opacity:.25}
.bcmp .cnav span{font-size:11.5px;font-weight:800;color:var(--sub);font-variant-numeric:tabular-nums}
.bcmp .cel .no2{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:#6f6a64;text-align:center;padding:10px;line-height:1.5}
.bcmp .cel .ft2{padding:7px 8px;font-size:11.5px;font-weight:700;color:#8f8a83;text-align:center}
.phstrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;flex:0 0 auto}
.phstrip::-webkit-scrollbar{display:none}
.phstrip .pt{flex:none;width:86px;border-radius:11px;overflow:hidden;
  background:#0e0e0d;border:1px solid var(--line)}
.phstrip .pt img{width:100%;height:106px;object-fit:cover;display:block}
/* ⛔ 화면 밖의 무음 영상은 크롬이 전력 절약으로 멈춘다
   ("video-only background media was paused to save power")
   → 줄이는 동안 **보이게** 튼다. 얼마나 남았는지도 같이 보인다 */
.vidwork{position:fixed;inset:0;z-index:99;background:rgba(10,10,9,.95);
  display:flex;align-items:center;justify-content:center;padding:22px}
.vw-box{width:100%;max-width:330px;text-align:center}
.vw-t{font-size:16px;font-weight:800;color:var(--cream);margin-bottom:4px}
.vw-s{font-size:12px;font-weight:500;color:var(--sub);margin-bottom:14px}
.vw-box video{width:100%;max-height:46vh;border-radius:12px;background:#000;display:block}
.vw-bar{height:6px;border-radius:99px;background:var(--dark-4);overflow:hidden;margin-top:14px}
.vw-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
.phstrip .pt video{width:100%;height:106px;object-fit:cover;display:block;background:#000}
.phstrip .pt.vid{position:relative}
.phstrip .pt.vid::after{content:'▶';position:absolute;left:50%;top:44px;transform:translate(-50%,-50%);
  font-size:15px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none}
.phstrip .pt span{display:block;font-size:10.5px;font-weight:700;color:#8f8a83;padding:5px 2px;text-align:center}
.lrbar{display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--dark-3);border:1px solid var(--line)}
.lrbar span{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;min-width:34px}
.lrbar .l{background:var(--gold);color:#241d12}
.lrbar .r{background:#4d7f96;color:#f2fafd}
.lrbar .z{flex:1;color:#6f6a64;font-weight:600;font-size:12px}
.ibtag{display:inline-block;margin-left:5px;font-size:9.5px;font-weight:800;color:#0d2027;background:var(--teal);
  border-radius:5px;padding:1px 5px;vertical-align:1px}
.blrow{display:grid;grid-template-columns:58px 1fr 1fr 1fr;gap:4px;align-items:baseline;
  padding:9px 2px;border-top:1px solid var(--line)}
.blrow:first-child{border-top:none}
.blrow .d0{font-size:11.5px;font-weight:700;color:#8f8a83}
.blrow .c{text-align:right;font-size:13.5px;font-weight:800;color:var(--cream);font-variant-numeric:tabular-nums}
.blrow .c i{font-style:normal;font-size:10.5px;font-weight:700;margin-left:3px}
.blrow .c i.up{color:#6fa07f}.blrow .c i.dn{color:var(--warn)}
.ibdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-left:5px;vertical-align:middle}
.ibfd .blrow,.ibfd .blhd{grid-template-columns:76px 1fr 1fr 1fr}
.ibfd .blrow{text-align:left}
.ibfd .d0{white-space:nowrap}
/* 홈 오운완 — 오늘 기록을 마쳤는데 아직 안 찍었을 때만 (2026-09-19 대표: 「놓칠 수 있으니까 메인 화면에도」) */
.pickbox{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:2px 0}
.dim2{color:var(--sub);font-weight:500;margin-left:6px;font-size:12px}
/* 커뮤니티 */
.pcard{background:var(--dark-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.phead{display:flex;align-items:center;gap:9px;padding:10px 12px}
.pav{width:30px;height:30px;border-radius:50%;background:var(--dark-3);color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pwho{flex:1;font-weight:700;font-size:13px;display:flex;flex-direction:column;line-height:1.25}
.pwho small{font-weight:500;color:var(--sub);font-size:11px}
.pmore{color:var(--sub);font-size:18px;padding:0 4px}
.pimgw{display:block;width:100%;padding:0;background:#000}
.pimg{display:block;width:100%;max-height:420px;object-fit:cover}
.pcap{padding:9px 12px 0;font-size:13px;line-height:1.5;white-space:pre-wrap}
.pacts{display:flex;gap:4px;padding:8px 8px 10px}
.pacts button{flex:none;padding:6px 10px;border-radius:9px;background:var(--dark-3);color:var(--cream,#eee);font-size:12.5px;font-weight:600}
.pacts button.on{color:var(--gold)}
.trio.four{grid-template-columns:repeat(4,1fr)}.trio .t4 .k{color:var(--gold)}
.cycline{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;flex:none;background:var(--dark-2);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:12px;padding:10px 12px}
.cycline .ch{font-size:14.5px;font-weight:600}.cycline .ch b{color:var(--cc);font-weight:800}.cycline .ch small{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:1px}
.cycline .cw{font-size:12.5px;line-height:1.5;color:var(--cream,#ddd)}
.rmnow{background:var(--gold-dim,rgba(230,196,135,.08));border:1px solid var(--gold-2,#8a7350);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.rmnow .rmt{font-weight:700;font-size:13px;color:var(--gold)}.rmnow .rmt small{color:var(--sub);font-weight:500;margin-left:6px}
.rmnow .rmrow.ok{opacity:.45}.rmnow .rmrow.now{outline:1.5px solid var(--gold);background:var(--dark-2)}
.rmhint{font-size:11.5px;color:var(--sub);line-height:1.45}
.hero.rm{background:linear-gradient(135deg,#4a3a1e,#1c160d)}
.hero2.rm{background:linear-gradient(135deg,#4a3a1e,#17120b);border:1px solid var(--gold-2,#8a7350)}
.rmplan{display:flex;flex-direction:column;gap:5px}
.rmrow{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;background:var(--dark-3);border-radius:9px;padding:7px 10px;font-size:12.5px}
.rmrow b{color:var(--gold)}.rmrow span{font-weight:600}.rmrow span small{color:var(--sub);margin-left:5px;font-weight:500}
.rmrow em{font-style:normal;font-weight:700}.rmrow i{font-style:normal;color:var(--sub);font-size:11px}
.rmrow.opt{opacity:.7;border:1px dashed var(--line);background:none}
.rmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%}
.rmc{background:var(--dark-2);border:1px solid var(--line);border-radius:11px;padding:9px 8px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.rmc b{font-size:19px;color:var(--gold)}.rmc b small{font-size:11px;margin-left:2px;color:var(--sub)}
.rmc span{font-size:12px;font-weight:600;line-height:1.2}.rmc i{font-style:normal;font-size:10.5px;color:var(--sub)}
.bdgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:100%}
.bdg{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--dark-2);border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center;opacity:.38;filter:grayscale(1)}
.bdg.on{opacity:1;filter:none;border-color:rgba(230,196,135,.5)}
.bdg i{font-style:normal;font-size:22px;line-height:1.1}.bdg b{font-size:11px;line-height:1.15}.bdg small{font-size:9.5px;color:var(--sub);line-height:1.15}
.trgrid{display:grid;gap:4px 3px;align-items:center;font-size:12px}
.trgrid i{font-style:normal;color:var(--sub);font-size:10.5px;text-align:center}.trgrid b{font-size:11px;color:var(--sub);font-weight:600}
.trgrid span{text-align:center;font-weight:700;background:var(--dark-3);border-radius:7px;padding:4px 0}.trgrid span small{font-weight:500;color:var(--sub);font-size:9px}
.trgrid span.g1{color:#0e0e0d;background:var(--gold)}.trgrid span.g2{background:#8d8d88;color:#0e0e0d}.trgrid span.g3{background:#8a5a3c;color:#fff}.trgrid span.no{background:none;color:var(--sub);font-weight:400}
.rkbox{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:none}
.rkt{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:2px}
/* 랭킹 2판 — 판 하나만 · 시상대 */
.rktabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;flex:none;margin-bottom:8px}
.rktabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border-radius:13px;background:var(--dark-2);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--sub)}
.rktabs button svg{opacity:.6}.rktabs button.on svg{opacity:1}
.seg.gold{background:#1a1917;border:1px solid #34332d}.seg.gold button.on{background:linear-gradient(180deg,#f3d9a8,#e2c184);color:#2a1c14;box-shadow:0 2px 10px rgba(240,211,160,.25)}
.rkme{background:linear-gradient(160deg,#1d3a43,#12242a) !important;border-color:#3f7281 !important}
.rkme .rm1 b{color:var(--cream)}.rkme .rm1 small,.rkme .rm2 small{color:#b9d3db}
.podwrap{width:100%;flex:none;border-radius:18px;border:1px solid #4a3f2a;padding:6px 10px 0;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 18%,rgba(240,211,160,.16),transparent 70%),linear-gradient(180deg,#221d15,#151412)}
.podwrap .podium{padding-top:30px}
.rkbar u{background:var(--gold) !important;opacity:.85 !important}
.rktabs button.on{color:var(--gold);border-color:rgba(230,196,135,.55);background:linear-gradient(180deg,rgba(230,196,135,.14),rgba(230,196,135,.03))}
.rktabs button.on i{filter:none;opacity:1}
.seg.sm2{width:150px;align-self:center}
.rkme{display:flex;align-items:center;gap:12px;width:100%;flex:none;text-align:left;padding:12px 14px;border-radius:16px;margin-bottom:4px;
  background:linear-gradient(120deg,#3a2f1c,#221d14 70%);border:1px solid rgba(230,196,135,.4)}
.rkme .rm1{display:flex;flex-direction:column;min-width:74px}.rkme .rm1 small{font-size:10.5px;color:var(--sub)}
.rkme .rm1 b{font-size:34px;font-weight:800;color:var(--gold);line-height:1.05}.rkme .rm1 b i{font-style:normal;font-size:14px;margin-left:2px}.rkme .rm1 b.no{color:var(--sub)}
.rkme .rm2{flex:1;display:flex;flex-direction:column;gap:2px}.rkme .rm2 b{font-size:15px}.rkme .rm2 small{font-size:11.5px;color:var(--sub)}
.rkme em{font-style:normal;margin-left:5px;font-weight:700}.rkme em.up{color:#7fd6a4}.rkme em.dn{color:#e58b7b}
.rkme .rm3{font-size:11.5px;color:var(--gold);flex:none}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:6px;width:100%;flex:none;padding:26px 2px 0}
.pd{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;min-width:0;--mc:#8d8d88}
.pd.p1{--mc:var(--gold)}.pd.p3{--mc:#a8704a}
.pd .crown{position:absolute;top:-21px;width:26px;height:20px;color:var(--gold);filter:drop-shadow(0 2px 6px rgba(230,196,135,.5))}
.pda{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--mc);background:var(--dark-3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.pd.p1 .pda{width:72px;height:72px;box-shadow:0 0 0 4px rgba(230,196,135,.13),0 6px 22px rgba(230,196,135,.22)}
.pda img,.rka img{width:100%;height:100%;object-fit:cover}.pda b{font-size:21px;color:var(--mc)}.pd.p1 .pda b{font-size:27px}
.pdn{font-size:12.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pd.me .pdn{color:var(--gold)}
.pdv{font-size:14px;font-weight:800;color:var(--mc)}.pdv small{font-size:10px;font-weight:600;margin-left:1px}
.pdb{width:100%;height:46px;border-radius:12px 12px 0 0;margin-top:3px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 30%,transparent),transparent);border-top:2px solid var(--mc)}
.pd.p1 .pdb{height:70px}.pd.p3 .pdb{height:32px}.pdb b{font-size:17px;font-weight:800;color:var(--mc);opacity:.9}
.pd.none{opacity:.35}.pd.none .pdn{font-weight:500;font-size:11px}
.rklist{display:flex;flex-direction:column;width:100%;flex:none;background:var(--dark-2);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.rklist.mine{border-color:rgba(230,196,135,.4);margin-top:6px}
.rk2{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.rk2:last-child{border-bottom:0}
.rk2>b{width:20px;text-align:center;font-size:13px;color:var(--sub)}
.rka{width:32px;height:32px;border-radius:50%;background:var(--dark-3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.rka b{font-size:13px;color:var(--sub)}
.rkn{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px;font-weight:600}.rkn small{font-size:10.5px;color:var(--sub);font-weight:500}
.rkbar{display:block;height:3px;border-radius:2px;background:var(--dark-3);overflow:hidden}.rkbar u{display:block;height:100%;background:var(--sub);border-radius:2px;opacity:.55}
.rk2>em{font-style:normal;font-weight:800;font-size:14px}.rk2>em small{font-size:10px;color:var(--sub);margin-left:1px;font-weight:600}
.rk2.me>b,.rk2.me .rkn,.rk2.me>em{color:var(--gold)}.rk2.me .rkbar u{background:var(--gold);opacity:1}
.rkr{display:flex;align-items:center;gap:9px;font-size:13.5px}.rkr b{width:20px;color:var(--gold)}.rkr span{flex:1;font-weight:600}.rkr em{font-style:normal;font-weight:700}
.rkr em small{color:var(--sub);font-weight:500;margin-left:4px}.rkr.me{background:rgba(230,196,135,.08);border-radius:8px;padding:3px 6px;margin:0 -6px}
.ptc.done{opacity:.6}
.ptst{font-size:11px;font-weight:700;color:#0e0e0d;background:var(--gold);border-radius:8px;padding:2px 8px;flex:none}
.ptst.off{background:var(--dark-3);color:var(--sub)}
.ptbody{display:block;width:100%;text-align:left;padding:0 12px 4px}
.ptgrid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px 10px;font-size:12.5px;align-items:center}
.ptgrid i{color:var(--sub);font-style:normal;font-size:11.5px}.ptgrid b{font-weight:600}
.ptgrid i:nth-last-child(2){grid-column:1}.ptgrid b:last-child{grid-column:2/5}
.big3{display:flex;gap:7px}.big3 label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--sub)}
.fld .fn em{font-style:normal;color:var(--gold);font-size:11px;margin-left:4px}
.pcms{display:flex;flex-direction:column;gap:7px}
.pcm{font-size:13px;line-height:1.45}.pcm b{color:var(--gold);margin-right:4px}.pcm small{display:block;color:var(--sub);font-size:11px}
.pcm small button{color:var(--sub);text-decoration:underline}
.pcmin{display:flex;gap:7px}.pcmin input{flex:1}
.pg{position:relative}.pg.hid img{opacity:.45}

.prow.x .kd{color:var(--sub)}

.vpick{gap:6px}
.vpick .chip{padding:6px 12px;font-size:12.5px;font-weight:700}
.prevb{background:var(--gold-dim);border:1px solid #4a3d22;border-left:3px solid var(--gold);
  border-radius:0 11px 11px 0;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.prevh{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  flex-wrap:wrap;row-gap:7px}
.prevh .pk{font-size:11.5px;font-weight:800;color:var(--gold-2);flex:none;letter-spacing:.01em}
.prevh .pv{font-size:14px;font-weight:800;letter-spacing:-.01em;color:#a89f92;
  font-variant-numeric:tabular-nums;min-width:0;
  flex:1 1 100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prevh .pv b{color:var(--gold);font-size:17px;font-weight:800}
.prevh .pv i{font-style:normal;color:#6f6a64;font-weight:600;margin:0 3px}
.prevh .ar{font-size:12px;font-weight:800;flex:none;order:1}
.prevh .ar.up{color:var(--gold)} .prevh .ar.down{color:var(--warn)}
.prevh .cv{font-size:11px;font-weight:800;flex:none;padding:3px 8px;border-radius:6px;
  background:#2e1c18;color:var(--warn);order:2}
/* 접고 펴는 표시 — 앱 어디서나 같은 모양 */
.cx{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;
  color:var(--gold-2);flex:none;padding:4px 9px;border-radius:8px;
  background:#3a3020;border:1px solid #55482f;white-space:nowrap;line-height:1.25}
#main.lite .cx{background:#f6efe3;border-color:#e6ddcf;color:#8a6f3f}
.prevh .cx{order:3;margin-left:auto}
.cx.off{color:#7d766e;background:var(--dark-3);border-color:var(--line)}
.foldh.off{opacity:.72}
/* 접었다 펴는 상자 — 제목 줄은 늘 보이고, 아래가 열린다 */
.foldb{display:flex;flex-direction:column;gap:9px;flex:none}
.foldh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:var(--dark-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.foldh .fk{display:flex;flex:none;color:var(--gold-2)}
.foldh .ft{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--cream)}
#main.lite .foldh{background:#fff;border-color:#e6ddcf}
#main.lite .foldh .ft{color:#2b231c}
.prevb:active{transform:scale(.99)}
.prevb.flat .prevh .cx{display:none}
/* 목록 줄 — 여기를 누르면 접힌다 */
.tog{font-size:11px;font-weight:700;color:var(--teal);margin-left:5px;
  padding:2px 6px;border-radius:6px;background:#1e343b;border:1px solid #39515a}
.prevr{display:flex;align-items:center;gap:9px;padding:7px 0 0;border-top:1px solid #26262230}
.prevr .rd{font-size:11.5px;font-weight:700;color:var(--sub);width:70px;flex:none;line-height:1.35}
.prevr .rs{font-size:12.5px;font-weight:700;color:#ded7cd;flex:1;min-width:0;
  font-variant-numeric:tabular-nums;line-height:1.4}
.prevr .rb{font-size:11.5px;font-weight:800;color:#241a0d;background:var(--gold);
  border:0;border-radius:8px;padding:6px 10px;flex:none}
.prevr{border-top:1px solid #4a3d2255}
.prevr .rs{color:#cfc6b8}
.exbig{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--cream);line-height:1.25}
.exbig small{display:block;font-size:13px;font-weight:500;color:var(--teal);margin-top:2px}
.card.now2{border-color:#3a5b66;background:var(--teal-dim);border-radius:14px 14px 0 0;margin-bottom:0}
.card.now2 .nm{color:var(--teal)}
.ordbtn{width:38px;height:38px;border-radius:10px;background:var(--dark-4);
  color:var(--cream);font-size:15px;font-weight:800;flex:none}
.ordbtn:active{background:#45453f}

/* 담은 종목 미리보기 — 사진첩 고르기처럼 아래에 계속 보인다 */
.picked{flex:1.15;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  background:var(--teal-dim);border:1px solid #3a5b66;border-radius:12px;padding:8px 12px;text-align:left}
.picked .c{font-size:12px;font-weight:800;color:var(--teal);display:flex;align-items:center;gap:5px}
.picked .l{font-size:11.5px;font-weight:500;color:#8f8a83;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;width:100%}
.picked.bump{animation:pk .5s ease-out}

/* 지금 하는 종목 · 완료 버튼 — 눈이 가도록 은은하게 */
@keyframes nowGlow{0%,100%{box-shadow:0 0 0 0 rgba(157,206,220,.00)}
  50%{box-shadow:0 0 0 3px rgba(157,206,220,.14)}}
.card.now2{animation:nowGlow 2.6s ease-in-out infinite}
@keyframes finPulse{0%,100%{box-shadow:0 0 0 0 rgba(157,206,220,.45)}
  70%{box-shadow:0 0 0 9px rgba(157,206,220,0)}}
.btn.main.fin{animation:finPulse 2.1s cubic-bezier(.4,0,.6,1) infinite}
.btn.ic{display:flex;align-items:center;justify-content:center;gap:7px}
.btn.ic svg{flex:none}
@media (prefers-reduced-motion:reduce){
  .card.now2,.btn.main.fin{animation:none}}

/* 찾기 도구 — 종목 목록과 확실히 구분되게 갈색 판에 얹는다 */
.ptools{background:#251b16;border:1px solid #503a2f;border-radius:16px;
  padding:11px;display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
.ptools .search{background:#160f0d;border-color:#5c4238;color:var(--cream)}
.ptools .search::placeholder{color:#8a7364}
.pbtn{display:flex;align-items:center;gap:10px;background:#160f0d;border:1px solid #5c4238;
  border-radius:12px;padding:11px 13px;text-align:left;width:100%}
.pbtn .ic{width:30px;height:30px;border-radius:9px;background:#3b2a22;color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none}
.pbtn .tx{flex:1;min-width:0}
.pbtn .tx b{display:block;font-size:14.5px;font-weight:700;color:var(--cream)}
.pbtn .tx span{display:block;font-size:11.5px;font-weight:500;color:#a08d7e;margin-top:1px}
.pbtn .ar{font-size:13px;color:#a08d7e;flex:none}
.pbtn.etc .ic{background:var(--gold);color:#2a1d12}
.ptools .chips{margin:0}
@keyframes pk{0%{transform:scale(1)}30%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.picked.bump{animation:none}}
.step .v{cursor:pointer}
.step .vin{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  background:#141412;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.step .vin input{width:100%;min-width:0;background:none;border:none;outline:none;text-align:center;
  font-size:24px;font-weight:900;color:var(--cream);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  font-family:inherit;padding:2px 0}
.step .vin small{font-size:13px;font-weight:500;color:var(--sub);flex:none}
.step .vin:focus-within{border-color:var(--gold)}
.step .v.on{color:var(--gold)}
.unitlbl{font-size:11.5px;font-weight:600;color:var(--sub);text-align:center;margin-top:-4px}

/* ── 휴식 타이머 ── 오른쪽 위, 운동 시간 옆. 도는 동안엔 금빛으로 차고 숨 쉰다 */
#top .tmwrap{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
#top .tmwrap .tm{margin-left:0}
#top .tmwrap .chip.t{padding:5px 10px;font-size:12px;font-weight:700}
.restt{display:inline-flex;align-items:center;gap:5px;flex:none;
  background:var(--gold-dim);border:1px solid #6a5730;border-radius:999px;padding:5px 10px 5px 8px;
  color:var(--gold);white-space:nowrap}
.restt i{font-style:normal;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em}
.restt:active{transform:scale(.96)}
.restt.run{background:var(--gold);border-color:var(--gold);color:#241a08;
  animation:쉼숨 1.4s ease-in-out infinite}
@keyframes 쉼숨{0%,100%{box-shadow:0 0 0 0 rgba(240,211,160,.42)}
  60%{box-shadow:0 0 0 6px rgba(240,211,160,0)}}
@media (prefers-reduced-motion:reduce){.restt.run{animation:none}}

/* ── 자물쇠 ── 고정바 맨 오른쪽 */
.lockb{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border-radius:12px;background:var(--dark-3);border:1px solid var(--line);color:var(--sub)}
.lockb i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.lockb.on{background:var(--gold);border-color:var(--gold);color:#241a08}
.lockb:active{opacity:.72}
#foot .btn.dim{opacity:.32}
/* 좁은 폰에서 발판 글씨가 두 줄로 접히지 않게 */
#foot .btn{font-size:14.5px;white-space:nowrap;padding-left:6px;padding-right:6px}
#tabs.tlock{opacity:.34;pointer-events:none}
.btn.ic .pl{font-size:17px;font-weight:800;color:var(--teal)}

/* ── 세로 입력 기둥 ── 지금 하는 세트 */
.varr{background:var(--dark-3);border:1px solid var(--line);border-radius:10px;
  padding:9px 0;font-size:13px;font-weight:800;color:var(--gold-2);line-height:1}
.vnum{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:#141412;border:1px solid var(--line);border-radius:11px;padding:8px 4px;flex:1}
.vnum input{width:100%;min-width:0;background:none;border:none;outline:none;text-align:center;
  font-size:25px;font-weight:900;color:var(--cream);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;font-family:inherit;padding:0}
.vdone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--gold);color:#241a08;border:none;border-radius:12px;padding:8px 6px;
  box-shadow:0 3px 0 #a8874a}
/* 완료해서 잠긴 세트 칸 — 담겼다는 게 한눈에 보이게 (2026-09-17) */
.vdone.next{background:var(--dark-3);color:var(--gold);box-shadow:0 3px 0 #2a2822;
  border:1px solid var(--gold-2)}
#main.lite .vstep.lockrow .vnum input{color:#8a6c2f}
.vsub{display:flex;align-items:center;gap:9px;flex:none;margin-top:-2px}
.vsub .vh{font-size:10.5px;font-weight:600;color:#7d766e;line-height:1.45;flex:1;min-width:0}
/* ── 되돌리기 ── 세트 완료 위, 속이 빈 작은 알약. 채워진 것과 확실히 갈린다 */
.vundo2{flex:none;height:34px;display:flex;align-items:center;justify-content:center;gap:5px;
  background:none;border:1.5px solid #5d5850;border-radius:999px;
  font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;padding:0 6px}
#main.lite .vundo2{border-color:#ded2c0}
/* 끝난 세트를 누르면 고칠 수 있다는 표시 */
.setedit{flex:none;font-size:10.5px;font-weight:700;color:var(--gold-2);
  border:1px solid #55482f;background:#33301f;border-radius:6px;padding:2px 7px;line-height:1.3}
.set.done .setedit,.set.now .setedit{opacity:.9}
#main.lite .setedit{background:#f6efe3;border-color:#e6ddcf;color:#8a6f3f}
.vundo{flex:none;font-size:11.5px;font-weight:700;color:var(--sub);background:none;
  border:none;border-bottom:1px solid #55524a;padding:0 1px 1px;border-radius:0}
.vundo[disabled]{opacity:.3}

/* ── 담는 자리 ── 점선이라 「여기에 더 넣는다」로 읽힌다 */
.addbox{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:none;border:1.5px dashed #4f4c44;border-radius:13px;padding:14px 10px;
  font-size:14.5px;font-weight:700;color:var(--sub);margin-top:4px}
.addbox b{font-size:17px;font-weight:800;color:var(--teal)}
.addbox:active{background:var(--dark-2)}
/* ── 되돌릴 수 없는 것 ── 작게, 멀리 */
.dngr{display:block;margin:12px auto 4px;background:none;border:none;padding:6px 10px;
  font-size:12px;font-weight:600;color:#8b8379;text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:#55524a}
#main.lite .varr{background:#f6efe3;border-color:#e6ddcf;color:#8a6f3f}
#main.lite .vnum{background:#fff;border-color:#e6ddcf}
#main.lite .vnum input{color:#2b231c}
#main.lite .addbox{border-color:#dfd2bd}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--dark-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:500;color:var(--sub)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.chip.t{color:var(--teal);border-color:#3a5b66}
.eqlbl{font-size:11px;font-weight:700;color:var(--sub);margin:2px 0 -2px 2px}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--gold-dim);color:var(--gold);
  border:1px solid var(--gold-2);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;flex:none}
.pill.q{background:var(--dark-3);color:var(--sub);border-color:var(--line)}
.pill.t{background:var(--teal-dim);color:var(--teal);border-color:#3a5b66}

.desc{background:var(--dark-3);border:1px solid var(--line);border-radius:12px;padding:14px;
  display:flex;flex-direction:column;gap:9px}
.desc .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.desc .hd b{font-size:13.5px;font-weight:700}
.desc .tx{font-size:14px;font-weight:500;color:#ded9d2;line-height:1.85;white-space:pre-wrap}

.cm{background:var(--dark-2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;
  padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.cm .who{font-size:12.5px;font-weight:500;color:var(--teal);display:flex;align-items:center;gap:8px}
.cm .tx{font-size:14px;font-weight:500;color:#e0dbd4;line-height:1.8;white-space:pre-wrap}

/* 세 칸 — 세로로 쌓이던 셋을 한 줄로. 누르면 아래에서 창이 올라온다 */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:none}
.trio button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  min-width:0;text-align:left;background:var(--dark-2);border:1px solid var(--line);
  border-radius:12px;padding:9px 10px 10px}
.trio .k{font-size:11px;font-weight:800;color:var(--sub);white-space:nowrap}
.trio .v{font-size:14.5px;font-weight:800;color:var(--cream);max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.trio .v i{font-style:normal;font-size:12px;margin-left:3px}
.trio .v i.up{color:var(--gold)} .trio .v i.down{color:var(--warn)}
.trio .t1{background:var(--gold-dim);border-color:#4a3d22}
.trio .t1 .k{color:var(--gold-2)} .trio .t1 .v{color:var(--gold)}
.trio .t3 .k{color:var(--teal)}
.trio .off .v{color:#6f6a64}
.trio .nw{position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:800;
  background:var(--teal);color:#0d2027;border-radius:5px;padding:1px 5px}
.trio button:active{transform:scale(.97)}
#main.lite .trio button{background:#fff;border-color:#e6ddcf}
#main.lite .trio .v{color:#2b231c}
#main.lite .trio .t1{background:#f6efe3;border-color:#e6ddcf}
#main.lite .trio .t1 .v{color:#8a6f3f}
/* 피드백에 붙인 것 — 보내기 전 미리보기 · 받은 쪽 실물 */
.attrow{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 8px}
.attth{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;
  background:#000;border:1px solid var(--line);flex:none}
.attth img,.attth video{width:100%;height:100%;object-fit:cover;display:block}
.attth.v::after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none}
.attth button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:800;line-height:22px;padding:0}
/* 넘겨 보기 — 폰은 옆으로 밀고, PC 는 ‹ › (2026-09-18 대표: 「올린 순서대로 넘기면서 볼 수 있게」) */
.cs-kind{margin-top:8px}
/* 피드백 회차 넘기기 — 좌우 화살표 · 가운데 누르면 회차 목록 (2026-09-29 대표) */
/* ⚠ #sheetbox 가 flex 다 — flex:none 을 안 주면 목록이 12px 로 찌그러진다
   (2026-09-29 브라우저에서 잼. 안은 236px 인데 밖이 12px 이었다) */
.cmnav{display:flex;align-items:center;gap:6px;margin:2px 0 8px;flex:none}
.cmnav .ar{flex:none;width:32px;height:32px;border-radius:50%;background:#242220;
  border:1px solid var(--line);color:var(--cream);font-size:19px;line-height:28px;padding:0}
.cmnav .ar.end{opacity:.28;pointer-events:none}
.cmnav .mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  background:#242220;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  color:var(--cream);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
.cmnav .mid.yr{flex:none;padding:8px 11px}      /* 연도 단추는 글자만큼만 */
.cmnav .mid.on{border-color:var(--gold-2);color:var(--gold);background:var(--gold-dim)}
.cmnav .mid .cnt{font-size:11.5px;font-weight:500;color:var(--dim)}
.cmnav .mid .car{font-size:10px;color:var(--gold)}
.cmlist{background:#1c1b19;border:1px solid var(--line);border-radius:10px;
  padding:5px;margin:-4px 0 9px;max-height:min(34vh,260px);overflow-y:auto;
  flex:none;-webkit-overflow-scrolling:touch}
/* 달 칩 — 폰에서 줄바꿈으로 길어지지 않게 **가로로 민다** */
.cmlist .mons{display:flex;gap:5px;overflow-x:auto;padding:3px 3px 7px;
  scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:4px;
  position:sticky;top:-5px;background:#1c1b19;z-index:1}
.cmlist .mons::-webkit-scrollbar{display:none}
.cmlist .mons button{flex:none;width:auto;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);font-size:12px;color:var(--dim);background:#242220}
.cmlist .mons button.on{border-color:var(--gold-2);color:var(--gold);background:var(--gold-dim)}
/* 해 칩 — 달 칩 위에 한 줄 더. 해가 둘 이상일 때만 나온다 */
.cmlist .mons.yrs{border-bottom:none;padding-bottom:3px;margin-bottom:0;top:-5px}
.cmlist .mons.yrs button{font-size:12.5px;font-weight:600}
.cmlist .mons.yrs + .mons{top:34px}
.cmlist .mons button b{font-size:11.5px;opacity:.85}
.cmlist button{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;
  padding:8px 10px;border-radius:7px;color:var(--cream);font-size:12.5px;background:none}
.cmlist button.on{background:var(--gold-dim);color:var(--gold)}
.cmlist button b{flex:none;font-size:12.5px}
.cmlist button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--dim);font-size:12px}
.cmslide{position:relative;margin-top:8px}
.cs-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:10px;
  background:#000;scrollbar-width:none;overscroll-behavior-x:contain}
.cs-track::-webkit-scrollbar{display:none}
.cs-item{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;
  height:min(52vh,420px);position:relative}
.cs-item img,.cs-item video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.cs-prev,.cs-next{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border-radius:50%;background:rgba(0,0,0,.58);color:#fff;font-size:21px;line-height:32px;padding:0}
.cs-prev{left:6px} .cs-next{right:6px}
.cs-prev.end,.cs-next.end{display:none}
/* 소리 켜기 단추 — 피드백 영상은 **기본 음소거**로 튼다 (2026-09-21 대표:
   「틀자마자 갑자기 소리가 팍 튀어나오면 당황하니까」).
   폰 기본 재생기에는 음소거 버튼이 없는 기기가 있어서 우리가 따로 단다. */
.vmute{position:absolute;left:8px;bottom:8px;z-index:3;display:inline-flex;align-items:center;gap:5px;
  padding:6px 10px;border:0;border-radius:999px;background:rgba(0,0,0,.66);color:#fff;
  font-size:12px;font-weight:600;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.vmute b{font-weight:600}
.vmute.on{background:rgba(230,196,135,.92);color:#1a1814}
.vmute.on b{display:none}

.btn.off{opacity:.42;pointer-events:none}
.cs-n{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11.5px;

.vbox{background:#0e0e0d;border:1px solid var(--line);border-radius:12px;height:120px;width:100%;

.wk{background:var(--dark-2);border:1px solid var(--line);border-radius:16px;padding:11px 9px 13px;flex:0 0 auto}

.hero .ht{font-size:23px;font-weight:900;letter-spacing:-.035em;margin-top:11px;line-height:1.24;color:#fff}

/* 수업 리포트 */
.rpt-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.rpt-hd b{font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--gold)}
.rpt-hd span{font-size:12px;font-weight:600;color:var(--sub)}
/* 맨 위 제목 — 알림톡으로 들어온 회원이 무엇을 보는지 바로 알게 (2026-09-29) */
.rpt-title{font-size:19px;font-weight:800;line-height:1.35;color:var(--cream);margin:0 0 12px}
.rpt-cal .cday{pointer-events:none}
.btn.dim{opacity:.5}
.cal2{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal2 .hd{text-align:center;font-size:11.5px;font-weight:700;color:#7d766e;padding:3px 0}

.cal2 .cday.sel{background:var(--gold);color:#2a1c14}

  width:4px;height:4px;border-radius:50%;background:var(--gold-2)}

.wkhd .d .cvv{color:var(--gold-2);font-size:12px;font-weight:700}
#main.lite .wkhd .d .cvv{color:#b08a52}
.cal2 .cday i{position:absolute;right:3px;top:2px;font-style:normal;font-size:9.5px;
  font-weight:800;color:var(--gold)}
.cal2 .cday.sel i{color:#2a1c14}
.seg{display:flex;background:var(--dark-3);border-radius:999px;padding:3px;gap:2px;flex:0 0 auto}
.seg button{flex:1;padding:7px 4px;border-radius:999px;font-size:12.5px;font-weight:700;color:#8f8a83}
.seg button.on{background:var(--cream);color:#1a1a18}
.gbox{background:var(--dark-2);border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px;flex:0 0 auto}
.gbox svg{display:block;width:100%;height:auto}
.gsum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-radius:13px;overflow:hidden;flex:0 0 auto}
.gsum>div{background:var(--dark-2);padding:13px 5px;text-align:center}
.gsum .k{display:block;font-size:11px;font-weight:600;color:#7d766e}
.gsum .v{display:block;font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.03em;color:var(--gold)}
.gsum .v small{font-size:11px;font-weight:600;color:var(--sub)}
.trow{display:flex;align-items:baseline;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
/* 리포트 종목 줄 밑의 피드백 — 있을 때만 나온다 (2026-09-29 대표 「없으면 줄을 안 만드는 것으로」) */
.rpcm.none{border-color:var(--gold-2);background:var(--gold-dim)}
.rpcm.none .ic{color:var(--gold)}
.rpcm.none .tx{color:var(--gold)}
.rpcm{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  background:#201e1b;border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;margin:-2px 0 9px;color:var(--cream);font-size:12.5px;line-height:1.5}
.rpcm .ic{flex:none;font-size:13px}
.rpcm .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpcm .at{flex:none;font-size:11.5px;color:var(--gold);opacity:.9}
.rpcm:active{background:#262320}
.trow .e{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#e9e3db;text-align:left}
.trow .n{font-size:11px;font-weight:600;color:#6f6a64;flex:none}
.trow .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.trow .d{font-size:12.5px;font-weight:800;flex:none;min-width:58px;text-align:right}
.trow .d.up{color:var(--gold)}
.trow .d.dn{color:var(--warn)}
.trow .d.eq{color:#6f6a64}
.dhd{display:flex;align-items:baseline;gap:9px;padding-bottom:8px}
.dhd .t{flex:1;font-size:14px;font-weight:700;color:var(--cream);letter-spacing:-.02em}
.dhd .r{font-size:12.5px;font-weight:600;color:#8f8a83}
/* ── 바로 가기 카드 ── 아이콘 · 눌림 · 떠오름 */
.gocard{
  width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:#1f1f1c;border:1px solid #35342e;border-radius:14px;padding:14px 15px;
  transition:transform .13s ease, background .13s ease, border-color .13s ease}
.gocard:active{transform:scale(.978);background:#262622}
.gocard .gi{
  width:42px;height:42px;border-radius:13px;flex:none;display:flex;
  align-items:center;justify-content:center;
  background:var(--dark-3);border:1px solid var(--line);color:var(--gold-2)}
.gocard .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gocard .nm{font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--cream)}
.gocard .sm{font-size:12.5px;font-weight:500;color:var(--sub);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gocard .ga{font-size:15px;color:#8f8a83;flex:none}
.gocard.gold2{border-color:var(--gold-2);background:var(--gold-dim)}
.gocard.gold2 .gi{background:#3a3020;border-color:var(--gold-2);color:var(--gold)}
.gocard.gold2 .nm{color:var(--gold)}
.ic2{display:block}

/* 누르면 눌리는 느낌 — 모든 카드·버튼 공통 */
.card,.btn,.hero,.tile{transition:transform .13s ease, background .13s ease}
.card:active,.hero:active,.tile:active{transform:scale(.985)}
.btn:active{transform:scale(.975)}

/* 화면에 들어올 때 아래에서 떠오른다 (같은 화면 안에서 다시 그릴 땐 안 움직인다) */
@keyframes 떠오름{ from{opacity:0;transform:translateY(9px)} to{opacity:1;transform:none} }
#main.anim > *{animation:떠오름 .34s cubic-bezier(.22,.9,.3,1) both}
#main.anim > *:nth-child(1){animation-delay:0ms}
#main.anim > *:nth-child(2){animation-delay:35ms}
#main.anim > *:nth-child(3){animation-delay:70ms}
#main.anim > *:nth-child(4){animation-delay:105ms}
#main.anim > *:nth-child(5){animation-delay:140ms}
#main.anim > *:nth-child(6){animation-delay:170ms}
#main.anim > *:nth-child(7){animation-delay:195ms}
#main.anim > *:nth-child(n+8){animation-delay:215ms}
@media (prefers-reduced-motion:reduce){
  #main.anim > *{animation:none}
  .card,.btn,.hero,.tile,.gocard{transition:none}
}

/* 세는 숫자 */
.dsum .v .cnt{font-style:normal;font-variant-numeric:tabular-nums}
.gocard .gi.tealic{color:var(--teal);border-color:#39515a;background:var(--teal-dim)}

  background:var(--dark-3);border:1px solid var(--line);color:#8b8379}

.empty2 .es{font-size:12.5px;font-weight:500;color:#6d6a65;line-height:1.6;margin-top:-4px}

#main.lite .empty2 .et{color:#8a7f70}
#main.lite .empty2 .es{color:#a89b8a}

/* 오늘 기록 — 접히는 카드 */
/* 카드 안 제목 — 라벨을 따로 두지 않는다 */
.dtitle{padding:14px 15px 11px;font-size:14.5px;font-weight:800;color:var(--cream);
  letter-spacing:-.02em;border-bottom:1px solid var(--line)}
.dtitle small{display:block;font-size:12px;font-weight:600;color:var(--sub);
  margin-top:3px;letter-spacing:0}
#main.lite .dtitle{color:#2b231c;border-bottom-color:#e6ddcf}
#main.lite .dtitle small{color:#a0917f}
.dhd2{width:100%;display:flex;align-items:center;gap:10px;padding:14px 15px;text-align:left}
/* 기록 카드 머리 + 오른쪽 「새 피드백」 (2026-09-18 대표: 「새 피드백은 여기에 버튼이 바로 보이게」) */
.dhrow{display:flex;align-items:center}
.dhrow>.dhd2{flex:1;min-width:0}
.dhrow + .dhrow{border-top:1px solid var(--line)}
.dnew{flex:none;margin-right:12px;font-size:12px;font-weight:800;color:#0d2027;background:var(--teal);
  border-radius:9px;padding:7px 11px;white-space:nowrap}
/* 이번 달 현황판 — 달력 자리를 줄이고 한눈에 */
.board{background:var(--dark-2);border:1px solid var(--line);border-radius:14px;padding:12px 12px 13px;flex:none}
.board .bd-hd{font-size:12px;font-weight:800;color:var(--gold-2);margin:0 2px 9px}
.bd3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.bd3>div,.bd3>button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;text-align:left;
  background:var(--dark-3);border-radius:11px;padding:9px 10px 10px}
.bd3 .k{font-size:11px;font-weight:700;color:var(--sub)}
.bd3 .v{font-size:21px;font-weight:800;color:var(--cream);font-variant-numeric:tabular-nums;line-height:1.2}
.bd3 .v small{font-size:11px;font-weight:700;color:var(--sub);margin-left:1px}
.bd3 .v.dim{color:#6f6a64}
.bd3 .s{font-size:10.5px;font-weight:600;color:#8f8a83;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bd3 .bar{display:block;width:100%;height:4px;border-radius:9px;background:var(--dark-4);margin-top:5px;overflow:hidden}
.bd3 .bar b{display:block;height:100%;background:var(--gold);border-radius:9px}
.bd3.two{grid-template-columns:repeat(2,1fr)}
.dayslink{width:100%}
/* 홈 — 왼쪽 최근 운동기록(간단히) · 지난 운동기록 / 오른쪽 운동 피드백 칸
   (2026-09-18 대표: 「칸 나눠서 우측에 피드백 칸을 넣으라니까 / 최근 운동기록을 간략하게 하고
    들어가서 상세하게 보면되니까 / NEW! 하고 운동 피드백 / NEW는 작게 애니메이션 효과 반짝 거리게」) */
.homerec{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:8px;align-items:stretch;flex:none}
.hr-l{display:flex;flex-direction:column;gap:8px;min-width:0}
.hr-l .dayslink{margin:0}
.reccard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
  background:var(--dark-2);border:1px solid var(--line);border-radius:14px;padding:12px 30px 12px 14px}
.reccard .k{font-size:12px;font-weight:800;color:var(--gold-2)}
.reccard .t{font-size:14.5px;font-weight:800;color:var(--cream)}
.reccard .s{font-size:12px;font-weight:600;color:var(--sub)}
.reccard .go{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gold-2);font-size:19px;font-weight:700}
.cmcell{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-width:0;
  background:var(--dark-2);border:1px solid var(--line);border-radius:14px;padding:12px 11px;text-align:left}
.cmcell .k{font-size:12px;font-weight:800;color:var(--teal)}
.cmcell .v{font-size:26px;font-weight:800;color:var(--cream);line-height:1.15;font-variant-numeric:tabular-nums}
.cmcell .v small{font-size:11px;font-weight:700;color:var(--sub);margin-left:2px}
.cmcell .s{font-size:10.5px;font-weight:600;color:#8f8a83;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmcell.new{border-color:var(--teal);background:#1e343b}
.cmcell.new .v{color:var(--teal)}
/* NEW! — 작게, 반짝 */
@keyframes ggTwinkle{0%,100%{opacity:1;transform:scale(1)}45%{opacity:.25;transform:scale(.88)}}
.nwx{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.03em;color:#0d2027;background:var(--teal);
  border-radius:5px;padding:1px 5px;animation:ggTwinkle 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .nwx{animation:none} }
#main.lite .reccard,#main.lite .cmcell{background:#fff;border-color:#e6ddcf}
#main.lite .reccard .t,#main.lite .cmcell .v{color:#2b231c}
/* 내 목표 · 뱃지 */
.gl-hd{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 7px}
.gl-hd b{font-size:12px;font-weight:800;color:var(--gold-2)}
.gl-hd button{font-size:11.5px;font-weight:800;color:var(--gold);padding:3px 4px}
.glrow{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 8px;width:100%;text-align:left;
  background:var(--dark-3);border-radius:11px;padding:9px 11px 10px;margin-bottom:6px;position:relative}
.glrow .gl-t{font-size:13px;font-weight:700;color:var(--cream);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glrow .gl-v{font-size:15px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.glrow .gl-v small{font-size:11px;font-weight:700;color:var(--sub)}
.glrow .bar{grid-column:1 / -1;display:block;height:5px;border-radius:9px;background:var(--dark-4);overflow:hidden;margin-top:4px}
.glrow .bar b{display:block;height:100%;background:var(--gold);border-radius:9px}
.glrow.ok .bar b{background:var(--teal)} .glrow.ok .gl-v{color:var(--teal)}
.gl-add{width:100%;border:1px dashed #55482f;border-radius:11px;padding:11px;font-size:13px;font-weight:800;color:var(--gold)}
.bdgs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.bdgs::-webkit-scrollbar{display:none}
.bdg{flex:none;display:flex;align-items:center;gap:5px;background:#3a3020;border:1px solid #6b5a33;border-radius:20px;
  padding:5px 10px 5px 7px;font-size:11.5px;font-weight:800;color:var(--gold);white-space:nowrap}
.bdg i{font-style:normal}
#main.lite .glrow{background:#f6efe3} #main.lite .glrow .gl-t{color:#2b231c}
#main.lite .board{background:#fff;border-color:#e6ddcf}
#main.lite .bd3>div,#main.lite .bd3>button{background:#f6efe3}
#main.lite .bd3 .v{color:#2b231c}
.dsum .on .v{color:var(--gold)} .dsum .on2 .v{color:var(--teal)}
.dhd2 + .dhd2{border-top:1px solid var(--line)}
.dhd2.dtop .t{font-size:14.5px;font-weight:800}
.dhd2.dtop .r{font-size:12px;line-height:1.5}
.dhd2 .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dhd2 .t{font-size:14.5px;font-weight:700;color:var(--cream);letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhd2 .r{font-size:12px;font-weight:600;color:var(--sub)}
.dhd2 .ar{font-size:13px;color:var(--sub);flex:none}
.dbody{padding:0 15px 13px}
.drow{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px;
  width:100%;text-align:left}
.drow .dl1{display:flex;align-items:baseline;gap:8px;width:100%}
.drow .de{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:#e9e3db;text-align:left}
.drow .dn{font-size:11.5px;font-weight:600;color:#7d766e;flex:none}
.drow .dn.g{color:var(--gold);font-size:13px;font-weight:800}
.drow .dl2{font-size:12.5px;font-weight:700;color:var(--gold-2);line-height:1.6;
  font-variant-numeric:tabular-nums;text-align:left}
.drow.dtot{border-top:1px solid var(--gold-2)}
.dstart{width:100%;margin-top:10px;padding:11px 0;border-radius:10px;background:var(--gold);
  color:#241d12;font-size:13.5px;font-weight:800}
.dstart+.dmore{margin-top:6px}
.dmore{width:100%;margin-top:10px;padding:10px 0;border-radius:10px;background:var(--dark-3);
  border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--gold-2)}

.setrow{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.setrow .e{flex:1;min-width:0;font-size:13px;font-weight:600;color:#e9e3db;text-align:left}
.setrow .s{font-size:12.5px;font-weight:700;color:var(--gold-2);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.setrow .n{font-size:11.5px;font-weight:600;color:#7d766e;flex:none}
.empty{padding:30px 10px;text-align:center;color:#6d6a65;font-size:14px;font-weight:500;line-height:1.8}
.note{background:var(--dark-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  font-size:12.5px;font-weight:500;color:var(--sub);line-height:1.75}
.note b{color:var(--gold);font-weight:700}
.hr{height:1px;background:var(--line);margin:3px 0}

/* 방금 담긴 것 — 눈에 띄게 */
@keyframes pop{0%{transform:scale(.97);opacity:.4}60%{transform:scale(1.01)}100%{transform:scale(1);opacity:1}}
.card.just{border-color:var(--gold);background:var(--gold-dim);animation:pop .32s ease-out}
.card.just .nm{color:var(--gold)}
.card.done2{border-color:#3a5b66;background:var(--teal-dim)}
.card.done2 .nm{color:var(--teal)}

/* 운동 중 돌아가기 띠 */
.backbar{background:var(--gold-dim);border:1px solid var(--gold-2);border-radius:12px;
  padding:12px 14px;display:flex;align-items:center;gap:9px;width:100%;text-align:left}
.backbar .l{font-size:14.5px;font-weight:700;color:var(--gold)}
.backbar .r{margin-left:auto;font-size:13px;font-weight:500;color:var(--gold-2)}

/* 스플래시 */
#splash{position:absolute;inset:0;background:var(--dark);z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;
  transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
/* 오프닝 2판 (2026-10-07 대표가 고른 참고: 심볼이 선으로 그려지고 → 글자가 옆으로 펼쳐지는 로고 오프닝)
   --k = 빠르기(1 = 그날 처음 · .55 = 같은 날 다시) */
#splash{--k:1.25}#splash.quick{--k:.69}      /* 2026-10-07 대표 「80% 속도로 조금 느리게」 — 길이를 1.25배로 (전 1 · .55) */
#splash .lk{display:flex;align-items:center;justify-content:center}
#splash .sym{width:62px;height:62px;flex:none;fill:none;stroke:var(--gold);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(240,211,160,.28))}
#splash .sym path{stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw calc(var(--k)*.55s) cubic-bezier(.5,0,.2,1) forwards}
#splash .sym path:nth-child(2){animation-delay:calc(var(--k)*.12s)}#splash .sym path:nth-child(3){animation-delay:calc(var(--k)*.3s)}
#splash .sym path:nth-child(4){animation-delay:calc(var(--k)*.36s)}#splash .sym path:nth-child(5){animation-delay:calc(var(--k)*.5s)}
#splash .wm{display:flex;align-items:center;overflow:hidden;white-space:nowrap;max-width:0;margin-left:0;animation:spOpen calc(var(--k)*.55s) cubic-bezier(.2,.8,.2,1) calc(var(--k)*.95s) forwards}
#splash .wm i{font-style:normal;font-size:27px;font-weight:800;letter-spacing:.1em;color:var(--cream);opacity:0;transform:translateX(-14px);animation:spLet calc(var(--k)*.4s) ease forwards}
#splash .wm i.sp{width:9px}
#splash .wm i:nth-child(1){animation-delay:calc(var(--k)*1s)}#splash .wm i:nth-child(2){animation-delay:calc(var(--k)*1.05s)}#splash .wm i:nth-child(3){animation-delay:calc(var(--k)*1.1s)}
#splash .wm i:nth-child(4){animation-delay:calc(var(--k)*1.15s)}#splash .wm i:nth-child(6){animation-delay:calc(var(--k)*1.22s)}#splash .wm i:nth-child(7){animation-delay:calc(var(--k)*1.27s)}#splash .wm i:nth-child(8){animation-delay:calc(var(--k)*1.32s)}
#splash .today{min-height:24px;margin-top:26px;font-size:15.5px;font-weight:600;color:var(--cream);text-align:center;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
#splash .today.on{opacity:1;transform:none}#splash .today b{color:var(--gold);font-weight:800}
#splash.hi .today{transition:none;transform:none;animation:spFade .4s ease 1.1s forwards}
#splash .copy{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:12.5px;font-weight:500;letter-spacing:.02em;color:#7d766e;opacity:0;animation:spFade .6s ease 1.9s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spOpen{to{max-width:230px;margin-left:15px}}
@keyframes spLet{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .sym path{animation:none;stroke-dashoffset:0}#splash .wm{animation:none;max-width:230px;margin-left:15px}#splash .wm i{animation:none;opacity:1;transform:none}#splash .copy{animation:none;opacity:1}}

/* 체크리스트 · 폼 */
.frow{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.frow .fk{font-size:13px;font-weight:500;color:var(--sub);min-width:88px;flex:none;padding-top:2px}
.frow .fv{font-size:14px;font-weight:500;flex:1;line-height:1.7;white-space:pre-wrap}
.frow .fv.none{color:#5f5c57}
.ckrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.ckrow:last-child{border-bottom:none}
.ckrow .t{font-size:13.5px;font-weight:500;flex:1}
.ckrow .opts{display:flex;gap:6px;flex:none}
.ck{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--sub);background:var(--dark-3)}
.ck.on{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);font-weight:700}

/* 사진 슬롯 */
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.slot{background:#0e0e0d;border:1px dashed var(--line);border-radius:11px;height:112px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:12px;font-weight:500;color:var(--sub);text-align:center;padding:6px}
.slot.on{border-style:solid;border-color:var(--gold-2);background:var(--gold-dim);color:var(--gold)}
.slot .ic{font-size:19px}

/* 주기 막대 */
/* ⛔ `overflow:hidden` 이면 세로 flex 안에서 **min-height 가 0 으로 풀린다.**
   폰처럼 내용이 길면 이 막대가 **납작하게 눌려 사라졌다** (2026-10-01 폰에서 실측).
   `flex:none` 으로 못 줄이게 박는다. */
.cyc{display:flex;gap:3px;height:34px;flex:none;border-radius:9px;overflow:hidden}
.cyc div{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#6f6a63;background:var(--dark-3)}
.cyc div.p{background:#2a1d1a;color:var(--warn)}
.cyc div.f{background:var(--gold-dim);color:var(--gold)}
.cyc div.o{background:#2d2440;color:#b9a3e8}                 /* 배란기 — 따로 보이게 */
.cyc div.l{background:var(--teal-dim);color:var(--teal)}
.cyc div.now{outline:2px solid var(--gold);outline-offset:-2px}
.cyclbl{display:flex;gap:3px}
/* 「13~15일」 이 좁은 칸에서 두 줄로 접혔다 — 「일」을 떼고 안 접히게 한다 (폰 실측) */
.cyclbl span{flex:1;min-width:0;text-align:center;font-size:10px;color:#75726c;
  font-weight:500;white-space:nowrap}

#toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--dark-4);
  border:1px solid var(--line);border-radius:11px;padding:11px 17px;font-size:13.5px;font-weight:700;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .22s;z-index:30}
#toast.on{opacity:1}

/* 네 방향 찍기 — 뭐가 없는지 한눈에 */
.posechk{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:2px 0 10px}
.posechk .pc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;
  border-radius:11px;border:1px solid var(--line,#33332f);background:var(--card,#1a1a18);
  font-size:12px;font-weight:700;color:var(--sub,#8f8a83)}
.posechk .pc.on{border-color:var(--teal,#4a8f95);color:var(--cream,#fdfaf6)}
.posechk .pc .bx{font-size:15px}
.posechk .pc.on .bx{color:var(--teal,#4a8f95)}
.posechk .pc small{font-size:10.5px;opacity:.7}

/* 피드백 안내 그만 받기 — 한 장짜리 동의 화면 (설치 없이 열린다) */
.cmoffwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.cmoffbox{width:100%;max-width:420px;background:var(--card,#1a1a18);border:1px solid var(--line,#33332f);
  border-radius:18px;padding:26px 22px;text-align:left}
.cmoffbox.ok{border-color:var(--teal,#4a8f95)}
.cmoffbox.warn{border-color:var(--warn,#b5695a);margin-top:12px;padding:14px 16px;font-size:13px}
.cmoffbox .ttl{font-size:19px;font-weight:800;margin-bottom:12px;color:var(--gold,#d4af6e)}
.cmoffbox p{font-size:14.5px;line-height:1.85;margin:0 0 14px}
.cmoffbox ul{margin:0 0 18px;padding-left:18px}
.cmoffbox li{font-size:13px;line-height:1.9;color:var(--sub,#8f8a83)}
.cmoffgo{width:100%;padding:15px;border-radius:12px;border:0;background:var(--gold,#d4af6e);
  color:#1b1a17;font-size:15.5px;font-weight:800}
.cmoffgo:disabled{opacity:.5}
.cmoffbox .sub{text-align:center;font-size:12px;color:var(--sub,#8f8a83);margin-top:10px}

/* 초상권 고르기 — 세 갈래를 큼직하게 (어르신도 누르기 쉽게) */
.ptpick{display:flex;flex-direction:column;gap:10px;margin:4px 0 14px}
.ptbtn{display:block;width:100%;text-align:left;padding:16px 16px;border-radius:13px;
  border:1px solid var(--line,#33332f);background:var(--dark-3,#222220);color:var(--cream,#fdfaf6)}
.ptbtn b{display:block;font-size:15.5px;font-weight:800;margin-bottom:4px}
.ptbtn small{font-size:12.5px;color:var(--sub,#8f8a83);font-weight:600}
.ptbtn:hover{border-color:var(--gold,#d4af6e)}
.ptbtn:disabled{opacity:.45}

/* ══ 바로가기 만들기 띠 ══ 2026-09-30 대표
   「바탕화면에 빼고 이렇게 저렇게 하세요를 줄이고」 — 눌러서 설치되게 한다 */
.pwabar{display:none;align-items:center;gap:10px;margin:0 0 12px;padding:11px 13px;
  background:var(--gold-dim);border:1px solid var(--gold-2);border-radius:13px}
.pwabar.on{display:flex}
.pwabar .t{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.55;color:var(--gold)}
.pwabar .t small{display:block;font-weight:600;color:var(--sub);margin-top:2px;font-size:11.5px}
.pwabar button{flex:none;padding:8px 13px;border-radius:9px;border:1px solid var(--gold-2);
  background:var(--gold);color:#1b1a17;font-size:12.5px;font-weight:800}

function 세어올리기(){
  document.querySelectorAll('#main .cnt[data-cnt]').forEach(el => {
    const 끝 = parseFloat(el.getAttribute('data-cnt')) || 0;
    if(!끝) return;
    const 자리 = (el.getAttribute('data-cnt').indexOf('.') >= 0) ? 1 : 0;
    const 콤마 = el.hasAttribute('data-comma');
    const 꾸밈 = v => 콤마 ? Math.round(v).toLocaleString() : v.toFixed(자리);
    if(document.hidden){ el.textContent = 꾸밈(끝); return; }   /* 안 보이면 그냥 끝값 */
    const t0 = Date.now(), 걸림 = 640;
    /* 0 으로 먼저 덮지 않는다 — 타이머가 안 돌아도 제 값이 남아 있게 */
    const 타 = setInterval(() => {
      const 진 = Math.min(1, (Date.now() - t0) / 걸림);
      el.textContent = 꾸밈(끝 * (1 - Math.pow(1 - 진, 3)));
      if(진 >= 1) clearInterval(타);
    }, 24);

    setTimeout(() => { clearInterval(타); el.textContent = 꾸밈(끝); }, 걸림 + 400);
  });
}

function agoTxt(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  const dayOf = x => x.getFullYear()*10000 + (x.getMonth()+1)*100 + x.getDate();
  const gap = dayOf(now) - dayOf(d);
  if(gap === 0) return (now - d) < 3600000 ? '방금' : '오늘';
  if(gap === 1) return '어제';
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
}

/* ══ 잠깐 쓰는 사진 주소 (서명 주소) ══ 2026-09-29
   지금 `media` 버킷은 **공개**라 주소만 알면 아무나 받는다 (실측 — 피드백 영상이 열렸다).
   리포트에 사진을 얹으면 그 주소가 알림톡을 타고 나간다. 그래서 버킷을 잠근다.

   잠그면 `/object/public/...` 이 막히므로, 볼 때마다 **한 시간짜리 주소**를 받아 쓴다.
   ⚠ 이것만으로 다 막히는 건 아니다 — 앱 열쇠가 HTML 에 박혀 있어 그 열쇠를 찾은 사람은
      똑같이 받을 수 있다. **진짜 문은 전화 인증**이다. 다만 「주소만 알면 열림」은 사라진다.

   ⛔ 앱을 먼저 고치고 버킷을 잠근다. 서명 주소는 공개 버킷에서도 되니 순서가 안전하다. */
let SIGNED = {};                          /* path → 잠깐 쓰는 주소 */
const 서명유효 = 3600;                     /* 한 시간 */

async function 주소받기(paths){
  const 새것 = [...new Set((paths||[]).filter(x => x && !SIGNED[x]))];
  if(!새것.length) return;
  for(let i=0; i<새것.length; i+=100){
    const 묶 = 새것.slice(i, i+100);
    try{
      const r = await fetch(SB_URL + '/storage/v1/object/sign/media', { method:'POST',
        headers: Object.assign({}, SB_H, {'Content-Type':'application/json'}),
        body: JSON.stringify({ expiresIn: 서명유효, paths: 묶 }) });
      if(!r.ok) continue;                 /* 아직 공개 버킷이면 실패해도 그만 — 아래에서 공개 주소로 돈다 */
      (await r.json()).forEach(x => {
        if(x && x.signedURL && !x.error) SIGNED[x.path] = SB_URL + '/storage/v1' + x.signedURL; });
    }catch(e){ /* 조용히 넘어가지 않게 콘솔에만 */ console.warn('사진 주소 못 받음', e); }
  }
}

/* ══ 운동이 끝났는지 재는 자 — 판단은 오직 여기서만 한다 ══
