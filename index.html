/* ── 영상 넣기 (2026-09-17 대표: 「영상업로드 추가하고 · 직접 올리는거야」) ──
   ⛔ 왜 다시 굽는가 — 폰이 찍은 1080p60 은 1분에 90MB 다. 저장소도 전송량도 못 버틴다.
      긴 변 720 · 1.2Mbps 로 다시 구우면 30초에 4MB 안팎이 된다.
   ⛔ 소리 규칙이 **둘로 갈린다** (2026-09-21 대표: 「피드백에 붙이는 영상은 소리가 나야한다」)
      · **기구 사용법 · 체형분석(비포애프터)** → **무음.** 폼을 보는 영상이고 옆 사람 말소리가 올라가면 안 된다
      · **트레이너 피드백 첨부 영상** → **소리 담는다.** 트레이너 목소리가 그 영상의 알맹이다
      쓰는 법: 영상줄이기(파일, 알림, 소리=true) — 소리를 뺄 곳에서는 셋째 값을 주지 않는다.
      ⛔ 영상 딱지는 **음소거를 유지한 채** 소리 트랙만 captureStream 으로 뽑는다.
         음소거를 풀면 브라우저가 자동재생을 막고 굽는 동안 소리가 새어 나온다.
         (2026-09-21 브라우저 실측: 음소거 상태에서도 소리 트랙 1개가 잡히고 mp4 에 mp4a 로 담긴다) */
const 영상최대초 = 60;
const 영상최대MB = 45;
function 영상줄이기(file, 알림, 소리){
  return new Promise((res, rej) => {
    const 판 = document.createElement('div');
    판.className = 'vidwork';
    판.innerHTML = '<div class="vw-box"><div class="vw-t">영상을 줄이는 중이에요</div>'
      + '<div class="vw-s">영상 길이만큼 걸립니다 · 다른 앱으로 가면 멈췄다 이어집니다</div>'
      + '<div class="vw-bar"><i></i></div></div>';
    const v = document.createElement('video');
    v.muted = true; v.defaultMuted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted',''); v.setAttribute('playsinline','');
    document.body.appendChild(판);
    판.querySelector('.vw-box').insertBefore(v, 판.querySelector('.vw-bar'));
    const 막대 = 판.querySelector('.vw-bar i');
    let 보임바뀜 = null;
    const 치우기 = () => { try{ v.pause(); }catch(e){} try{ 판.remove(); }catch(e){}
      if(보임바뀜) document.removeEventListener('visibilitychange', 보임바뀜); };
    v.src = URL.createObjectURL(file);
    v.onerror = () => { 치우기(); rej(new Error('영상을 읽지 못했어요')); };
    v.onloadedmetadata = () => {
      const dur = v.duration || 0;
      if(dur > 영상최대초 + 2){ 치우기();
        rej(new Error(영상최대초 + '초까지만 올라갑니다 — 지금 ' + Math.round(dur) + '초예요')); return; }
      let w = v.videoWidth, h = v.videoHeight;
      const sc = Math.min(1, 720 / Math.max(w, h));
      w = Math.max(2, Math.round(w * sc / 2) * 2);
      h = Math.max(2, Math.round(h * sc / 2) * 2);
      /* 소리를 담아야 하는 영상(트레이너 피드백)만 소리 트랙을 뽑는다.
         못 뽑는 브라우저면 조용히 무음으로 간다 — 올리기 자체가 막히면 안 된다 */
      let 소리트랙 = [];
      if(소리){
        try{
          const cs = v.captureStream || v.mozCaptureStream;
          if(cs) 소리트랙 = cs.call(v).getAudioTracks() || [];
        }catch(e){ 소리트랙 = []; }
      }
      const 소리담김 = 소리트랙.length > 0;
      const 꼴후보 = 소리담김
        ? ['video/mp4;codecs=avc1,mp4a.40.2', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
        : ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'];
      const 꼴 = (typeof MediaRecorder !== 'undefined')
        ? 꼴후보.find(t => MediaRecorder.isTypeSupported(t))
        : null;
      const 구울수있나 = !!꼴 && !!(HTMLCanvasElement.prototype.captureStream);
      /* 못 굽는 브라우저 — 작은 것만 원본 그대로 받는다 */
      if(!구울수있나){
        치우기();
        if(file.size <= 영상최대MB * 1048576)
          return res({ blob:file, ext:(String(file.type).indexOf('webm') >= 0 ? 'webm' : 'mp4'), 원본:true });
        return rej(new Error('이 브라우저가 영상을 줄이지 못해요 — 더 짧게 찍어 주세요'));
      }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      let rec;
      const 흐름 = cv.captureStream(30);
      소리트랙.forEach(t => { try{ 흐름.addTrack(t); }catch(e){} });
      try{ rec = new MediaRecorder(흐름, 소리담김
             ? { mimeType:꼴, videoBitsPerSecond:1200000, audioBitsPerSecond:64000 }
             : { mimeType:꼴, videoBitsPerSecond:1200000 }); }
      catch(e){ 치우기(); return rej(new Error('영상을 줄이지 못했어요')); }
      const 조각 = [];
      rec.ondataavailable = e => { if(e.data && e.data.size) 조각.push(e.data); };
      rec.onstop = () => { 치우기(); res({ blob:new Blob(조각, { type:꼴.split(';')[0] }),
                               ext:(꼴.indexOf('mp4') >= 0 ? 'mp4' : 'webm'), 소리:소리담김 }); };
      let raf = 0, 지난 = -1;
      const 그리기 = () => {
        if(v.ended) return;
        if(v.paused){ raf = requestAnimationFrame(그리기); return; }   /* 멈춰 있으면 굽지 않고 기다린다 */
        cx.drawImage(v, 0, 0, w, h);
        if(dur){ const pc = Math.min(100, Math.round(v.currentTime / dur * 100));
          막대.style.width = pc + '%';
          const n = Math.floor(pc / 10) * 10;
          if(알림 && n !== 지난){ 지난 = n; 알림(n); } }
        raf = requestAnimationFrame(그리기);
      };
      v.onended = () => { cancelAnimationFrame(raf); setTimeout(() => { try{ rec.stop(); }catch(e){} }, 150); };
      /* ⛔ 화면이 가려지면 브라우저가 무음 영상을 스스로 멈춘다.
         굽기를 **재생에 묶어** 둔다 — 안 묶으면 멈춘 동안 그림 없이 구워져 알맹이가 날아간다
         (실제로 5초짜리가 1.1초로 잘렸다) */
      v.onpause = () => { try{ if(rec.state === 'recording') rec.pause(); }catch(e){} };
      v.onplay  = () => { try{ if(rec.state === 'paused') rec.resume(); }catch(e){} };
      const 이어감 = () => { if(v.ended || !v.paused) return; v.play().then(그리기).catch(() => {}); };
      보임바뀜 = () => { if(document.visibilityState === 'visible') 이어감(); };
      document.addEventListener('visibilitychange', 보임바뀜);
      try{ rec.start(500); }catch(e){ 치우기(); return rej(new Error('영상을 줄이지 못했어요')); }
      v.play().then(그리기).catch(er => {
        if(document.visibilityState !== 'visible') return;   /* 가려졌을 뿐 — 돌아오면 이어간다 */
        console.error('영상 줄이기', er); 치우기(); try{ rec.stop(); }catch(e2){}
        rej(new Error('영상을 열지 못했어요')); });
    };
  });
}

function shrinkPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1400;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, MAX/Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      res(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

function vCycle(){

/* 주기 고리 — 네 시기를 고리의 네 토막으로, 오늘 자리에 점. 지금 시기만 진하게 (2026-10-07 융합) */
function 주기고리(c, t){
  const R = 46, C = 2*Math.PI*R, 틈 = 5, seg = cycSeg(c);
  const 토막 = seg.map(([nm,a,b])=>{ const 시작 = (a-1)/c.len*C + 틈/2, 길 = Math.max(2, (b-a+1)/c.len*C - 틈), 지금 = nm===t.ph;
    return `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${주기색[nm]}" stroke-width="${지금?9:6}" stroke-linecap="round" opacity="${지금?1:.3}"
      stroke-dasharray="${길.toFixed(1)} ${(C-길).toFixed(1)}" stroke-dashoffset="${(-시작).toFixed(1)}" transform="rotate(-90 60 60)"/>`; }).join('');
  const 각 = ((t.day-.5)/c.len)*2*Math.PI - Math.PI/2, x = 60 + R*Math.cos(각), y = 60 + R*Math.sin(각);
  return `<div class="cyhead" style="--cc:${주기색[t.ph]}">
    <span class="cyt"><small>오늘 ${t.day}일차</small><b>${esc(주기말(t.ph))}</b><i>${esc(t.why)}</i><em>${다음말(t)}</em></span>
    <span class="cyring"><svg viewBox="0 0 120 120" aria-hidden="true">${토막}
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7.5" fill="#151513" stroke="#fff" stroke-width="2.6"/></svg>
      <i><b>${t.day}</b><small>/ ${c.len}일</small></i></span></div>`;
}

/* 길게 누르기 —
     data-rep  : 누르고 있으면 반복 (무게·횟수 빨리 바꾸기)
     data-hold : 길게 누르면 그 동작 한 번 (종목 순서 바꾸기)          */
(function(){
  let 늦게=null, 반복=null, 눌린=null;
  const 끝 = ()=>{
    clearTimeout(늦게); clearInterval(반복); 늦게=반복=null; 눌린=null;
    if(S.repeating){ S.repeating=false; S.heldAt=Date.now(); drawSheet(); render(); }   /* 손 떼면 제대로 다시 그린다 */
  };
  const 눌림 = e=>{
    const el = e.target.closest('[data-rep],[data-hold]'); if(!el) return;
    눌린 = el;
    const h = el.getAttribute('data-hold');
    const a = el.getAttribute('data-act');
    늦게 = setTimeout(()=>{
      if(h){ if(navigator.vibrate) navigator.vibrate(18); 실행(h); S.heldAt=Date.now(); return; }
      if(!a) return;
      if(navigator.vibrate) navigator.vibrate(10);
      /* 화면을 다시 그리면 버튼이 바뀌므로, 버튼이 아니라 「동작」을 되풀이한다.
         「시간」으로 몇 칸을 갈지 정한다 — 기기가 느려도 누른 만큼 움직인다.
         처음 1초는 110ms 에 한 칸, 그 뒤로는 55ms 에 한 칸(두 배 빨리).       */
      S.repeating = true;
      const t0 = Date.now();
      let 적용 = 0;
      반복 = setInterval(()=>{
        const 지난 = Date.now() - t0;
        const 목표 = 지난 < 1000 ? Math.floor(지난/110)
                                : 9 + Math.floor((지난-1000)/55);
        let 남은 = Math.min(목표 - 적용, 40);          /* 한 번에 너무 많이 가지 않게 */
        while(남은-- > 0){ 실행(a); 적용++; }
      }, 55);
    }, h0(el));
  };
  const h0 = el => el.getAttribute('data-hold') ? 420 : 380;
  const 실행 = a=>{
    const b=document.createElement('button'); b.setAttribute('data-act',a);
    b.setAttribute('data-syn','1');        /* 우리가 만든 눌림 — 가로막지 않는다 */
    document.body.appendChild(b); b.click(); b.remove();
  };
  for(const ev of ['pointerdown']) document.addEventListener(ev, 눌림, {passive:true});
  for(const ev of ['pointerup','pointercancel','pointerleave','scroll','touchmove'])
    document.addEventListener(ev, 끝, {passive:true});
})();

  const rec={ id:w.id, mid:w.mid, date:w.date||TODAY, kind:w.kind, rid:w.rid, title:w.title, dur, done:true,
    items: w.items.filter(it=>it.sets.some(s=>s.done)).map(it=>({ _id:it._id, ex:it.ex, va:it.va, locked:true,
      sec:Math.round(it.sec), sets: it.sets.filter(s=>s.done).map(s=>({kg:s.kg, reps:s.reps, spd:s.spd})) })) };
  const i0=D.workouts.findIndex(x=>x.id===w.id);

  /* ══ 수업을 마치면 리포트를 30분 뒤로 예약한다 ══ 2026-09-29 대표
     ⛔ 안전장치 셋 — ① 「수업」만 (개인운동은 안 보낸다)  ② 기록된 세트가 있어야
        ③ **30분 뒤** — 그 사이 피드백을 올리거나 잘못 끝낸 것을 취소할 수 있다
     이미 예약·발송된 수업이면 건드리지 않는다 (두 번 보내기 막기). */
  if((rec.kind || '') === '수업' && 운동요약(rec)){
    try{
      const 있 = await 리포트상태(rec.id);
      if(!있){
        const at = await 리포트예약(rec, 자동분);
        if(at) toast('수업 기록을 ' + 시각글(at) + ' 에 보냅니다');

  }

  D.live=null; save(); S.wid=rec.id;
  if(S.who==='tr'){ S.tmid=rec.mid; S.subj=rec.mid; }

}

    D.cm = mapCm(cms);
    /* 첨부가 아직 덜 올라온 새 피드백이 있으면 다음 번에 다시 받는다 (10분 안의 것만) */
    if(D.cm.some(c => ((+c.pics||0)+(+c.vids||0)) > c.media.length
        && c.ts && Date.now() - new Date(c.ts).getTime() < 600000)) pollSig='';
    const ids = wks.map(w=>'"'+w.id+'"').join(',');
    let witems=[], wsets=[];
    if(ids){
      witems = await sget('workout_items?select=*&workout_id=in.('+ids+')&order=sort');
      const iids = witems.map(i=>i.id).join(',');
      if(iids) wsets = await sget('workout_sets?select=*&item_id=in.('+iids+')&order=sort');
    }
    if(wks.length && !witems.length){
      console.error('poll: 종목이 0건 — 덮어쓰지 않습니다');   /* 있던 기록을 지우느니 그대로 둔다 */
      pollSig = '';
      return;
    }
    D.workouts = mapWorkouts(wks, witems, wsets);
    if(D.live){
      const mine = D.workouts.find(w=>w.id===D.live.id);
      /* ⛔ 「서버에 없으니 지운다」는 **두 번 연달아** 없고, 이 물음보다 먼저 시작한 운동일 때만.
         물어본 뒤에 시작한 운동은 이 답에 아직 없다 — 그걸 지워서 방금 시작한 운동이 통째로 사라졌다 (2026-10-09 점검 「세트표」가 3번에 1번 걸려서 찾음) */
      if(mine) D.live._없음 = 0;
      else if((D.live.born || 0) < 물은때 - 3000 && (D.live._없음 = (D.live._없음 || 0) + 1) >= 2){ D.live=null; save(); }
    }
    if(!first && !isTyping()){ try{ render(); if(sheetRender) drawSheet(); }catch(e){ console.error('그리기', e); } }
  }catch(e){ console.error('poll', e); }
}, 4000);

render();
start();

/* ══ 바로가기 만들기 ══ 2026-09-30 대표
   크롬 계열(안드로이드·PC)은 `beforeinstallprompt` 를 잡아 뒀다가 **한 번 눌러 설치**한다.
   아이폰 사파리는 그 신호가 없다 — 「공유 → 홈 화면에 추가」를 **글로 알려 준다.**
   ⛔ 이미 설치해 쓰는 중이면(standalone) 안 띄운다. 닫으면 그 기기에서 다시 안 띄운다. */
let 설치신호 = null;
const 설치됨 = () => window.matchMedia('(display-mode: standalone)').matches
              || window.navigator.standalone === true;
/* ⚠ 회원앱엔 이미 `아이폰` 이 있다 — 겹치면 스크립트가 통째로 죽는다 (2026-09-30 브라우저에서 잡음) */
const 아이폰사파리 = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); 설치신호 = e; 바로가기띠(); });
window.addEventListener('appinstalled', () => { 설치신호 = null; 바로가기띠(); });

function 바로가기띠(){
  const el = document.getElementById('pwabar'); if(!el) return;
  let 껐나 = false;
  try{ 껐나 = localStorage.getItem('pwabar_off') === '1'; }catch(e){}
  if(설치됨() || 껐나 || (!설치신호 && !아이폰사파리())){ el.classList.remove('on'); return; }
  el.innerHTML = 설치신호
    ? '<span class="t">바로가기를 만들어 두세요<small>다음부터 주소를 찾지 않고 바로 열립니다</small></span>'
      + '<button id="pwago">＋ 바로가기 만들기</button><button class="x" id="pwax">✕</button>'
    : '<span class="t">홈 화면에 추가하세요<small>아래 <b>공유</b> ⬆ → <b>홈 화면에 추가</b> 를 누르시면 됩니다</small></span>'
      + '<button class="x" id="pwax">✕</button>';
  el.classList.add('on');
  const go = document.getElementById('pwago');
  if(go) go.onclick = async () => {
    const p = 설치신호; 설치신호 = null;
    try{ p.prompt(); await p.userChoice; }catch(e){}
    바로가기띠();
  };
  const x = document.getElementById('pwax');
  if(x) x.onclick = () => { try{ localStorage.setItem('pwabar_off','1'); }catch(e){} el.classList.remove('on'); };
}
setTimeout(바로가기띠, 800);
</script>
