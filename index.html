<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131312">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="글래드짐">
<title>글래드짐 운동기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">

<style>
:root{color-scheme:dark;
  /* 바닥을 한 단씩 올렸다 — 어둡되 지하실처럼 눌리지 않게 */
  --dark:#1e1e1b; --dark-2:#282824; --dark-3:#33332e; --dark-4:#41413b;
  --brown:#5a3a2e; --gold:#f0d3a0; --gold-2:#d6b87e; --gold-dim:#332b1d;
  --teal:#a9d8e6; --teal-dim:#1e343b;
  --cream:#fffcf8; --sub:#c6bdb2; --line:#3c3b36;
  --warn:#dda08d; --stage:#141412;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--stage);color:var(--cream);
  font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:500;line-height:1.6;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

#frame{width:100%;max-width:400px;height:min(860px,100vh);background:var(--dark);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  border:1px solid var(--line);border-radius:26px}
@media (max-width:440px){ #frame{max-width:none;height:100vh;height:100dvh;border:none;border-radius:0} }
@supports (padding: env(safe-area-inset-bottom)){
  #tabs{padding-bottom:calc(13px + env(safe-area-inset-bottom))}
  #foot{padding-bottom:calc(11px + env(safe-area-inset-bottom))}
  #top{padding-top:calc(13px + env(safe-area-inset-top))}
}

#top{background:#1a1a17;border-bottom:1px solid var(--line);padding:13px 16px;
  display:flex;align-items:center;gap:11px;flex:none;min-height:52px}
#top .ttl{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
#top .ttl small{display:block;font-size:11.5px;font-weight:500;color:var(--gold-2);letter-spacing:0}
#top .sub{font-size:13px;font-weight:500;color:var(--sub);margin-left:auto;text-align:right}
#top .tbtn{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;color:var(--gold-2);
  border:1px solid var(--line);border-radius:8px;padding:6px 11px}
#top .tbtn:active{background:var(--dark-3)}
#top .tm{font-size:15px;font-weight:700;color:var(--gold);margin-left:auto}
#top .back{font-size:20px;color:var(--sub);width:22px;flex:none;line-height:1}
#top .logo{font-size:10.5px;letter-spacing:.2em;color:var(--gold-2);font-weight:700;
  border:1px solid var(--line);border-radius:7px;padding:5px 8px;flex:none}
#top .logo:active{background:var(--dark-3)}

.search{background:var(--dark-3);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;font-size:14.5px;font-weight:500;color:var(--cream);width:100%}
.search::placeholder{color:#6f6a63}
.fld{display:flex;flex-direction:column;gap:6px}
.fld .fn{font-size:12.5px;font-weight:500;color:var(--sub)}
.calc{background:var(--dark-2);border:1px solid var(--gold-2);border-radius:13px;padding:14px;
  display:flex;flex-direction:column;gap:9px}
.crow{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow .ck{font-size:13px;font-weight:500;color:var(--sub);flex:1}
.crow .cv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.crow .cv.g{color:var(--gold);font-size:17px}
.crow .cs{font-size:12px;font-weight:500;color:var(--sub)}
.calc .kedit{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.calc .kedit .ku{font-size:12px;font-weight:500;color:var(--sub)}
.calc input.kin{width:74px;background:var(--dark-3);border:1px solid var(--gold-2);border-radius:8px;
  padding:7px 8px;font-size:16px;font-weight:700;color:var(--gold);text-align:right;
  font-variant-numeric:tabular-nums;font-family:inherit}
.calc input.kin::placeholder{color:var(--gold);opacity:.6;font-weight:700}
.calc .stp{width:31px;height:31px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);
  background:var(--dark-3);color:var(--cream);font-size:17px;font-weight:700;line-height:1;font-family:inherit}
.calc .stp:active{background:var(--gold-2);color:#fff}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mac div{background:var(--dark-3);border:1px solid var(--line);border-radius:10px;padding:10px;
  display:flex;flex-direction:column;gap:2px;align-items:center}
.mac .n{font-size:12px;font-weight:500;color:var(--sub)}
.mac .v{font-size:17px;font-weight:900;color:var(--gold)}
.mac .u{font-size:11.5px;font-weight:500;color:var(--sub)}

.bar{height:9px;border-radius:5px;background:#2f2f2a;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.bar i.over{background:var(--warn)}
#main.lite .bar{background:#eadfcd}
.kcard{background:#1f1f1c;border:1px solid #35342e;border-radius:13px;padding:15px;
  display:flex;flex-direction:column;gap:10px}
#main.lite .kcard{background:#fff;border-color:#e6ddcf}
.kbig{display:flex;align-items:baseline;gap:8px}
.kbig .v{font-size:29px;font-weight:900;letter-spacing:-.03em}
.kbig .v.g{color:var(--gold)}
.kbig .v.w{color:var(--warn)}
.kbig .u{font-size:13px;font-weight:500;color:var(--sub)}
#main.lite .kbig .v{color:#2b231c}
#main.lite .kbig .v.g{color:#8a5a2b}
#main.lite .kbig .u{color:#7b6c5d}
.krow{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500}
.krow .k{color:var(--sub);flex:1}
#main.lite .krow .k{color:#7b6c5d}
.krow .v{font-weight:700;font-variant-numeric:tabular-nums}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m3 > div{display:flex;flex-direction:column;gap:5px}
.m3 .t{font-size:12px;font-weight:600;color:var(--sub)}
#main.lite .m3 .t{color:#7b6c5d}
.req{color:var(--gold)}

#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:13px}
#main.lite{background:#fbf7f0;color:#2b231c}
#main.lite .card{background:#fff;border-color:#e6ddcf}
#main.lite .card .nm{color:#2b231c}
#main.lite .card .sm{color:#7b6c5d}
#main.lite .lbl{color:#7b6c5d}
#main.lite .note{background:#fff;border-color:#e6ddcf;color:#7b6c5d}
#main.lite .note b{color:#8a5a2b}
#main.lite .hr{background:#e6ddcf}
#main.lite .empty{color:#a0917f}
#main.lite .chip{background:#fff;border-color:#e6ddcf;color:#7b6c5d}
#main.lite .chip.on{background:#f6ead4;border-color:var(--gold-2);color:#8a5a2b}
#main.lite textarea{background:#fff;border-color:#e6ddcf;color:#2b231c}
#main.lite .search{background:#fff;border-color:#e6ddcf;color:#2b231c}
#main.lite .wk{background:#fff;border-color:#e6ddcf}
#main.lite .wkhd .d{background:#f6efe3;color:#2b231c}
#main.lite .wkhd button{color:#8a7c6c}
#main.lite .wkd .dn{color:#a0917f}
#main.lite .wkd .dnum{color:#a0917f}
#main.lite .wkd .dnum.has{color:#2b231c}
#main.lite .wkd>button.sel{background:#f6efe3}
#main.lite .wkd>button.sel .dn{color:#2b231c}
#main.lite .dsum{background:#e6ddcf}
#main.lite .dsum>div{background:#fff}
#main.lite .dsum .k{color:#a0917f}
#main.lite .dsum .v{color:#8a5a2b}
#main.lite .dsum .v small{color:#a0917f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto}
.big2{position:relative;overflow:hidden;border-radius:16px;padding:15px 13px 13px;min-height:112px;
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid #e0cfb4;
  background:linear-gradient(120deg,#f8efe0,#f1e3cd)}
.big2.b{background:linear-gradient(120deg,#eef2f6,#dfe8ef);border-color:#cfdbe4}
.big2 .ic{font-size:24px;line-height:1.1}
.big2 b{font-size:15.5px;font-weight:900;letter-spacing:-.03em;color:#3a2a1e}
.big2 i{font-style:normal;font-size:11.5px;font-weight:600;color:#8a7663;line-height:1.4}
.mealcd{background:#fff;border:1px solid #e6ddcf;border-radius:15px;padding:0;overflow:hidden;flex:0 0 auto}
.mealcd .hd2{display:flex;align-items:baseline;gap:8px;padding:12px 14px 9px}
.mealcd .hd2 .n{font-size:14.5px;font-weight:800;color:#2b231c;letter-spacing:-.02em}
.mealcd .hd2 .t{font-size:11.5px;font-weight:600;color:#a0917f}
.mealcd .hd2 .k{margin-left:auto;font-size:15px;font-weight:900;color:#8a5a2b;font-variant-numeric:tabular-nums}
.mealcd .ph{width:100%;display:block;max-height:190px;object-fit:cover}
.frow2{display:flex;align-items:baseline;gap:9px;padding:9px 14px;border-top:1px solid #f0e8db;width:100%;text-align:left}
.frow2 .fn2{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#2b231c}
.frow2 .fq{font-size:11.5px;font-weight:600;color:#a0917f;flex:none}
.frow2 .fk{font-size:13px;font-weight:800;color:#8a5a2b;flex:none;font-variant-numeric:tabular-nums}
.addf{width:100%;padding:11px 14px;border-top:1px dashed #e0d3bd;font-size:13px;font-weight:700;color:#8a5a2b;text-align:left}
.fitem{display:flex;align-items:baseline;gap:9px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.fitem .n2{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--cream)}
.fitem .n2 small{display:block;font-size:11.5px;font-weight:600;color:#8f8a83;margin-top:1px}
.fitem .k2{font-size:14px;font-weight:800;color:var(--gold);flex:none;font-variant-numeric:tabular-nums}
.qbig{display:flex;align-items:center;justify-content:center;gap:10px}
.qbig .v2{font-size:30px;font-weight:900;color:var(--gold);min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.qbig .gin{width:104px;font-size:28px;font-weight:900;color:var(--gold);text-align:center;
  background:var(--dark-3);border:1px solid var(--line);border-radius:12px;padding:6px 4px;
  font-family:inherit;font-variant-numeric:tabular-nums}
.qbig .gu{font-size:15px;font-weight:800;color:#8f8a83}
.qbig button{width:44px;height:44px;border-radius:50%;background:var(--dark-3);border:1px solid var(--line);
  color:var(--cream);font-size:22px;font-weight:700;line-height:1;font-family:inherit}
.shot2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;flex:0 0 auto;
  border-radius:18px;padding:16px 18px 34px;min-height:112px;position:relative;overflow:hidden;
  background:linear-gradient(115deg,#f8efe0 0%,#f3e6d2 55%,#eddcc4 100%);border:1px solid #e0cfb4}
.shot2 .pic{flex:none;display:flex;align-items:center;justify-content:center;
  width:86px;height:70px;animation:sdBob 3.4s ease-in-out infinite}
.shot2 .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.shot2 .tx b{font-size:18px;font-weight:900;letter-spacing:-.03em;color:#3a2a1e}
.shot2 .tx i{font-style:normal;font-size:12.5px;font-weight:600;color:#8a7663;line-height:1.45}
.shot2 .go{position:absolute;right:16px;bottom:13px;background:var(--brown);color:#f6ead4;
  font-size:12.5px;font-weight:800;border-radius:999px;padding:6px 13px}
.shot2::after{content:'';position:absolute;top:-30%;bottom:-30%;width:30%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);
  animation:ggShine 4.2s ease-in-out infinite}
@keyframes sdBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){ .shot2::after,.shot2 .pic{animation:none} }

.shot{width:100%;border-radius:12px;display:block;background:#0e0e0d}
.mealgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mealcard{border:1px solid #e6ddcf;border-radius:12px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column}
.mealcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.mealcard .cap{padding:8px 10px;font-size:12.5px;font-weight:700;color:#2b231c}
.mealcard .cap span{display:block;font-weight:500;color:#7b6c5d;font-size:11.5px}
.mrow{display:flex;align-items:center;gap:11px;background:var(--dark-2);border:1px solid var(--line);
  border-radius:12px;padding:10px;width:100%;text-align:left}
.mrow img{width:58px;height:58px;border-radius:9px;object-fit:cover;flex:none;background:#0e0e0d}
.nopic{display:flex;align-items:center;justify-content:center;background:var(--dark-3);overflow:hidden}
.nopic svg{width:68%;height:auto}
.mrow .nopic{width:58px;height:58px;border-radius:9px;flex:none;border:1px solid var(--line)}
.nopic.ph{width:100%;height:150px}
.nopic.shot{width:100%;height:190px;border-radius:12px;border:1px solid var(--line)}
.bcmp .cel .nopic{width:100%;aspect-ratio:3/4}
.phstrip .pt .nopic{width:100%;height:106px}
.mrow .nm{font-size:14px;font-weight:700}
.mrow .sm{font-size:12.5px;font-weight:500;color:var(--sub)}
.shotbtn{width:100%;border:1px dashed var(--gold-2);border-radius:12px;background:#f6ead4;
  padding:18px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#8a5a2b}
.shotbtn .ic{font-size:24px}
.shotbtn .t{font-size:15px;font-weight:700}
.shotbtn .s{font-size:12.5px;font-weight:500}
#foot{flex:none;border-top:1px solid #46453f;background:#242420;padding:11px 14px;display:flex;gap:9px;
  box-shadow:0 -6px 16px rgba(0,0,0,.35)}
#tabs{flex:none;background:var(--brown);border-top:1px solid #6b4436;display:flex;
  box-shadow:0 -6px 16px rgba(0,0,0,.45)}
#tabs button{flex:1;padding:12px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:12.5px;font-weight:700;color:#d6c2b6;position:relative}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34px;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
#tabs button .ic{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
  height:22px;transition:transform .16s ease}
#tabs button.on .ic{transform:translateY(-1px) scale(1.06)}
#tabs button:active .ic{transform:scale(.9)}
#tabs button .bd{position:absolute;transform:translate(14px,-4px);width:9px;height:9px;
  border-radius:50%;background:var(--teal);border:2px solid var(--brown)}

.lbl{font-size:13.5px;font-weight:700;color:#a9a29a;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;margin-top:9px}
.lbl::before{content:'';width:3px;height:14px;border-radius:2px;background:#7a4d3c;flex:none}
.lbl.plain{margin-top:0}
.lbl.plain::before{display:none}
.h1{font-size:21px;font-weight:900;letter-spacing:-.03em;line-height:1.3}
.h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
.h2 small{font-weight:500;color:var(--sub);font-size:13px}

.card{background:#1f1f1c;border:1px solid #35342e;border-radius:13px;padding:14px 15px;
  display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:active{background:#262622}
.card.gold{border-color:var(--gold-2);background:var(--gold-dim)}
.card.teal{border-color:#3a5b66;background:var(--teal-dim)}
.card.dim{opacity:.45}
.card.plan{border-left:3px solid #7a4d3c}
.card .nm{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.card .nm.g{color:var(--gold)}
.card .nm.t{color:var(--teal)}
.card .sm{font-size:13px;font-weight:500;color:#8f8a83;line-height:1.6}
.rowc{display:flex;flex-direction:row;align-items:center;gap:11px}
.rowc > div{flex:1;min-width:0;text-align:left}
.rowc .rt{margin-left:auto;text-align:right;font-size:13px;font-weight:600;color:#8f8a83;flex:none}

.tile{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;padding:15px;
  display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:13px;font-weight:500;color:var(--sub)}
.tile .v{font-size:27px;font-weight:900;letter-spacing:-.03em}
.tile .v.g{color:var(--gold)}
.tile .v small{font-size:14px;font-weight:500;color:var(--sub);letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.btn{flex:1;text-align:center;border-radius:12px;padding:14px 10px;font-size:15.5px;font-weight:700;
  letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--teal);color:#0d2027}
.btn.gold{background:var(--gold);color:#241a08}
.btn.sub{background:var(--dark-3);color:var(--teal);border:1px solid var(--line)}
.btn.ghost{background:var(--dark-2);color:var(--sub);border:1px solid var(--line)}
.btn.kakao{background:#FEE500;color:#1c1a17}
.btn.blue{background:#4d7f96;color:#f2fafd}
.anatab{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:0 0 auto;margin-bottom:3px}
.anatab button{padding:14px 6px 13px;border-radius:14px;font-size:15.5px;font-weight:800;
  letter-spacing:-.03em;border:1px solid var(--line);background:var(--dark-2);color:#8b8379;
  display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1}
.anatab button .ic3{display:block;opacity:.55}
.anatab button.on .ic3{opacity:1}
.anatab button.ex.on{background:linear-gradient(140deg,#7d5f38 0%,#5e4128 100%);
  border-color:#a2814f;color:#fdf3e3;box-shadow:0 4px 13px rgba(125,95,56,.4)}
.anatab button.bd.on{background:linear-gradient(140deg,#4d7f96 0%,#35586a 100%);
  border-color:#7fb0c6;color:#f2fafd;box-shadow:0 4px 13px rgba(77,127,150,.4)}
.bcmp{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:0 0 auto}
.bcmp .cel{background:#0e0e0d;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column}
.bcmp .cel .hd2{display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:8px 10px;background:var(--dark-3);width:100%}
.bcmp .cel .hd2 b{font-size:12.5px;font-weight:800;color:var(--cream)}
.bcmp .cel .hd2 i{font-style:normal;font-size:11.5px;font-weight:700;color:#8bbdd2}
.bcmp .cel img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#000}
.bcmp .cel .no2{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:#6f6a64;text-align:center;padding:10px;line-height:1.5}
.bcmp .cel .ft2{padding:7px 8px;font-size:11.5px;font-weight:700;color:#8f8a83;text-align:center}
.phstrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;flex:0 0 auto}
.phstrip::-webkit-scrollbar{display:none}
.phstrip .pt{flex:none;width:86px;border-radius:11px;overflow:hidden;
  background:#0e0e0d;border:1px solid var(--line)}
.phstrip .pt img{width:100%;height:106px;object-fit:cover;display:block}
.phstrip .pt span{display:block;font-size:10.5px;font-weight:700;color:#8f8a83;padding:5px 2px;text-align:center}
.lrbar{display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--dark-3);border:1px solid var(--line)}
.lrbar span{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;min-width:34px}
.lrbar .l{background:var(--gold);color:#241d12}
.lrbar .r{background:#4d7f96;color:#f2fafd}
.lrbar .z{flex:1;color:#6f6a64;font-weight:600;font-size:12px}
.blrow{display:grid;grid-template-columns:58px 1fr 1fr 1fr;gap:4px;align-items:baseline;
  padding:9px 2px;border-top:1px solid var(--line)}
.blrow:first-child{border-top:none}
.blrow .d0{font-size:11.5px;font-weight:700;color:#8f8a83}
.blrow .c{text-align:right;font-size:13.5px;font-weight:800;color:var(--cream);font-variant-numeric:tabular-nums}
.blrow .c i{font-style:normal;font-size:10.5px;font-weight:700;margin-left:3px}
.blrow .c i.up{color:#6fa07f}.blrow .c i.dn{color:var(--warn)}
.blhd{display:grid;grid-template-columns:58px 1fr 1fr 1fr;gap:4px;padding:0 2px 6px}
.blhd span{font-size:10.5px;font-weight:700;color:#75706a;text-align:right}
.blhd span:first-child{text-align:left}
.figbox{background:var(--dark-2);border:1px solid var(--line);border-radius:16px;padding:10px 8px 6px;flex:0 0 auto;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.figbox svg{display:block;margin:0 auto;cursor:grab}
.figcap{text-align:center;font-size:12px;font-weight:700;color:#8f8a83;margin-top:3px}
.figcap b{color:var(--gold)}
.figls{display:flex;flex-direction:column;gap:0}
.figls .fl{display:flex;gap:8px;align-items:baseline;padding:7px 2px;border-top:1px solid var(--line)}
.figls .fl b{font-size:11px;font-weight:800;color:var(--gold-2);min-width:26px}
.figls .fl span{font-size:13px;font-weight:600;color:var(--cream);flex:1}
.figls .fl i{font-style:normal;font-size:12px;font-weight:700;color:#8f8a83}
.figls .fl{border-radius:9px;transition:background .12s}
.figls .fl.on{background:var(--gold-dim)}
.figls .fl.on span{color:var(--gold)}
.mkwrap{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#000;
  border:1px solid var(--line)}
.mkwrap img{width:100%;height:100%;object-fit:cover;display:block}
.mkwrap .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sig{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
  padding:9px 2px;border-top:1px solid var(--line)}
.sig:first-child{border-top:none}
.sig .t2{font-size:13px;font-weight:600;color:var(--cream)}
.sig .t2 small{display:block;font-size:11px;font-weight:600;color:#75706a}
.sig .b2{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.sig .b2.ok{background:rgba(111,160,127,.16);color:#8fc4a2}
.sig .b2.no{background:var(--gold-dim);color:var(--gold)}
.sig .b2.nw{background:rgba(200,90,60,.15);color:var(--warn)}
.setrow2{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 13px;border-radius:11px;background:var(--dark-3);border:1px solid var(--line);margin-top:7px}
.setrow2.ed{border-color:#4d7f96;background:#1b2a31}
.setrow2 .no{font-size:12px;font-weight:700;color:#8f8a83;flex:none;min-width:38px}
.setrow2 .vv{flex:1;font-size:15px;font-weight:800;color:var(--cream);font-variant-numeric:tabular-nums}
.setrow2 .go2{font-size:12.5px;font-weight:700;color:#8bbdd2;flex:none}
.btn:active{opacity:.72}
.btn[disabled]{opacity:.3}
.btn.sm{padding:10px 8px;font-size:13.5px}
/* 아래 큰 단추 — 숨 쉬듯 천천히 */
@keyframes ggBreath{
  0%,100%{ box-shadow:0 0 0 0 rgba(157,206,220,0), 0 2px 10px rgba(0,0,0,.35) }
  50%    { box-shadow:0 0 0 7px rgba(157,206,220,.12), 0 6px 20px rgba(157,206,220,.28) }
}
@keyframes ggShine{ 0%{transform:translateX(-140%) skewX(-18deg)} 60%,100%{transform:translateX(320%) skewX(-18deg)} }
@keyframes ggDot{ 0%,100%{opacity:.35;transform:scale(.82)} 50%{opacity:1;transform:scale(1)} }
@keyframes ggUp{ from{opacity:0;transform:translateY(9px)} to{opacity:1;transform:translateY(0)} }
.btn.go{position:relative;overflow:hidden}
.btn.go::after{content:'';position:absolute;top:-30%;bottom:-30%;width:34%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  animation:ggShine 3.6s ease-in-out infinite}
.btn.go.live::after{animation-duration:2.2s}
.btn.go .gdot{width:8px;height:8px;border-radius:50%;background:currentColor;
  animation:ggDot 1.2s ease-in-out infinite;flex:none}
.btn.go.calm::after{display:none}
#foot > .btn.go{animation:ggUp .42s ease-out both, ggBreath 2.8s ease-in-out .42s infinite}
#foot > .btn.go.live{animation:ggUp .42s ease-out both, ggBreath 1.6s ease-in-out .42s infinite}
#foot > .btn.go.calm{animation:ggUp .42s ease-out both, ggBreath 4.6s ease-in-out .42s infinite}
@media (prefers-reduced-motion:reduce){
  #foot > .btn.go{animation:none!important}
  .btn.go::after,.btn.go .gdot{animation:none!important;display:none}
}

.set{background:var(--dark-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.set .i{font-size:13px;font-weight:500;color:var(--sub);min-width:46px;flex:none}
.set .n{font-size:20px;font-weight:700;margin-left:auto}
.set .u{font-size:12.5px;font-weight:500;color:var(--sub)}
.set .sl{color:#4c4c46;font-weight:700;padding:0 2px}
.set.done{opacity:.42}
.set.now{border-color:var(--gold);background:var(--gold-dim)}
.set.now .n{color:var(--gold)}
.set.lock{opacity:.42;pointer-events:none}

/* 종목을 누르면 그 아래로 펼쳐지는 카드 */
.opencard{background:var(--dark-2);border:1px solid #3a5b66;border-top:none;
  border-radius:0 0 14px 14px;padding:13px;margin:-9px 0 4px;
  display:flex;flex-direction:column;gap:9px}
/* 직전 무게 — 접힌 한 줄이 기본, 누르면 3회분 펼침 */
/* 시범 그림이 아직 없는 자리 */
.demop{display:flex;align-items:center;justify-content:center;flex:none;
  aspect-ratio:16/10;border:1px dashed #4a473f;border-radius:14px;background:var(--dark-2)}
.demop .dpt{font-size:14px;font-weight:700;color:#7d766e;letter-spacing:.02em}
#main.lite .demop{background:#fff;border-color:#dfd2bd}
#main.lite .demop .dpt{color:#a89b8a}

/* ── 프로필 ── 인스타처럼 */
.pf{display:flex;flex-direction:column;align-items:center;gap:7px;flex:none;
  padding:20px 16px 18px;border:1px solid var(--line);border-radius:18px;
  background:radial-gradient(110% 80% at 50% 0%,#2c2823 0%,var(--dark-2) 70%)}
.pfa{width:86px;height:86px;border-radius:50%;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--dark-3);border:2px solid var(--gold-2);color:var(--gold)}
.pfa img{width:100%;height:100%;object-fit:cover}
.pfa b{font-size:34px;font-weight:800}
.pfn{font-size:18px;font-weight:800;color:var(--cream);letter-spacing:-.02em}
.pfb{font-size:12.5px;font-weight:500;color:var(--sub);text-align:center;line-height:1.6}
.pfs{display:flex;width:100%;margin-top:9px;gap:1px;background:var(--line);
  border-radius:12px;overflow:hidden}
.pfs i{flex:1;background:var(--dark-3);padding:10px 4px;text-align:center;font-style:normal;
  font-size:11px;font-weight:600;color:#8e867d;display:flex;flex-direction:column;gap:2px}
.pfs i b{font-size:18px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.pfs i b .cnt{font-style:normal}
.pfstreak{font-size:12px;font-weight:700;color:var(--gold-2);margin-top:8px}
.pfrow .gi.pfmini{overflow:hidden;padding:0}
.pfrow .gi.pfmini img{width:100%;height:100%;object-fit:cover}

/* 오운완 격자 */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;flex:none}
.pg{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:6px;background:var(--dark-3);
  transition:transform .13s ease}
.pg:active{transform:scale(.97)}
.pg img{width:100%;height:100%;object-fit:cover;display:block}
.pgd{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;
  font-size:10px;font-weight:700;color:rgba(255,255,255,.9);text-align:left;
  background:linear-gradient(to top,rgba(8,8,7,.72),transparent)}
#main.lite .pf{background:#fff;border-color:#e6ddcf}
#main.lite .pfn{color:#2b231c}
#main.lite .pfs i{background:#f6efe3;color:#a0917f}
#main.lite .pfs i b{color:#8a5a2b}

/* 오운완 미리보기 — 세로 4:5 */
.ootdimg{width:100%;border-radius:14px;aspect-ratio:4/5;object-fit:cover;
  border:1px solid var(--line)}

/* ── 운동 끝 ── 로고가 떠오르고 빛이 한 번 훑고 지나간다 */
.fend{position:relative;overflow:hidden;flex:none;
  border:1px solid var(--gold-2);border-radius:18px;padding:26px 20px 22px;
  background:radial-gradient(120% 90% at 50% 0%,#3a3020 0%,#221f19 55%,#1c1a15 100%);
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.fend > *{position:relative;z-index:2}
.fend .shine{position:absolute;z-index:1;inset:-40% -60%;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,240,205,.30) 50%,transparent 62%);
  transform:translateX(-70%);
  animation:빛훑기 1.5s cubic-bezier(.3,.7,.4,1) .34s 1 both}
@keyframes 빛훑기{ from{transform:translateX(-70%)} to{transform:translateX(70%)} }
.fend .flogo{font-size:22px;font-weight:800;letter-spacing:.24em;color:var(--gold);
  text-shadow:0 2px 22px rgba(240,211,160,.35);
  animation:로고떠오름 .62s cubic-bezier(.2,.9,.3,1.05) both}
@keyframes 로고떠오름{
  from{opacity:0;transform:translateY(14px) scale(.9)}
  60%{opacity:1;transform:translateY(-2px) scale(1.03)}
  to{opacity:1;transform:none} }
.fend .fmsg{font-size:13px;font-weight:600;color:#c0b6a8;
  animation:떠오름 .5s ease .18s both}
.fend .fnum{font-size:14.5px;font-weight:700;color:var(--cream);margin-top:5px;
  animation:떠오름 .5s ease .26s both}
.fend .fnum small{font-size:11.5px;font-weight:600;color:var(--sub);margin-left:1px}
.fend .fkg{font-size:38px;font-weight:800;color:var(--gold);letter-spacing:-.035em;
  line-height:1.1;font-variant-numeric:tabular-nums;
  animation:떠오름 .5s ease .34s both}
.fend .fkg small{font-size:15px;font-weight:700;color:var(--gold-2)}
.fend .fkg .cnt{font-style:normal}
.fend .fparts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px;
  animation:떠오름 .5s ease .42s both}
.fend .fparts i{font-style:normal;font-size:11.5px;font-weight:700;color:#d8d0c6;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:999px;padding:4px 10px 4px 8px;display:inline-flex;align-items:center;gap:5px}
.fend .fparts i::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--pc)}
.fend .fdiff{font-size:12px;font-weight:700;margin-top:7px;
  animation:떠오름 .5s ease .5s both}
.fend .fdiff.up{color:var(--gold)}
.fend .fdiff.dn{color:var(--sub)}
@media (prefers-reduced-motion:reduce){
  .fend .shine{display:none}
  .fend .flogo,.fend .fmsg,.fend .fnum,.fend .fkg,.fend .fparts,.fend .fdiff{animation:none}
}

/* 코멘트 — 대화처럼 */
.cm.cm2{flex-direction:row;align-items:flex-start;gap:11px;text-align:left;
  border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.cm.cm2.new{border-color:#3f5a63;background:linear-gradient(180deg,var(--teal-dim),var(--dark-2))}
.cm2 .av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:800;
  background:#24383e;border:1px solid #3f5a63;color:var(--teal)}
.cm2.new .av{background:#2b4650;border-color:#4d6d78}
.cm2 .cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cm2 .ndot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none}
.cm2 .cex{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--gold)}
.cm2 .cex i{width:7px;height:7px;border-radius:2px;flex:none}
.cm2 .cmore{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--teal)}
#main.lite .cm2{border-color:#e6ddcf}
#main.lite .cm2 .av{background:#e8f0f4;border-color:#c3d7e0;color:#4a6b80}

/* 회원권 타일 — 남은 기간 고리를 오른쪽에 */
.mtile{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.mtile .mt1{display:flex;flex-direction:column;gap:4px;min-width:0}
.dring{flex:none}

/* 목표 진행 막대 */
.gbar{height:7px;border-radius:99px;background:var(--dark-4);overflow:hidden;margin-top:11px}
.gbar > span{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold-2),var(--gold))}
.gbl{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;
  color:var(--sub);margin-top:5px}
.gbl b{color:var(--gold);font-weight:800}

/* 켬/끔 스위치 */
.sw{width:42px;height:24px;border-radius:99px;flex:none;position:relative;
  background:var(--dark-4);border:1px solid var(--line);transition:background .18s ease}
.sw i{position:absolute;top:2.5px;left:3px;width:17px;height:17px;border-radius:50%;
  background:#8b847b;transition:transform .18s ease, background .18s ease}
.sw.on{background:var(--gold-dim);border-color:var(--gold-2)}
.sw.on i{transform:translateX(18px);background:var(--gold)}
.gi.sm2{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;background:var(--dark-3);border:1px solid var(--line);
  color:var(--gold-2);flex:none;margin-right:11px}

/* 음식 줄 앞 그림 */
.frow2 .fe{font-size:16px;line-height:1;flex:none;width:22px;text-align:center;
  filter:saturate(.92)}

/* ── 인체도 ── 어디를 안 했는지 한눈에 */
.bwrap{display:flex;flex-direction:column;gap:11px;align-items:center;width:100%}
.bsvg{width:100%;max-width:280px;height:auto;display:block}
.bchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.bchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  color:#6d6a65;background:var(--dark-3);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px 4px 6px}
.bchip.on{color:#c9c2b9;border-color:#4d4a42}
.bchip i{width:8px;height:8px;border-radius:50%;flex:none}
.bchip b{font-weight:800;color:#5f5b56}
.bchip.on b{color:var(--gold)}
#main.lite .bchip{background:#f6efe3;border-color:#e6ddcf;color:#a0917f}
#main.lite .bchip.on{color:#5a4a3a;border-color:#dfd2bd}
#main.lite .bchip.on b{color:#8a5a2b}

/* ── 칼로리 결론 카드 ── 가장 궁금한 넷만 위로 올린다 */
.kres{border:1px solid var(--gold-2);border-radius:16px;overflow:hidden;
  background:linear-gradient(152deg,var(--gold-dim),#26221a);margin-bottom:4px}
.kres .kmain{padding:16px 16px 14px;text-align:center}
.kres .kl{display:block;font-size:12px;font-weight:700;color:var(--gold-2);letter-spacing:-.01em}
.kres .kb{display:block;font-size:40px;font-weight:800;color:var(--gold);letter-spacing:-.035em;
  line-height:1.08;margin-top:4px;font-variant-numeric:tabular-nums}
.kres .kb small{font-size:15px;font-weight:700;margin-left:5px;color:var(--gold-2)}
.kres .kb .cnt{font-style:normal}
.kres .ks{display:block;font-size:12px;font-weight:500;color:#c0b6a8;margin-top:6px;line-height:1.55}
.kres .ks b{color:var(--cream);font-weight:800}
.kres .ksub{display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:#4a422f;border-top:1px solid #4a422f}
.kres .ksub > div{background:#232019;padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.kres .ksub .n{font-size:11px;font-weight:700;color:#9a9187}
.kres .ksub .v{font-size:17.5px;font-weight:800;color:var(--cream);letter-spacing:-.02em}
.kres .ksub .u{font-size:11px;font-weight:500;color:#8e867d;line-height:1.45}
#main.lite .kres{border-color:#d8b57a;background:linear-gradient(152deg,#fbf2e2,#f5ead6)}
#main.lite .kres .kl{color:#a8813f}
#main.lite .kres .kb{color:#8a5a2b}
#main.lite .kres .kb small{color:#a8813f}
#main.lite .kres .ks{color:#8a7f70}
#main.lite .kres .ks b{color:#3a2f24}
#main.lite .kres .ksub{background:#e6d8bd;border-top-color:#e6d8bd}
#main.lite .kres .ksub > div{background:#fffaf0}
#main.lite .kres .ksub .n{color:#a0917f}
#main.lite .kres .ksub .v{color:#2b231c}
#main.lite .kres .ksub .u{color:#a0917f}

/* ── 큰 그림 카드 ── 사진이 들어올 자리를 미리 잡아 둔다.
   나중에 --img 만 채우면 그대로 사진 카드가 된다.                    */
.hero2{
  position:relative;overflow:hidden;width:100%;border-radius:18px;
  min-height:188px;                       /* 고정 높이가 아니라 최소 높이 — 글씨가 잘리지 않게 */
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:19px 20px;text-align:left;border:1px solid var(--line);
  background-image:var(--img,none),linear-gradient(128deg,var(--h1),var(--h2));
  background-size:cover;background-position:center;isolation:isolate}
.hero2::after{
  content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(9,9,8,.72) 6%,rgba(9,9,8,.18) 58%,transparent)}
.hero2:active{transform:scale(.985)}
.hero2 .tt{
  position:relative;z-index:3;font-size:23px;font-weight:800;letter-spacing:-.03em;
  line-height:1.25;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.55)}
.hero2 .dd{
  position:relative;z-index:3;font-size:12.5px;font-weight:500;line-height:1.6;
  color:rgba(255,255,255,.84);margin-top:5px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.hero2 .tag2{
  position:absolute;top:14px;right:15px;z-index:3;font-size:11.5px;font-weight:800;
  padding:5px 12px;border-radius:999px;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(6px)}
.hero2 .gl{
  position:absolute;top:13px;left:16px;z-index:3;font-size:10.5px;font-weight:800;
  letter-spacing:.1em;color:rgba(255,255,255,.6)}
.hero2.tall{min-height:214px}
.hero2.shot .art{display:none}
.hero2.shot::after{
  background:linear-gradient(to top,rgba(6,6,5,.66) 2%,rgba(6,6,5,.22) 46%,
    rgba(6,6,5,.06) 64%,transparent)}
.hero2.shot .tag2{background:rgba(20,18,15,.42);border-color:rgba(255,255,255,.30)}

/* 무늬 — 사진이 없는 동안 카드를 살려 주는 장치 */
.hero2 .art{position:absolute;inset:0;z-index:0;opacity:.5;pointer-events:none}
.hero2 .art::before,.hero2 .art::after{content:'';position:absolute;display:block}
.art.d1::before{width:190px;height:190px;right:-52px;top:-64px;border-radius:34px;

function exKey(e){
  let t = e.n + ' ' + e.p + ' ' + (e.e||'');
  for(const a of 별칭이름) if(t.indexOf(a[0])>=0) t += ' ' + a[1];
  t += ' ' + (별칭부위[e.p]||'') + ' ' + (별칭기구[e.e]||'');
  /* 같은 낱말이라도 부위에 따라 뜻이 다르다 — 레그 컬은 이두가 아니고, 덤벨 킥백은 둔근이 아니다 */
  if(e.p==='팔'){
    if(/컬/.test(e.n)) t += ' 이두 biceps 알통';
    if(/트라이셉스|푸시다운|익스텐션|킥백|딥스|스컬|JM|클로즈그립/.test(e.n)) t += ' 삼두 triceps';
    if(/리스트|파머스|악력|그립 스퀴즈/.test(e.n)) t += ' 전완 forearm 악력';
  }
  if(e.p==='하체'){
    if(/힙|글루트|브릿지|쓰러스트|킥백|어브덕션|풀 스루|하이퍼|데드리프트|RDL/.test(e.n))
      t += ' 엉덩이 둔근 glute 힙';

    if(/익스텐션|스쿼트|런지|레그 프레스|핵|시시/.test(e.n)) t += ' 대퇴사두 quad 앞허벅지';
    if(/어덕션|애덕터/.test(e.n)) t += ' 내전근 adductor 안쪽허벅지';
  }
  if(e.p==='등'){

    if(/슈러그/.test(e.n)) t += ' 승모 trap';
    if(/페이스|리버스 플라이|Y 레이즈|T 레이즈/.test(e.n)) t += ' 후면 승모 능형근';

  if(e.p==='어깨'){
    if(/레터럴/.test(e.n)) t += ' 측면 중간삼각 사레레';
    if(/프론트/.test(e.n)) t += ' 전면삼각';
    if(/리어|리버스 플라이|델트 로우/.test(e.n)) t += ' 후면삼각 후삼';
    if(/회전|큐반/.test(e.n)) t += ' 회전근개 rotatorcuff 재활';
  }
  if(e.p==='가슴'){
    if(/인클라인/.test(e.n)) t += ' 윗가슴 상부';
    if(/디클라인/.test(e.n)) t += ' 아랫가슴 하부';
  }
  if(e.p==='복근'){
    if(/레그 레이즈|니 레이즈|리버스 크런치|니업|플러터|시저스/.test(e.n)) t += ' 하복부';

  }
  return 검색키(t);
}

const 수 = (v, 콤마) => {
  const n = Number(v) || 0;
  const 글 = 콤마 ? Math.round(n).toLocaleString() : String(n);
  return n ? '<i class="cnt" data-cnt="' + n + '"' + (콤마 ? ' data-comma="1"' : '')
             + '>' + 글 + '</i>' : 글;
};
function 세어올리기(){
  document.querySelectorAll('#main .cnt[data-cnt]').forEach(el => {
    const 끝 = parseFloat(el.getAttribute('data-cnt')) || 0;
    if(!끝) return;
    const 자리 = (el.getAttribute('data-cnt').indexOf('.') >= 0) ? 1 : 0;
    const 콤마 = el.hasAttribute('data-comma');
    const 꾸밈 = v => 콤마 ? Math.round(v).toLocaleString() : v.toFixed(자리);
    if(document.hidden){ el.textContent = 꾸밈(끝); return; }   /* 안 보이면 그냥 끝값 */
    const t0 = Date.now(), 걸림 = 640;
    /* 0 으로 먼저 덮지 않는다 — 타이머가 안 돌아도 제 값이 남아 있게 */
    const 타 = setInterval(() => {
      const 진 = Math.min(1, (Date.now() - t0) / 걸림);
      el.textContent = 꾸밈(끝 * (1 - Math.pow(1 - 진, 3)));
      if(진 >= 1) clearInterval(타);
    }, 24);
    /* 안전망 — 무슨 일이 있어도 제 값으로 끝낸다 (창이 가려져 타이머가 늦어져도) */
    setTimeout(() => { clearInterval(타); el.textContent = 꾸밈(끝); }, 걸림 + 400);
  });
}

function totalKg(w){ let s=0; (w.items||[]).forEach(it=>{ if(isMemo(it.ex)) return;
  (it.sets||[]).forEach(x=>{ s+=(x.kg||0)*(x.reps||0); }); }); return s; }
function partTimes(w){ const m={}; (w.items||[]).forEach(it=>{ if(!(it.sec>0)) return; const p=exOf(it.ex).p; m[p]=(m[p]||0)+it.sec; }); return m; }
const byDateDesc = (a,b)=> a.date<b.date?1 : a.date>b.date?-1 : (a.id<b.id?1:-1);
function myWorkouts(){ return D.workouts.filter(w=>w.mid===S.mid && w.done).slice().sort(byDateDesc); }
function liveOf(mid){
  if(D.live && D.live.mid===mid) return D.live;
  /* 오늘 것만 「기록 중」으로 본다 — 지난날 끝내지 않은 기록이 계속 떠 있지 않게 */
  const w = D.workouts.find(x=>!x.done && x.mid===mid && x.date===TODAY);
  if(!w || !w.items || !w.items.length) return null;
  if(w.cur==null || w.cur<0 || w.cur>=w.items.length){
    const i = w.items.findIndex(it=>!it.locked);
    w.cur = i>=0 ? i : w.items.length-1;
  }
  return w;
}
const DOW = ['일','월','화','수','목','금','토'];
const dNew = d => new Date(d + 'T00:00:00');
const dowTxt = d => (+d.slice(5,7))+'월 '+(+d.slice(8))+'일 ('+DOW[dNew(d).getDay()]+')';
function weekOf(d0){
  const d = dNew(d0); d.setDate(d.getDate() - d.getDay());
  return Array.from({length:7}, (_,i) => { const x = new Date(d); x.setDate(d.getDate()+i); return ymd(x); });
}
/* 그날 한 줄 요약 — 운동시간 · 종목수 · 먹은 칼로리 */
function dayStat(mid, date){
  const ws = D.workouts.filter(w => w.mid===mid && w.date===date && w.done);
  const dur = ws.reduce((a,w) => a + (Number(w.dur)||0), 0);
  const exs = new Set(); ws.forEach(w => w.items.forEach(i => exs.add(i.ex)));
  const ms = (D.meals||[]).filter(m => m.mid===mid && m.date===date);
  const kcal = ms.reduce((a,m) => a + (Number(m.kcal)||0), 0);
  let goal = 0; try{ const rr = calcOf(GOALS[mid]||{}); goal = rr.bmr ? rr.kcal : 0; }catch(e){}
  const vol = ws.reduce((a,w)=> a + totalKg(w), 0);
  return { ws, dur, ex:exs.size, vol, kcal, shots:ms.length, goal,
    pw: Math.min(1, dur/(45*60)), pk: goal ? Math.min(1, kcal/goal) : 0 };
}
/* 두 겹 고리 — 바깥 운동 · 안쪽 식단 */
function ring(pw, pk){
  const C1 = 2*Math.PI*15, C2 = 2*Math.PI*10;
  const arc = (r,c,p,col) => `<circle cx="18" cy="18" r="${r}" fill="none" stroke="${col}" stroke-width="3.4"
    stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 18 18)"/>`;

    <circle cx="18" cy="18" r="15" fill="none" stroke="#302f2b" stroke-width="3.4"/>
    <circle cx="18" cy="18" r="10" fill="none" stroke="#302f2b" stroke-width="3.4"/>
    ${pw>0?arc(15,C1,pw,'var(--gold)'):''}${pk>0?arc(10,C2,pk,'var(--teal)'):''}</svg>`;
}
/* 그날 무엇을 몇 kg 몇 세트 했는지 */
function dayDetail(mid, date){
  const all = D.workouts.filter(w => w.mid===mid && w.date===date && w.done);

  return `<span class="lbl">${dateTxt(date)} 기록${dayVol?` · 총 ${dayVol.toLocaleString()}kg`:''}${dayCar?` · 유산소 ${dayCar}분`:''}</span>`
   + ws.map(w => { const vol = totalKg(w);

          <span class="r">${its.length}종목${vol?` · ${vol.toLocaleString()}kg`:''} · ${durTxt(w.dur)}</span>

/* ── 분석 ── */
const PARTG = { '상체':['가슴','어깨','등','팔'], '하체':['하체'], '복근':['복근'], '유산소':['유산소'], '기타':['기타'] };
const PARTS8 = ['가슴','어깨','등','팔','하체','복근','유산소','기타'];
const ANA_P = { '1주':7, '1달':30, '3달':90, '전체':3650 };

function anaFrom(){ return addDays(TODAY, -(ANA_P[S.anaP||'1주'] - 1)); }
function anaWs(mid, from){ return D.workouts.filter(w => w.mid===mid && w.done && w.date >= from)
  .slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }

/* 그날 든 총 무게 · 세트 · 분 · 소모 추정 */
function wStat(w, bw){
  let vol = 0, sets = 0, cardioMin = 0;
  w.items.forEach(it => { const e = exOf(it.ex); if(!e || isMemo(it.ex)) return;
    it.sets.forEach(x => { sets++;
      if(e.cardio) cardioMin += (+x.reps || 0);
      else vol += (+x.kg || 0) * (+x.reps || 0); }); });
  const min = Math.round((Number(w.dur)||0)/60);
  const wt = Math.max(0, min - cardioMin);
  const kcal = Math.round((5.0*wt + 7.0*cardioMin) * 3.5 * (bw||65) / 200);
  return { vol:Math.round(vol), sets, min, kcal };
}
function bwOf(mid){ const g = GOALS[mid]||{}; return nnum(g.now && g.now.w) || 65; }

/* 기간을 7칸으로 나눈 꺾은선 */
function anaSeries(mid, metric){
  const days = ANA_P[S.anaP||'1주'], bw = bwOf(mid);
  let from = anaFrom();
  if(days > 365){ const all = D.workouts.filter(w=>w.mid===mid && w.done);
    from = all.length ? all.map(w=>w.date).sort()[0] : TODAY; }
  const total = Math.max(1, Math.round((dNew(TODAY) - dNew(from)) / 86400000) + 1);
  const n = Math.min(7, total), span = Math.ceil(total / n);
  const out = [];
  for(let i = n-1; i >= 0; i--){
    const end = addDays(TODAY, -i*span), st = addDays(end, -(span-1));
    const ws = D.workouts.filter(w => w.mid===mid && w.done && w.date >= st && w.date <= end);
    let v = 0;
    ws.forEach(w => { const t = wStat(w, bw);
      v += metric==='vol' ? t.vol : metric==='kcal' ? t.kcal : t.min; });
    out.push({ label: span===1 ? DOW[dNew(end).getDay()] : (+end.slice(5,7))+'/'+(+end.slice(8)), v });
  }
  return out;
}
function lineChart(pts, unit){
  const W = 320, H = 118, PL = 8, PR = 8, PT = 26, PB = 20;
  const mx = Math.max(1, ...pts.map(p=>p.v));
  const x = i => PL + i * (W-PL-PR) / Math.max(1, pts.length-1);
  const y = v => PT + (1 - v/mx) * (H-PT-PB);
  const d = pts.map((p,i)=> (i?'L':'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = d + ` L ${x(pts.length-1).toFixed(1)} ${H-PB} L ${x(0).toFixed(1)} ${H-PB} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:140px">
    <path d="${area}" fill="var(--gold-dim)"/>
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i===pts.length-1?3.4:2.4}"
        fill="${i===pts.length-1?'var(--gold)':'var(--gold-2)'}"/>
      ${p.v?`<text x="${x(i).toFixed(1)}" y="${Math.max(11,y(p.v)-8).toFixed(1)}" text-anchor="middle"
        font-size="9.5" font-weight="700" fill="#c9c2b9">${p.v.toLocaleString()}</text>`:''}
      <text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9.5" font-weight="600"
        fill="#75706a">${esc(p.label)}</text>`).join('')}
  </svg><div class="sm" style="text-align:right;color:#75706a">단위 ${unit}</div>`;
}

/* 부위별 세트 수 → 팔각형 */
function partSets(mid, from){
  const o = {}; PARTS8.forEach(k => o[k] = 0);
  anaWs(mid, from).forEach(w => w.items.forEach(it => {
    const e = exOf(it.ex); if(!e || isMemo(it.ex)) return;
    const k = PARTS8.includes(e.p) ? e.p : '기타';
    o[k] += it.sets.length; }));
  return o;
}
/* ── 인체도 ── 부위별 세트 수를 몸에 칠한다.
   앞/뒤 두 장. 등은 뒤에 있어서 앞모습만으로는 못 보여 준다.
   유산소·기타는 몸에 자리가 없어 아래 칩으로 뺀다.
   좌우는 거울로 뒤집어 쓴다 — 좌표를 두 번 쓰지 않는다.        */
const 몸부위 = ['가슴','어깨','등','팔','하체','복근'];
const 몸꼴 = {

  발:   'M32.6,153 L44.4,153 L44.4,158 Q44.4,161 40,161 L36,161 Q32.6,161 32.6,158 Z',
  어깨: 'M28.4,40 Q26.2,32.6 34.4,32.6 L37,44 Q31.6,46.6 27.6,45 Z',
  가슴: 'M33.5,36 L58.5,36 Q62,38 62.5,46 L60.5,56 Q54,60 46,60 Q38,60 31.5,56 L29.5,46 Q30,38 33.5,36 Z',
  복근: 'M35,61 L57,61 L58,86 Q58,90.5 53.5,90.5 L38.5,90.5 Q34,90.5 34,86 Z',
  등:   'M32.5,35 L59.5,35 Q63.5,37 64,46 L61,60 Q59,66 59,73 L33,73 Q33,66 31,60 L28,46 Q28.5,37 32.5,35 Z',
  허리: 'M34.5,74.5 L57.5,74.5 L58,88 Q58,91 54,91 L38,91 Q34,91 34,88 Z',
};
function bodyMap(o){
  const mx = Math.max(1, ...몸부위.map(k => o[k] || 0));
  /* 안 한 곳은 거의 안 보이게, 많이 한 곳은 진하게 */
  const 칠 = k => { const v = o[k] || 0;
    return v ? `rgba(240,211,160,${(0.20 + 0.72*(v/mx)).toFixed(3)})` : 'rgba(255,255,255,.05)'; };
  const 선 = k => (o[k] ? 'rgba(240,211,160,.5)' : 'rgba(255,255,255,.11)');
  const 몸 = (k, d) => `<path d="${d}" fill="${칠(k)}" stroke="${선(k)}" stroke-width=".9"
    stroke-linejoin="round"/>`;
  const 살 = 'rgba(255,255,255,.075)';
  const 거울 = g => `<g transform="translate(92,0) scale(-1,1)">${g}</g>`;

  /* 몸의 뼈대 — 부위를 하나도 안 했어도 사람으로 보이게 깔아 둔다 */
  const 반쪽뼈대 = `<path d="${몸꼴.팔}" fill="${살}"/><path d="${몸꼴.다리}" fill="${살}"/>`
                 + `<path d="${몸꼴.발}" fill="${살}"/>`;
  const 뼈대 = `<circle cx="46" cy="14.5" r="10" fill="${살}"/>`
             + `<rect x="41.8" y="21" width="8.4" height="15" rx="4" fill="${살}"/>`
             + `<path d="${몸꼴.몸통}" fill="${살}"/>` + 반쪽뼈대 + 거울(반쪽뼈대);

  const 반쪽 = 몸('어깨', 몸꼴.어깨) + 몸('팔', 몸꼴.팔) + 몸('하체', 몸꼴.다리);
  const 앞 = 뼈대 + 몸('가슴', 몸꼴.가슴) + 몸('복근', 몸꼴.복근) + 반쪽 + 거울(반쪽)
    + `<text x="46" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7d766e">앞</text>`;
  const 뒤 = 뼈대 + 몸('등', 몸꼴.등) + 몸('등', 몸꼴.허리) + 반쪽 + 거울(반쪽)
    + `<text x="46" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7d766e">뒤</text>`;

  const 칩 = PARTS8.map(k => `<span class="bchip ${o[k]?'on':''}">
    <i style="background:${o[k] ? `rgba(240,211,160,${(0.32 + 0.68*Math.min(1,(o[k]||0)/mx)).toFixed(2)})` : 'rgba(255,255,255,.10)'}"></i>
    ${k}<b>${o[k]||0}</b></span>`).join('');

  return `<div class="bwrap">
    <svg viewBox="0 0 196 176" class="bsvg">
      <g>${앞}</g>
      <g transform="translate(104,0)">${뒤}</g>
    </svg>
    <div class="bchips">${칩}</div>
  </div>`;
}
function radar(o){
  const n = PARTS8.length, R = 56, cx = 110, cy = 96;
  const mx = Math.max(1, ...PARTS8.map(k=>o[k]));
  const pt = (i, r) => { const a = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + Math.cos(a)*r, cy + Math.sin(a)*r]; };
  const web = [1,.66,.33].map(f =>
    `<polygon points="${PARTS8.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="#302f2b" stroke-width="1"/>`).join('');
  const spokes = PARTS8.map((_,i)=>{ const [x,y]=pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a2926" stroke-width="1"/>`; }).join('');
  const poly = PARTS8.map((k,i)=> pt(i, R * (o[k]/mx)).map(v=>v.toFixed(1)).join(',')).join(' ');
  const labels = PARTS8.map((k,i)=>{ const [x,y]=pt(i, R+17);
    const an = Math.abs(x-cx) < 6 ? 'middle' : (x > cx ? 'start' : 'end');
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${an}" font-size="10" font-weight="700"
      fill="${o[k]===0?'#5f5b56':'#c9c2b9'}">${k}</text>
      <text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="${an}" font-size="9.5" font-weight="700"
      fill="${o[k]===0?'#4d4a46':'var(--gold-2)'}">${o[k]}세트</text>`; }).join('');
  return `<svg viewBox="0 0 220 200" style="height:210px">${web}${spokes}
    <polygon points="${poly}" fill="rgba(230,196,135,.22)" stroke="var(--gold)" stroke-width="1.8"/>
    ${PARTS8.map((k,i)=>{ const [x,y]=pt(i, R*(o[k]/mx));
      return o[k] ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--gold)"/>` : ''; }).join('')}
    ${labels}</svg>`;
}

/* 종목별 무게 변화 */
function exTrend(mid, from, grp){
  const map = {};
  anaWs(mid, '1900-01-01').forEach(w => w.items.forEach(it => {   /* 기간 밖 기록도 견줄 밑값으로 쓴다 */
    if(!it.sets.length || isMemo(it.ex)) return;
    const e = exOf(it.ex); if(!e) return;
    if(grp !== '전체' && !(PARTG[grp]||[]).includes(e.p)) return;
    const key = it.ex + ':' + it.va;
    const best = e.cardio ? Math.max(...it.sets.map(x=>+x.reps||0)) : Math.max(...it.sets.map(x=>+x.kg||0));
    (map[key] = map[key] || { ex:it.ex, va:it.va, cardio:e.cardio, all:[] }).all.push({ d:w.date, v:best });
  }));
  return Object.values(map).map(m => {
    const inP = m.all.filter(x => x.d >= from);
    if(!inP.length) return null;                       /* 이 기간엔 안 한 종목 */
    const before = m.all.filter(x => x.d < from);
    const base = inP.length > 1 ? inP[0] : (before.length ? before[before.length-1] : null);
    const l = inP[inP.length-1].v;
    return { ex:m.ex, va:m.va, cardio:m.cardio, n:inP.length, last:l,
      first: base ? base.v : l, diff: base ? Math.round((l - base.v)*10)/10 : null,
      prev: !!(base && inP.length === 1), since: base ? base.d : '' };
  }).filter(Boolean).sort((a,b) => b.n - a.n || b.last - a.last);
}

function weekStrip(mid){

/* 루틴 그룹 — 트레이너가 붙이는 이름 (생리주기 · 근지구력 · 파워 …) */
const GRP_SUGGEST = ['근지구력','근비대','파워','컨디셔닝','재활·교정',
  '생리기','황체기','황금기','상체','하체','전신'];
function grpsOf(mid){
  const o = [];
  myRoutines(mid).forEach(r => { const g = (r.grp||'').trim(); if(g && o.indexOf(g) < 0) o.push(g); });

/* 지금 종목 사전에 실제로 있는 기구만 · 자주 쓰는 순서로 */
const EQORDER = ['맨몸','바벨','덤벨','케이블','머신','스미스','밴드','케틀벨',
                 '짐볼','TRX','메디신볼','원판','폼롤러','땅콩볼','마사지볼','도구','유산소'];
function EQS(){
  const 있는 = new Set(EX.map(e=>e.e).filter(Boolean));
  return ['전체'].concat(EQORDER.filter(x=>있는.has(x)),
                         [...있는].filter(x=>EQORDER.indexOf(x)<0));
}

/* 직전 무게 상자 — 종목 카드 안에 한 줄로 붙는다 */
function prevBox(e, cur, mid){
  if(isMemo(cur.ex)) return '';
  const runs = lastRuns(cur.ex, cur.va, mid, 3);
  const 단위 = e.cardio ? '분' : 'kg';
  if(!runs.length) return `<div class="prevb"><div class="prevh">
    <span class="pk">직전기록</span>
    <span class="pv" style="font-weight:600">처음 하는 종목이에요</span></div></div>`;

  const top = r => e.cardio ? Math.max(...r.sets.map(x=>+x.reps||0))
                            : Math.max(...r.sets.map(x=>+x.kg||0));
  const 값 = runs.map(top).reverse();                    /* 오래된 → 최근 */
  const 최근 = 값[값.length-1], 이전 = 값.length>1 ? 값[값.length-2] : null;
  const 방향 = 이전==null ? '' : (최근>이전 ? 'up' : (최근<이전 ? 'down' : ''));
  const 화살 = 방향==='up' ? '↑' : (방향==='down' ? '↓' : '');

  /* 지금 열려 있는 세트에 맞춰진 값과 견준다 */
  const oi = cur.sets.findIndex(x=>!x.done);
  const 지금 = oi>=0 ? (e.cardio ? +cur.sets[oi].reps : +cur.sets[oi].kg) : null;
  const 다름 = (지금!=null && 최근!=null && 지금!==최근);

  const 줄 = `<button class="prevh" data-act="prevopen">
    <span class="pk">직전기록</span>
    <span class="pv">${값.map((x,i)=> i===값.length-1
        ? `<b>${kgfmt(x)}${단위}</b>` : kgfmt(x)).join('<i>→</i>')}</span>
    ${화살?`<span class="ar ${방향}">${화살}</span>`:''}
    ${다름?`<span class="cv">지금 ${kgfmt(지금)}${단위}</span>`:''}
    <span class="cx">${S.prevOpen?'▴':'▾'}</span></button>`;

  if(!S.prevOpen) return `<div class="prevb">${줄}</div>`;

  const 안 = runs.map(function(r){
    const t = top(r);
    const 세트 = r.sets.map(x=> e.cardio
      ? `${x.reps}분${x.spd?`·${x.spd}`:''}`
      : `${kgfmt(x.kg)}×${x.reps}`).join(' · ');
    const rp = r.sets.find(x=> (e.cardio ? +x.reps : +x.kg) === t) || r.sets[0];
    return `<div class="prevr">
      <span class="rd">${mdTxt(r.date)}<br>${esc(r.kind)}</span>
      <span class="rs">${세트}</span>
      ${oi>=0?`<button class="rb" data-act="usekg:${e.cardio?0:kgfmt(t)}:${rp.reps||0}">이 무게로</button>`:''}
    </div>`; }).join('');
  return `<div class="prevb">${줄}${안}</div>`;
}

/* 주마다 다른 조합 — 같은 주에는 늘 같게, 주가 바뀌면 바뀐다 */
function 이번주(){
  return Math.floor((new Date(TODAY+'T00:00:00') - new Date('2026-01-05T00:00:00')) / 604800000);
}
/* 무리에서 하나씩 돌아가며 뽑는다 — 어느 주에도 핵심 부위가 빠지지 않게 */
function 뽑기(무리들, n, 자리){
  const w = 이번주() + (자리||0), out = [];
  let 회 = 0;
  while(out.length < n && 회 < n*4){
    const g = 무리들[회 % 무리들.length];
    const c = g[(w + Math.floor(회 / 무리들.length)) % g.length];
    if(out.indexOf(c) < 0) out.push(c);
    회++;
  }
  return out;
}
function prepList(setKey, kind){
  const st = PREPSET.find(x=>x.k===setKey) || PREPSET[0];
  if(kind==='s') return 뽑기(st.s, 4, 0).map(i=>사전[i]);
  if(kind==='m') return 뽑기(st.m, 4, 0).map(i=>사전[i]);
  return 뽑기(st.m, 2, 0).map(i=>사전[i])
    .concat(뽑기(st.s, 3, 1).map(i=>사전[i]));   /* 풀고 → 늘이기 */
}

/* 트레이너가 지정한 준비운동 — 루틴에 grp='준비운동' 으로 담긴다 */
function prepRoutines(mid){
  return (D.routines||[]).filter(r => r.mid===(mid||S.mid) && /준비운동/.test(r.grp||''))
    .sort((a,b)=>a.no-b.no);
}
function prepFromRoutine(r){
  return (r.items||[]).map(function(it){
    const pv = 사전v[VID(it.ex, it.va)];
    if(pv) return pv;                                       /* 준비운동 사전에 있는 동작 */
    const e = exOf(it.ex), v = varOf(it.ex, it.va);
    return { i:'x', n: exName(it.ex, it.va),
      t: e.cardio ? (it.reps+'분') : (it.sets>1 ? it.reps+'회 · '+it.sets+'세트' : it.reps+'회'),
      d: (v && v.desc) ? v.desc.replace(/\s+/g,' ').trim().slice(0,70) : '트레이너가 담아 둔 동작입니다' };
  }).filter(Boolean);
}

/* ── ★ 운동 중 ── */
async function newLive(title, items, kind, rid, mid, by){
  const id='w'+Date.now();
  mid = mid || S.mid;
  const kd = kind || '개인운동';
  const t0 = (kd === '수업') ? null : Date.now();          /* 수업은 시계를 자동으로 켜지 않는다 */
  D.live={ id, mid, title, kind:kd, rid:rid||null, date:TODAY, startAt:t0, items, cur:0,
           by:by||'회원', begun: items.length>0 };   /* 담기만 한 상태면 아직 시작 전 */
  if(!t0) items.forEach(it=>{ it.startAt = null; });
  save(); go(items.length ? 'workout' : 'pick');
  await sv(spost('workouts',[{ id, member_id:mid, on_date:TODAY, kind:D.live.kind,
    routine_id:rid||null, title, dur:0, done:false }]), '운동 시작');
  for(let i=0;i<items.length;i++) await svNewItem(i);
  D.workouts.unshift({ id, mid, date:TODAY, kind:D.live.kind, rid:rid||null, title, dur:0, done:false,
    items: items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, sec:0, locked:false, sets:[] })) });
  save(); render();
}
/* 다른 기기에서 시작한 운동을 이 기기에서 이어받는다 */
function adoptLive(mid){
  if(D.live && D.live.mid===mid) return true;
  const w = D.workouts.find(x=>!x.done && x.mid===mid && x.date===TODAY);
  if(!w || !w.items || !w.items.length) return false;
  const i = w.items.findIndex(it=>!it.locked);
  D.live = { id:w.id, mid:w.mid, title:w.title||'운동', kind:w.kind, rid:w.rid, date:w.date,
    startAt: Date.now() - (Number(w.dur)||0)*1000, cur: i>=0?i:w.items.length-1,
    items: w.items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, rest:60, locked:it.locked,
      sec:it.sec, startAt:Date.now(), sets:(it.sets||[]).map(x=>({kg:x.kg,reps:x.reps,spd:x.spd,done:true})) })) };
  if(!D.live.items.length) { D.live=null; return false; }
  if(D.live.items.every(it=>it.locked)) D.live.cur = D.live.items.length-1;
  save(); return true;
}
async function svNewItem(i){
  const w=D.live; if(!w) return; const it=w.items[i]; if(!it || it._id) return;
  const back = await sv(spost('workout_items',
    [{ workout_id:w.id, sort:i, variant_id:VID(it.ex,it.va), sec:0, locked:false }], {ret:true}), '종목 추가');
  if(back && back[0]) it._id = back[0].id;
  save();
}
async function svItem(i){
  const w=D.live; if(!w) return; const it=w.items[i]; if(!it) return;
  if(!it._id) await svNewItem(i);
  if(!it._id) return;
  await sv(spatch('workout_items','id=eq.'+it._id,
    { sec:Math.round(it.sec||0), locked:!!it.locked, sort:i }), '종목 저장');
  await sv(sdel('workout_sets','item_id=eq.'+it._id), '세트 정리');
  const rows = it.sets.filter(x=>x.done).map((x,k)=>({ item_id:it._id, sort:k,
    kg:x.kg, reps:x.reps, spd: x.spd==null ? null : x.spd, done:true }));
  if(rows.length) await sv(spost('workout_sets', rows), '세트 저장');
  const sw = D.workouts.find(x=>x.id===w.id);
  if(sw){ const si = sw.items.find(x=>x._id===it._id);
    if(si){ si.sec=Math.round(it.sec||0); si.locked=!!it.locked;
      si.sets = it.sets.filter(x=>x.done).map(x=>({kg:x.kg,reps:x.reps,spd:x.spd})); } }
  save();
}
function itemsFromRoutine(r){
  return r.items.map(it=>({ ex:it.ex, va:it.va, rest:it.rest||60, locked:false, sec:0, startAt:Date.now(),
    sets:[{kg:it.kg, reps:it.reps, spd:exOf(it.ex).cardio?6.5:undefined, done:false}] }));
}

/* 고친 것 서버에 쓰기 */
async function recSave(){
  const E = S.recEdit; if(!E) return;
  const w = D.workouts.find(x=>x.id===E.wid);
  closeSheet(); S.recEdit = null;
  if(!w) return;
  toast('고치는 중이에요');
  for(const it of E.items){
    const src = w.items.find(x=>x._id===it._id) || {};
    src.sets = it.sets.map(x=>({ kg:Number(x.kg)||0, reps:Number(x.reps)||0,
      spd: x.spd==null||x.spd==='' ? undefined : Number(x.spd) }));
    if(it._id){
      await sv(sdel('workout_sets','item_id=eq.'+it._id), '세트 지우기');
      if(src.sets.length) await sv(spost('workout_sets', src.sets.map((x,k)=>({
        item_id: it._id, sort:k, kg:x.kg, reps:x.reps, spd: x.spd==null?null:x.spd, done:true }))), '세트 저장');
    }
  }
  save(); toast('고쳤습니다'); render();
}

const 음식그림 = 이름 => {
  const t = (이름 || '').replace(/\s/g, '');
  for(const [e, re] of 음식찾기) if(re.test(t)) return e;
  return '🍽️';

function mealsOf(mid, date){ return (D.meals||[]).filter(m=>m.mid===mid && (!date || m.date===date)); }
/* 담긴 음식이 있으면 그 합, 없으면 직접 적은 값 */
function mealSum(m){
  if(m.items && m.items.length){
    return m.items.reduce((a,x)=>({ kcal:a.kcal+x.kcal, carb:a.carb+x.carb,
      protein:a.protein+x.protein, fat:a.fat+x.fat }), {kcal:0,carb:0,protein:0,fat:0});
  }
  return { kcal:Number(m.kcal||0), carb:Number(m.carb||0), protein:Number(m.protein||0), fat:Number(m.fat||0) };
}
/* 그날 식사를 회차 순으로 */
function mealsSeq(mid, date){
  return mealsOf(mid, date).slice().sort((a,b)=>
    String(a.at||'').localeCompare(String(b.at||'')) || String(a.id).localeCompare(String(b.id)));
}
function nextSeq(mid, date){ return mealsOf(mid, date).length + 1; }
const hhmm = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
/* 음식장에서 찾기 — 서버에 물어본다 */
async function foodFind(q){
  const s0 = (q||'').trim();
  if(!s0) return sget('foods?select=*&order=uses.desc&limit=24');
  const esc2 = encodeURIComponent('%'+s0.replace(/[%,()]/g,' ')+'%');
  return sget('foods?select=*&or=(name.ilike.'+esc2+',brand.ilike.'+esc2+')&order=uses.desc,id.asc&limit=40');
}
/* 최근 먹은 음식 */
function recentFoods(mid){
  const seen = {}, out = [];
  mealsOf(mid).slice().sort((a,b)=> a.date<b.date?1:-1).forEach(m=>(m.items||[]).forEach(x=>{
    const k = x.name+'|'+x.brand;
    if(seen[k]) return; seen[k]=1;
    if(out.length<12) out.push(x);
  }));
  return out;
}

/* 목표 대비 얼마나 채웠나 */
function dietStat(mid, from, to){
  const g = GOALS[mid] || {};
  const r = calcOf(g);
  const target = r.kcal || 0, dayLoss = r.day || 0;
  const gm = { c:r.gg.c, p:r.gg.p, f:r.gg.f };
  const ready = (r.bmr > 0 && r.keep > 0 && r.kcal > 0);
  const rows = (D.meals||[]).filter(m => m.mid===mid && (!from || m.date>=from) && (!to || m.date<=to));
  const withK = rows.filter(m => Number(m.kcal) > 0);
  const byDay = {};
  withK.forEach(m => { byDay[m.date] = (byDay[m.date]||0) + Number(m.kcal); });
  const days = Object.keys(byDay);
  let over = 0; days.forEach(d => { over += (byDay[d] - target); });
  const eaten = withK.reduce((a,m)=>a+Number(m.kcal), 0);
  const carb  = rows.reduce((a,m)=>a+(Number(m.carb)||0), 0);
  const prot  = rows.reduce((a,m)=>a+(Number(m.protein)||0), 0);
  const fat   = rows.reduce((a,m)=>a+(Number(m.fat)||0), 0);
  const noK   = rows.length - withK.length;
  const planLoss = dayLoss * days.length;
  const realLoss = planLoss - over;
  return { ready, target, dayLoss, gm, days:days.length, eaten, carb, prot, fat, over, noK,
    planLoss, realLoss, planKg: planLoss/FAT_KCAL, realKg: realLoss/FAT_KCAL };
}
function weekStart(){ const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthStart(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; }

function kcalCard(mid, day){
  const st = dietStat(mid, day, day);
  if(!st.ready) return `<div class="note">운동계획에서 <b>인바디 값(기초대사량)과 활동량</b>을 먼저 넣어 주세요.

function kcalSummary(mid){
  const kg = v => (Math.round(v*100)/100).toFixed(2);

    if(!st.days) return `<div class="krow"><span class="k">${nm}</span><span class="v" style="color:var(--sub)">기록 없음</span></div>`;
    const over = st.over > 0;
    return `<div class="krow"><span class="k">${nm} · ${st.days}일 기록</span>
      <span class="v" style="color:${over?'var(--warn)':'var(--gold)'}">${over?'+':''}${Math.round(st.over).toLocaleString()} kcal</span></div>
      <div class="krow"><span class="k" style="padding-left:10px">예상 감량</span>
      <span class="v">${kg(st.realKg)}kg <span style="color:var(--sub);font-weight:500">(계획 ${kg(st.planKg)}kg)</span></span></div>`;
  };
  const w = dietStat(mid, weekStart(), TODAY), m = dietStat(mid, monthStart(), TODAY);

/* ── 오운완 인증사진 ── 찍은 사진 위에 오늘 기록을 얹어 한 장으로 만든다.
   인스타에 그대로 올리도록 세로 4:5(1080×1350)로 뽑는다.              */
const OOTD_W = 1080, OOTD_H = 1350;
function ootdDraw(img, w){
  const cv = document.createElement('canvas');
  cv.width = OOTD_W; cv.height = OOTD_H;
  const x = cv.getContext('2d');

  /* 1) 사진을 4:5 로 꽉 채워 자른다 */
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const 비 = Math.max(OOTD_W/iw, OOTD_H/ih);
  const dw = iw*비, dh = ih*비;
  x.drawImage(img, (OOTD_W-dw)/2, (OOTD_H-dh)/2, dw, dh);

  /* 2) 아래쪽을 어둡게 — 글씨가 읽히게 */
  const g1 = x.createLinearGradient(0, OOTD_H*0.30, 0, OOTD_H);
  g1.addColorStop(0,'rgba(8,8,7,0)'); g1.addColorStop(.45,'rgba(8,8,7,.62)');
  g1.addColorStop(1,'rgba(8,8,7,.94)');
  x.fillStyle = g1; x.fillRect(0, OOTD_H*0.30, OOTD_W, OOTD_H*0.70);
  const g2 = x.createLinearGradient(0, 0, 0, 220);
  g2.addColorStop(0,'rgba(8,8,7,.55)'); g2.addColorStop(1,'rgba(8,8,7,0)');
  x.fillStyle = g2; x.fillRect(0, 0, OOTD_W, 220);

  const 여백 = 74;
  const 글 = (t, size, weight, color, 자간) => {
    x.font = `${weight} ${size}px "Noto Sans KR",sans-serif`;
    x.fillStyle = color;
    try{ x.letterSpacing = (자간||0) + 'px'; }catch(e){}
  };
  x.textBaseline = 'alphabetic';

  /* 3) 위쪽 로고 */
  글('', 36, 800, '#f0d3a0', 7);
  x.font = '800 36px "Noto Sans KR",sans-serif';
  x.fillText('GLAD GYM', 여백, 108);
  try{ x.letterSpacing = '0px'; }catch(e){}

  /* 4) 아래에서 위로 쌓는다 */
  let y = OOTD_H - 여백;

  글('', 30, 500, 'rgba(253,250,246,.62)');
  const 날 = (w.date||TODAY).replace(/-/g,'.');
  x.fillText(날, 여백, y);
  const 점 = '글래드짐 구산역촌점';
  x.fillText(점, OOTD_W - 여백 - x.measureText(점).width, y);
  y -= 34;
  x.fillStyle = 'rgba(255,255,255,.16)';
  x.fillRect(여백, y, OOTD_W - 여백*2, 2);
  y -= 40;

  /* 종목 × 세트 — 러닝 앱이 거리·심박을 보여 주듯, 웨이트는 이것이다 */
  const 목록 = w.items.filter(it => it.sets.length)
    .map(it => [exName(it.ex, it.va), it.sets.length]);
  const 보일것 = 목록.slice(0, 6).reverse();
  const 남은 = 목록.length - 보일것.length;
  보일것.forEach(([n, c]) => {
    글('', 34, 600, 'rgba(253,250,246,.90)');
    let nm = n; while(x.measureText(nm).width > OOTD_W - 여백*2 - 150) nm = nm.slice(0, -1);
    if(nm !== n) nm += '…';
    x.fillText(nm, 여백, y);
    글('', 34, 800, '#e6c487');
    const c2 = c + '세트';
    x.fillText(c2, OOTD_W - 여백 - x.measureText(c2).width, y);
    y -= 52;
  });
  if(남은 > 0){
    글('', 30, 500, 'rgba(253,250,246,.55)');
    x.fillText('외 ' + 남은 + '종목', 여백, y); y -= 52;
  }
  y -= 10;
  x.fillStyle = 'rgba(255,255,255,.16)';
  x.fillRect(여백, y, OOTD_W - 여백*2, 2);
  y -= 44;

  /* 루틴 · 시간 · 종목수 */
  const 줄 = [ w.kind || '운동', 목록.length + '종목',
    목록.reduce((a,b)=>a+b[1],0) + '세트', Math.max(1, Math.round((w.dur||0)/60)) + '분' ].join('  ·  ');
  글('', 36, 600, 'rgba(253,250,246,.86)');
  x.fillText(줄, 여백, y);
  y -= 118;

  /* 총 볼륨 — 가장 크게 */
  const vol = totalKg(w);
  if(vol){
    글('', 132, 800, '#f0d3a0', -3);
    const v = Math.round(vol).toLocaleString();
    x.fillText(v, 여백, y);
    const vw = x.measureText(v).width;
    try{ x.letterSpacing = '0px'; }catch(e){}
    글('', 44, 700, '#e6c487');
    x.fillText(' kg', 여백 + vw + 8, y);
    y -= 128;                       /* 글자 크기(132)만큼 띄워야 안 겹친다 */
    글('', 30, 700, 'rgba(253,250,246,.60)', 2);
    x.fillText('오늘 든 무게', 여백, y);
    try{ x.letterSpacing = '0px'; }catch(e){}
  } else {
    글('', 96, 800, '#f0d3a0', -2);
    x.fillText('오운완', 여백, y);
    try{ x.letterSpacing = '0px'; }catch(e){}
  }
  return cv.toDataURL('image/jpeg', 0.90);
}

function ootdPick(wid){
  const w = D.workouts.find(z => z.id === wid); if(!w) return;
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.style.display='none'; document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    inp.remove(); if(!f) return;
    toast('사진을 다듬는 중이에요');
    const img = new Image();
    img.onload = () => { try{
      S.ootd = { wid, url: ootdDraw(img, w) };
      URL.revokeObjectURL(img.src); sheetOotd();
    }catch(e){ console.error(e); toast('사진을 만들지 못했어요'); } };
    img.onerror = () => toast('사진을 읽지 못했어요');
    img.src = URL.createObjectURL(f);
  });
  inp.click();
}

/* 폰이면 공유 시트를, 안 되면 그냥 내려받기 */
async function ootdShare(){
  if(!S.ootd) return;
  const blob = await (await fetch(S.ootd.url)).blob();
  const 이름 = '글래드짐_오운완_' + (S.ootd.wid||'') + '.jpg';
  const file = new File([blob], 이름, { type:'image/jpeg' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file] }); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 이름;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('사진첩에 저장했어요');
}

function stampPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, MAX/Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      const x = cv.getContext('2d');
      x.drawImage(img, 0, 0, w, h);
      /* 아래쪽 띠 */
      const barH = Math.max(56, Math.round(h*0.09));
      const gr = x.createLinearGradient(0, h-barH*1.6, 0, h);
      gr.addColorStop(0,'rgba(10,10,9,0)'); gr.addColorStop(1,'rgba(10,10,9,.82)');
      x.fillStyle = gr; x.fillRect(0, h-barH*1.6, w, barH*1.6);
      const pad = Math.round(barH*0.42);
      const s1 = Math.round(barH*0.40), s2 = Math.round(barH*0.28);
      x.textBaseline='alphabetic';
      x.font = `700 ${s1}px "Noto Sans KR",sans-serif`;
      x.fillStyle = '#e6c487';
      x.letterSpacing = Math.round(s1*0.18)+'px';
      x.fillText('GLAD GYM', pad, h - pad - s2 - Math.round(barH*0.14));
      x.letterSpacing = '0px';
      const d = new Date();
      const two = n => String(n).padStart(2,'0');
      const stamp = `${d.getFullYear()}.${two(d.getMonth()+1)}.${two(d.getDate())}  ${two(d.getHours())}:${two(d.getMinutes())}`;
      x.font = `500 ${s2}px "Noto Sans KR",sans-serif`;
      x.fillStyle = '#fdfaf6';
      x.fillText(stamp, pad, h - pad);
      /* 오른쪽 아래 작은 표시 */
      x.font = `500 ${Math.round(s2*0.85)}px "Noto Sans KR",sans-serif`;
      x.fillStyle = 'rgba(253,250,246,.6)';
      const tx = '구산역촌점';
      x.fillText(tx, w - pad - x.measureText(tx).width, h - pad);
      res(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

function readGram(){
  const el = document.getElementById('fgram');
  const amt = Number(S.fpPick && S.fpPick.amount)||0;
  if(!el || !amt) return;
  const g2 = Math.max(1, nnum(el.value));
  S.fpQty = Math.round((g2/amt)*1000)/1000;
}

/* ── 남은 기간 고리 ── 회원권이 얼마나 남았는지 한 바퀴로 */
function dRing(남은, 전체){
  const p = Math.max(0, Math.min(1, 남은 / (전체 || 1)));
  const C = 2 * Math.PI * 21;
  const 색 = 남은 <= 14 ? 'var(--warn)' : (남은 <= 30 ? 'var(--gold-2)' : 'var(--gold)');
  return `<svg viewBox="0 0 52 52" width="52" height="52" class="dring">
    <circle cx="26" cy="26" r="21" fill="none" stroke="var(--dark-4)" stroke-width="4.5"/>
    <circle cx="26" cy="26" r="21" fill="none" stroke="${색}" stroke-width="4.5"
      stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}"
      transform="rotate(-90 26 26)"/>
    <text x="26" y="30" text-anchor="middle" font-size="14" font-weight="800"
      fill="${색}">${남은}</text></svg>`;
}
/* ── 켬/끔 스위치 ── 글자 대신 눈에 보이는 스위치 */
const 스위치 = on => `<span class="sw ${on?'on':''}" aria-hidden="true"><i></i></span>`;

/* ── 프로필 ── 인스타처럼 내 오운완이 쌓이는 곳.
   프로필 정보는 운동계획(plans) 안에 같이 담는다 — 표를 새로 만들지 않는다. */
const profOf = mid => (GOALS[mid] || {}).prof || {};
async function profSave(mid, patch){
  const g = GOALS[mid] = GOALS[mid] || {};
  g.prof = Object.assign({}, g.prof || {}, patch);
  await sv(spost('plans', [{ member_id:mid, data:g, updated_at:new Date().toISOString() }],
    {on:'member_id'}), '프로필 저장');
}
/* 쌓인 것 세기 — 운동한 날 · 총 볼륨 · 오운완 장수 · 연속 */
function profStat(mid){
  const ws = D.workouts.filter(w => w.mid===mid && w.done && w.items.some(i=>i.sets.length));

function profPick(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.style.display='none'; document.body.appendChild(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if(!f) return;
    toast('올리는 중이에요');
    try{
      const img = new Image();
      await new Promise((r,j)=>{ img.onload=r; img.onerror=j; img.src=URL.createObjectURL(f); });
      const N = 480, cv = document.createElement('canvas'); cv.width=N; cv.height=N;
      const x = cv.getContext('2d');
      const 비 = Math.max(N/img.naturalWidth, N/img.naturalHeight);
      const dw = img.naturalWidth*비, dh = img.naturalHeight*비;
      x.drawImage(img, (N-dw)/2, (N-dh)/2, dw, dh);
      URL.revokeObjectURL(img.src);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.88));
      const path = `avatar/${S.mid}/${Date.now()}.jpg`;
      const r2 = await fetch(SB_URL+'/storage/v1/object/media/'+path, {
        method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY,
          'Content-Type':'image/jpeg' }, body: blob });
      if(!r2.ok){ toast('사진을 못 올렸어요'); console.error(await r2.text()); return; }
      await profSave(S.mid, { avatar: path });
      toast('바꿨어요'); closeSheet(); render();
    }catch(e){ console.error(e); toast('사진을 읽지 못했어요'); }
  });
  inp.click();
}

function svCycle(mid){
  const c=D.cycle[mid]; if(!c) return;
  return sv(spost('cycles',[{ member_id:mid, enabled:!!c.on, last_start:c.last,
    cyc_len:c.len, period_len:c.period, updated_at:new Date().toISOString() }], {on:'member_id'}), '생리주기 저장');
}
function cycOf(mid){ return (D.cycle&&D.cycle[mid]) || null; }
function cycToday(c){
  if(!c||!c.on) return null;
  const base=new Date(c.last+'T00:00:00'), now=new Date('2026-08-28T00:00:00');
  const diff=Math.floor((now-base)/86400000);
  const day=((diff % c.len)+c.len)%c.len + 1;
  const ovul=c.len-14;
  let ph, why;
  if(day<=c.period){ ph='생리기'; why='가볍게 · 컨디션 우선'; }
  else if(day<=ovul+1){ ph='황금기'; why='힘이 가장 잘 나는 때 · 증량하기 좋아요'; }
  else { ph='황체기'; why='붓고 무거운 때 · 무게보다 횟수로'; }
  const left=c.len-day+1;
  return {day, ph, why, left, ovul};
}
function cycBar(c){
  const t=cycToday(c); if(!t) return '';
  let cells='', labels='';
  const seg=[['생리기',1,c.period,'p'],['황금기',c.period+1,t.ovul+1,'g'],['황체기',t.ovul+2,c.len,'l']];
  seg.forEach(([nm,a,b,cls])=>{
    const w=b-a+1, now=(t.day>=a&&t.day<=b);
    cells+=`<div class="${cls}${now?' now':''}" style="flex:${w}">${nm}</div>`;
    labels+=`<span style="flex:${w}">${a}~${b}일</span>`;
  });
  return `<div class="cyc">${cells}</div><div class="cyclbl">${labels}</div>`;
}
