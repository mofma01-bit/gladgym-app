<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131312">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="글래드짐">
<title>글래드짐 운동기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">

<style>
:root{color-scheme:dark;
  --dark:#131312; --dark-2:#1c1c1a; --dark-3:#262623; --dark-4:#333330;
  --brown:#412921; --gold:#e6c487; --gold-2:#c9a96e; --gold-dim:#211c14;
  --teal:#9dcedc; --teal-dim:#16262b;
  --cream:#fdfaf6; --sub:#b5aca2; --line:#2e2e2a;
  --warn:#c98b7a; --stage:#0a0a09;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--stage);color:var(--cream);
  font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:500;line-height:1.6;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

#frame{width:100%;max-width:400px;height:min(860px,100vh);background:var(--dark);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  border:1px solid var(--line);border-radius:26px}
@media (max-width:440px){ #frame{max-width:none;height:100vh;height:100dvh;border:none;border-radius:0} }
@supports (padding: env(safe-area-inset-bottom)){
  #tabs{padding-bottom:calc(13px + env(safe-area-inset-bottom))}
  #foot{padding-bottom:calc(11px + env(safe-area-inset-bottom))}
  #top{padding-top:calc(13px + env(safe-area-inset-top))}
}

#top{background:#0e0e0d;border-bottom:1px solid var(--line);padding:13px 16px;
  display:flex;align-items:center;gap:11px;flex:none;min-height:52px}
#top .ttl{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
#top .ttl small{display:block;font-size:11.5px;font-weight:500;color:var(--gold-2);letter-spacing:0}
#top .sub{font-size:13px;font-weight:500;color:var(--sub);margin-left:auto;text-align:right}
#top .tm{font-size:15px;font-weight:700;color:var(--gold);margin-left:auto}
#top .back{font-size:20px;color:var(--sub);width:22px;flex:none;line-height:1}
#top .logo{font-size:10.5px;letter-spacing:.2em;color:var(--gold-2);font-weight:700;
  border:1px solid var(--line);border-radius:7px;padding:5px 8px;flex:none}
#top .logo:active{background:var(--dark-3)}

.search{background:var(--dark-3);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;font-size:14.5px;font-weight:500;color:var(--cream);width:100%}
.search::placeholder{color:#6f6a63}
.fld{display:flex;flex-direction:column;gap:6px}
.fld .fn{font-size:12.5px;font-weight:500;color:var(--sub)}
.calc{background:var(--dark-2);border:1px solid var(--gold-2);border-radius:13px;padding:14px;
  display:flex;flex-direction:column;gap:9px}
.crow{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow .ck{font-size:13px;font-weight:500;color:var(--sub);flex:1}
.crow .cv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.crow .cv.g{color:var(--gold);font-size:17px}
.crow .cs{font-size:12px;font-weight:500;color:var(--sub)}
.calc .kedit{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.calc .kedit .ku{font-size:12px;font-weight:500;color:var(--sub)}
.calc input.kin{width:74px;background:var(--dark-3);border:1px solid var(--gold-2);border-radius:8px;
  padding:7px 8px;font-size:16px;font-weight:700;color:var(--gold);text-align:right;
  font-variant-numeric:tabular-nums;font-family:inherit}
.calc input.kin::placeholder{color:var(--gold);opacity:.6;font-weight:700}
.calc .stp{width:31px;height:31px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);
  background:var(--dark-3);color:var(--cream);font-size:17px;font-weight:700;line-height:1;font-family:inherit}
.calc .stp:active{background:var(--gold-2);color:#fff}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mac div{background:var(--dark-3);border:1px solid var(--line);border-radius:10px;padding:10px;
  display:flex;flex-direction:column;gap:2px;align-items:center}
.mac .n{font-size:12px;font-weight:500;color:var(--sub)}
.mac .v{font-size:17px;font-weight:900;color:var(--gold)}
.mac .u{font-size:11.5px;font-weight:500;color:var(--sub)}

.bar{height:9px;border-radius:5px;background:#2f2f2a;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.bar i.over{background:var(--warn)}
#main.lite .bar{background:#eadfcd}
.kcard{background:#1f1f1c;border:1px solid #35342e;border-radius:13px;padding:15px;
  display:flex;flex-direction:column;gap:10px}
#main.lite .kcard{background:#fff;border-color:#e6ddcf}
.kbig{display:flex;align-items:baseline;gap:8px}
.kbig .v{font-size:29px;font-weight:900;letter-spacing:-.03em}
.kbig .v.g{color:var(--gold)}
.kbig .v.w{color:var(--warn)}
.kbig .u{font-size:13px;font-weight:500;color:var(--sub)}
#main.lite .kbig .v{color:#2b231c}
#main.lite .kbig .v.g{color:#8a5a2b}
#main.lite .kbig .u{color:#7b6c5d}
.krow{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500}
.krow .k{color:var(--sub);flex:1}
#main.lite .krow .k{color:#7b6c5d}
.krow .v{font-weight:700;font-variant-numeric:tabular-nums}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m3 > div{display:flex;flex-direction:column;gap:5px}
.m3 .t{font-size:12px;font-weight:600;color:var(--sub)}
#main.lite .m3 .t{color:#7b6c5d}
.req{color:var(--gold)}

#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:13px}
#main.lite{background:#fbf7f0;color:#2b231c}
#main.lite .card{background:#fff;border-color:#e6ddcf}
#main.lite .card .nm{color:#2b231c}
#main.lite .card .sm{color:#7b6c5d}
#main.lite .lbl{color:#7b6c5d}
#main.lite .note{background:#fff;border-color:#e6ddcf;color:#7b6c5d}
#main.lite .note b{color:#8a5a2b}
#main.lite .hr{background:#e6ddcf}
#main.lite .empty{color:#a0917f}
#main.lite .chip{background:#fff;border-color:#e6ddcf;color:#7b6c5d}
#main.lite .chip.on{background:#f6ead4;border-color:var(--gold-2);color:#8a5a2b}
#main.lite textarea{background:#fff;border-color:#e6ddcf;color:#2b231c}
#main.lite .search{background:#fff;border-color:#e6ddcf;color:#2b231c}

.shot{width:100%;border-radius:12px;display:block;background:#0e0e0d}
.mealgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mealcard{border:1px solid #e6ddcf;border-radius:12px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column}
.mealcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.mealcard .cap{padding:8px 10px;font-size:12.5px;font-weight:700;color:#2b231c}
.mealcard .cap span{display:block;font-weight:500;color:#7b6c5d;font-size:11.5px}
.mrow{display:flex;align-items:center;gap:11px;background:var(--dark-2);border:1px solid var(--line);
  border-radius:12px;padding:10px;width:100%;text-align:left}
.mrow img{width:58px;height:58px;border-radius:9px;object-fit:cover;flex:none;background:#0e0e0d}
.mrow .nm{font-size:14px;font-weight:700}
.mrow .sm{font-size:12.5px;font-weight:500;color:var(--sub)}
.shotbtn{width:100%;border:1px dashed var(--gold-2);border-radius:12px;background:#f6ead4;
  padding:18px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#8a5a2b}
.shotbtn .ic{font-size:24px}
.shotbtn .t{font-size:15px;font-weight:700}
.shotbtn .s{font-size:12.5px;font-weight:500}
#foot{flex:none;border-top:1px solid #3a3a35;background:#1a1a18;padding:11px 14px;display:flex;gap:9px;
  box-shadow:0 -6px 16px rgba(0,0,0,.35)}
#tabs{flex:none;background:var(--brown);border-top:1px solid #6b4436;display:flex;
  box-shadow:0 -6px 16px rgba(0,0,0,.45)}
#tabs button{flex:1;padding:12px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:12.5px;font-weight:700;color:#d6c2b6;position:relative}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34px;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
#tabs button .ic{font-size:20px;line-height:1}
#tabs button .bd{position:absolute;transform:translate(14px,-4px);width:9px;height:9px;
  border-radius:50%;background:var(--teal);border:2px solid var(--brown)}

.lbl{font-size:13.5px;font-weight:700;color:#a9a29a;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;margin-top:9px}
.lbl::before{content:'';width:3px;height:14px;border-radius:2px;background:#7a4d3c;flex:none}
.lbl.plain{margin-top:0}
.lbl.plain::before{display:none}
.h1{font-size:21px;font-weight:900;letter-spacing:-.03em;line-height:1.3}
.h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
.h2 small{font-weight:500;color:var(--sub);font-size:13px}

.card{background:#1f1f1c;border:1px solid #35342e;border-radius:13px;padding:14px 15px;
  display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:active{background:#262622}
.card.gold{border-color:var(--gold-2);background:var(--gold-dim)}
.card.teal{border-color:#3a5b66;background:var(--teal-dim)}
.card.dim{opacity:.45}
.card.plan{border-left:3px solid #7a4d3c}
.card .nm{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.card .nm.g{color:var(--gold)}
.card .nm.t{color:var(--teal)}
.card .sm{font-size:13px;font-weight:500;color:#8f8a83;line-height:1.6}
.rowc{display:flex;flex-direction:row;align-items:center;gap:11px}
.rowc > div{flex:1;min-width:0;text-align:left}
.rowc .rt{margin-left:auto;text-align:right;font-size:13px;font-weight:600;color:#8f8a83;flex:none}

.tile{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;padding:15px;
  display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:13px;font-weight:500;color:var(--sub)}
.tile .v{font-size:27px;font-weight:900;letter-spacing:-.03em}
.tile .v.g{color:var(--gold)}
.tile .v small{font-size:14px;font-weight:500;color:var(--sub);letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.btn{flex:1;text-align:center;border-radius:12px;padding:14px 10px;font-size:15.5px;font-weight:700;
  letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--teal);color:#0d2027}
.btn.gold{background:var(--gold);color:#241a08}
.btn.sub{background:var(--dark-3);color:var(--teal);border:1px solid var(--line)}
.btn.ghost{background:var(--dark-2);color:var(--sub);border:1px solid var(--line)}
.btn.kakao{background:#FEE500;color:#1c1a17}
.btn:active{opacity:.72}
.btn[disabled]{opacity:.3}
.btn.sm{padding:10px 8px;font-size:13.5px}

.set{background:var(--dark-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.set .i{font-size:13px;font-weight:500;color:var(--sub);min-width:46px;flex:none}
.set .n{font-size:20px;font-weight:700;margin-left:auto}
.set .u{font-size:12.5px;font-weight:500;color:var(--sub)}
.set .sl{color:#4c4c46;font-weight:700;padding:0 2px}
.set.done{opacity:.42}
.set.now{border-color:var(--gold);background:var(--gold-dim)}
.set.now .n{color:var(--gold)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--dark-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:500;color:var(--sub)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.chip.t{color:var(--teal);border-color:#3a5b66}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--gold-dim);color:var(--gold);
  border:1px solid var(--gold-2);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;flex:none}
.pill.q{background:var(--dark-3);color:var(--sub);border-color:var(--line)}
.pill.t{background:var(--teal-dim);color:var(--teal);border-color:#3a5b66}

.desc{background:var(--dark-3);border:1px solid var(--line);border-radius:12px;padding:14px;
  display:flex;flex-direction:column;gap:9px}
.desc .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.desc .hd b{font-size:13.5px;font-weight:700}
.desc .tx{font-size:14px;font-weight:500;color:#ded9d2;line-height:1.85;white-space:pre-wrap}

.cm{background:var(--dark-2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;
  padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.cm .who{font-size:12.5px;font-weight:500;color:var(--teal)}
.cm .tx{font-size:14px;font-weight:500;color:#e0dbd4;line-height:1.8;white-space:pre-wrap}

.fbbtn{width:100%;text-align:left;background:var(--dark-2);border:1px solid var(--line);
  border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:12px 14px;
  display:flex;align-items:center;gap:9px}
.fbbtn .l{font-size:14.5px;font-weight:700;color:var(--teal)}
.fbbtn .r{font-size:13px;font-weight:500;color:var(--sub);margin-left:auto}

.demo{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;height:126px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  position:relative;overflow:hidden;flex:none}
.demo .fig{width:34px;height:56px;position:relative}
.demo .bar{position:absolute;left:-13px;right:-13px;height:5px;border-radius:3px;background:var(--gold);
  top:16px;animation:lift 1.9s ease-in-out infinite}
.demo .bod{position:absolute;left:9px;right:9px;top:20px;bottom:0;border-radius:8px 8px 4px 4px;background:#3d3d38}
.demo .cap{font-size:12.5px;font-weight:500;color:var(--sub);z-index:2;text-align:center;padding:0 12px}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){.demo .bar{animation:none}}

.vbox{background:#0e0e0d;border:1px solid var(--line);border-radius:12px;height:120px;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.vbox .play{width:42px;height:42px;border-radius:50%;background:var(--teal);color:#0d2027;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.vbox .cap{font-size:12px;font-weight:500;color:var(--sub);text-align:center;padding:0 8px}
.vbox.on .play{background:var(--dark-3);color:var(--teal)}
.pbox{background:#0e0e0d;border:1px solid var(--line);border-radius:12px;height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:12.5px;font-weight:500;color:var(--sub)}
.pbox .ic{font-size:19px}
.media2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:8px;background:var(--dark-2);display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:500;color:#7a766f}
.cal div.on{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-2);font-weight:700}
.cal div.hd{background:none;color:#5d5a55;font-size:11px}
.cal div.pad{background:none}

.graph{display:flex;align-items:flex-end;gap:7px;height:86px}
.graph i{flex:1;background:var(--dark-3);border-radius:4px 4px 0 0;min-height:4px}
.graph i.g{background:var(--gold)}
.glbl{display:flex;gap:7px}
.glbl span{flex:1;text-align:center;font-size:10.5px;color:#75726c;font-weight:500}

#sheet{position:absolute;inset:0;background:rgba(6,6,5,.74);display:none;align-items:flex-end;z-index:20}
#sheet.open{display:flex}
#sheetbox{background:var(--dark-2);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:9px 16px 20px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
#sheetbox .grip{width:44px;height:4px;border-radius:2px;background:#43433e;align-self:center;margin-bottom:4px;flex:none}

.ring{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;margin:2px auto;background:var(--dark-3);border:6px solid var(--gold)}
.ring .t{font-size:34px;font-weight:900;color:var(--gold);letter-spacing:-.03em}
.ring .c{font-size:12.5px;font-weight:500;color:var(--sub)}

.step{display:flex;align-items:center;gap:11px;background:var(--dark-3);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px}
.step .k{font-size:13px;font-weight:500;color:var(--sub);flex:none;min-width:36px}
.step .v{font-size:23px;font-weight:900;flex:1;text-align:center;letter-spacing:-.02em}
.step .v small{font-size:13px;font-weight:500;color:var(--sub)}
.step button{width:42px;height:42px;border-radius:10px;background:var(--dark-4);font-size:20px;
  font-weight:700;flex:none;display:flex;align-items:center;justify-content:center}
.step button:active{background:#45453f}

textarea,input[type=text],input[type=date]{width:100%;background:var(--dark-3);border:1px solid var(--line);border-radius:12px;
  padding:12px;color:var(--cream);font-family:inherit;font-size:14.5px;font-weight:500;line-height:1.8}
textarea{min-height:92px;resize:vertical}
textarea.tall{min-height:170px}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.wk{background:var(--dark-2);border:1px solid var(--line);border-radius:16px;padding:11px 9px 13px;flex:0 0 auto}
.wkhd{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:10px}
.wkhd .d{font-size:16px;font-weight:800;letter-spacing:-.02em;padding:6px 18px;border-radius:999px;
  background:var(--dark-3);min-width:150px;text-align:center}
.wkhd button{width:34px;height:34px;border-radius:50%;color:var(--sub);font-size:18px;line-height:1}
.wkhd button:active{background:var(--dark-3)}
.wkd{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.wkd>button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 6px;border-radius:11px}
.wkd .dn{font-size:11.5px;font-weight:700;color:#7d766e}
.wkd .dn.sun{color:#c98b7a}
.wkd .num{font-size:10.5px;font-weight:700;color:#67635d}
.wkd>button.sel{background:var(--dark-3)}
.wkd>button.sel .dn{color:var(--cream)}
.wkd>button.tdy .num{color:var(--gold)}
.wkd>button.fut{opacity:.28;pointer-events:none}
.dsum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:11px;
  background:var(--line);border-radius:11px;overflow:hidden}
.dsum>div{background:var(--dark-2);padding:10px 4px;text-align:center}
.dsum .k{display:block;font-size:11px;font-weight:600;color:#7d766e}
.dsum .v{display:block;font-size:17px;font-weight:800;margin-top:1px;letter-spacing:-.02em}
.dsum .v small{font-size:11px;font-weight:600;color:var(--sub)}
.hero{display:flex;flex-direction:column;align-items:flex-start;flex:0 0 auto;
  width:100%;text-align:left;border-radius:18px;padding:19px 18px 17px;min-height:152px;

.trow .n{font-size:11px;font-weight:600;color:#6f6a64;flex:none}
.trow .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}

/* 방금 담긴 것 — 눈에 띄게 */
@keyframes pop{0%{transform:scale(.97);opacity:.4}60%{transform:scale(1.01)}100%{transform:scale(1);opacity:1}}

/* 사진 슬롯 */
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.slot{background:#0e0e0d;border:1px dashed var(--line);border-radius:11px;height:112px;

/* 주기 막대 */
.cyc{display:flex;gap:3px;height:34px;border-radius:9px;overflow:hidden}

.cyc div.now{outline:2px solid var(--gold);outline-offset:-2px}

.cyclbl span{flex:1;text-align:center;font-size:10.5px;color:#75726c;font-weight:500}

#toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--dark-4);
  border:1px solid var(--line);border-radius:11px;padding:11px 17px;font-size:13.5px;font-weight:700;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .22s;z-index:30}
#toast.on{opacity:1}
</style>

<script>
"use strict";

/* ═══ 종목 사전 ═══
   종목 하나에 「벌」이 하나 이상. 잡는 법·타겟이 다르면 벌을 나눈다.
   벌마다 기본 설명과 시범 영상이 따로 붙는다.                        */
let EX = [];
const PARTS = ['가슴','등','어깨','하체','복근','팔','유산소','기타'];
const exOf = id => EX.find(x=>x.id===id) || {id:'?',n:'?',p:'?',vars:[{k:'a',n:'',desc:''}]};

let MEMBERS = [];
let TRAINER = '양인수';

/* 체형분석 체크리스트 — 플래너 7쪽 */
const BODY_TESTS = [
  {g:'경추', k:'c1', t:'하부경추 각도', a:'50도 이상 일자목', b:'50도 미만 거북목'},
  {g:'경추', k:'c2', t:'상부경추 각도', a:'145도 이상 거북목', b:'145도 미만 일자목'},
  {g:'경추', k:'c3', t:'좌우 회전', a:'L', b:'R'},

  {g:'어깨', k:'s2', t:'충돌 테스트 엠프티 캔', a:'L', b:'R'},
  {g:'어깨', k:'s3', t:'충돌 테스트 풀 캔', a:'L', b:'R'},

  {g:'다리', k:'l1', t:'골반 형태', a:'전방경사', b:'후방경사'},
  {g:'다리', k:'l2', t:'크레이그 테스트', a:'과전경', b:'후경'},
  {g:'다리', k:'l3', t:'무릎 방향', a:'안쪽', b:'바깥쪽'},
  {g:'다리', k:'l4', t:'O / X 다리', a:'오다리', b:'X다리'},
  {g:'다리', k:'l5', t:'토마스 테스트', a:'대퇴직근', b:'장요근'},
  {g:'다리', k:'l6', t:'중둔근 전방섬유', a:'L', b:'R'},
  {g:'다리', k:'l7', t:'중둔근 후방섬유', a:'L', b:'R'},
  {g:'발', k:'f1', t:'발 아치', a:'평발(회내)', b:'요족(회외)'},
];

/* 자주 물어보는 Q&A — 플래너 9쪽 */
const QA = [
  {q:'운동 전 식사는 언제 해야 되나요?', a:'음식에 따라 다르지만 최소 2~3시간 전입니다.'},
  {q:'퇴근 후에 배가 너무 고픈데 참고해야 하나요?', a:'그럴 땐 1시간 전에 과일, 에너지바 또는 음료 종류를 드시는 게 좋습니다.'},
  {q:'퇴근 후 식사를 하면 야식이니까 살이 찌는 것 아닌가요?',
   a:'살찌는 음식은 배달음식 종류, 고칼로리 음식입니다.\n하루 정해진 식사를 일정 간격으로 먹는 것이 늦을 뿐 야식이 아닙니다.\n늦어도 잠자기 2시간 전에 식사를 끝내세요.\n다른 방법은 운동 전에 저녁을 끝내고 운동 후 보충제를 드시는 것입니다.'},
  {q:'러닝머신 먼저 해야 될까 근력운동 먼저 해야 될까?',
   a:'오늘 근력운동을 어느 정도 무겁게 할 거라면, 유산소를 먼저 과하게 할 경우 근력운동 집중력이 떨어질 수 있어요.\n가볍게 10분 정도 하거나 스트레칭 후 근력운동에 집중하고, 마무리로 유산소를 추천합니다.'},
  {q:'매일 운동해야 효과 있나요?',
   a:'목적에 따라 다르지만 주 3회 이상 유산소·근력운동을 30분 이상 하는 것을 권장합니다.\n\n추천 — 일주일에 근력운동 2회, 유산소 2회 · 나에게 맞는 하루 식사 칼로리 지키기'},
];

let GOALS = {};

/* ═══ 서버 ═══ */
const SB_URL = 'https://mylzxiahksgloxzabpqk.supabase.co';
const SB_KEY = 'sb_publishable_AwOEXYRkjO1FASdu7i4Mzg_tw7ewPZ3';
const SB_H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };

const TODAY = (d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'))(new Date());

let netBad = 0;
async function sget(q){
  const r = await fetch(SB_URL + '/rest/v1/' + q, { headers: SB_H });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function spost(t, rows, opt){
  opt = opt || {};
  const h = Object.assign({}, SB_H, { Prefer: (opt.ret ? 'return=representation' : 'return=minimal') + (opt.on ? ',resolution=merge-duplicates' : '') });
  const r = await fetch(SB_URL + '/rest/v1/' + t + (opt.on ? '?on_conflict=' + opt.on : ''), { method:'POST', headers:h, body: JSON.stringify(rows) });
  if(!r.ok) throw new Error(await r.text());
  return opt.ret ? r.json() : null;
}
async function spatch(t, q, body){
  const r = await fetch(SB_URL + '/rest/v1/' + t + '?' + q, { method:'PATCH', headers: Object.assign({}, SB_H, {Prefer:'return=minimal'}), body: JSON.stringify(body) });
  if(!r.ok) throw new Error(await r.text());
}
async function sdel(t, q){
  const r = await fetch(SB_URL + '/rest/v1/' + t + '?' + q, { method:'DELETE', headers: SB_H });
  if(!r.ok) throw new Error(await r.text());
}
/* 서버에 쓰다 실패하면 조용히 넘어가지 않는다 */
function sv(promise, what){
  return Promise.resolve(promise).catch(e => {
    netBad++;
    console.error(what, e);
    toast('서버에 저장 못 했어요 — ' + what);
  });
}

const VID = (ex, va) => ex + ':' + va;
const splitV = id => { const i = String(id).lastIndexOf(':'); return [String(id).slice(0,i), String(id).slice(i+1)]; };

function agoTxt(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  const dayOf = x => x.getFullYear()*10000 + (x.getMonth()+1)*100 + x.getDate();
  const gap = dayOf(now) - dayOf(d);
  if(gap === 0) return (now - d) < 3600000 ? '방금' : '오늘';
  if(gap === 1) return '어제';
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
}

/* ═══ 상태 ═══ */
let D = { routines:[], desc:{}, addvars:{}, today:{}, workouts:[], cm:[], live:null, intake:{}, body:{}, cycle:{} };
let S = { who:null, mid:null, screen:'boot', tab:'home', pickPart:'가슴', tmid:null };

const LIVEKEY = 'gladgym_live_v1';
function save(){ try{ localStorage.setItem(LIVEKEY, JSON.stringify(D.live)); }catch(e){} }
function loadLive(){ try{ const r=localStorage.getItem(LIVEKEY); if(r) D.live=JSON.parse(r); }catch(e){} }

function mapCm(rows){
  return rows.map(c => { const [ex,va] = splitV(c.variant_id);
    return { id:c.id, mid:c.member_id, ex, va, tr:c.trainer, at:agoTxt(c.created_at),
      tx:c.body, pics:c.pics, vids:c.vids, read: !!c.read_at, ts:c.created_at }; });
}
function mapWorkouts(wks, witems, wsets){
  return wks.map(w => ({
    id:w.id, mid:w.member_id, date:w.on_date, kind:w.kind, rid:w.routine_id, title:w.title,
    dur:Number(w.dur||0), done:!!w.done,
    items: witems.filter(i => i.workout_id === w.id).sort((a,b)=>a.sort-b.sort).map(i => {
      const [ex,va] = splitV(i.variant_id);
      return { _id:i.id, ex, va, sec:Number(i.sec||0), locked:!!i.locked,
        sets: wsets.filter(x => x.item_id === i.id).sort((a,b)=>a.sort-b.sort)
          .map(x => ({ kg:Number(x.kg||0), reps:Number(x.reps||0), spd: x.spd==null ? undefined : Number(x.spd), done: !!x.done })) };
    })
  }));
}

async function boot(){
  const [exs, vrs, mems, rts, ritems, asg, wks, witems, wsets, cms, mdesc, intk, plns, bdy, cyc, mls] = await Promise.all([
    sget('exercises?select=*&order=sort'),
    sget('variants?select=*&order=sort'),
    sget('members?select=*'),
    sget('routines?select=*&order=no'),
    sget('routine_items?select=*&order=sort'),
    sget('assignments?select=*'),
    sget('workouts?select=*&order=on_date.desc'),
    sget('workout_items?select=*&order=sort'),
    sget('workout_sets?select=*&order=sort'),
    sget('comments?select=*&order=created_at.desc&limit=300'),
    sget('member_desc?select=*'),
    sget('intake?select=*'),
    sget('plans?select=*'),
    sget('body_checks?select=*'),
    sget('cycles?select=*'),
    sget('meals?select=*&order=created_at.desc&limit=300'),
  ]);

  EX = exs.map(e => ({ id:e.id, n:e.name, p:e.part, e:e.equip, cardio: e.cardio ? 1 : 0,
    vars: vrs.filter(v => v.ex_id === e.id).map(v => ({ k:v.vkey, n:v.name||'', desc:v.descr||'', demo: v.demo?1:0 })) }));
  MEMBERS = mems.filter(m => m.role === 'member').map(m => ({ id:m.id, n:m.name, tr:m.trainer }));
  const t = mems.find(m => m.role === 'trainer'); if(t) TRAINER = t.name;

  D.routines = rts.map(r => ({ id:r.id, mid:r.member_id, no:r.no, n:r.name, purpose:r.purpose||'',
    items: ritems.filter(i => i.routine_id === r.id).sort((a,b)=>a.sort-b.sort).map(i => {
      const [ex,va] = splitV(i.variant_id);
      return { ex, va, kg:Number(i.kg||0), reps:i.reps, sets:i.sets, rest:i.rest }; }) }));

  D.today = {}; asg.forEach(a => { if(a.on_date === TODAY) D.today[a.member_id] = { rid:a.routine_id, kind:a.kind, by:a.assigned_by }; });
  D.workouts = mapWorkouts(wks, witems, wsets);
  D.cm = mapCm(cms);
  D.desc = {}; mdesc.forEach(m => { const [ex,va] = splitV(m.variant_id); D.desc[m.member_id+':'+ex+':'+va] = m.descr; });
  D.intake = {}; intk.forEach(r => D.intake[r.member_id] = r.data || {});
  GOALS = {}; plns.forEach(r => GOALS[r.member_id] = r.data || {});
  D.body = {}; bdy.forEach(r => D.body[r.member_id] = { date:r.on_date, checks:r.checks||{}, photos:r.photos||{}, memo:r.memo||'' });

/* 어제까지의 안 끝낸 기록은 그날로 마감한다 — 「기록 중」으로 계속 떠 있지 않게 */
const CAP_EX = 2*3600, CAP_W = 4*3600;
const capSec = (n, cap) => Math.max(0, Math.min(Math.round(Number(n)||0), cap));

function closeStale(){
  const old = D.workouts.filter(w => !w.done && w.date && w.date < TODAY);
  if(!old.length) return;
  old.forEach(w => {
    w.done = true;
    w.items.forEach(it => { it.locked = true; it.sec = capSec(it.sec, CAP_EX); });
    const dur = capSec(Number(w.dur) || w.items.reduce((a,it)=> a + it.sec, 0), CAP_W);
    w.dur = dur;
    w.autoClosed = true;
    sv(spatch('workouts','id=eq.'+w.id, { done:true, dur }), '지난 기록 자동 종료');
  });
  if(D.live && old.some(w => w.id === D.live.id)) { D.live = null; save(); }
  console.log('지난 기록 자동 종료', old.length, '건');
}

/* 그날 한 줄 요약 — 운동시간 · 종목수 · 먹은 칼로리 */
function dayStat(mid, date){
  const ws = D.workouts.filter(w => w.mid===mid && w.date===date && w.done);
  const dur = ws.reduce((a,w) => a + (Number(w.dur)||0), 0);

  let goal = 0; try{ const rr = calcOf(GOALS[mid]||{}); goal = rr.bmr ? rr.kcal : 0; }catch(e){}
  return { ws, dur, ex:exs.size, kcal, shots:ms.length, goal,
    pw: Math.min(1, dur/(45*60)), pk: goal ? Math.min(1, kcal/goal) : 0 };

/* 두 겹 고리 — 바깥 운동 · 안쪽 식단 */

/* ── 분석 ── */
const PARTG = { '상체':['가슴','어깨','등','팔'], '하체':['하체'], '복근':['복근'], '유산소':['유산소'], '기타':['기타'] };
const PARTS8 = ['가슴','어깨','등','팔','하체','복근','유산소','기타'];
const ANA_P = { '1주':7, '1달':30, '3달':90, '전체':3650 };

function anaFrom(){ return addDays(TODAY, -(ANA_P[S.anaP||'1주'] - 1)); }
function anaWs(mid, from){ return D.workouts.filter(w => w.mid===mid && w.done && w.date >= from)
  .slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }

/* 그날 든 총 무게 · 세트 · 분 · 소모 추정 */
function wStat(w, bw){
  let vol = 0, sets = 0, cardioMin = 0;
  w.items.forEach(it => { const e = exOf(it.ex); if(!e) return;
    it.sets.forEach(x => { sets++;
      if(e.cardio) cardioMin += (+x.reps || 0);
      else vol += (+x.kg || 0) * (+x.reps || 0); }); });
  const min = Math.round((Number(w.dur)||0)/60);
  const wt = Math.max(0, min - cardioMin);
  const kcal = Math.round((5.0*wt + 7.0*cardioMin) * 3.5 * (bw||65) / 200);
  return { vol:Math.round(vol), sets, min, kcal };
}
function bwOf(mid){ const g = GOALS[mid]||{}; return nnum(g.now && g.now.w) || 65; }

/* 기간을 7칸으로 나눈 꺾은선 */
function anaSeries(mid, metric){
  const days = ANA_P[S.anaP||'1주'], bw = bwOf(mid);
  let from = anaFrom();
  if(days > 365){ const all = D.workouts.filter(w=>w.mid===mid && w.done);
    from = all.length ? all.map(w=>w.date).sort()[0] : TODAY; }
  const total = Math.max(1, Math.round((dNew(TODAY) - dNew(from)) / 86400000) + 1);
  const n = Math.min(7, total), span = Math.ceil(total / n);
  const out = [];
  for(let i = n-1; i >= 0; i--){
    const end = addDays(TODAY, -i*span), st = addDays(end, -(span-1));
    const ws = D.workouts.filter(w => w.mid===mid && w.done && w.date >= st && w.date <= end);
    let v = 0;
    ws.forEach(w => { const t = wStat(w, bw);
      v += metric==='vol' ? t.vol : metric==='kcal' ? t.kcal : t.min; });
    out.push({ label: span===1 ? DOW[dNew(end).getDay()] : (+end.slice(5,7))+'/'+(+end.slice(8)), v });
  }
  return out;
}
function lineChart(pts, unit){
  const W = 320, H = 118, PL = 8, PR = 8, PT = 26, PB = 20;
  const mx = Math.max(1, ...pts.map(p=>p.v));
  const x = i => PL + i * (W-PL-PR) / Math.max(1, pts.length-1);
  const y = v => PT + (1 - v/mx) * (H-PT-PB);
  const d = pts.map((p,i)=> (i?'L':'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = d + ` L ${x(pts.length-1).toFixed(1)} ${H-PB} L ${x(0).toFixed(1)} ${H-PB} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:140px">
    <path d="${area}" fill="var(--gold-dim)"/>
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i===pts.length-1?3.4:2.4}"
        fill="${i===pts.length-1?'var(--gold)':'var(--gold-2)'}"/>
      ${p.v?`<text x="${x(i).toFixed(1)}" y="${Math.max(11,y(p.v)-8).toFixed(1)}" text-anchor="middle"
        font-size="9.5" font-weight="700" fill="#c9c2b9">${p.v.toLocaleString()}</text>`:''}
      <text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9.5" font-weight="600"

}

/* 부위별 세트 수 → 팔각형 */
function partSets(mid, from){
  const o = {}; PARTS8.forEach(k => o[k] = 0);
  anaWs(mid, from).forEach(w => w.items.forEach(it => {
    const e = exOf(it.ex); if(!e) return;
    const k = PARTS8.includes(e.p) ? e.p : '기타';
    o[k] += it.sets.length; }));
  return o;
}
function radar(o){
  const n = PARTS8.length, R = 56, cx = 110, cy = 96;
  const mx = Math.max(1, ...PARTS8.map(k=>o[k]));
  const pt = (i, r) => { const a = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + Math.cos(a)*r, cy + Math.sin(a)*r]; };
  const web = [1,.66,.33].map(f =>
    `<polygon points="${PARTS8.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="#302f2b" stroke-width="1"/>`).join('');
  const spokes = PARTS8.map((_,i)=>{ const [x,y]=pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a2926" stroke-width="1"/>`; }).join('');
  const poly = PARTS8.map((k,i)=> pt(i, R * (o[k]/mx)).map(v=>v.toFixed(1)).join(',')).join(' ');
  const labels = PARTS8.map((k,i)=>{ const [x,y]=pt(i, R+17);
    const an = Math.abs(x-cx) < 6 ? 'middle' : (x > cx ? 'start' : 'end');
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${an}" font-size="10" font-weight="700"
      fill="${o[k]===0?'#5f5b56':'#c9c2b9'}">${k}</text>
      <text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="${an}" font-size="9.5" font-weight="700"
      fill="${o[k]===0?'#4d4a46':'var(--gold-2)'}">${o[k]}세트</text>`; }).join('');
  return `<svg viewBox="0 0 220 200" style="height:210px">${web}${spokes}
    <polygon points="${poly}" fill="rgba(230,196,135,.22)" stroke="var(--gold)" stroke-width="1.8"/>
    ${PARTS8.map((k,i)=>{ const [x,y]=pt(i, R*(o[k]/mx));
      return o[k] ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--gold)"/>` : ''; }).join('')}
    ${labels}</svg>`;
}

/* 종목별 무게 변화 */
function exTrend(mid, from, grp){
  const map = {};
  anaWs(mid, from).forEach(w => w.items.forEach(it => {
    if(!it.sets.length) return;
    const e = exOf(it.ex); if(!e) return;
    if(grp !== '전체' && !(PARTG[grp]||[]).includes(e.p)) return;
    const key = it.ex + ':' + it.va;
    const best = e.cardio ? Math.max(...it.sets.map(x=>+x.reps||0)) : Math.max(...it.sets.map(x=>+x.kg||0));
    (map[key] = map[key] || { ex:it.ex, va:it.va, cardio:e.cardio, rows:[] }).rows.push(best);
  }));
  return Object.values(map).map(m => {
    const f = m.rows[0], l = m.rows[m.rows.length-1];
    return Object.assign(m, { first:f, last:l, diff: Math.round((l-f)*10)/10, n:m.rows.length });
  }).sort((a,b) => b.n - a.n || b.last - a.last);
}

async function newLive(title, items, kind, rid, mid, by){
  const id='w'+Date.now();
  mid = mid || S.mid;
  D.live={ id, mid, title, kind:kind||'개인운동', rid:rid||null, date:TODAY, startAt:Date.now(), items, cur:0, by:by||'회원' };
  save(); go('workout');
  await sv(spost('workouts',[{ id, member_id:mid, on_date:TODAY, kind:D.live.kind,
    routine_id:rid||null, title, dur:0, done:false }]), '운동 시작');
  for(let i=0;i<items.length;i++) await svNewItem(i);
  D.workouts.unshift({ id, mid, date:TODAY, kind:D.live.kind, rid:rid||null, title, dur:0, done:false,
    items: items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, sec:0, locked:false, sets:[] })) });
  save(); render();
}
/* 다른 기기에서 시작한 운동을 이 기기에서 이어받는다 */
function adoptLive(mid){
  if(D.live && D.live.mid===mid) return true;
  const w = D.workouts.find(x=>!x.done && x.mid===mid && x.date===TODAY);
  if(!w || !w.items || !w.items.length) return false;
  const i = w.items.findIndex(it=>!it.locked);
  D.live = { id:w.id, mid:w.mid, title:w.title||'운동', kind:w.kind, rid:w.rid, date:w.date,
    startAt: Date.now() - (Number(w.dur)||0)*1000, cur: i>=0?i:w.items.length-1,
    items: w.items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, rest:60, locked:it.locked,
      sec:it.sec, startAt:Date.now(), sets:(it.sets||[]).map(x=>({kg:x.kg,reps:x.reps,spd:x.spd,done:true})) })) };
  if(!D.live.items.length) { D.live=null; return false; }
  if(D.live.items.every(it=>it.locked)) D.live.cur = D.live.items.length-1;
  save(); return true;
}
async function svNewItem(i){
  const w=D.live; if(!w) return; const it=w.items[i]; if(!it || it._id) return;
  const back = await sv(spost('workout_items',
    [{ workout_id:w.id, sort:i, variant_id:VID(it.ex,it.va), sec:0, locked:false }], {ret:true}), '종목 추가');
  if(back && back[0]) it._id = back[0].id;
  save();
}
async function svItem(i){
  const w=D.live; if(!w) return; const it=w.items[i]; if(!it) return;
  if(!it._id) await svNewItem(i);
  if(!it._id) return;
  await sv(spatch('workout_items','id=eq.'+it._id,
    { sec:Math.round(it.sec||0), locked:!!it.locked, sort:i }), '종목 저장');
  await sv(sdel('workout_sets','item_id=eq.'+it._id), '세트 정리');
  const rows = it.sets.filter(x=>x.done).map((x,k)=>({ item_id:it._id, sort:k,
    kg:x.kg, reps:x.reps, spd: x.spd==null ? null : x.spd, done:true }));
  if(rows.length) await sv(spost('workout_sets', rows), '세트 저장');
  const sw = D.workouts.find(x=>x.id===w.id);
  if(sw){ const si = sw.items.find(x=>x._id===it._id);
    if(si){ si.sec=Math.round(it.sec||0); si.locked=!!it.locked;
      si.sets = it.sets.filter(x=>x.done).map(x=>({kg:x.kg,reps:x.reps,spd:x.spd})); } }
  save();
}

function vRecords(){
  const mid = S.mid, from = anaFrom(), bw = bwOf(mid);
  const per = S.anaP || '1주', gm = S.anaG || 'vol', grp = S.anaB || '전체';
  const ws = anaWs(mid, from);
  const tot = ws.reduce((a,w) => { const t = wStat(w, bw);
    return { vol:a.vol+t.vol, sets:a.sets+t.sets, min:a.min+t.min, kcal:a.kcal+t.kcal }; },
    {vol:0, sets:0, min:0, kcal:0});
  const ps = partSets(mid, from);
  const lo = PARTS8.slice().sort((a,b)=> ps[a]-ps[b])[0];
  const hi = PARTS8.slice().sort((a,b)=> ps[b]-ps[a])[0];
  const tr = exTrend(mid, from, grp);
  const unit = gm==='vol' ? 'kg' : gm==='kcal' ? 'kcal' : '분';

  return { top: bar('분석', `<span class="sub">${esc(per)}</span>`), tabs:1, body:`

    <span class="lbl">${esc(per)} 변화</span>

    <span class="lbl">운동 균형 · 부위별 세트</span>

      ${tot.sets ? `<div class="note" style="margin-top:4px">가장 많이 한 곳은 <b style="color:var(--gold)">${hi} ${ps[hi]}세트</b>,

    <div class="card" style="padding:6px 14px">

const SLOTS = ['아침','점심','저녁','간식'];
const mealURL = path => path ? (SB_URL + '/storage/v1/object/public/media/' + path) : '';
function mealsOf(mid, date){ return (D.meals||[]).filter(m=>m.mid===mid && (!date || m.date===date)); }

/* 목표 대비 얼마나 채웠나 */
function dietStat(mid, from, to){
  const g = GOALS[mid] || {};
  const r = calcOf(g);
  const target = r.kcal || 0, dayLoss = r.day || 0;
  const gm = { c:r.gg.c, p:r.gg.p, f:r.gg.f };
  const ready = (r.bmr > 0 && r.keep > 0 && r.kcal > 0);
  const rows = (D.meals||[]).filter(m => m.mid===mid && (!from || m.date>=from) && (!to || m.date<=to));
  const withK = rows.filter(m => Number(m.kcal) > 0);
  const byDay = {};
  withK.forEach(m => { byDay[m.date] = (byDay[m.date]||0) + Number(m.kcal); });
  const days = Object.keys(byDay);
  let over = 0; days.forEach(d => { over += (byDay[d] - target); });
  const eaten = withK.reduce((a,m)=>a+Number(m.kcal), 0);
  const carb  = rows.reduce((a,m)=>a+(Number(m.carb)||0), 0);
  const prot  = rows.reduce((a,m)=>a+(Number(m.protein)||0), 0);
  const fat   = rows.reduce((a,m)=>a+(Number(m.fat)||0), 0);
  const noK   = rows.length - withK.length;
  const planLoss = dayLoss * days.length;
  const realLoss = planLoss - over;
  return { ready, target, dayLoss, gm, days:days.length, eaten, carb, prot, fat, over, noK,
    planLoss, realLoss, planKg: planLoss/FAT_KCAL, realKg: realLoss/FAT_KCAL };
}
function weekStart(){ const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthStart(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; }

function kcalCard(mid, day){
  const st = dietStat(mid, day, day);
  if(!st.ready) return `<div class="note">운동계획에서 <b>인바디 값(기초대사량)과 활동량</b>을 먼저 넣어 주세요.
    넣으면 여기에 <b>오늘 남은 칼로리</b>와 탄단지가 나옵니다.
    ${S.who==='tr'?'<br>트레이너 → 회원 → 운동계획 → 계획 고치기':''}</div>`;
  const left = st.target - st.eaten, over = left < 0;
  const pct = Math.min(100, Math.round(st.eaten / st.target * 100));
  const mm = (nm, got, goal) => `<div><span class="t">${nm} ${got}/${goal}g</span>
    <span class="bar"><i class="${got>goal?'over':''}" style="width:${Math.min(100, goal?Math.round(got/goal*100):0)}%"></i></span></div>`;
  return `<div class="kcard">
    <div class="kbig"><span class="v ${over?'w':'g'}">${over ? '+'+Math.abs(left).toLocaleString() : left.toLocaleString()}</span>
      <span class="u">kcal ${over ? '초과' : '남음'}</span></div>
    <span class="bar"><i class="${over?'over':''}" style="width:${pct}%"></i></span>
    <div class="krow"><span class="k">먹은 칼로리</span><span class="v">${st.eaten.toLocaleString()} / ${st.target.toLocaleString()} kcal</span></div>
    <div class="m3">
      ${mm('탄수', st.carb, st.gm.c)}${mm('단백', st.prot, st.gm.p)}${mm('지방', st.fat, st.gm.f)}
    </div></div>`;
}

function kcalSummary(mid){
  const kg = v => (Math.round(v*100)/100).toFixed(2);
  const box = (nm, st) => {
    if(!st.days) return `<div class="krow"><span class="k">${nm}</span><span class="v" style="color:var(--sub)">기록 없음</span></div>`;
    const over = st.over > 0;
    return `<div class="krow"><span class="k">${nm} · ${st.days}일 기록</span>
      <span class="v" style="color:${over?'var(--warn)':'var(--gold)'}">${over?'+':''}${Math.round(st.over).toLocaleString()} kcal</span></div>
      <div class="krow"><span class="k" style="padding-left:10px">예상 감량</span>
      <span class="v">${kg(st.realKg)}kg <span style="color:var(--sub);font-weight:500">(계획 ${kg(st.planKg)}kg)</span></span></div>`;
  };
  const w = dietStat(mid, weekStart(), TODAY), m = dietStat(mid, monthStart(), TODAY);
  if(!w.ready) return '';
  return `<div class="kcard">
    ${box('이번 주', w)}<div class="hr"></div>${box('이번 달', m)}
    ${m.noK?`<div class="krow"><span class="k">칼로리 안 적은 사진</span><span class="v" style="color:var(--sub)">${m.noK}장</span></div>`:''}
    <div class="note">목표보다 <b>더 먹으면 +</b>, 덜 먹으면 −로 쌓입니다. 지방 1kg = 7,700kcal 로 환산했습니다.</div></div>`;
}

function shotPick(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.style.display='none'; document.body.appendChild(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if(!f) return;
    toast('사진을 다듬는 중이에요');
    try{ const url = await stampPhoto(f); S.shot = url; sheetShot(); }
    catch(e){ console.error(e); toast('사진을 읽지 못했어요'); }
  });
  inp.click();
}

function stampPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, MAX/Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      const x = cv.getContext('2d');
      x.drawImage(img, 0, 0, w, h);
      /* 아래쪽 띠 */
      const barH = Math.max(56, Math.round(h*0.09));
      const gr = x.createLinearGradient(0, h-barH*1.6, 0, h);
      gr.addColorStop(0,'rgba(10,10,9,0)'); gr.addColorStop(1,'rgba(10,10,9,.82)');
      x.fillStyle = gr; x.fillRect(0, h-barH*1.6, w, barH*1.6);
      const pad = Math.round(barH*0.42);
      const s1 = Math.round(barH*0.40), s2 = Math.round(barH*0.28);
      x.textBaseline='alphabetic';
      x.font = `700 ${s1}px "Noto Sans KR",sans-serif`;
      x.fillStyle = '#e6c487';
      x.letterSpacing = Math.round(s1*0.18)+'px';
      x.fillText('GLAD GYM', pad, h - pad - s2 - Math.round(barH*0.14));
      x.letterSpacing = '0px';
      const d = new Date();
      const two = n => String(n).padStart(2,'0');
      const stamp = `${d.getFullYear()}.${two(d.getMonth()+1)}.${two(d.getDate())}  ${two(d.getHours())}:${two(d.getMinutes())}`;
      x.font = `500 ${s2}px "Noto Sans KR",sans-serif`;
      x.fillStyle = '#fdfaf6';
      x.fillText(stamp, pad, h - pad);
      /* 오른쪽 아래 작은 표시 */
      x.font = `500 ${Math.round(s2*0.85)}px "Noto Sans KR",sans-serif`;
      x.fillStyle = 'rgba(253,250,246,.6)';
      const tx = '구산역촌점';
      x.fillText(tx, w - pad - x.measureText(tx).width, h - pad);
      res(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

    cyc_len:c.len, period_len:c.period, updated_at:new Date().toISOString() }], {on:'member_id'}), '생리주기 저장');

function cycOf(mid){ return (D.cycle&&D.cycle[mid]) || null; }
function cycToday(c){
  if(!c||!c.on) return null;
  const base=new Date(c.last+'T00:00:00'), now=new Date('2026-08-28T00:00:00');
  const diff=Math.floor((now-base)/86400000);
  const day=((diff % c.len)+c.len)%c.len + 1;
  const ovul=c.len-14;
  let ph, why;
  if(day<=c.period){ ph='생리기'; why='가볍게 · 컨디션 우선'; }
  else if(day<=ovul+1){ ph='황금기'; why='힘이 가장 잘 나는 때 · 증량하기 좋아요'; }
  else { ph='황체기'; why='붓고 무거운 때 · 무게보다 횟수로'; }
  const left=c.len-day+1;
  return {day, ph, why, left, ovul};
}
function cycBar(c){
  const t=cycToday(c); if(!t) return '';
  let cells='', labels='';
  const seg=[['생리기',1,c.period,'p'],['황금기',c.period+1,t.ovul+1,'g'],['황체기',t.ovul+2,c.len,'l']];

    const w=b-a+1, now=(t.day>=a&&t.day<=b);

/* 「3개월」 「12주」 「90일」 「12월 2일」 「2026-12-02」 → 2026-12-02 */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function goalDate(txt){
  const t = String(txt||'').trim(); if(!t) return '';
  const base = new Date(TODAY+'T00:00:00');   /* 언제나 오늘이 기준 */
  let m;
  if((m = t.match(/^(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/)))
    return ymd(new Date(+m[1], +m[2]-1, +m[3]));
  if((m = t.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일?$/)) || (m = t.match(/^(\d{1,2})[-.\/](\d{1,2})$/))){
    const y = base.getFullYear();
    let d = new Date(y, +m[1]-1, +m[2]);
    if(d < base) d = new Date(y+1, +m[1]-1, +m[2]);
    return ymd(d);
  }
  if((m = t.match(/^(\d+)\s*일$/))){ const d=new Date(base); d.setDate(d.getDate()+ +m[1]); return ymd(d); }
  if((m = t.match(/^(\d+)\s*주$/))){ const d=new Date(base); d.setDate(d.getDate()+ +m[1]*7); return ymd(d); }
  if((m = t.match(/^(\d+)\s*(개월|달|월)?$/))){
    const d=new Date(base), day=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + +m[1]);
    const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day,last)); return ymd(d);
  }
  return '';
}
function dLeft(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')) return null;
  return Math.round((new Date(date+'T00:00:00') - new Date(TODAY+'T00:00:00'))/86400000);
}
function goalLine(g){
  const d = (g.to && g.to.date) || '';
  if(!d) return '<div class="note" style="padding:8px 10px">달력에서 목표 날짜를 골라 주세요. 그날까지 맞춰 섭취 칼로리를 잡아 드립니다.</div>';
  const n = dLeft(d);
  return `<div class="note" style="padding:8px 10px">오늘부터 <b style="color:var(--gold)">${n>0?n+'일':(n===0?'오늘':'지난 날짜')}</b>
    ${n>0?` · 약 ${Math.round(n/7)}주`:''}</div>`;
}

/* 「1992-03-15」 「1992.3.15」 「19920315」 「920315」 → 1992-03-15 */
function birthYmd(t){
  const s0 = String(t||'').trim();
  const cy = +TODAY.slice(2,4);
  const ok = (y,m,d) => (y>=1900 && y<=+TODAY.slice(0,4) && m>=1 && m<=12 && d>=1 && d<=31)
    ? y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0') : '';
  let m0;
  if((m0 = s0.match(/^(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/))) return ok(+m0[1], +m0[2], +m0[3]);
  if((m0 = s0.match(/^(\d{2})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/))){
    const yy = +m0[1]; return ok(yy<=cy?2000+yy:1900+yy, +m0[2], +m0[3]);
  }
  const n = s0.replace(/[^0-9]/g,'');
  if(n.length === 8) return ok(+n.slice(0,4), +n.slice(4,6), +n.slice(6,8));
  if(n.length === 6){ const yy = +n.slice(0,2); return ok(yy<=cy?2000+yy:1900+yy, +n.slice(2,4), +n.slice(4,6)); }
  return '';
}
function ageFrom(t){
  const d = birthYmd(t); if(!d) return 0;
  const b = d.split('-').map(Number), n = TODAY.split('-').map(Number);
  if(b[0] < 1900 || b[0] > n[0] || b[1] < 1 || b[1] > 12 || b[2] < 1 || b[2] > 31) return 0;
  let a = n[0] - b[0];
  if(n[1] < b[1] || (n[1] === b[1] && n[2] < b[2])) a--;
  return (a >= 0 && a <= 120) ? a : 0;
}
function ageTag(c){
  const a = ageFrom(c && c.birth);
  if(a) return `<b style="color:var(--gold)">만 ${a}세</b>`;
  if(c && String(c.birth||'').trim()) return `<b style="color:var(--warn)">날짜를 다시 봐 주세요</b>`;
  return '';
}

function calcOf(g){
  const c = g.calc || (g.calc = {});
  const w  = nnum(g.now && g.now.w), gw = nnum(g.to && g.to.w);
  const fp = nnum(g.now && g.now.fp);                 /* 체지방률 % */
  const h  = nnum(c.height), age = ageFrom(c.birth), male = (c.sex === '남');
  let bmr  = nnum(c.bmr), how = '인바디 값';
  const auto = !bmr;
  if(auto && w && fp > 0 && fp < 60){                 /* 체지방률을 알면 이게 더 정확 */
    const lbm = w * (1 - fp/100);
    bmr = Math.round(370 + 21.6 * lbm);
    how = '체지방률 기준';
  } else if(auto && w && h && age){
    bmr = Math.round(10*w + 6.25*h - 5*age + (male ? 5 : -161));
    how = '키·몸무게 기준';
  } else if(auto){ how = ''; }
  const k     = ACT[c.act] != null ? ACT[c.act] : 0.375;
  const actC  = Math.round(bmr * k);
  const total = bmr + actC;             /* 활동량에 운동까지 들어 있다 */

  /* 목표 날짜까지 남은 날 · 그날까지 맞추려면 하루 얼마를 덜 먹어야 하는지 */
  const goal   = (g.to && g.to.date) || '';
  const left   = dLeft(goal);
  const daysTo = (left != null && left > 0) ? left : 0;
  const need0  = (w && gw) ? (w - gw) * FAT_KCAL : 0;
  const dayNeed = (daysTo && need0 > 0) ? Math.round(need0 / daysTo) : 0;

  const floor = nnum(c.floor) || (male ? 1500 : 1200);
  const wkMax = nnum(c.wkmax) || DEF_WKMAX;

  let kcal = nnum(c.kcal);
  const kcalAuto = !kcal;
  if(kcalAuto) kcal = dayNeed ? Math.max(floor, Math.floor((total - dayNeed)/10)*10)
                              : Math.max(floor, Math.round((total - 500)/10)*10);
  const day  = total - kcal;

  /* 안전하게 잡았을 때 언제쯤 닿는지 */
  const dSafe = Math.max(0, Math.min(w ? w*(wkMax/100)*FAT_KCAL/7 : 0, total - floor));
  const safeDays = (need0 > 0 && dSafe > 0) ? Math.ceil(need0/dSafe) : null;
  const safeDate = safeDays ? addDays(TODAY, safeDays) : '';
  const hitDays  = (need0 > 0 && day > 0) ? Math.ceil(need0/day) : null;
  const hitDate  = hitDays ? addDays(TODAY, hitDays) : '';
  const week = day*7, month = day*30;
  let rc = nnum(c.rc)||50, rp = nnum(c.rp)||25, rf = nnum(c.rf)||25;
  let kk, gg;
  if(c.macro === 'kg' && w){                 /* 체중 기준 — 단백질부터 잡는다 */
    const pg = nnum(c.pkg) || 1.2, fg = nnum(c.fkg) || 0.9;
    const P = Math.round(w * pg), F = Math.round(w * fg);
    const kP = P*4, kF = F*9;
    const kC = Math.max(0, kcal - kP - kF);
    const C = Math.round(kC/4);
    gg = { c:C, p:P, f:F };
    kk = { c:Math.round(kC), p:kP, f:kF };
    rc = kcal?Math.round(kC/kcal*100):0; rp = kcal?Math.round(kP/kcal*100):0; rf = kcal?Math.round(kF/kcal*100):0;
  } else {
    kk = { c:Math.round(kcal*rc/100), p:Math.round(kcal*rp/100), f:Math.round(kcal*rf/100) };
    gg = { c:Math.round(kk.c/4), p:Math.round(kk.p/4), f:Math.round(kk.f/9) };
  }
  const need = need0;
  const days = hitDays;
  const bmi = (w && h) ? Math.round(w / Math.pow(h/100,2) * 10)/10 : 0;
  const bmiTo = (gw && h) ? Math.round(gw / Math.pow(h/100,2) * 10)/10 : 0;
  const perKg = w ? Math.round(gg.p / w * 10)/10 : 0;     /* 단백질 g/kg */
  const water = w ? Math.round(w*33/10)*10 : 0;           /* 물 ml */
  const wkPct = w ? (week/FAT_KCAL)/w*100 : 0;            /* 주당 감량 % */
  const warn = [];
  if(kcal && kcal < floor) warn.push(`하루 ${floor}kcal 아래입니다 — 안전 가이드보다 낮게 잡으셨습니다`);
  else if(kcal && bmr && kcal < bmr) warn.push('권장 칼로리가 기초대사량보다 낮습니다 — 오래 끌면 근육이 빠집니다');
  if(wkPct > wkMax) warn.push(`한 주에 체중의 ${Math.round(wkPct*10)/10}%가 빠지는 속도입니다 (가이드 ${wkMax}%)`);
  if(dayNeed && dayNeed > total - floor)
    warn.push(`이 날짜에 맞추려면 하루 ${dayNeed.toLocaleString()}kcal 를 줄여야 하는데, 최소 섭취 ${floor.toLocaleString()}kcal 를 지키면 ${Math.max(0,total-floor).toLocaleString()}kcal 까지가 한계입니다`);
  if(perKg && perKg < 1.0) warn.push(`단백질이 체중 1kg당 ${perKg}g입니다 — 근육을 지키려면 1.2g 이상을 권합니다`);
  if(day <= 0 && kcal && gw && w > gw) warn.push('지금 설정으로는 살이 빠지지 않습니다 — 섭취를 낮추거나 활동량을 올려 보세요');
  const tough = !!(warn.length && safeDate && daysTo && safeDays > daysTo);
  return { w, gw, fp, bmr, auto, how, k, actC, keep: total, total, kcal, kcalAuto, day, week, month,
    wkKg: week/FAT_KCAL, moKg: month/FAT_KCAL, rc, rp, rf, kk, gg, need, days,
    goal, daysTo, dayNeed, floor, wkMax, dSafe, safeDays, safeDate, hitDays, hitDate, tough,
    bmi, bmiTo, perKg, water, wkPct, warn };
}

function calcBrief(g, ed){
  const r = calcOf(g);
  if(!r.bmr) return '';
  const c = g.calc || {};
  const kg = v => (Math.round(v*100)/100).toFixed(1);
  return `<div class="calc" style="gap:12px">
    <div class="crow" style="border:none;padding:0"><span class="ck" style="font-size:14px;font-weight:700;color:var(--cream)">회원님께 이렇게 설명합니다</span></div>
    <div class="krow"><span class="k">① 하루에 쓰는 양</span><span class="v">${r.total.toLocaleString()} kcal</span></div>
    <div class="krow"><span class="k">② 이만큼 드시면</span>${ed
      ? `<span class="kedit">
          <button class="stp" data-act="kcalstep:-50">−</button>
          <input class="kin" type="text" inputmode="numeric" data-k="pc:kcal" value="${esc(c.kcal||'')}" placeholder="${r.kcal}">
          <button class="stp" data-act="kcalstep:50">＋</button>
          <span class="ku">kcal</span></span>`
      : `<span class="v" style="color:var(--gold)">${r.kcal.toLocaleString()} kcal</span>`}</div>
    <div class="krow"><span class="k">③ 한 달에</span><span class="v" style="color:var(--gold)">${kg(r.moKg)} kg</span></div>
    ${r.goal && r.gw ? `<div class="krow"><span class="k">④ ${esc(r.goal)} 까지</span>
      <span class="v" style="color:${r.hitDate && r.hitDate<=r.goal ? 'var(--gold)' : 'var(--warn)'}">${
        !r.hitDate ? '안 빠짐' : (r.hitDate<=r.goal ? `${r.gw}kg 도착` : `${Math.round((r.w - (r.day*r.daysTo)/FAT_KCAL)*10)/10}kg 쯤`)}</span></div>` : ''}
    ${ed?`<div class="note" style="padding:8px 10px">숫자를 바꾸면 아래가 모두 따라 바뀝니다. 비우면 자동으로 잡습니다.</div>`:''}
    <div class="note">차이 <b>${r.day>0?r.day:0}kcal</b> 는 ${esc(foodTxt(r.day>0?r.day:0))} 입니다.
      하루 그만큼만 덜 드시면 한 달에 ${kg(r.moKg)}kg 이 빠집니다.</div>
  </div>`;
}

function calcHTML(g, ed){
  const r = calcOf(g);
  const c = g.calc || {};
  const kg = v => (Math.round(v*100)/100).toFixed(2);
  const per = r.days ? (r.days>=60 ? `약 ${Math.round(r.days/30)}개월` : `약 ${Math.ceil(r.days/7)}주`) : '—';
  const need = r.bmr ? '' : (!r.w ? '몸무게를 넣어 주세요.'
    : '체지방률, 또는 생년월일과 키를 넣으면 기초대사량을 잡아 드립니다.');
  return `<div class="calc">
    ${need?`<div class="note" style="border-color:var(--warn);color:var(--warn);font-weight:700">${need}</div>`:''}
    <div class="crow"><span class="ck">기초대사량 <span style="color:var(--gold-2)">${esc(r.how||'')}</span></span>
      <span class="cv">${r.bmr||'—'}<span class="cs"> kcal</span></span></div>
    <div class="crow"><span class="ck">유지 칼로리</span>
      <span class="cv">${r.total||'—'}<span class="cs"> kcal</span></span></div>
    ${r.dayNeed?`<div class="crow"><span class="ck">목표 날짜까지 <span style="color:var(--gold-2)">${r.daysTo}일</span> · 하루 줄여야 할 양</span>
      <span class="cv">${r.dayNeed.toLocaleString()}<span class="cs"> kcal</span></span></div>`:''}
    <div class="crow"><span class="ck">권장 섭취 칼로리${r.kcalAuto?(r.dayNeed?' · 목표 날짜 기준':' · 자동'):' · 직접 정함'}</span>
      <span class="cv g">${r.kcal||'—'}<span class="cs"> kcal</span></span></div>
    <div class="crow"><span class="ck">하루 감량치 <span style="color:var(--gold-2)">${esc(foodTxt(r.day>0?r.day:0))}</span></span>
      <span class="cv">${r.day>0?r.day:0}<span class="cs"> kcal</span></span></div>
    <div class="crow"><span class="ck">주당 감량치</span>
      <span class="cv">${r.week>0?r.week.toLocaleString():0}<span class="cs"> kcal · ${kg(r.wkKg)}kg</span></span></div>
    <div class="crow"><span class="ck">한 달 예상</span>
      <span class="cv g">${r.month>0?Math.round(r.month).toLocaleString():0}<span class="cs"> kcal · ${kg(r.moKg)}kg</span></span></div>
    <div class="crow"><span class="ck">${r.w&&r.gw?`${r.w}kg → ${r.gw}kg 까지`:'목표 몸무게를 넣으면 기간이 나옵니다'}</span>
      <span class="cv g">${per}${r.hitDate?`<span class="cs"> · ${r.hitDate}</span>`:''}</span></div>
    <div class="mac">
      <div><span class="n">탄수화물 ${r.rc}%</span><span class="v">${r.gg.c}</span><span class="u">g · ${r.kk.c}kcal</span></div>
      <div><span class="n">단백질 ${r.rp}%</span><span class="v">${r.gg.p}</span><span class="u">g · ${r.kk.p}kcal</span></div>
      <div><span class="n">지방 ${r.rf}%</span><span class="v">${r.gg.f}</span><span class="u">g · ${r.kk.f}kcal</span></div>
    </div>
    ${ed?`<div class="fld" style="margin-top:2px"><span class="fn">탄단지 정하는 방식</span>
      <div class="chips">
        <button class="chip ${c.macro!=='kg'?'on':''}" data-act="pc1:macro:pct">비율로 정하기</button>
        <button class="chip ${c.macro==='kg'?'on':''}" data-act="pc1:macro:kg">체중 기준으로</button>
      </div></div>
    ${c.macro==='kg'
      ? `<div class="grid2">
          <div class="fld"><span class="fn">단백질 g/kg</span><input class="search" type="text" inputmode="decimal" data-k="pc:pkg" value="${esc(c.pkg||'')}" placeholder="1.2"></div>
          <div class="fld"><span class="fn">지방 g/kg</span><input class="search" type="text" inputmode="decimal" data-k="pc:fkg" value="${esc(c.fkg||'')}" placeholder="0.9"></div>
        </div>
        <div class="note">단백질과 지방을 <b>몸무게로 먼저</b> 잡고 남은 것을 탄수로 채웁니다. 칼로리를 낮춰도 단백질이 안 깎여서 근육을 지킵니다.</div>`
      : `<div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
          <div class="fld"><span class="fn">탄수 %</span><input class="search" type="text" inputmode="numeric" data-k="pc:rc" value="${esc(c.rc||'')}" placeholder="50"></div>
          <div class="fld"><span class="fn">단백 %</span><input class="search" type="text" inputmode="numeric" data-k="pc:rp" value="${esc(c.rp||'')}" placeholder="25"></div>
          <div class="fld"><span class="fn">지방 %</span><input class="search" type="text" inputmode="numeric" data-k="pc:rf" value="${esc(c.rf||'')}" placeholder="25"></div>
        </div>`}`:''}
    ${r.perKg?`<div class="crow"><span class="ck">단백질 — 체중 1kg당</span>
      <span class="cv">${r.perKg}<span class="cs"> g/kg</span></span></div>`:''}
    ${r.bmi?`<div class="crow"><span class="ck">체질량지수 BMI</span>
      <span class="cv">${r.bmi}${r.bmiTo?`<span class="cs"> → 목표 ${r.bmiTo}</span>`:''}</span></div>`:''}
    ${r.water?`<div class="crow"><span class="ck">하루 물</span>
      <span class="cv">${(r.water/1000).toFixed(1)}<span class="cs"> L</span></span></div>`:''}
    ${r.warn.length?`<div class="note" style="border-color:var(--warn)">
      ${r.warn.map(x=>`<div style="color:var(--warn);font-weight:700">· ${esc(x)}</div>`).join('')}
      ${r.safeDate?`<div style="margin-top:7px">안전 가이드 안에서라면 <b style="color:var(--gold)">${r.safeDate}</b> 쯤이 여유롭습니다
        ${r.daysTo?`(지금 목표는 ${r.daysTo}일, 가이드로는 ${r.safeDays}일)`:''}.</div>`:''}
      <div style="margin-top:5px;opacity:.85">계산상의 숫자일 뿐 실제로 그만큼 빠지지는 않습니다.
        필요하면 <b>그대로 진행하셔도 됩니다.</b></div></div>`:''}
    <div class="note">지방 1kg 을 빼려면 <b>7,700kcal</b> 를 써야 합니다. 위 숫자는 그 기준으로 잡은 값입니다.</div>
  </div>`;
}

/* 글자 칸을 고치면 화면을 다시 그리지 않고 결과만 새로 쓴다 */
function calcSync(){
  const box = document.getElementById('calcout');
  if(!box) return;
  const g = GOALS[subj()] || {}; g.calc = g.calc || {}; g.now = g.now || {}; g.to = g.to || {};
  const gv = k => { const el=document.querySelector('[data-k="'+k+'"]'); return el ? el.value.trim() : undefined; };
  ['birth','height','bmr','kcal','floor','wkmax','rc','rp','rf','pkg','fkg'].forEach(k=>{ const v=gv('pc:'+k); if(v!==undefined) g.calc[k]=v; });
  const nw = gv('plnow:w');  if(nw!==undefined) g.now.w  = nw;
  const nf = gv('plnow:fp'); if(nf!==undefined) g.now.fp = nf;
  const tw = gv('plto:w');    if(tw!==undefined) g.to.w    = tw;
  const td = gv('plto:date'); if(td!==undefined) g.to.date = td;
  const ae = document.activeElement, ak = (ae && box.contains(ae)) ? ae.getAttribute('data-k') : null;
  const pos = ak ? ae.selectionStart : null;
  box.innerHTML = calcBrief(g,1) + calcHTML(g,1);
  if(ak){ const el = box.querySelector('[data-k="'+ak+'"]');
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} } }
}

/* 상담일지에서 가져왔는지 · 무엇이 비었는지 */
function intakeNote(mid){
  const d = D.intake[mid] || {};
  const has = k => String(d[k]||'').trim();
  const need = [];
  if(!has('birth')) need.push('생년월일');
  if(!has('height')) need.push('신장');
  if(!has('sex')) need.push('성별');
  if(!need.length) return `<div class="note" style="padding:8px 10px">상담일지에서 <b>생년월일 · 신장 · 성별</b>을 가져왔습니다.</div>`;
  return `<div class="note" style="border-color:var(--warn);padding:9px 11px">
    <div style="color:var(--warn);font-weight:700">상담일지에 ${need.join(' · ')}이(가) 비어 있습니다</div>
    <div>여기 적으시면 <b>상담일지에도 같이 들어갑니다.</b></div>
    <button class="btn ghost sm" data-act="editintake:${mid}" style="margin-top:8px">상담일지 열기 ›</button></div>`;
}

      ${cmp('몸무게','w')}${cmp('근육량','m')}${cmp('체지방량','f')}${cmp('체지방률','fp')}</div>

/* 피드백 — 코멘트 쓸 곳 모아보기 */
function tFeed(){
  const nm = id => (MEMBERS.find(x=>x.id===id)||{}).n || '?';
  const mode = S.tfeed || 'ex';
  const head = `<div class="chips">
    <button class="chip ${mode==='ex'?'on':''}" data-act="tfm:ex">운동 ${todoCount()?'· '+todoCount():''}</button>
    <button class="chip ${mode==='diet'?'on':''}" data-act="tfm:diet">식단 ${mealTodo().length?'· '+mealTodo().length:''}</button></div>`;

  if(mode==='diet'){
    const all = (D.meals||[]).slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
    const todoM = all.filter(m=>!m.note), doneM = all.filter(m=>m.note).slice(0,10);
    const row = m => `<button class="mrow" data-act="meal:${m.id}">
      <img src="${esc(mealURL(m.path))}" alt="">
      <div><div class="nm">${esc(nm(m.mid))} · ${esc(m.slot)}</div>
      <div class="sm">${dateTxt(m.date)}${m.memo?' · '+esc(m.memo.slice(0,14)):''}</div></div>
      ${m.note?'<span class="pill q">봤음</span>':'<span class="pill">쓰기 ›</span>'}</button>`;
    return { top: bar('피드백', `<span class="sub">식단 ${todoM.length}장</span>`), body: head + `
      <span class="lbl">코멘트 안 단 식단 · ${todoM.length}장</span>
      ${todoM.length? todoM.map(row).join('') : '<div class="empty">다 보셨어요</div>'}
      ${doneM.length?`<div class="hr"></div><span class="lbl">코멘트 남긴 것</span>${doneM.map(row).join('')}`:''}
      ${all.length?'':'<div class="note">회원이 식단 탭에서 사진을 올리면 여기에 모입니다.</div>'}` };
  }

  const todo = D.workouts.filter(w=>w.done && unseen(w)).sort(byDateDesc);
  const mine = D.cm.slice(0, 12);
  return { top: bar('피드백', `<span class="sub">쓸 것 ${todo.length}건</span>`), body: head + `
    <span class="lbl">코멘트를 아직 안 단 기록</span>
    ${todo.length? todo.map(w=>`<button class="card rowc" data-act="tw:${w.id}">
        <div><div class="nm">${esc(nm(w.mid))} · ${dateTxt(w.date)}</div>
        <div class="sm">${esc(w.kind||'')} · ${w.items.map(i=>exOf(i.ex).n).slice(0,2).join(', ')}${w.items.length>2?' 외':''}</div></div>
        <span class="pill">쓰기 ›</span></button>`).join('')
     : '<div class="empty">다 쓰셨어요</div>'}
    <div class="hr"></div>
    <span class="lbl">최근 남긴 코멘트</span>
    ${mine.length? mine.map(c=>`<button class="cm" style="text-align:left" data-act="exd:${c.ex}:${c.va}:${c.mid}">
        <span class="who">${esc(nm(c.mid))} · ${esc(c.at)}</span>
        <span class="ex" style="font-size:13.5px;font-weight:700;color:var(--gold)">${esc(exName(c.ex,c.va))}</span>
        <span class="tx">${esc(c.tx.slice(0,60))}${c.tx.length>60?'…':''}</span></button>`).join('')
     : '<div class="empty">아직 없어요</div>'}` };
}
