  '저활동':'하루 종일 앉아 계시고 따로 운동은 안 하심',
  '가벼운활동':'주 1~3회 가볍게 운동',
  '보통의활동':'주 3~5회 운동',
  '적극적인 활동':'주 6~7회 운동, 또는 몸 쓰는 일',
  '매우 적극적인 활동':'매일 강하게 · 하루 두 번 · 육체노동',
};
const DEF_WKMAX = 1;                     /* 주당 감량 상한 % — 고칠 수 있다 */
const addDays = (ymd0, n) => { const d=new Date(ymd0+'T00:00:00'); d.setDate(d.getDate()+Math.round(n)); return ymd(d); };
const FAT_KCAL = 7700;   /* 지방 1kg */

function nnum(v){ const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; }

const FOODS = [
  {n:'밥 한 공기', k:300}, {n:'닭가슴살 100g', k:140}, {n:'계란 1개', k:78},
  {n:'고구마 중간 1개', k:130}, {n:'아몬드 20알', k:139}, {n:'바나나 1개', k:105},
];
function foodTxt(kcal){
  if(!kcal || kcal<=0) return '';
  const f = FOODS[0];
  const n = Math.round(kcal / f.k * 10) / 10;
  return `${f.n} ${n}개쯤`;
}

/* 「3개월」 「12주」 「90일」 「12월 2일」 「2026-12-02」 → 2026-12-02 */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function goalDate(txt){
  const t = String(txt||'').trim(); if(!t) return '';
  const base = new Date(TODAY+'T00:00:00');   /* 언제나 오늘이 기준 */
  let m;
  if((m = t.match(/^(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/)))
    return ymd(new Date(+m[1], +m[2]-1, +m[3]));
  if((m = t.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일?$/)) || (m = t.match(/^(\d{1,2})[-.\/](\d{1,2})$/))){
    const y = base.getFullYear();
    let d = new Date(y, +m[1]-1, +m[2]);
    if(d < base) d = new Date(y+1, +m[1]-1, +m[2]);
    return ymd(d);
  }
  if((m = t.match(/^(\d+)\s*일$/))){ const d=new Date(base); d.setDate(d.getDate()+ +m[1]); return ymd(d); }
  if((m = t.match(/^(\d+)\s*주$/))){ const d=new Date(base); d.setDate(d.getDate()+ +m[1]*7); return ymd(d); }
  if((m = t.match(/^(\d+)\s*(개월|달|월)?$/))){
    const d=new Date(base), day=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + +m[1]);
    const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day,last)); return ymd(d);
  }
  return '';
}
function dLeft(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')) return null;
  return Math.round((new Date(date+'T00:00:00') - new Date(TODAY+'T00:00:00'))/86400000);
}
function goalLine(g){
  const d = (g.to && g.to.date) || '';
  if(!d) return '<div class="note" style="padding:8px 10px">달력에서 목표 날짜를 골라 주세요. 그날까지 맞춰 섭취 칼로리를 잡아 드립니다.</div>';
  const n = dLeft(d);
  return `<div class="note" style="padding:8px 10px">오늘부터 <b style="color:var(--gold)">${n>0?n+'일':(n===0?'오늘':'지난 날짜')}</b>
    ${n>0?` · 약 ${Math.round(n/7)}주`:''}</div>`;
}

/* 「1992-03-15」 「1992.3.15」 「19920315」 「920315」 → 1992-03-15 */
function birthYmd(t){
  const s0 = String(t||'').trim();
  const cy = +TODAY.slice(2,4);
  const ok = (y,m,d) => (y>=1900 && y<=+TODAY.slice(0,4) && m>=1 && m<=12 && d>=1 && d<=31)
    ? y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0') : '';
  let m0;
  if((m0 = s0.match(/^(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/))) return ok(+m0[1], +m0[2], +m0[3]);
  if((m0 = s0.match(/^(\d{2})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/))){
    const yy = +m0[1]; return ok(yy<=cy?2000+yy:1900+yy, +m0[2], +m0[3]);
  }
  const n = s0.replace(/[^0-9]/g,'');
  if(n.length === 8) return ok(+n.slice(0,4), +n.slice(4,6), +n.slice(6,8));
  if(n.length === 6){ const yy = +n.slice(0,2); return ok(yy<=cy?2000+yy:1900+yy, +n.slice(2,4), +n.slice(4,6)); }
  return '';
}
function ageFrom(t){
  const d = birthYmd(t); if(!d) return 0;
  const b = d.split('-').map(Number), n = TODAY.split('-').map(Number);
  if(b[0] < 1900 || b[0] > n[0] || b[1] < 1 || b[1] > 12 || b[2] < 1 || b[2] > 31) return 0;
  let a = n[0] - b[0];
  if(n[1] < b[1] || (n[1] === b[1] && n[2] < b[2])) a--;
  return (a >= 0 && a <= 120) ? a : 0;
}
function ageTag(c){
  const a = ageFrom(c && c.birth);
  if(a) return `<b style="color:var(--gold)">만 ${a}세</b>`;
  if(c && String(c.birth||'').trim()) return `<b style="color:var(--warn)">날짜를 다시 봐 주세요</b>`;
  return '';
}

function calcOf(g){
  const c = g.calc || (g.calc = {});
  const w  = nnum(g.now && g.now.w), gw = nnum(g.to && g.to.w);
  const fp = nnum(g.now && g.now.fp);                 /* 체지방률 % */
  const h  = nnum(c.height), age = ageFrom(c.birth), male = (c.sex === '남');
  let bmr  = nnum(c.bmr), how = '인바디 값';
  const auto = !bmr;
  if(auto && w && fp > 0 && fp < 60){                 /* 체지방률을 알면 이게 더 정확 */
    const lbm = w * (1 - fp/100);
    bmr = Math.round(370 + 21.6 * lbm);
    how = '체지방률 기준';
  } else if(auto && w && h && age){
    bmr = Math.round(10*w + 6.25*h - 5*age + (male ? 5 : -161));
    how = '키·몸무게 기준';
  } else if(auto){ how = ''; }
  const k     = ACT[c.act] != null ? ACT[c.act] : 0.375;
  const actC  = Math.round(bmr * k);
  const total = bmr + actC;             /* 활동량에 운동까지 들어 있다 */

  /* 목표 날짜까지 남은 날 · 그날까지 맞추려면 하루 얼마를 덜 먹어야 하는지 */
  const goal   = (g.to && g.to.date) || '';
  const left   = dLeft(goal);
  const daysTo = (left != null && left > 0) ? left : 0;
  const need0  = (w && gw) ? (w - gw) * FAT_KCAL : 0;
  const dayNeed = (daysTo && need0 > 0) ? Math.round(need0 / daysTo) : 0;

  const floor = nnum(c.floor) || (male ? 1500 : 1200);
  const wkMax = nnum(c.wkmax) || DEF_WKMAX;

  let kcal = nnum(c.kcal);
  const kcalAuto = !kcal;
  if(kcalAuto) kcal = dayNeed ? Math.max(floor, Math.floor((total - dayNeed)/10)*10)
                              : Math.max(floor, Math.round((total - 500)/10)*10);
  const day  = total - kcal;

  /* 안전하게 잡았을 때 언제쯤 닿는지 */
  const dSafe = Math.max(0, Math.min(w ? w*(wkMax/100)*FAT_KCAL/7 : 0, total - floor));
  const safeDays = (need0 > 0 && dSafe > 0) ? Math.ceil(need0/dSafe) : null;
  const safeDate = safeDays ? addDays(TODAY, safeDays) : '';
  const hitDays  = (need0 > 0 && day > 0) ? Math.ceil(need0/day) : null;
  const hitDate  = hitDays ? addDays(TODAY, hitDays) : '';
  const week = day*7, month = day*30;
  let rc = nnum(c.rc)||50, rp = nnum(c.rp)||25, rf = nnum(c.rf)||25;
  let kk, gg;
  if(c.macro === 'kg' && w){                 /* 체중 기준 — 단백질부터 잡는다 */
    const pg = nnum(c.pkg) || 1.2, fg = nnum(c.fkg) || 0.9;
    const P = Math.round(w * pg), F = Math.round(w * fg);
    const kP = P*4, kF = F*9;
    const kC = Math.max(0, kcal - kP - kF);
    const C = Math.round(kC/4);
    gg = { c:C, p:P, f:F };
    kk = { c:Math.round(kC), p:kP, f:kF };
    rc = kcal?Math.round(kC/kcal*100):0; rp = kcal?Math.round(kP/kcal*100):0; rf = kcal?Math.round(kF/kcal*100):0;
  } else {
    kk = { c:Math.round(kcal*rc/100), p:Math.round(kcal*rp/100), f:Math.round(kcal*rf/100) };
    gg = { c:Math.round(kk.c/4), p:Math.round(kk.p/4), f:Math.round(kk.f/9) };
  }
  const need = need0;
  const days = hitDays;
  const bmi = (w && h) ? Math.round(w / Math.pow(h/100,2) * 10)/10 : 0;
  const bmiTo = (gw && h) ? Math.round(gw / Math.pow(h/100,2) * 10)/10 : 0;
  const perKg = w ? Math.round(gg.p / w * 10)/10 : 0;     /* 단백질 g/kg */
  const water = w ? Math.round(w*33/10)*10 : 0;           /* 물 ml */
  const wkPct = w ? (week/FAT_KCAL)/w*100 : 0;            /* 주당 감량 % */
  const warn = [];
  if(kcal && kcal < floor) warn.push(`하루 ${floor}kcal 아래입니다 — 안전 가이드보다 낮게 잡으셨습니다`);
  else if(kcal && bmr && kcal < bmr) warn.push('권장 칼로리가 기초대사량보다 낮습니다 — 오래 끌면 근육이 빠집니다');
  if(wkPct > wkMax) warn.push(`한 주에 체중의 ${Math.round(wkPct*10)/10}%가 빠지는 속도입니다 (가이드 ${wkMax}%)`);
  if(dayNeed && dayNeed > total - floor)
    warn.push(`이 날짜에 맞추려면 하루 ${dayNeed.toLocaleString()}kcal 를 줄여야 하는데, 최소 섭취 ${floor.toLocaleString()}kcal 를 지키면 ${Math.max(0,total-floor).toLocaleString()}kcal 까지가 한계입니다`);
  if(perKg && perKg < 1.0) warn.push(`단백질이 체중 1kg당 ${perKg}g입니다 — 근육을 지키려면 1.2g 이상을 권합니다`);
  if(day <= 0 && kcal && gw && w > gw) warn.push('지금 설정으로는 살이 빠지지 않습니다 — 섭취를 낮추거나 활동량을 올려 보세요');
  const tough = !!(warn.length && safeDate && daysTo && safeDays > daysTo);
  return { w, gw, fp, bmr, auto, how, k, actC, keep: total, total, kcal, kcalAuto, day, week, month,
    wkKg: week/FAT_KCAL, moKg: month/FAT_KCAL, rc, rp, rf, kk, gg, need, days,
    goal, daysTo, dayNeed, floor, wkMax, dSafe, safeDays, safeDate, hitDays, hitDate, tough,
    bmi, bmiTo, perKg, water, wkPct, warn };
}

function calcBrief(g, ed){
  const r = calcOf(g);
  if(!r.bmr) return '';
  const c = g.calc || {};
  const kg = v => (Math.round(v*100)/100).toFixed(1);
  return `<div class="calc" style="gap:12px">
    <div class="crow" style="border:none;padding:0"><span class="ck" style="font-size:14px;font-weight:700;color:var(--cream)">회원님께 이렇게 설명합니다</span></div>
    <div class="krow"><span class="k">① 하루에 쓰는 양</span><span class="v">${r.total.toLocaleString()} kcal</span></div>
    <div class="krow"><span class="k">② 이만큼 드시면</span>${ed
      ? `<span class="kedit">
          <button class="stp" data-act="kcalstep:-50">−</button>
          <input class="kin" type="text" inputmode="numeric" data-k="pc:kcal" value="${esc(c.kcal||'')}" placeholder="${r.kcal}">
          <button class="stp" data-act="kcalstep:50">＋</button>
          <span class="ku">kcal</span></span>`
      : `<span class="v" style="color:var(--gold)">${r.kcal.toLocaleString()} kcal</span>`}</div>
    <div class="krow"><span class="k">③ 한 달에</span><span class="v" style="color:var(--gold)">${kg(r.moKg)} kg</span></div>
    ${r.goal && r.gw ? `<div class="krow"><span class="k">④ ${esc(r.goal)} 까지</span>
      <span class="v" style="color:${r.hitDate && r.hitDate<=r.goal ? 'var(--gold)' : 'var(--warn)'}">${
        !r.hitDate ? '안 빠짐' : (r.hitDate<=r.goal ? `${r.gw}kg 도착` : `${Math.round((r.w - (r.day*r.daysTo)/FAT_KCAL)*10)/10}kg 쯤`)}</span></div>` : ''}
    ${ed?`<div class="note" style="padding:8px 10px">숫자를 바꾸면 아래가 모두 따라 바뀝니다. 비우면 자동으로 잡습니다.</div>`:''}
    <div class="note">차이 <b>${r.day>0?r.day:0}kcal</b> 는 ${esc(foodTxt(r.day>0?r.day:0))} 입니다.
      하루 그만큼만 덜 드시면 한 달에 ${kg(r.moKg)}kg 이 빠집니다.</div>
  </div>`;
}

function calcHTML(g, ed){
  const r = calcOf(g);
  const c = g.calc || {};
  const kg = v => (Math.round(v*100)/100).toFixed(2);
  const per = r.days ? (r.days>=60 ? `약 ${Math.round(r.days/30)}개월` : `약 ${Math.ceil(r.days/7)}주`) : '—';
  const need = r.bmr ? '' : (!r.w ? '몸무게를 넣어 주세요.'
    : '체지방률, 또는 생년월일과 키를 넣으면 기초대사량을 잡아 드립니다.');
  return `<div class="calc">
    ${need?`<div class="note" style="border-color:var(--warn);color:var(--warn);font-weight:700">${need}</div>`:''}
    <div class="kres">
      <div class="kmain">
        <span class="kl">하루 이만큼 드세요${r.kcalAuto?(r.dayNeed?' · 목표 날짜 기준':''):' · 직접 정함'}</span>
        <span class="kb">${r.kcal?수(r.kcal,1):'—'}<small>kcal</small></span>
        <span class="ks">${r.total && r.day>0
          ? `유지 ${r.total.toLocaleString()} 에서 <b>${r.day}kcal</b> 줄인 값 — ${esc(foodTxt(r.day))}`
          : (r.total ? `유지 칼로리 ${r.total.toLocaleString()}kcal 과 같습니다` : '몸무게와 활동량을 넣어 주세요')}</span>
      </div>
      <div class="ksub">
        <div><span class="n">목표 날짜까지</span>
          <span class="v">${r.daysTo?`${r.daysTo}일`:'—'}</span>
          <span class="u">${r.dayNeed?`하루 ${r.dayNeed.toLocaleString()}kcal 줄이기`:'목표 날짜를 넣어 주세요'}</span></div>
        <div><span class="n">이 속도로 가면</span>
          <span class="v">${r.w&&r.gw?per:'—'}</span>
          <span class="u">${r.w&&r.gw
            ? `${r.w}kg → ${r.gw}kg${r.hitDate?` · ${r.hitDate}`:''}`
            : '목표 몸무게를 넣어 주세요'}</span></div>
      </div>
    </div>

    <span class="lbl plain">계산 근거</span>
    <div class="crow"><span class="ck">기초대사량 <span style="color:var(--gold-2)">${esc(r.how||'')}</span></span>
      <span class="cv">${r.bmr||'—'}<span class="cs"> kcal</span></span></div>
    <div class="crow"><span class="ck">유지 칼로리</span>
      <span class="cv">${r.total||'—'}<span class="cs"> kcal</span></span></div>
    <div class="crow"><span class="ck">주당 감량치</span>
      <span class="cv">${r.week>0?r.week.toLocaleString():0}<span class="cs"> kcal · ${kg(r.wkKg)}kg</span></span></div>
    <div class="crow"><span class="ck">한 달 예상</span>
      <span class="cv g">${r.month>0?Math.round(r.month).toLocaleString():0}<span class="cs"> kcal · ${kg(r.moKg)}kg</span></span></div>
    <div class="mac">
      <div><span class="n">탄수화물 ${r.rc}%</span><span class="v">${r.gg.c}</span><span class="u">g · ${r.kk.c}kcal</span></div>
      <div><span class="n">단백질 ${r.rp}%</span><span class="v">${r.gg.p}</span><span class="u">g · ${r.kk.p}kcal</span></div>
      <div><span class="n">지방 ${r.rf}%</span><span class="v">${r.gg.f}</span><span class="u">g · ${r.kk.f}kcal</span></div>
    </div>
    ${ed?`<div class="fld" style="margin-top:2px"><span class="fn">탄단지 정하는 방식</span>
      <div class="chips">
        <button class="chip ${c.macro!=='kg'?'on':''}" data-act="pc1:macro:pct">비율로 정하기</button>
        <button class="chip ${c.macro==='kg'?'on':''}" data-act="pc1:macro:kg">체중 기준으로</button>
      </div></div>
    ${c.macro==='kg'
      ? `<div class="grid2">
          <div class="fld"><span class="fn">단백질 g/kg</span><input class="search" type="text" inputmode="decimal" data-k="pc:pkg" value="${esc(c.pkg||'')}" placeholder="1.2"></div>
          <div class="fld"><span class="fn">지방 g/kg</span><input class="search" type="text" inputmode="decimal" data-k="pc:fkg" value="${esc(c.fkg||'')}" placeholder="0.9"></div>
        </div>
        <div class="note">단백질과 지방을 <b>몸무게로 먼저</b> 잡고 남은 것을 탄수로 채웁니다. 칼로리를 낮춰도 단백질이 안 깎여서 근육을 지킵니다.</div>`
      : `<div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
          <div class="fld"><span class="fn">탄수 %</span><input class="search" type="text" inputmode="numeric" data-k="pc:rc" value="${esc(c.rc||'')}" placeholder="50"></div>
          <div class="fld"><span class="fn">단백 %</span><input class="search" type="text" inputmode="numeric" data-k="pc:rp" value="${esc(c.rp||'')}" placeholder="25"></div>
          <div class="fld"><span class="fn">지방 %</span><input class="search" type="text" inputmode="numeric" data-k="pc:rf" value="${esc(c.rf||'')}" placeholder="25"></div>
        </div>`}`:''}
    ${r.perKg?`<div class="crow"><span class="ck">단백질 — 체중 1kg당</span>
      <span class="cv">${r.perKg}<span class="cs"> g/kg</span></span></div>`:''}
    ${r.bmi?`<div class="crow"><span class="ck">체질량지수 BMI</span>
      <span class="cv">${r.bmi}${r.bmiTo?`<span class="cs"> → 목표 ${r.bmiTo}</span>`:''}</span></div>`:''}
    ${r.water?`<div class="crow"><span class="ck">하루 물</span>
      <span class="cv">${(r.water/1000).toFixed(1)}<span class="cs"> L</span></span></div>`:''}
    ${r.warn.length?`<div class="note" style="border-color:var(--warn)">
      ${r.warn.map(x=>`<div style="color:var(--warn);font-weight:700">· ${esc(x)}</div>`).join('')}
      ${r.safeDate?`<div style="margin-top:7px">안전 가이드 안에서라면 <b style="color:var(--gold)">${r.safeDate}</b> 쯤이 여유롭습니다
        ${r.daysTo?`(지금 목표는 ${r.daysTo}일, 가이드로는 ${r.safeDays}일)`:''}.</div>`:''}
      <div style="margin-top:5px;opacity:.85">계산상의 숫자일 뿐 실제로 그만큼 빠지지는 않습니다.
        필요하면 <b>그대로 진행하셔도 됩니다.</b></div></div>`:''}

  </div>`;
}

const POSES = ['정면','측면','후면'];

function bphOf(mid, kind, pose){

    .sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
const mdTxt = d => d ? d.slice(5).replace('-','.') : '';

const num0 = v => (v==null || v==='') ? 0 : Number(v);
const dDiff = (a,b) => Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00')) / 86400000);

/* 그 사진 찍은 날에 가장 가까운 몸 상태 */
function logNear(mid, date){
  const ls = (D.blog && D.blog[mid]) || []; if(!ls.length) return null;
  let best = null, bd = 1e9;
  ls.forEach(x => { const d = Math.abs(dDiff(x.date, date)); if(d < bd){ bd = d; best = x; } });
  return bd <= 21 ? best : null;
}

/* ① 3차원 관절 모형 — 체크된 항목을 몸의 제자리(앞뒤까지)에 찍고, 돌려서 봅니다
   좌표 = [좌우, 위아래, 앞뒤]. 앞뒤(z)가 + 면 배 쪽, − 면 등 쪽입니다. */
const BODY_MAP = {
  c2:{y:23, z:3},                    c1:{y:31, z:3},
  c3:{y:27, dx:7,  z:0,  lr:1},      c4:{y:35, zab:[5,-5]},
  s5:{y:38, dx:15, z:7,  lr:1},      s4:{y:41, dx:16, z:6,  lr:1},
  s1:{y:45, dx:16, z:-4, both:1},    s2:{y:48, dx:17, z:2,  lr:1},
  s3:{y:52, dx:18, z:2,  lr:1},      s6:{y:60, dx:20, zab:[5,-5], both:1},
  t3:{y:46, dx:7,  z:-4, lr:1},      t1:{y:55, zab:[-7,-1]},
  t2:{y:62, dx:7,  z:-4, lr:1},      t4:{y:76, zab:[-4,3]},
  l6:{y:92, dx:13, z:-3, lr:1},      l1:{y:96, zab:[7,-7]},
  l2:{y:99, dx:9,  z:2,  both:1},    l7:{y:100,dx:14, z:-5, lr:1},
  l5:{y:108,dx:8,  zab:[6,3], both:1},
  l3:{y:140,dx:11, z:3,  both:1},    l4:{y:150,dx:12, z:2,  both:1},
  f1:{y:184,dx:12, z:0,  both:1},
};
/* 관절 자리 [좌우, 위아래, 앞뒤] */
const J3 = {
  neck:[50,29,0], shL:[34,41,0], shR:[66,41,0], thx:[50,53,-4],
  elL:[26,66,3], elR:[74,66,3], wrL:[22,90,4], wrR:[78,90,4], lum:[50,79,-2],
  hipL:[41,98,0], hipR:[59,98,0], knL:[39,140,2], knR:[61,140,2],
  anL:[38,181,-2], anR:[62,181,-2], toL:[37,190,9], toR:[63,190,9],
};
const BONES3 = [['neck','shL'],['neck','shR'],['shL','elL'],['elL','wrL'],
  ['shR','elR'],['elR','wrR'],['hipL','hipR'],
  ['hipL','knL'],['knL','anL'],['hipR','knR'],['knR','anR'],['anL','toL'],['anR','toR']];
const HEAD3 = [50,14,1];

/* 켜진 항목에 따라 척추 곡선이 실제로 휩니다 */
function spine3(c){
  c = c || {};
  const P = [[30,2],[38,-1],[46,-4],[55,-5],[66,-4],[75,-1],[84,2],[92,0],[98,-1]];
  const neck = (c.c1==='b' || c.c2==='a') ? 4 : (c.c1==='a' || c.c2==='b') ? -2 : 0;  /* 거북목 / 일자목 */
  const thx  = c.t1==='a' ? -4 : c.t1==='b' ? 3 : 0;                                  /* 라운드백 / 플랫백 */
  const lum  = c.l1==='a' ? 4 : c.l1==='b' ? -4 : 0;                                  /* 전방경사 / 후방경사 */
  return P.map(([y,z]) => {
    if(y <= 40) z += neck;
    else if(y <= 66) z += thx;
    else if(y <= 92) z += lum;
    return [50, y, z];
  });
}
function ring3(y, rx, rz, n){
  const a = [];
  for(let i=0;i<n;i++){ const t = i/n*Math.PI*2; a.push([50+Math.cos(t)*rx, y, Math.sin(t)*rz]); }
  a.push(a[0]); return a;
}
/* 항목 하나가 어디에 찍히는지 — [좌우, 위아래, 앞뒤] 목록 */
function dotsOf(t, v){
  const m = BODY_MAP[t.k] || {y:100};
  const dx = m.dx || 0;
  const z = m.zab ? (v==='a' ? m.zab[0] : m.zab[1]) : (m.z || 0);
  if(m.both) return [[50-dx, m.y, z], [50+dx, m.y, z]];
  if(m.lr)   return [[v==='a' ? 50-dx : 50+dx, m.y, z]];
  return [[50, m.y, z]];
}

const FIG_F = 340;
const figRot = (q, a) => { const dx=q[0]-50, dz=q[2], c=Math.cos(a), s2=Math.sin(a);
  return [50 + dx*c + dz*s2, q[1], -dx*s2 + dz*c]; };
const figPrj = q => { const k = FIG_F/(FIG_F - q[2]); return [50+(q[0]-50)*k, 102+(q[1]-102)*k, q[2], k]; };
const figOp  = z => Math.max(0.28, Math.min(1, 0.42 + 0.58*(z+16)/32)).toFixed(2);

function bodyFig(checks){
  return `<div class="figbox" id="fig3d">${figInner(checks)}</div>`;
}
function figInner(checks){
  const c = checks || {}, a = S.figA || 0;
  const P = q => figPrj(figRot(q, a));
  const line = (pts, w, col) => {
    const d = pts.map((q,i)=>{ const p=P(q); return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
    const z = pts.reduce((t,q)=>t+figRot(q,a)[2], 0)/pts.length;
    return `<path d="${d}" fill="none" stroke="${col||'#4e463c'}" stroke-width="${w}"
      stroke-linecap="round" stroke-linejoin="round" opacity="${figOp(z)}"/>`;
  };

  /* 몸통 · 골반 테 — 돌릴 때 두께가 보이게 */
  let g = '';
  [ring3(45,15,10,16), ring3(71,13.5,9,16), ring3(98,11.5,8,16)].forEach(r => g += line(r, 1.4, '#443d35'));
  const ct = ring3(45,15,10,16), cb = ring3(71,13.5,9,16);
  for(let i=0;i<16;i+=4) g += line([ct[i], cb[i]], 1.2, '#443d35');
  g += line(spine3(c), 3.4, '#5a5147');
  BONES3.forEach(b => g += line([J3[b[0]], J3[b[1]]], 6.6));
  g += line([J3.wrL,[19,98,5]], 5, '') + line([J3.wrR,[81,98,5]], 5, '');

  /* 관절 */
  const jt = Object.keys(J3).map(k=>P(J3[k])).sort((x,y)=>x[2]-y[2]);
  let jg = jt.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(4.4*p[3]).toFixed(2)}"
    fill="#746a5c" stroke="#9a8d7d" stroke-width="1" opacity="${figOp(p[2])}"/>`).join('');
  const hp = P(HEAD3);
  jg += `<circle cx="${hp[0].toFixed(1)}" cy="${hp[1].toFixed(1)}" r="${(10.4*hp[3]).toFixed(2)}"
    fill="#332e29" stroke="#6e6459" stroke-width="1.7"/>`;

  /* 켜진 항목 */
  const marks = [];
  BODY_TESTS.forEach(t => { const v = c[t.k]; if(!v) return;
    dotsOf(t, v).forEach(q => marks.push({ p:P(q), k:t.k })); });
  marks.sort((x,y)=>x.p[2]-y.p[2]);
  const mg = marks.map(m => { const p = m.p, on = (S.figSel === m.k);
    return `<g data-act="figk:${m.k}" style="cursor:pointer">
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(9*p[3]).toFixed(2)}" fill="transparent"/>
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${((on?9.6:7.8)*p[3]).toFixed(2)}"
        fill="var(--gold)" opacity="${on?'.3':'.17'}"/>
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${((on?4.6:3.6)*p[3]).toFixed(2)}"
        fill="var(--gold)" stroke="${on?'var(--cream)':'#241d12'}" stroke-width="0.8" opacity="${figOp(p[2])}"/>
    </g>`; }).join('');

  const deg = ((Math.round(a*180/Math.PI) % 360) + 360) % 360;
  const face = deg<45||deg>=315 ? '앞' : deg<135 ? '오른쪽 옆' : deg<225 ? '뒤' : '왼쪽 옆';
  const sel = S.figSel ? BODY_TESTS.find(t=>t.k===S.figSel) : null;

  return `<div class="seg" style="margin-bottom:8px">${
      [['앞',0],['오른쪽 옆',90],['뒤',180],['왼쪽 옆',270]].map(([n,d])=>
      `<button class="${Math.abs(((deg-d)%360+360)%360)<8?'on':''}" data-act="figa:${d}">${n}</button>`).join('')}</div>
    <svg viewBox="0 0 100 205" style="height:330px;width:auto">
      <line x1="50" y1="4" x2="50" y2="202" stroke="#37312b" stroke-width="0.7" stroke-dasharray="2.5 3.5"/>
      ${g}${jg}${mg}
    </svg>
    <div class="figcap">${sel ? `<b>${esc(sel.t)}</b> · ${esc(sel.g)}`
      : `${esc(face)}에서 본 모습 · ${deg}도`}</div>
    <div class="figcap" style="font-weight:600;color:#6f6a64;margin-top:1px">좌우로 끌어서 돌려 보세요</div>`;
}
function drawFig(){
  const el = document.getElementById('fig3d'); if(!el) return;

}

/* 그 점이 가장 잘 보이는 쪽으로 돌립니다 */
function figFace(k){

  const v = checksOf(figMid())[k]; if(!v) return;

/* ② 좌우 저울 */
function lrScale(checks){
  const items = BODY_TESTS.filter(t => t.a==='L' && t.b==='R');
  const l = [], r = [];
  items.forEach(t => { const v=(checks||{})[t.k];
    if(v==='a') l.push(t.t); else if(v==='b') r.push(t.t); });
  const n = l.length + r.length;
  if(!n) return `<div class="empty">좌우를 묻는 항목(${items.length}개)에 표시된 것이 없어요</div>`;
  const lp = Math.round(l.length/n*100);
  const side = l.length === r.length ? '고른 편' : (l.length > r.length ? '왼쪽' : '오른쪽');
  return `<div class="lrbar">
      ${l.length?`<span class="l" style="width:${lp}%">L ${l.length}</span>`:''}
      ${r.length?`<span class="r" style="width:${100-lp}%">R ${r.length}</span>`:''}
    </div>
    <div class="note">좌우를 묻는 ${items.length}개 가운데 <b>${n}개</b>가 표시됐고,
      ${side==='고른 편' ? '<b>양쪽이 고릅니다.</b>' : `<b style="color:var(--gold)">${side}</b>으로 치우쳐 있습니다.`}
      ${l.length?`<br><b>왼쪽</b> ${esc(l.join(' · '))}`:''}
      ${r.length?`<br><b>오른쪽</b> ${esc(r.join(' · '))}`:''}</div>`;
}

/* ⑤ 몸 상태 이력 그래프 — 값이 붙어 있어도 보이게 아래위를 잘라 그립니다 */
function lineChart2(pts, unit, dec){
  const W=320, H=126, PL=12, PR=12, PT=28, PB=20;
  const vs = pts.map(p=>p.v);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  if(mx - mn < 0.0001){ mn -= 1; mx += 1; }
  const pad = (mx-mn)*0.28; mn -= pad; mx += pad;
  const x = i => PL + i*(W-PL-PR)/Math.max(1, pts.length-1);
  const y = v => PT + (1 - (v-mn)/(mx-mn))*(H-PT-PB);
  const d = pts.map((p,i)=> (i?'L':'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = d + ` L ${x(pts.length-1).toFixed(1)} ${H-PB} L ${x(0).toFixed(1)} ${H-PB} Z`;
  const f = v => (dec ? v.toFixed(dec) : String(Math.round(v)));
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:146px">
    <path d="${area}" fill="var(--gold-dim)"/>
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i===pts.length-1?3.6:2.6}"
        fill="${i===pts.length-1?'var(--gold)':'var(--gold-2)'}"/>
      <text x="${x(i).toFixed(1)}" y="${Math.max(11,y(p.v)-8).toFixed(1)}" text-anchor="middle"
        font-size="10" font-weight="700" fill="#c9c2b9">${f(p.v)}</text>
      <text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9.5" font-weight="600"
        fill="#75706a">${esc(p.label)}</text>`).join('')}
  </svg><div class="sm" style="text-align:right;color:#75706a">단위 ${unit}</div>`;
}

/* ③ 체형 회차 */
function roundsOf(mid){ return (D.rounds && D.rounds[mid]) || []; }
function curRound(mid){ const rs = roundsOf(mid); return rs[rs.length-1] || null; }
function checksOf(mid){
  const r = curRound(mid);
  if(r) return r.checks || {};
  return ((D.body && D.body[mid]) || {}).checks || {};
}
function roundPane(mid){

        <b style="color:#8fc4a2">${gone.length}개 풀리고</b> ${came.length?`<b style="color:var(--warn)">${came.length}개 새로 생겼습니다.</b>`:'새로 생긴 것은 없습니다.'}</div>`;

      : `<div class="note">회차가 ${rs.length}번뿐입니다. <b>체형 재검사</b>를 한 번 더 하면
          ${rs.length?'첫 검사와 견줘 무엇이 풀렸는지 보여 드립니다.':'그때부터 회차가 쌓입니다.'}</div>`}

}

/* ④ 사진 위 기준선 */
const MARKS = ['귀','어깨','골반','무릎','복사뼈'];
function markSvg(pts){
  if(!pts || !pts.length) return '';
  const P = pts.map(q => [q.x*75, q.y*100]);
  const d = P.map((q,i)=> (i?'L':'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  return `<svg class="ov" viewBox="0 0 75 100">
    <line x1="${P[0][0].toFixed(1)}" y1="0" x2="${P[0][0].toFixed(1)}" y2="100"
      stroke="#8bbdd2" stroke-width="0.45" stroke-dasharray="2 2" opacity=".85"/>
    ${P.length>1?`<path d="${d}" fill="none" stroke="#e6c487" stroke-width="0.8" stroke-linejoin="round"/>`:''}
    ${P.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="1.5"
      fill="#e6c487" stroke="#241d12" stroke-width="0.4"/>`).join('')}
  </svg>`;
}
function angV(a, b){
  const dx = (b.x-a.x)*75, dy = (b.y-a.y)*100;
  if(!dy) return null;
  return Math.round(Math.abs(Math.atan2(dx, dy)) * 180/Math.PI * 10)/10;
}
function markTxt(pts){
  if(!pts || pts.length < 2) return '';
  const seg = [];
  const put = (i,j,n) => { if(pts[i] && pts[j]){ const a = angV(pts[i], pts[j]); if(a!=null) seg.push(`${n} <b>${a}°</b>`); } };
  put(0,1,'목(귀–어깨)'); put(1,2,'몸통(어깨–골반)'); put(2,4,'다리(골반–복사뼈)');
  return seg.length ? `<div class="note">수직선에서 벗어난 각도 — ${seg.join(' · ')}
    <br>측면 사진에서 <b>귀–어깨가 수직에 가까울수록</b> 목 부담이 적습니다.</div>` : '';
}
function markTap(ev, el){
  const M = S.bpMark; if(!M) return;
  if(M.pts.length >= MARKS.length){ toast('다섯 점을 다 찍었어요'); return; }
  const r = el.getBoundingClientRect();
  M.pts.push({ x: Math.max(0, Math.min(1, (ev.clientX - r.left)/r.width)),
               y: Math.max(0, Math.min(1, (ev.clientY - r.top)/r.height)) });
  drawSheet();
}
function sheetBpMark(id){

  S.bpMark = { id, pts: ((x.marks && x.marks.pts) || []).map(q=>({x:q.x, y:q.y})) };

  });
}

  return `

/* 사진 고르기 → 줄이기 → 올리기 */
function bpAdd(kind){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.style.display='none'; document.body.appendChild(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.remove();
    if(!f) return;
    toast('사진을 다듬는 중이에요');
    try{
      S.bpShot = await shrinkPhoto(f);
      S.bpKind = kind; S.bpNewPose = S.bpPose || '정면'; S.bpNewDate = TODAY;
      sheetBpAdd();
    }catch(e){ console.error(e); toast('사진을 읽지 못했어요'); }
  });
  inp.click();
}

function shrinkPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1400;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, MAX/Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      res(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

function sheetRAdd(){
  const mid = S.tmid || 'm1';
  const me2 = MEMBERS.find(x=>x.id===mid) || {n:''};
  S.rcart = S.rcart || [];
  openSheet(()=>{

document.addEventListener('input', ev=>{

  if(k === 'setkg' || k === 'setreps' || k === 'setspd'){   /* 세트 값 직접 적기 */
    const w=live(); if(!w) return;
    const cur=w.items[w.cur]; if(!cur) return;
    const st=cur.sets[+ev.target.getAttribute('data-i')]; if(!st) return;
    const v=parseFloat((ev.target.value||'').replace(/[^0-9.]/g,''));
    if(!isNaN(v)){
      if(k==='setkg') st.kg=Math.max(0, Math.round(v*10)/10);
      else if(k==='setspd') st.spd=Math.max(0, Math.round(v*10)/10);
      else st.reps=Math.max(1, Math.round(v));
      save(); render();               /* 뒤 화면만 새로 그린다 — 입력칸은 그대로 */
    }
    return;
  }
  if(k === 'exq'){                      /* 운동 이름으로 찾기 */
    S.exq = ev.target.value || '';
    칠하기();
    return;
  }
  if(k && (k.startsWith('pc:') || k==='plnow:w' || k==='plnow:fp' || k==='plto:w' || k==='plto:date')){ calcSync(); }
  if(k === 'pc:birth'){
    const el=document.getElementById('agenow');
    if(el) el.innerHTML = ageTag({ birth: ev.target.value.trim() });
  }
  if(k === 'plto:date'){
    const box=document.getElementById('godate');
    if(box) box.innerHTML = goalLine({ to:{ date: ev.target.value.trim() } });
  }
  const f = ev.target.closest('[data-filter]');
  if(!f) return;
  const q = (f.value||'').trim().toLowerCase();
  document.querySelectorAll('[data-nm]').forEach(el=>{
    el.style.display = (!q || el.getAttribute('data-nm').toLowerCase().includes(q)) ? '' : 'none';
  });
});

let figDrag = null, figMoved = false;

});
document.addEventListener('pointerup', ()=>{ figDrag = null; });
document.addEventListener('pointercancel', ()=>{ figDrag = null; figMoved = false; });

/* 길게 누르기 —
     data-rep  : 누르고 있으면 반복 (무게·횟수 빨리 바꾸기)
     data-hold : 길게 누르면 그 동작 한 번 (종목 순서 바꾸기)          */
(function(){
  let 늦게=null, 반복=null, 눌린=null;
  const 끝 = ()=>{
    clearTimeout(늦게); clearInterval(반복); 늦게=반복=null; 눌린=null;
    if(S.repeating){ S.repeating=false; drawSheet(); render(); }   /* 손 떼면 제대로 다시 그린다 */
  };
  const 눌림 = e=>{
    const el = e.target.closest('[data-rep],[data-hold]'); if(!el) return;
    눌린 = el;
    const h = el.getAttribute('data-hold');
    const a = el.getAttribute('data-act');
    늦게 = setTimeout(()=>{
      if(h){ if(navigator.vibrate) navigator.vibrate(18); 실행(h); return; }
      if(!a) return;
      if(navigator.vibrate) navigator.vibrate(10);
      /* 화면을 다시 그리면 버튼이 바뀌므로, 버튼이 아니라 「동작」을 되풀이한다.
         「시간」으로 몇 칸을 갈지 정한다 — 기기가 느려도 누른 만큼 움직인다.
         처음 1초는 110ms 에 한 칸, 그 뒤로는 55ms 에 한 칸(두 배 빨리).       */
      S.repeating = true;
      const t0 = Date.now();
      let 적용 = 0;
      반복 = setInterval(()=>{
        const 지난 = Date.now() - t0;
        const 목표 = 지난 < 1000 ? Math.floor(지난/110)
                                : 9 + Math.floor((지난-1000)/55);
        let 남은 = Math.min(목표 - 적용, 40);          /* 한 번에 너무 많이 가지 않게 */
        while(남은-- > 0){ 실행(a); 적용++; }
      }, 55);
    }, h0(el));
  };

  const 실행 = a=>{
    const b=document.createElement('button'); b.setAttribute('data-act',a);

})();

    case 'rest': sheetRest(); return;

    case 'partopen': S.pickOpen=!S.pickOpen; render(); setTimeout(칠하기,0); return;
    /* 담은 순서 확인 → 시작 */
    case 'askstart': S.sordIdx=null; sheetStart(); return;

    case 'spdel': { const i=+rest[0]; if(!w) return;

    case 'startgo': { if(!w || !w.items.length) return;

    case 'tm': S.tmid=rest[0]; go('t_member'); return;

      openSheet(()=>`

        <div class="note">고른 루틴을 <b>그대로 베껴</b> 새 루틴으로 만듭니다. 원래 루틴은 그대로 있습니다.</div>
        <button class="btn main" data-act="raddgo">추가하기</button>

    case 'raddgo': {
      const mid = S.tmid || 'm1', cart = (S.rcart||[]).slice();
      closeSheet(); S.rcart = [];
      if(!cart.length) return;
      const g0 = (S.rgrp && S.rgrp!=='전체' && S.rgrp!=='그룹 없음') ? S.rgrp : '';
      let no = myRoutines(mid).length;

      const 안겹치게 = base=>{
        const 있는 = myRoutines(mid).map(r=>(r.n||'').trim());

        D.routines.push({ id, mid, no, n:nm, purpose:src.purpose||'', grp:g0||src.grp||'', items });
        마지막 = id;
        sv(spost('routines',[{ id, member_id:mid, no, name:nm, purpose:src.purpose||'', grp:g0||src.grp||'' }])
          .then(()=> items.length ? spost('routine_items', items.map((it,i)=>({ routine_id:id, sort:i,
            variant_id:VID(it.ex,it.va), kg:it.kg, reps:it.reps, sets:it.sets, rest:it.rest }))) : null), '루틴 추가');

      save();
      if(cart.length===1 && 마지막){        /* 하나만 가져왔으면 바로 이름 짓는 화면으로 */

async function finish(){
  const w=live(), done=w.items.filter(it=>it.sets.some(s=>s.done));
  if(!done.length){
    await sv(sdel('workouts','id=eq.'+w.id), '운동 지우기');
    D.workouts=D.workouts.filter(x=>x.id!==w.id);
    D.live=null; save(); toast('기록할 세트가 없어요');
    if(S.who==='tr'){ S.tmid=w.mid; S.subj=w.mid; go('t_member'); } else go('home');
    return; }
  done.forEach(it=>{ if(!it.locked){ it.locked=true; it.sec=(it.sec||0)+(it.startAt ? (Date.now()-it.startAt)/1000 : 0); } });
  w.items.forEach(it=>{ it.sec = capSec(it.sec, CAP_EX); });
  const dur=capSec(w.startAt ? (Date.now()-w.startAt)/1000
    : w.items.reduce((a,it)=>a+(Number(it.sec)||0), 0), CAP_W);
  for(let i=0;i<w.items.length;i++) await svItem(i);
  await sv(spatch('workouts','id=eq.'+w.id, { done:true, dur, kind:w.kind }), '운동 저장');
  const rec={ id:w.id, mid:w.mid, date:w.date||TODAY, kind:w.kind, rid:w.rid, title:w.title, dur, done:true,
    items: w.items.filter(it=>it.sets.some(s=>s.done)).map(it=>({ _id:it._id, ex:it.ex, va:it.va, locked:true,
      sec:Math.round(it.sec), sets: it.sets.filter(s=>s.done).map(s=>({kg:s.kg, reps:s.reps, spd:s.spd})) })) };
  const i0=D.workouts.findIndex(x=>x.id===w.id);
  if(i0>=0) D.workouts[i0]=rec; else D.workouts.unshift(rec);
  /* 개인운동을 한 번 기록하면 그 회원의 추천은 다 쓴 것으로 본다 */
  if((rec.kind||'') === '개인운동' && recosOf(rec.mid).length){
    const 쓴것 = recosOf(rec.mid);
    D.reco[rec.mid] = [];
    for(const x of 쓴것) await sv(sdel('assignments','member_id=eq.'+rec.mid+'&on_date=eq.'+x.at), '추천 비우기');
  }
  D.live=null; save(); S.wid=rec.id;
  if(S.who==='tr'){ S.tmid=rec.mid; S.subj=rec.mid; }
  go('summary');
}

function hideSplash(){
  const sp=document.getElementById('splash');
  if(!sp) return;
  sp.classList.add('out'); setTimeout(()=>{ if(sp.parentNode) sp.remove(); }, 600);
}

async function start(){
  checkBuild();                     /* 새 판이 올라왔으면 조용히 받아온다 */
  try{
    const t0=Date.now();
    await boot();
    const wait=Math.max(0, 1500-(Date.now()-t0));
    setTimeout(hideSplash, wait);
    render();
  }catch(e){
    S.screen='err'; S.errMsg=String(e && e.message || e);
    hideSplash(); render();
  }
}

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkBuild(); });

/* 서버에서 바뀐 것 따라오기 */
const isTyping = () => { const a=document.activeElement; return a && (a.tagName==='TEXTAREA'||a.tagName==='INPUT'); };
let pollSig='';
setInterval(async ()=>{
  if(document.hidden || S.screen==='boot' || S.screen==='err' || !MEMBERS.length) return;
  try{
    const [cms, wks, mls] = await Promise.all([
      sget('comments?select=*&order=created_at.desc&limit=300'),
      sget('workouts?select=*&order=on_date.desc&limit=80'),
      sget('meals?select=*&order=created_at.desc&limit=300')
    ]);
    const oldM = {}; (D.meals||[]).forEach(x=>{ oldM[x.id]=x.items||[]; });
    D.meals = (mls||[]).map(m => ({ id:m.id, mid:m.member_id, date:m.on_date, slot:m.slot,
      seq:m.seq||0, at:m.at||'', path:m.path, memo:m.memo||'', note:m.trainer_note||'',
      kcal:m.kcal||0, carb:m.carb||0, protein:m.protein||0, fat:m.fat||0, items: oldM[m.id]||[] }));
    const sig = cms.map(c=>c.id+(c.read_at?'1':'0')).join(',') + '|' +
                wks.map(w=>w.id+(w.done?'1':'0')+w.dur).join(',') + '|' +
                (mls||[]).map(m=>m.id+(m.trainer_note?'1':'0')).join(',');
    if(sig===pollSig) return;
    const first = !pollSig;
    pollSig=sig;
    D.cm = mapCm(cms);
    const ids = wks.map(w=>'"'+w.id+'"').join(',');
    let witems=[], wsets=[];
    if(ids){
      witems = await sget('workout_items?select=*&workout_id=in.('+ids+')&order=sort');
      const iids = witems.map(i=>i.id).join(',');
      if(iids) wsets = await sget('workout_sets?select=*&item_id=in.('+iids+')&order=sort');
    }
    if(wks.length && !witems.length){
      console.error('poll: 종목이 0건 — 덮어쓰지 않습니다');   /* 있던 기록을 지우느니 그대로 둔다 */
      pollSig = '';
      return;
    }
    D.workouts = mapWorkouts(wks, witems, wsets);
    if(D.live){
      const mine = D.workouts.find(w=>w.id===D.live.id);
      if(!mine){ D.live=null; save(); }
    }
    if(!first && !isTyping()){ try{ render(); if(sheetRender) drawSheet(); }catch(e){ console.error('그리기', e); } }
  }catch(e){ console.error('poll', e); }
}, 4000);

render();
start();
</script>
</body>
</html>
