      운동만 담고 세트는 안 찍은 시간은 「아직 하는 중」이지만 「운동한 시간」은 아니기 때문이다. */

  if(마지막 && Date.now() - 마지막 >= 놀린한계) return '3시간 동안 손대지 않아';

/* 마지막으로 세트를 체크한 시각 — 세트를 완료할 때 s.at 에 찍어 둔다.
   (2026-09-17 대표: 「마지막으로 반복수체크한 시간까지를 운동 종료시간으로」) */

const PARTG = { '상체':['가슴','어깨','등','팔'], '하체':['하체'], '복근':['복근'], '유산소':['유산소'], '기타':['기타'] };

const ANA_P = { '1주':7, '1달':30, '3달':90, '전체':3650 };
/* 부위 색은 「그 기간의 주당 평균 세트」로 잰다 — 최근 한 주가 아니라 평균이다.
   1달을 고르면 한 달치를 4.3주로 나눈다. 「전체」는 첫 기록부터 오늘까지 실제 주 수로.  */
const ANA_W = { '1주':1, '1달':30/7, '3달':90/7 };
function anaWeeks(mid, per){
  if(ANA_W[per]) return ANA_W[per];
  const ds = D.workouts.filter(w => w.mid===mid && w.done && w.items.some(i=>i.sets.length))
    .map(w => w.date).sort();
  if(!ds.length) return 1;
  const 날 = (new Date(TODAY+'T00:00:00') - new Date(ds[0]+'T00:00:00')) / 86400000;
  return Math.max(1, (날 + 1) / 7);
}

function anaFrom(){ return addDays(TODAY, -(ANA_P[S.anaP||'1주'] - 1)); }
function anaWs(mid, from){ return D.workouts.filter(w => w.mid===mid && w.done && w.date >= from)
  .slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }

/* 그날 든 총 무게 · 세트 · 분 · 소모 추정 */
function wStat(w, bw){
  let vol = 0, sets = 0, cardioMin = 0;
  w.items.forEach(it => { const e = exOf(it.ex); if(!e || isMemo(it.ex)) return;
    it.sets.forEach(x => { sets++;
      if(e.cardio) cardioMin += (+x.reps || 0);
      else vol += (+x.kg || 0) * (+x.reps || 0); }); });
  const min = Math.round((Number(w.dur)||0)/60);
  const wt = Math.max(0, min - cardioMin);
  const kcal = Math.round((5.0*wt + 7.0*cardioMin) * 3.5 * (bw||65) / 200);
  return { vol:Math.round(vol), sets, min, kcal };
}
function bwOf(mid){ const g = GOALS[mid]||{}; return nnum(g.now && g.now.w) || 65; }

/* 기간을 7칸으로 나눈 꺾은선 */
function anaSeries(mid, metric, 앞으로){
  const days = ANA_P[S.anaP||'1주'], bw = bwOf(mid), 밀기 = 앞으로 || 0;      /* 밀기 = 며칠 앞 기간을 볼지 (바로 앞 기간 비교용) */
  let from = anaFrom();
  if(days > 365){ const all = D.workouts.filter(w=>w.mid===mid && w.done);
    from = all.length ? all.map(w=>w.date).sort()[0] : TODAY; }
  const total = Math.max(1, Math.round((dNew(TODAY) - dNew(from)) / 86400000) + 1);
  const n = Math.min(7, total), span = Math.ceil(total / n);
  const out = [];
  for(let i = n-1; i >= 0; i--){
    const end = addDays(TODAY, -i*span - 밀기), st = addDays(end, -(span-1));
    const ws = D.workouts.filter(w => w.mid===mid && w.done && w.date >= st && w.date <= end);
    let v = 0;
    ws.forEach(w => { const t = wStat(w, bw);
      v += metric==='n' ? 1 : metric==='vol' ? t.vol : metric==='kcal' ? t.kcal : t.min; });
    out.push({ label: span===1 ? DOW[dNew(end).getDay()] : (+end.slice(5,7))+'/'+(+end.slice(8)), v });
  }

}

/* ── 2.5D 해부 모델 그리기 ── (2026-10-01)

const 몸3저장 = {};                                   /* '남/앞' → {몸:Image, 부위:ImageData} */

  /* 그림 파일 이름은 같고 내용만 바뀐다 — BUILD 를 붙여 옛 그림이 캐시에 남지 않게 (2026-10-01 모델 교체) */

async function 몸3그리기(id){

     그래서 상자를 그리기 직전에 다시 찾고, 아직 없으면 잠깐 기다렸다 다시 본다 (2026-10-01 실측). */

function radar(o){

  const spokes = PARTS8.map((_,i)=>{ const [x,y]=pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a2926" stroke-width="1"/>`; }).join('');
  const poly = PARTS8.map((k,i)=> pt(i, R * (o[k]/mx)).map(v=>v.toFixed(1)).join(',')).join(' ');

  return `<svg viewBox="0 0 220 200" style="height:210px">${web}${spokes}

    ${PARTS8.map((k,i)=>{ const [x,y]=pt(i, R*(o[k]/mx));
      return o[k] ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--gold)"/>` : ''; }).join('')}
    ${labels}</svg>`;
}

/* 종목별 무게 변화 */
function exTrend(mid, from, grp){
  const map = {};
  anaWs(mid, '1900-01-01').forEach(w => w.items.forEach(it => {   /* 기간 밖 기록도 견줄 밑값으로 쓴다 */
    if(!it.sets.length || isMemo(it.ex)) return;
    const e = exOf(it.ex); if(!e) return;
    if(grp !== '전체' && !(PARTG[grp]||[]).includes(e.p)) return;
    const key = it.ex + ':' + it.va;
    const best = e.cardio ? Math.max(...it.sets.map(x=>+x.reps||0)) : Math.max(...it.sets.map(x=>+x.kg||0));
    (map[key] = map[key] || { ex:it.ex, va:it.va, cardio:e.cardio, all:[] }).all.push({ d:w.date, v:best });
  }));
  return Object.values(map).map(m => {
    const inP = m.all.filter(x => x.d >= from);
    if(!inP.length) return null;                       /* 이 기간엔 안 한 종목 */
    const before = m.all.filter(x => x.d < from);
    const base = inP.length > 1 ? inP[0] : (before.length ? before[before.length-1] : null);
    const l = inP[inP.length-1].v;
    return { ex:m.ex, va:m.va, cardio:m.cardio, n:inP.length, last:l,
      first: base ? base.v : l, diff: base ? Math.round((l - base.v)*10)/10 : null,
      prev: !!(base && inP.length === 1), since: base ? base.d : '' };
  }).filter(Boolean).sort((a,b) => b.n - a.n || b.last - a.last);
}

const 내목표 = mid => ((GOALS[mid]||{}).my) || [];
async function 목표뱃지저장(mid){
  const g = GOALS[mid] || (GOALS[mid] = {});
  let 서버 = null;
  try{ 서버 = ((await sget('plans?select=data&member_id=eq.'+encodeURIComponent(mid)))[0]||{}).data || null; }catch(e){}

  GOALS[mid] = 합;

}
const 내뱃지 = mid => ((GOALS[mid]||{}).badges) || [];
function 이달날들(){ const out=[], m=TODAY.slice(0,8); for(let d=1; d<=+TODAY.slice(8); d++) out.push(m+String(d).padStart(2,'0')); return out; }
function 목표재기(mid, g){
  const T = 목표종류[g.t]; if(!T) return null;
  const 달 = TODAY.slice(0,7), m = +달.slice(5);
  const 한날 = ws => new Set(ws.filter(w => 세트있나(w) && w.kind!=='수업').map(w=>w.date)).size;   /* 개인운동만 */
  const kcal날 = 이달날들().map(d => mealDayStat(mid, d)).filter(x => x.n && x.kcal > 0);
  let 지금 = 0, 기간 = 달, 이름 = T.이름, 뱃지 = '';
  if(g.t==='월운동'){ 지금 = 한날(workoutsOf(mid).filter(w=>w.date.slice(0,7)===달)); 뱃지 = `${m}월 개인운동 ${g.n}회`; }
  else if(g.t==='주운동'){ const wk = weekOf(TODAY); 기간 = wk[0];
    지금 = 한날(workoutsOf(mid).filter(w=>w.date>=wk[0] && w.date<=wk[6])); 뱃지 = `${+wk[0].slice(5,7)}/${+wk[0].slice(8)} 주 개인운동 ${g.n}회`; }
  else if(g.t==='식단기록'){ 지금 = 이달날들().filter(d => mealDayStat(mid, d).n).length; 뱃지 = `${m}월 식단 기록 ${g.n}일`; }
  else if(g.t==='칼로리이하'){ 지금 = kcal날.filter(x => x.kcal <= g.kcal).length; 이름 = `${(+g.kcal).toLocaleString()}kcal 이하로 먹은 날`; 뱃지 = `${m}월 ${(+g.kcal).toLocaleString()}kcal 이하 ${g.n}일`; }
  else if(g.t==='칼로리이상'){ 지금 = kcal날.filter(x => x.kcal >= g.kcal).length; 이름 = `${(+g.kcal).toLocaleString()}kcal 이상 먹은 날`; 뱃지 = `${m}월 ${(+g.kcal).toLocaleString()}kcal 이상 ${g.n}일`; }
  else if(g.t==='볼륨'){ 지금 = Math.round(workoutsOf(mid).filter(w=>w.date.slice(0,7)===달).reduce((a,w)=>a+totalKg(w),0)/100)/10; 뱃지 = `${m}월 볼륨 ${g.n}톤`; }
  else if(g.t==='종목무게'){ 기간 = 'all';
    workoutsOf(mid).filter(w => w.date >= (g.since||'')).forEach(w => w.items.forEach(it => {
      if(it.ex===g.ex && it.va===g.va) it.sets.forEach(x => { 지금 = Math.max(지금, +x.kg||0); }); }));
    이름 = `${exName(g.ex, g.va)} 무게`; 뱃지 = `${exName(g.ex, g.va)} ${kgfmt(g.n)}kg`; }
  const n = +g.n || 1;
  return { 이름, 지금, n, 단위:T.단위, p: Math.min(1, 지금 / n), 키: g.id + '|' + 기간, 뱃지 };
}

/* 체중 · 체지방률 · 근육량 목표 — 운동계획(now · to)과 **같은 값**이다. 「내 목표」 맨 위 줄로 보이고 회원도 고친다 (2026-10-08 대표) */
function 몸목표들(mid){
  const g = GOALS[mid]||{}, now = g.now||{}, to = g.to||{}, 있다 = v => v!=null && v!=='' && +v > 0;
  return ['w','fp','m'].filter(u => 있다(to[u]) && 있다(now[u])).map(k => {
    const logs = ((D.blog||{})[mid]||[]).filter(x => +x[k]), first = logs[0], last = logs[logs.length-1];

function 직전요약(e, cur, mid){
  const runs = lastRuns(cur.ex, cur.va, mid, 3);
  if(!runs.length) return { v:'처음', 방향:'' };
  const top = r => e.cardio ? Math.max(...r.sets.map(x=>+x.reps||0))
                            : Math.max(...r.sets.map(x=>+x.kg||0));
  const 최근 = top(runs[0]), 이전 = runs.length > 1 ? top(runs[1]) : null;
  return { v: kgfmt(최근) + (e.cardio ? '분' : 'kg'),
           방향: 이전==null ? '' : (최근>이전 ? 'up' : (최근<이전 ? 'down' : '')) };
}

/* 직전 무게 상자 — 종목 카드 안에 한 줄로 붙는다 */
function prevBox(e, cur, mid, 늘펼침){
  if(isMemo(cur.ex)) return '';
  const runs = lastRuns(cur.ex, cur.va, mid, 3);
  const 단위 = e.cardio ? '분' : 'kg';
  if(!runs.length) return `<div class="prevb flat"><div class="prevh">
    <span class="pk">직전기록</span>
    <span class="pv" style="font-weight:600">처음 하는 종목이에요</span></div></div>`;

  const top = r => e.cardio ? Math.max(...r.sets.map(x=>+x.reps||0))
                            : Math.max(...r.sets.map(x=>+x.kg||0));
  const 값 = runs.map(top).reverse();                    /* 오래된 → 최근 */
  const 최근 = 값[값.length-1], 이전 = 값.length>1 ? 값[값.length-2] : null;
  const 방향 = 이전==null ? '' : (최근>이전 ? 'up' : (최근<이전 ? 'down' : ''));
  const 화살 = 방향==='up' ? '↑' : (방향==='down' ? '↓' : '');

  /* 지금 열려 있는 세트에 맞춰진 값과 견준다 */
  const oi = cur.sets.findIndex(x=>!x.done);
  const 지금 = oi>=0 ? (e.cardio ? +cur.sets[oi].reps : +cur.sets[oi].kg) : null;
  const 다름 = (지금!=null && 최근!=null && 지금!==최근);

  const 줄안 = `<span class="pk">직전기록</span>
    <span class="pv">${값.map((x,i)=> i===값.length-1
        ? `<b>${kgfmt(x)}${단위}</b>` : kgfmt(x)).join('<i>→</i>')}</span>
    ${화살?`<span class="ar ${방향}">${화살}</span>`:''}
    ${다름?`<span class="cv">지금 ${kgfmt(지금)}${단위}</span>`:''}`;
  const 줄 = 늘펼침 ? `<div class="prevh">${줄안}</div>`
    : `<button class="prevh" data-act="prevopen">${줄안}${접개(S.prevOpen)}</button>`;

  if(!S.prevOpen && !늘펼침) return `<div class="prevb">${줄}</div>`;

  const 안 = runs.map(function(r){
    const t = top(r);
    const 세트 = r.sets.map(x=> e.cardio
      ? `${x.reps}분${x.spd?`·${x.spd}`:''}`
      : `${kgfmt(x.kg)}×${x.reps}`).join(' · ');
    const rp = r.sets.find(x=> (e.cardio ? +x.reps : +x.kg) === t) || r.sets[0];
    return `<div class="prevr">
      <span class="rd">${mdTxt(r.date)}<br>${esc(r.kind)}</span>
      <span class="rs">${세트}</span>
      ${oi>=0?`<button class="rb" data-act="usekg:${e.cardio?0:kgfmt(t)}:${rp.reps||0}">이 무게로</button>`:''}
    </div>`; }).join('');
  return `<div class="prevb">${줄}${안}</div>`;
}

/* 주마다 다른 조합 — 같은 주에는 늘 같게, 주가 바뀌면 바뀐다 */
function 이번주(){
  return Math.floor((new Date(TODAY+'T00:00:00') - new Date('2026-01-05T00:00:00')) / 604800000);
}
/* 무리에서 하나씩 돌아가며 뽑는다 — 어느 주에도 핵심 부위가 빠지지 않게 */
function 뽑기(무리들, n, 자리){
  const w = 이번주() + (자리||0), out = [];
  let 회 = 0;
  while(out.length < n && 회 < n*4){
    const g = 무리들[회 % 무리들.length];
    const c = g[(w + Math.floor(회 / 무리들.length)) % g.length];
    if(out.indexOf(c) < 0) out.push(c);
    회++;
  }
  return out;
}
function prepList(setKey, kind){
  const st = PREPSET.find(x=>x.k===setKey) || PREPSET[0];
  if(kind==='s') return 뽑기(st.s, 4, 0).map(i=>사전[i]);
  if(kind==='m') return 뽑기(st.m, 4, 0).map(i=>사전[i]);
  return 뽑기(st.m, 2, 0).map(i=>사전[i])
    .concat(뽑기(st.s, 3, 1).map(i=>사전[i]));   /* 풀고 → 늘이기 */
}

/* ── ★ 운동 중 ── */
/* 트레이너가 기록하는 운동인가 — 그러면 시계는 「시간 재기 ▶」를 눌러야만 켜진다 */
const 시계는손으로 = w => !!w && (w.kind === '수업' || w.by === '트레이너' || S.who === 'tr');
async function newLive(title, items, kind, rid, mid, by){
  const id='w'+Date.now();
  mid = mid || S.mid;
  const kd = kind || '개인운동';
  const t0 = 시계는손으로({ kind:kd, by }) ? null : Date.now();   /* 수업·트레이너 기록은 시계를 자동으로 켜지 않는다 */
  D.live={ id, mid, title, kind:kd, rid:rid||null, date:TODAY, startAt:t0, born:Date.now(), items, cur:0,
           by:by||'회원', begun: items.length>0 };   /* 담기만 한 상태면 아직 시작 전 */
  if(!t0) items.forEach(it=>{ it.startAt = null; });
  save(); go(items.length ? 'workout' : 'pick');
  await sv(spost('workouts',[{ id, member_id:mid, on_date:TODAY, kind:D.live.kind,
    routine_id:rid||null, title, dur:0, done:false }]), '운동 시작');
  for(let i=0;i<items.length;i++) await svNewItem(i);
  D.workouts.unshift({ id, mid, date:TODAY, kind:D.live.kind, rid:rid||null, title, dur:0, done:false,
    items: items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, sec:0, locked:false, sets:[] })) });
  save(); render();
}
/* 다른 기기에서 시작한 운동을 이 기기에서 이어받는다 */
function adoptLive(mid){
  if(D.live && D.live.mid===mid) return true;
  const w = D.workouts.find(x=>!x.done && x.mid===mid && x.date===TODAY);
  if(!w || !w.items || !w.items.length) return false;
  const i = w.items.findIndex(it=>!it.locked);
  const 꺼둠 = 시계는손으로(w) && !Number(w.dur);           /* 시계 없이 하던 수업은 이어받아도 꺼 둔다 */
  D.live = { id:w.id, mid:w.mid, title:w.title||'운동', kind:w.kind, rid:w.rid, date:w.date,
    startAt: 꺼둠 ? null : Date.now() - (Number(w.dur)||0)*1000, cur: i>=0?i:w.items.length-1,
    items: w.items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, rest:60, locked:it.locked,
      sec:it.sec, startAt: 꺼둠 ? null : Date.now(), sets:(it.sets||[]).map(x=>({kg:x.kg,reps:x.reps,spd:x.spd,done:true})) })) };
  if(!D.live.items.length) { D.live=null; return false; }
  if(D.live.items.every(it=>it.locked)) D.live.cur = D.live.items.length-1;
  save(); return true;
}
async function svNewItem(i){
  const w=D.live; if(!w) return; const it=w.items[i]; if(!it || it._id) return;
  const back = await sv(spost('workout_items',
    [{ workout_id:w.id, sort:i, variant_id:VID(it.ex,it.va), sec:0, locked:false }], {ret:true}), '종목 추가');
  if(back && back[0]) it._id = back[0].id;
  save();
}
async function svItem(i){
  const w=D.live; if(!w) return; const it=w.items[i]; if(!it) return;
  if(!it._id) await svNewItem(i);
  if(!it._id) return;
  await sv(spatch('workout_items','id=eq.'+it._id,
    { sec:Math.round(it.sec||0), locked:!!it.locked, sort:i }), '종목 저장');
  await sv(sdel('workout_sets','item_id=eq.'+it._id), '세트 정리');
  const rows = it.sets.filter(x=>x.done).map((x,k)=>Object.assign({ item_id:it._id, sort:k,
    kg:x.kg, reps:x.reps, spd: x.spd==null ? null : x.spd, done:true }, 유산소칸있나 && x.dist != null ? { dist:x.dist } : {}, 유산소칸있나 && x.feel ? { feel:x.feel, src:x.src||'직접' } : {}));
  if(rows.length) await sv(spost('workout_sets', rows), '세트 저장');
  const sw = D.workouts.find(x=>x.id===w.id);
  if(sw){ const si = sw.items.find(x=>x._id===it._id);
    if(si){ si.sec=Math.round(it.sec||0); si.locked=!!it.locked;
      si.sets = it.sets.filter(x=>x.done).map(x=>({kg:x.kg,reps:x.reps,spd:x.spd,dist:x.dist,feel:x.feel,done:true})); } }
  save();
}
/* 지난 기록으로 시작 — 종목·순서는 그대로, 세트는 그날 마지막 세트의 무게·횟수를 첫 세트 목표로 (2026-10-02 대표
   「정해진 루틴 선택 외에도 지난 수업기록에서 바로 선택할 수 있게 · 최근 5~8개 · 수업이든 개인운동이든」) */
function itemsFromWorkout(w){
  return (w.items||[]).filter(it=>it.sets && it.sets.length).map(it=>{ const 끝=it.sets[it.sets.length-1];
    return { ex:it.ex, va:it.va, rest:60, locked:false, sec:0, startAt:Date.now(),
      sets:[{kg:끝.kg||0, reps:끝.reps||0, spd:exOf(it.ex).cardio?(끝.spd||6.5):undefined, done:false}] }; });
}
function itemsFromRoutine(r){
  return r.items.map(it=>({ ex:it.ex, va:it.va, rest:it.rest||60, locked:false, sec:0, startAt:Date.now(),
    sets:[{kg:it.kg, reps:it.reps, spd:exOf(it.ex).cardio?6.5:undefined, done:false}] }));
}

/* ── 운동 중 고정바 ── 담기 · 끝내기 · 자물쇠. 화면 어디에 있어도 자리가 같다 */
function 발판(w){

/* ── 휴식 타이머 ── 오른쪽 위, 운동 시간 바로 옆 (2026-09-04 대표 지시).
   세트 사이에 계속 누르는 것이라 늘 같은 자리에 붙어 있어야 한다.       */
function 쉼칩(w){
  const 도는중 = !!(S.rest && S.rest.until);
  const 기본 = (w && w.items && w.items[w.cur] && w.items[w.cur].rest) || 60;
  const 남음 = 도는중 ? Math.max(0,(S.rest.until-Date.now())/1000) : 기본;
  return `<button class="restt ${도는중?'run':''}" data-act="rest" aria-label="휴식 타이머">

      <circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.4 1.6"/><path d="M9 2h6"/><path d="M12 2v3"/></svg>
    <i id="restleft">${도는중?mmss(남음):남음+'초'}</i></button>`;
}
/* 오른쪽 위 — 운동 시간과 휴식 타이머를 한 덩어리로 */
function 윗시계(w){
  /* 1RM 측정 모드 — 운동시간과 쉬는시간이 같이 돌면 뭘 봐야 할지 헷갈린다(2026-10-05 대표). 쉬는 시간만 */
  if(w.title === '1RM 측정') return `<span class="tmwrap">${쉼칩(w)}</span>`;
  return `<span class="tmwrap">
    ${w.startAt ? `<span class="tm" id="tm">${mmss((Date.now()-w.startAt)/1000)}</span>`
                : `<button class="chip t" data-act="timego">시간 재기 ▶</button>`}</span>`;   /* 쉬는 시간 칩은 뺐다 — 종목 카드 안 스위치와 겹친다 (2026-10-08 대표). 1RM 측정 모드에만 남는다 */
}

function vWorkout(){
  const w=live(); if(!w) return (S.who==='tr' ? tToday() : vHome());
  if(!w.items.length) return {
    top: bar('운동 중', 윗시계(w), 'go:home'),
    body:`<div class="empty">종목을 추가해 주세요</div>
      <button class="dngr" data-act="askcancel">기록 삭제하고 나가기</button>`,
    foot: 발판(w) };
  const cur=w.items[w.cur]||w.items[0], e=exOf(cur.ex), v=varOf(cur.ex,cur.va);

  const 보일칸 = openIdx >= 0 ? openIdx : cur.sets.length - 1;
  const cms=cmOf(wmid,cur.ex,cur.va), nw=cms.filter(c=>!c.read).length, dsc=descOf(wmid,cur.ex,cur.va);

  /* 지금 하는 종목의 「펼쳐진 카드」 — 목록에서 그 종목 바로 아래에 붙는다 */

  /* 이름은 바로 위 목록 줄에 이미 있다 — 여기서 또 쓰면 두 번 나온다 */

        ${cur.rmPlan.map((p,i)=>`<div class="rmrow ${i<n?'ok':(i===n?'now':'')}"><b>${i<n?'✓':i+1}</b><span>${p.단계}<small>${Math.round(p.pct*100)}%</small></span><em>${kg표(p.kg)}kg × ${p.reps}회</em><i>쉬기 ${p.쉼}</i></div>`).join('')}
        ${n < cur.rmPlan.length ? `<div class="rmhint">세트를 끝내면 그 단계 쉬는 시간이 자동으로 돌아갑니다</div>`
          : (cur.rmDone ? `<div class="rmhint"><b style="color:var(--gold)">✓ 1RM 실측 ${kg표(cur.rmDone)}kg 남겼어요</b></div>`
          : `<div class="rmhint">본 시도 끝 — 방금 무게를 성공했으면 남기고, 더 들 수 있으면 올려서 한 번 더</div>
             <div style="display:flex;gap:7px"><button class="btn main sm" style="flex:1" data-act="rmok">성공 — 실측으로 남기기</button>
               <button class="btn sub sm" style="flex:1" data-act="rmmore">＋${RM종목[cur.ex]==='상체'?'2.5':'5'}% 한 번 더</button></div>`)}</div>`; })() : ''}
    ${세칸(e, v, cur, wmid, tr, cms, nw, dsc)}
    ${isMemo(cur.ex) ? (cur.locked ? '' : `<button class="btn main fin" data-act="fin">${esc(e.n)} 완료</button>`) : e.cardio ? 유산소판(cur, e, wmid) : 세트표(cur, e, wmid)}
  </div>`;

  return {
    top: bar('운동 중', 윗시계(w), 'askleave'),
    keepScroll:true, body:`
    ${/* 2026-10-06 융합 — 위쪽 안내는 한 줄씩. 주기 권장 글은 수업 시작 창·회원 화면에서 이미 봤다(눌러도 나온다) */''}
    ${tr ? 주기줄(wmid, 'tsub:cycle:'+wmid, true) : ''}
    ${tr?`<button class="hline" data-act="tlive:${wmid}">${svg('h_chat',18)}<b>${esc((MEMBERS.find(m=>m.id===wmid)||{}).n||'')} 회원 수업 기록 중</b>
      <small>종목별 피드백 남기기</small><i>›</i></button>`:''}
    <span class="lbl">오늘 한 운동${S.moveIdx!=null?' — <b style="color:var(--teal)">순서 변경 중</b>':''}</span>
    ${w.items.map((it,i)=>{
      const on = (i===w.cur), mv = (S.moveIdx===i);
      return `<div class="card rowc ${it.locked&&!on?'dim':''} ${on?'now2':''} ${S.just===VID(it.ex,it.va)?'just':''}"
        style="padding:9px 9px 9px 13px" data-hold="ord:${i}">
      ${on ? `<span class="wkic">${svg('h_dumb',18)}</span>` : ''}
      <button data-act="jump:${i}" style="flex:1;min-width:0;text-align:left">
        <div class="nm" style="font-size:14px">${esc(exName(it.ex,it.va))}${isMemo(it.ex)?' <span class="pill q">메모</span>':''}</div>
        <div class="sm">${it.locked?`${mmss(it.sec)} · ${isMemo(it.ex)?'메모':it.sets.length+'세트'}`
          :(on?(S.fold?접개(0):'하는 중 '+접개(1))

           <button class="chip t" data-act="ordend" style="flex:none;padding:6px 10px">여기에 놓기</button>`
        : `${on&&!it.locked?'<span class="pill t">운동중</span>':(it.locked?'<span class="pill q">완료</span>':'')}

      </div>${(on && !S.fold) ? 펼침() : ''}`;
    }).join('')}
    ${/* 담고 끝내는 건 아래 고정바로 갔다. 여기엔 되돌릴 수 없는 것만 작게 남긴다 */''}
    <button class="dngr" data-act="askcancel">기록 삭제하고 나가기</button>`,

/* ── 설명 + 피드백 ── */
/* ══ 피드백 회차 넘겨보기 ══ 2026-09-29 대표
   한 번에 하나만 보인다. 좌우 화살표로 넘기고, **가운데를 누르면 회차 목록**이 펼쳐진다.
   회차 번호는 **오래된 것부터 1번** — 회원이 「몇 번째에 뭐라고 하셨더라」로 찾는다.
   ⛔ 피드백이 하나면 화살표도 목록도 안 만든다. */
function 피드백회차(cms, K, tr){
  if(!cms.length) return '<div class="empty">아직 피드백이 없어요</div>';
  /* ⭐ 차례는 **하나로만 센다** — 오래된 것이 1회차. 화살표·목록·번호가 다 이 차례를 쓴다.
     (2026-09-29: 목록은 배열 차례, 번호는 시각으로 매겨 「6·5·4·2·3회차」로 섞였다) */
  const 줄 = cms.slice().sort((a,b) => String(a.ts||'') > String(b.ts||'') ? -1 : 1);      /* 최근이 0번 */
  const n = 줄.length;
  S.cmIdx = S.cmIdx || {};
  let i = S.cmIdx[K];
  if(i == null) i = 0;                           /* 열면 **제일 최근 회차** */
  i = Math.max(0, Math.min(n - 1, i));
  /* ⚠ 고른 자리를 **되담아 둔다.** 안 담으면 화살표가 `(undefined||0)±1` 로 계산돼
     6회차에서 ‹ 를 눌렀는데 1회차로 튄다 (2026-09-29 브라우저에서 잡음). */
  S.cmIdx[K] = i;
  const c = 줄[i];
  const 날 = String(c.ts||'').slice(0,10);
  const 해글 = 날 ? 날.slice(2,4) + '년' : '';
  const 이름 = (날 ? dateTxt(날) : (c.at||'')) + ' · ' + (n-i) + '회차';

  /* 목록은 **달로 묶는다** — 피드백이 30개든 100개든 목록은 달 수만큼만 늘어난다.
     기본으로 지금 보고 있는 회차의 달이 열린다. */
  const 해of = x => String(x.ts||'').slice(0,4);
  const 달of = x => String(x.ts||'').slice(0,7);
  const 해들 = [...new Set(줄.map(해of).filter(Boolean))].sort().reverse();
  S.cmYr = S.cmYr || {}; S.cmMon = S.cmMon || {};
  /* 해가 하나뿐이면 해 칩은 안 만든다 — 대부분의 회원이 여기다 */
  const 지금해 = (해들.length > 1 ? (S.cmYr[K] || 해of(c)) : 해of(c)) || (해들[0] || '');
  const 달들 = [...new Set(줄.filter(x => 해of(x) === 지금해).map(달of))].sort().reverse();
  const 달이름 = m => m ? (+m.slice(5,7)) + '월' : '날짜 없음';
  let 지금달 = S.cmMon[K];
  if(!지금달 || 지금달.slice(0,4) !== 지금해) 지금달 = (해of(c) === 지금해 ? 달of(c) : (달들[0] || ''));
  const 보일것 = 줄.map((x, j) => ({x, j})).filter(({x}) => 달of(x) === 지금달);            /* 줄이 이미 최근 순 */

  /* 여는 것은 **한 번에 하나** — 연도만, 또는 달+회차만. 폰에서 둘 다 열면 화면을 다 먹는다 */
  const 연것 = S.cmOpen;
  const 고르기 = (연것 === K + '|yr')
    ? `<div class="cmlist"><div class="mons yrs">` + 해들.map(y =>
        `<button class="${y===지금해?'on':''}" data-act="cmyr:${esc(K)}:${esc(y)}">
           ${esc(y.slice(2)) + '년'} <b>${줄.filter(x=>해of(x)===y).length}</b></button>`).join('')
      + `</div></div>`
    : (연것 === K + '|no')
    ? `<div class="cmlist">`
      + (달들.length > 1 ? `<div class="mons">` + 달들.map(m =>
          `<button class="${m===지금달?'on':''}" data-act="cmmon:${esc(K)}:${esc(m)}">
             ${esc(달이름(m))} <b>${줄.filter(x=>달of(x)===m).length}</b></button>`).join('')
          + `</div>` : '')
      + 보일것.map(({x, j}) => { const d = String(x.ts||'').slice(0,10);
          return `<button class="${j===i?'on':''}" data-act="cmgo:${esc(K)}:${j}">
            <b>${n-j}회차</b> ${esc(d ? dateTxt(d) : (x.at||''))}
            <span>${esc((x.tx||'').slice(0,16))}${(x.tx||'').length>16?'…':''}</span></button>`; }).join('')
      + `</div>`
    : '';

  const 여러해 = 해들.length > 1;
  return `<div class="cmnav">
      ${n>1 ? `<button class="ar ${i<=0?'end':''}" data-act="cmnav:${esc(K)}:-1" aria-label="더 최근 피드백">‹</button>` : ''}

   「수업기록 완료하면 리포트 보내기가 자동으로 가는 것도 좋을 거 같아」
   「그러면 끝나고 30분 뒤니까 발송 전인지 발송 완료인지만 체킹되면 되겠다」
   수업을 마치면 **30분 뒤**로 예약한다. 그 사이에 트레이너가 피드백을 올리거나
   잘못 끝낸 것을 취소할 수 있다. 보내는 때가 아니면(00~05시) 그날 05시로 민다. */
const 자동분 = 30;
function 나갈시각(분){
  const t = new Date(Date.now() + (분 || 0) * 60000);
  if(t.getHours() < 5) t.setHours(5, 0, 0, 0);       /* 새벽이면 그날 05시 */
  return t;
}
const 시각글 = d => String(d.getHours()).padStart(2,'0') + '시 '
                  + String(d.getMinutes()).padStart(2,'0') + '분';

function 운동요약(w){
  const 종목 = w.items.filter(it => it.sets.length && !isMemo(it.ex)).map(it => exName(it.ex, it.va));
  if(!종목.length) return '';
  return 종목.slice(0,3).join(' · ') + (종목.length > 3 ? ' 외 ' + (종목.length-3) + '개' : '');
}

/* 예약 한 줄을 넣는다. 돌려주는 것 = 나갈 시각(Date) 또는 null.
   ⛔ 리포트 내용은 담지 않는다 — 회원이 열 때 그 순간의 기록을 읽어 그린다. */
async function 리포트예약(w, 분){
  const 요약 = 운동요약(w);
  if(!요약) return null;
  const m = MEMBERS.find(x => x.id === w.mid) || {};
  const at = 나갈시각(분);
  await spost('report_sends', [{ id:'rs_' + w.id, workout_id:w.id, member_id:w.mid,
    member_name:(m.n || ''), trainer:(m.tr || TRAINER), lesson_date:w.date, summary:요약,
    state:'대기', queued_at:new Date().toISOString(), send_at:at.toISOString(),
    sent_at:null, fail_why:null, tried:0 }], {on:'id'});
  return at;
}

/* 이미 예약·발송된 수업인가 — 두 번 보내지 않으려고 본다 */
async function 리포트상태(wid){
  try{ return (await sget('report_sends?select=state,send_at,sent_at&id=eq.rs_' + encodeURIComponent(wid)))[0] || null; }

/* ══ 리포트에 뜨는 피드백 ══ 2026-09-29 대표
   「종목에는 그동안의 피드백이 쌓이고 / 피드백 남기는 건 수업하고 남길 수 있게」
   피드백은 **한 종류**다. 들어가는 문이 수업이고, 서랍은 종목이다.
     종목 사전에서 보면 → 그 종목의 피드백 전부
     수업 리포트에서 보면 → **그 수업에서 남긴 것만**
   ⚠ 2026-09-29 이전 피드백에는 `wid` 가 없다(그때는 안 담았다). 그건 **날짜+종목**으로 맞춘다.
      앞으로 쓰는 것부터 정확해진다. */
function 수업피드백(w, it){
  const 다 = cmOf(w.mid, it.ex, it.va);
  const 이수업 = 다.filter(c => c.wid === w.id);
  if(이수업.length) return 이수업;
  return 다.filter(c => !c.wid && String(c.ts || '').slice(0,10) === w.date);   /* 옛 피드백 */
}

/* 리포트 맨 위 제목 — 「무엇을 보고 있는지」를 한눈에 (2026-09-29 대표
   「가장 상단에 n월n일 수업기록인지 나타내면 좋겠다」).
   올해가 아니면 연도도 같이 보인다. 요일도 붙인다 — 회원은 요일로 기억한다. */
function 수업제목(w){
  const d = w.date || '';
  const 올해 = String(new Date().getFullYear());
  const 해 = d.slice(0,4) !== 올해 ? d.slice(0,4) + '년 ' : '';
  const 요일 = ['일','월','화','수','목','금','토'][new Date(d + 'T00:00:00').getDay()];
  const 무엇 = (w.kind || '').includes('개인') ? '개인운동 기록' : '수업 기록';
  return 해 + dateTxt(d) + (요일 ? ' (' + 요일 + ')' : '') + ' ' + 무엇;
}

function vReport(){
  const w = D.workouts.find(x=>x.id===S.rw); if(!w) return (S.who==='tr' ? tToday() : vHome());
  const mid = w.mid, 이름 = (MEMBERS.find(m=>m.id===mid)||{}).n || '', bw = bwOf(mid);
  /* ⛔ `tr` 은 **맨 위**에 둔다 (2026-10-01). 아래 `줄` 을 만드는 map 안에서 쓰는데(첫없음, 2026-09-30),
     선언이 그 뒤에 있어 「Cannot access 'tr' before initialization」 으로 **리포트 화면이 통째로 죽었다.**
     node --check 도, 단추 점검도 못 잡는다 — 눌러서 열어 봐야만 나온다. */
  const tr = S.who==='tr';
  const 달 = w.date.slice(0,7), [y, m] = [+달.slice(0,4), +달.slice(5,7)];
  const 이달 = workoutsOf(mid).filter(x => x.date.slice(0,7)===달 && x.date <= w.date && 세트있나(x))
    .sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const 수업 = 이달.filter(x=>x.kind==='수업').length, 개인 = 이달.length - 수업;
  const 합 = 이달.reduce((a,x)=>{ const t=wStat(x,bw); return { vol:a.vol+t.vol, sets:a.sets+t.sets }; }, {vol:0, sets:0});
  const 운동날 = new Set(이달.map(x=>x.date));

  /* 오늘 한 종목 — 가장 무거운 세트를 그 전에 한 날과 견준다 */
  const 줄 = w.items.filter(it=>it.sets.length && !isMemo(it.ex)).map(it=>{
    const e = exOf(it.ex)||{}, top = ss => e.cardio ? Math.max(...ss.map(x=>+x.reps||0)) : Math.max(...ss.map(x=>+x.kg||0));
    const 오늘 = top(it.sets), 단위 = e.cardio ? '분' : 'kg';
    const 전w = workoutsOf(mid).find(x => x.date < w.date && x.items.some(i=>i.ex===it.ex && i.va===it.va && i.sets.length));
    const 전 = 전w ? top(전w.items.find(i=>i.ex===it.ex && i.va===it.va).sets) : null;
    const d = 전==null ? null : Math.round((오늘-전)*10)/10;
    const cl = d==null ? 'eq' : d>0 ? 'up' : d<0 ? 'dn' : 'eq';
    const 글 = d==null ? '처음' : d>0 ? `▲${kgfmt(d)}` : d<0 ? `▼${kgfmt(-d)}` : '그대로';
    /* 피드백이 없으면 **줄을 안 만든다** — 「피드백 없음」도 안 쓴다 (2026-09-29 대표)
       ⭐ 딱 하나 예외 (2026-09-30 대표 「첫 피드백 없음이 강조되어야 하고」):
          그 종목에 피드백이 **한 번도 없으면** 트레이너에게만 「첫 피드백 없음」을 띄운다.
          피드백은 있는데 이번 회차에만 없는 것은 **지금 그대로** 아무 줄도 안 만든다.
          회원 화면에는 안 띄운다 — 트레이너 사정이지 회원이 볼 것이 아니다. */
    const 다피드백 = cmOf(w.mid, it.ex, it.va);
    const 첫없음 = tr && !다피드백.length && !피드백끔(w.mid);
    const cs = 수업피드백(w, it);
    const 장 = cs.reduce((a,c)=> a + (+c.pics||0), 0), 영 = cs.reduce((a,c)=> a + (+c.vids||0), 0);
    const 붙 = 리포트사진켬 ? [장 ? '사진 ' + 장 : '', 영 ? '영상 ' + 영 : ''].filter(Boolean).join(' · ') : '';
    return `<div class="trow">
      <span class="e">${esc(exName(it.ex,it.va))}</span>
      <span class="n">${it.sets.length}세트</span>
      <span class="v">${kgfmt(오늘)}<span style="font-size:11px;font-weight:600;color:#8f8a83">${단위}</span></span>
      <span class="d ${cl}">${글}</span></div>`
      + (cs.length ? `<button class="rpcm" data-act="rpcm:${it.ex}:${it.va}">
          <span class="ic">💬</span><span class="tx">${esc(cs[0].tx || '')}</span>
          ${붙 ? `<span class="at">${esc(붙)}</span>` : ''}
          ${cs.length > 1 ? `<span class="at">＋${cs.length-1}</span>` : ''}</button>`
        : 첫없음 ? `<button class="rpcm none" data-act="rpcm:${it.ex}:${it.va}">
          <span class="ic">✎</span><span class="tx"><b>첫 피드백 없음</b> — 이 종목은 아직 하나도 없어요</span>
          <span class="at">남기기 ›</span></button>` : '');
    }).join('');

  /* 부위 균형 — 그 달 안에서만 센다 */
  const ps = {}; PARTS8.forEach(k=>ps[k]=0);
  이달.forEach(x=>x.items.forEach(it=>{ const e=exOf(it.ex); if(!e||isMemo(it.ex)) return;
    ps[PARTS8.includes(e.p)?e.p:'기타'] += it.sets.length; }));
  const 끝날 = +w.date.slice(8);
  /* ⭐ 그래프는 **최근 6회만** (2026-10-01 대표 「항상 보는 사람을 고려해서 모든 데이터를 다 넣는 게 아니라 …
     모바일 안 크기를 고려해서 적정한 양」). 그 달 전부를 넣으니 매일 운동하는 회원은 점 20개가 320폭에 몰려
     숫자가 겹쳤다. 6개면 점 사이가 60폭 — 「12,623」 같은 숫자(≈32폭)가 안 닿는다.
     달에 매이지 않고 **리포트 날짜까지의 최근 6회**를 본다 — 달이 바뀌어도 흐름이 끊기지 않는다. */
  const 최근 = workoutsOf(mid).filter(x => x.date <= w.date && 세트있나(x))

async function recSave(){
  const E = S.recEdit; if(!E) return;
  const w = D.workouts.find(x=>x.id===E.wid);
  closeSheet(); S.recEdit = null;
  if(!w) return;
  toast('수정하는 중이에요');
  for(const it of E.items){
    const src = w.items.find(x=>x._id===it._id) || {};
    src.sets = it.sets.map(x=>({ kg:Number(x.kg)||0, reps:Number(x.reps)||0,
      spd: x.spd==null||x.spd==='' ? undefined : Number(x.spd) }));
    if(it._id){
      await sv(sdel('workout_sets','item_id=eq.'+it._id), '세트 삭제');
      if(src.sets.length) await sv(spost('workout_sets', src.sets.map((x,k)=>({
        item_id: it._id, sort:k, kg:x.kg, reps:x.reps, spd: x.spd==null?null:x.spd, done:true }))), '세트 저장');
    }
  }
  save(); toast('수정했어요'); render();
}

const SLOTS = ['아침','점심','저녁','간식'];

/* ── 사진 위 음식 표시(인스타 태그) ──
   표를 새로 못 만들어서 meal_items 의 `sort` 칸을 빌려 자리를 담는다.
   1,000,000 보다 크면 「사진에 표시된 것」이고, 천분율 x·y 가 들어 있다.
   그보다 작으면 예전처럼 그냥 담긴 순서다.                              */
const 자리있음 = 1000000;
const 자리코드 = (x, y) => 자리있음
  + Math.max(0, Math.min(999, Math.round(x*10))) * 1000
  + Math.max(0, Math.min(999, Math.round(y*10)));
const 자리풀기 = pos => {
  const n = Number(pos||0);
  if(n < 자리있음) return null;
  const v = n - 자리있음;
  return { x: Math.floor(v/1000)/10, y: (v%1000)/10 };
};
/* 지금 시각으로 끼니를 짐작한다 — 0~5시 아침, 6~11시 아침, 12~17시 점심, 18시~ 저녁 */
function 지금끼니(){
  const h = new Date().getHours();
  return h < 11 ? '아침' : (h < 17 ? '점심' : '저녁');
}
const mealURL = path => 사진주소(path);

/* 사진이 없거나 서버에서 지워졌으면 샐러드 그림으로 갈음합니다 */
function picFail(img){
  /* 주소를 아직 못 받은 사진이면 받아서 한 번 더 건다 — 바로 자리 그림으로 바꾸지 않는다 */
  const m = (img.getAttribute('src')||'').match(/\/object\/public\/media\/([^?]+)/), 길 = m ? decodeURIComponent(m[1]) : '';
  if(길 && !img.dataset.retry){ img.dataset.retry = '1';
    주소받기([길]).then(() => { if(SIGNED[길]) img.src = SIGNED[길]; else picFail(img); }).catch(() => picFail(img)); return; }
  const sp = document.createElement('span');
  sp.className = 'nopic ' + (img.className||'');
  if(img.dataset && img.dataset.act) sp.dataset.act = img.dataset.act;
  /* 밥그릇은 **식단 사진**에만. 오운완 · 프로필 · 글 사진이 안 뜰 때 밥그릇이 뜨면 엉뚱하다 */
  const 식단 = /(^|\/)meals\//.test(길) || (!길 && (img.classList.contains('shot') || img.classList.contains('ph')));
  const 큰 = img.classList.contains('shot') || img.classList.contains('ph');
  sp.innerHTML = 식단 ? (큰 ? SALAD : SALAD_MINI) : `<span class="nopicx">${svg('h_cam', 큰 ? 34 : 22)}</span>`;
  img.replaceWith(sp);
}
/* 사진 + 그 위 음식 표시. 다는중=1 이면 눌러서 새로 달 수 있다 */
function 태그판(m, 다는중){
  const 것 = (m.items||[]).map(x=>({ x, p:자리풀기(x.pos) })).filter(v=>v.p)
    .sort((a,b)=> a.p.y - b.p.y);
  /* 이름표가 서로 겹치지 않게 세로로 조금씩 밀어 둔다. 점은 실제 자리에 그대로 둔다 */
  let 앞 = -99;
  것.forEach(v => { v.ly = Math.min(96, Math.max(v.p.y, 앞 + 10)); 앞 = v.ly; });
  const 그림 = (m.id === 'draft')
    ? `<img class="tagph" src="${S.shot||''}" alt="">`         /* 아직 안 올린 사진 */
    : picImg(m.path, 'tagph', 다는중?'':'meal:'+m.id, 1);
  return `<div class="tagwrap ${다는중?'on':''}" data-meal="${esc(m.id)}">
    ${그림}
    ${것.map(v=>`<i class="tdot" style="left:${v.p.x}%;top:${v.p.y}%"></i>`).join('')}
    ${것.map(v=>`<b class="ftag ${v.p.x>56?'lft':''}" style="left:${v.p.x}%;top:${v.ly}%"
        ${다는중?`data-act="fdel:${m.id}:${v.x.id}"`:''}>${음식그림(v.x.name)} ${esc(v.x.name)}
      <em>${Math.round(v.x.kcal)}</em></b>`).join('')}
    ${다는중 && !것.length ? `<span class="taghint">사진 속 음식을 눌러 주세요</span>` : ''}
  </div>`;
}
/* 표시 안 하고 그냥 담긴 것 (사진 없이 검색으로 담은 것 포함) */
const 자리없는것 = m => (m.items||[]).filter(x => !자리풀기(x.pos));

function mealsOf(mid, date){ return (D.meals||[]).filter(m=>m.mid===mid && (!date || m.date===date)); }
/* 담긴 음식이 있으면 그 합, 없으면 직접 적은 값 */
function mealSum(m){
  if(m.items && m.items.length){
    return m.items.reduce((a,x)=>({ kcal:a.kcal+x.kcal, carb:a.carb+x.carb,
      protein:a.protein+x.protein, fat:a.fat+x.fat }), {kcal:0,carb:0,protein:0,fat:0});
  }
  return { kcal:Number(m.kcal||0), carb:Number(m.carb||0), protein:Number(m.protein||0), fat:Number(m.fat||0) };
}
/* 그날 식사를 회차 순으로 */
function mealsSeq(mid, date){
  return mealsOf(mid, date).slice().sort((a,b)=>
    String(a.at||'').localeCompare(String(b.at||'')) || String(a.id).localeCompare(String(b.id)));
}
function nextSeq(mid, date){ return mealsOf(mid, date).length + 1; }
const hhmm = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
/* 음식장에서 찾기 — 서버에 물어본다 */
async function foodFind(q){
  const s0 = (q||'').trim();
  const 전부 = () => sget('foods?select=*&order=uses.desc&limit=24');
  if(!s0) return 전부();
  /* 「닭가슴살 (구이)」처럼 괄호·띄어쓰기가 섞여도 찾게 — 낱말로 쪼개 「다 들어간 것」을 고른다.
     예전에는 괄호를 빈칸으로 바꿔 통째로 맞춰 보느라 「최근 먹은 것」을 눌러도 못 찾았다. */
  const 낱말 = s0.replace(/[%(),*."']/g, ' ').split(/\s+/).filter(w => w).slice(0, 4);
  if(!낱말.length) return 전부();
  const 조각 = f => '(' + 낱말.map(w => f + '.ilike.*' + encodeURIComponent(w) + '*').join(',') + ')';
  return sget('foods?select=*&or=(and' + 조각('name') + ',and' + 조각('brand') + ')'
    + '&order=uses.desc,id.asc&limit=40');
}
/* 최근 먹은 음식 */
function recentFoods(mid){
  const seen = {}, out = [];
  mealsOf(mid).slice().sort((a,b)=> a.date<b.date?1:-1).forEach(m=>(m.items||[]).forEach(x=>{
    const k = x.name+'|'+x.brand;
    if(seen[k]) return; seen[k]=1;
    if(out.length<12) out.push(x);
  }));
  return out;
}

/* 목표 대비 얼마나 채웠나 */
function dietStat(mid, from, to){
  const g = GOALS[mid] || {};
  const r = calcOf(g);
  const target = r.kcal || 0, dayLoss = r.day || 0;
  const gm = { c:r.gg.c, p:r.gg.p, f:r.gg.f };
  const ready = (r.bmr > 0 && r.keep > 0 && r.kcal > 0);
  const rows = (D.meals||[]).filter(m => m.mid===mid && (!from || m.date>=from) && (!to || m.date<=to));
  const withK = rows.filter(m => Number(m.kcal) > 0);
  const byDay = {};
  withK.forEach(m => { byDay[m.date] = (byDay[m.date]||0) + Number(m.kcal); });
  const days = Object.keys(byDay);
  let over = 0; days.forEach(d => { over += (byDay[d] - target); });
  const eaten = withK.reduce((a,m)=>a+Number(m.kcal), 0);
  const carb  = rows.reduce((a,m)=>a+(Number(m.carb)||0), 0);
  const prot  = rows.reduce((a,m)=>a+(Number(m.protein)||0), 0);
  const fat   = rows.reduce((a,m)=>a+(Number(m.fat)||0), 0);
  const noK   = rows.length - withK.length;
  const planLoss = dayLoss * days.length;
  const realLoss = planLoss - over;
  return { ready, target, dayLoss, gm, days:days.length, eaten, carb, prot, fat, over, noK,
    planLoss, realLoss, planKg: planLoss/FAT_KCAL, realKg: realLoss/FAT_KCAL };
}
function weekStart(){ const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthStart(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; }

        <span class="goal">${넘 ? '목표보다 '+Math.round((먹-g)/g*100)+'% 더 먹었어요' : Math.round(p*100)+'% 채웠어요'}</span></span>
    </div>` : `<div class="khead">

function carMove(el){

  if(c) c.textContent = (n+1) + ' / ' + el.children.length;
  const d = w.nextElementSibling; if(d && d.classList.contains('fdots')) [...d.children].forEach((x,i)=>x.classList.toggle('on', i===n));

function mealDayStat(mid, d){
  const ms = mealsOf(mid, d);
  const kcal = ms.reduce((a,m)=> a + (Number(m.kcal)||0), 0);
  let goal = 0; try{ const rr = calcOf(GOALS[mid]||{}); goal = rr.bmr ? rr.kcal : 0; }catch(e){}
  return { n: ms.length, kcal, goal, p: goal ? Math.min(1, kcal/goal) : 0 };
}
function dietStrip(mid, 곡선만){
  const sel = S.dietDay || TODAY, wk = weekOf(sel), st = mealDayStat(mid, sel);
  const 날들 = wk.map(d => Object.assign({ d }, mealDayStat(mid, d)));

    return `<svg viewBox="0 0 40 40" aria-hidden="true">

      ${t.p > 0 ? `<circle cx="20" cy="20" r="${R}" fill="none" stroke="${색}" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="${(C*t.p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 20 20)"/>`
        : (t.n ? `<circle cx="20" cy="20" r="${R}" fill="none" stroke="${색}" stroke-width="2.6" opacity=".55"/>` : '')}
      <text x="20" y="24.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="${on ? '#fff' : (t.n ? '#e9e2d6' : '#67635d')}">${+t.d.slice(8)}</text></svg>`; };
  /* 최근 7일 칼로리 곡선 — 이 화면에 하나뿐인 그래프. 달력 주(일~토)로 자르면 주 초엔 점이 두세 개뿐이라 고른 날까지 7일로 그린다 */
  const 곡선 = (()=>{ const 지난 = [6,5,4,3,2,1,0].map(k => { const d = addDays(sel, -k); return Object.assign({ d }, mealDayStat(mid, d)); });
    if(!지난.some(t=>t.kcal)) return '';
    const W = 210, H = 74, PL = 6, PR = 6, PT = 12, PB = 8, goal = st.goal || 0;
    const mx = Math.max(1, goal, ...지난.map(t=>t.kcal)) * 1.08;
    const x = i => PL + i*(W-PL-PR)/6, y = v => PT + (1 - v/mx)*(H-PT-PB);
    const xs = 지난.map((_,i)=>x(i)), ys = 지난.map(t=>y(t.kcal)), d = 곡선길(xs, ys), si = 지난.findIndex(t=>t.d===sel);
    return `<svg class="dkg" viewBox="0 0 ${W} ${H}" aria-hidden="true">

        <text x="${W-PR}" y="${(y(goal)-3).toFixed(1)}" text-anchor="end" font-size="7.5" fill="var(--teal)" opacity=".85">권장</text>` : ''}
      <path d="${d} L ${xs[xs.length-1].toFixed(1)} ${H-PB} L ${xs[0].toFixed(1)} ${H-PB} Z" fill="url(#dkgf)"/>
      <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
      ${지난.map((t,i)=> i===si ? '' : `<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="1.9" fill="#1b1a18" stroke="var(--gold-2)" stroke-width="1.2"/>`).join('')}
      ${si >= 0 ? `<line x1="${xs[si].toFixed(1)}" x2="${xs[si].toFixed(1)}" y1="${(ys[si]+5).toFixed(1)}" y2="${H-PB}" stroke="var(--gold-2)" stroke-width=".7" stroke-dasharray="2 3" opacity=".7"/>
        <circle cx="${xs[si].toFixed(1)}" cy="${ys[si].toFixed(1)}" r="6.5" fill="#f0d3a0" opacity=".16"/>
        <circle cx="${xs[si].toFixed(1)}" cy="${ys[si].toFixed(1)}" r="3.6" fill="#1b1a18" stroke="var(--gold)" stroke-width="2"/>` : ''}</svg>`; })();
  if(곡선만) return 곡선;
  return `<div class="dwk">
    <div class="wkhd">

  </div>
`;
}

/* ── 오운완 인증사진 ── 찍은 사진 위에 오늘 기록을 얹어 한 장으로 만든다.
   인스타에 그대로 올리도록 세로 4:5(1080×1350)로 뽑는다.              */
const OOTD_W = 1080, OOTD_H = 1350;
/* ── 오운완 인증샷 ── 나이키 런클럽 공유카드 결로 다시 그렸다 (2026-09-05 확정).
   · 왼쪽 위 : 로고 → 날짜 → 총 볼륨(주인공) → 시간·세트·종목·최고무게
   · 오른쪽 아래 : 세트마다 막대 하나, 크림→골드로 흐른다. 아래에 종목 이름
   · 사진을 그늘로 덮지 않는다. 평평하게 14% 만 어둡게 하고 글씨엔 작은 그림자만.
   ⛔ 그림자를 번지게 하거나 골드를 여기저기 쓰면 촌스러워진다 — 물려서 다시 만든 적 있다. */
const OOTD_B = '"Archivo Black","Noto Sans KR",sans-serif';   /* 숫자 — 넓고 두껍다 */
const OOTD_A = '"Archivo","Noto Sans KR",sans-serif';         /* 영문 라벨 */
const OOTD_K = '"Noto Sans KR",sans-serif';                   /* 한글 */
/* 캔버스는 글꼴이 실제로 올라온 뒤에 그려야 한다. 안 오면 그냥 기본 글씨로 그린다 */
async function ootd글꼴(){
  if(!document.fonts || !document.fonts.load) return;
  try{
    await Promise.race([
      Promise.all([ document.fonts.load('400 200px "Archivo Black"'),
                    document.fonts.load('700 20px "Archivo"') ]),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  }catch(e){ console.warn('오운완 글꼴을 못 받았어요', e); }
}

/* ── 운동 이름 줄이기 ── 인증샷에 「레그」만 나오면 뭔지 모른다 (2026-09-07 대표 지적).
   낱말을 통째로 자르지 말고 「아는 낱말은 짧게 바꾸고」 붙인다.
   레그 익스텐션 → 레그익스 · 오버헤드 트라이셉스 익스텐션 → OH트라이익스           */
const 줄임낱말 = [
  ['오버헤드','OH'], ['트라이셉스','트라이'], ['익스텐션','익스'],
  ['인클라인','인클'], ['디클라인','디클'], ['루마니안','RDL'], ['데드리프트','데드'],
  ['어시스트','보조'], ['비하인드','비하인드'], ['프리처','프리처'],
  ['라잉','라잉'], ['시티드','시티드'], ['스탠딩','스탠딩'], ['리버스','리버스'],
  ['덤벨','덤벨'], ['바벨','바벨'], ['케이블','케이블'], ['스미스','스미스'], ['머신','머신'],
  ['레터럴','레터럴'], ['프론트','프론트'], ['해머','해머'], ['원암','원암'],
  ['아이소레터럴','ISO'], ['서포티드','서포'], ['어브덕션','어브'], ['어덕션','어덕'],
  ['벤치프레스','벤치'], ['불가리안','불가'], ['스플릿','스플릿'],
];
function 짧은이름(이름){
  let t = String(이름 || '').replace(/\(.*?\)/g, '');        /* 괄호 안(그립 등)은 뺀다 */
  줄임낱말.forEach(([a,b]) => { if(a!==b) t = t.split(a).join(b); });
  return t.replace(/\s+/g, '').trim() || String(이름||'');
}
/* 그 종목에서 가장 무겁게 든 것 — 유산소는 시간, 맨몸은 「맨몸」 */
function 탑세트(it){
  const e = exOf(it.ex) || {};
  if(e.cardio) return (it.sets.reduce((a,z)=>a+(+z.reps||0),0) || 0) + '분';
  const mx = Math.max(0, ...it.sets.map(z => +z.kg || 0));
  return mx ? kgfmt(mx) + 'kg' : '맨몸';
}

function ootdDraw(img, w){
  const cv = document.createElement('canvas');
  cv.width = OOTD_W; cv.height = OOTD_H;
  const x = cv.getContext('2d');
  const 여 = 80;

  /* 1) 사진을 4:5 로 꽉 채워 자른다 */
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const 비 = Math.max(OOTD_W/iw, OOTD_H/ih);
  x.drawImage(img, (OOTD_W-iw*비)/2, (OOTD_H-ih*비)/2, iw*비, ih*비);

  /* 2) 평평하게 조금만 어둡게 — 그라데이션 그늘을 쓰지 않는다 */
  x.fillStyle = 'rgba(0,0,0,.14)';
  x.fillRect(0, 0, OOTD_W, OOTD_H);

  /* 3) 글씨엔 번지지 않는 작은 그림자만 */
  x.shadowColor = 'rgba(0,0,0,.45)';
  x.shadowBlur = 5; x.shadowOffsetY = 1;
  x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  const 글 = (크기, 굵기, 글꼴, 색, 자간) => {
    x.font =굵기 + ' ' + 크기 + 'px ' + 글꼴; x.fillStyle = 색;
    try{ x.letterSpacing = (자간||0) + 'px'; }catch(e){}
  };
  const 자간끄기 = () => { try{ x.letterSpacing = '0px'; }catch(e){} };

  /* ── 왼쪽 위 : 로고 · 날짜 ── */
  글(25, 700, OOTD_A, '#fff', 3);
  x.fillText('GLAD GYM', 여, 98);
  글(19, 600, OOTD_A, 'rgba(255,255,255,.78)', 4);
  /* 날짜 옆에 **찍은 시각** (2026-10-08 대표 「촬영 시각도 간단하게 표기」) — 오운완은 그날에만 찍으니 지금 시각이 곧 찍은 시각이다. 식단 사진(stampPhoto)은 원래 시각까지 찍는다 */
  x.fillText((w.date||TODAY).replace(/-/g,'.') + '  ' + (d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'))(new Date()), 여, 130);
  자간끄기();

  /* ── 주인공 : 총 볼륨 ──
     ⛔ 톤은 「1.2」처럼 짧아 좋지만 몸에 와 닿지 않는다

/* ══ 1RM ══ 추정 = 세트 완료 때 자동(Epley · 12회 이하 · 유산소 제외) · 실측 = 트레이너 「1RM 재기」 */

const kg표 = v => String(Math.round((Number(v)||0)*10)/10);
const rm추정식 = (kg, reps) => reps<=1 ? kg : (reps>12 ? 0 : kg*(1+reps/30));
const rm최고 = (mid, ex) => { let b=null;
  (D.rm||[]).forEach(r=>{ if(r.mid!==mid || r.ex!==ex) return; if(!b || r.kg>b.kg || (r.kg===b.kg && r.kind==='실측')) b=r; }); return b; };
const rm종목 = mid => { const m={};
  (D.rm||[]).forEach(r=>{ if(r.mid!==mid) return; const b=m[r.ex]; if(!b || r.kg>b.kg || (r.kg===b.kg && r.kind==='실측')) m[r.ex]=r; });
  return Object.values(m).sort((a,b)=>b.kg-a.kg); };
async function rm기록(mid, ex, va, kg, reps, kind, wid, by){
  const id = 'rm'+Date.now()+Math.random().toString(36).slice(2,5);
  const row = { id, mid, ex, va, kg, reps, kind, date:TODAY, wid:wid||'', by:by||'' };

  await sv(spost('one_rm',[{ id, member_id:mid, variant_id:VID(ex,va), kg, reps, kind, on_date:TODAY, workout_id:wid||null, by:by||null }]), '1RM');

  const kg = Number(set.kg)||0, reps = Number(set.reps)||0; if(kg<=0 || reps<=0 || reps>12) return;
  const est = Math.round(rm추정식(kg, reps)*2)/2;

function 배지통계(mid){
  const ps = profStat(mid);

  const 삼 = ['sq','bp','dl'].map(e => { const b = rm최고(mid, e); return b ? Number(b.kg) : 0; }).reduce((a,b)=>a+b,0);
  const 지난 = 지난달들(2)[1]; const R = 랭킹계산(월시작(지난), 월끝(지난));
  const 등수들 = ['오운완','운동','무게','삼대남','삼대여'].map(k => { const i = R[k].findIndex(r=>r.mid===mid); return i>=0 ? i+1 : 0; }).filter(Boolean);
  return { 운동:ws.length, 오운완:ps.오운완||0, 연속:ps.연속||0, 톤:Math.floor((ps.vol||0)/1000), 삼대:삼,

    글:(D.posts||[]).filter(p=>p.mid===mid && p.kind!=='파트너').length, 모집:(D.posts||[]).filter(p=>p.mid===mid && p.kind==='파트너').length,

/* ── 오운완 사진 내보내기 ── 「저장」과 「공유」를 갈라 놓았다 (2026-09-07).
   웹은 사진첩에 곧바로 못 넣는다. 그래서 두 길뿐이다 :
     · 안드로이드 — 내려받기. 다운로드 폴더에 들어가고 갤러리가 잡아 준다
     · 아이폰    — 내려받기로는 사진 앱에 안 들어간다. 공유 시트의 「이미지 저장」이 유일하다  */
const 아이폰 = () => /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* 파일 이름은 날짜로 — 기록 id 는 회원에게 뜻이 없다 (2026-09-07) */
function ootd파일(blob, 날짜){
  const d = (날짜 || TODAY).slice(0,10);
  return new File([blob], '글래드짐_오운완_' + d + '.jpg', { type:'image/jpeg' });
}
/* 그 기록이 언제 것인가 */
const ootd날 = wid => ((D.workouts||[]).find(z=>z.id===wid)||{}).date || TODAY;
function 내려받기(blob, 이름){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 이름;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* 갤러리에 저장 */
async function ootdDL(url, 날짜){
  try{
    const blob = await (await fetch(url)).blob();
    const file = ootd파일(blob, 날짜);
    if(아이폰() && navigator.canShare && navigator.canShare({ files:[file] })){
      toast('「이미지 저장」을 선택해 주세요');
      try{ await navigator.share({ files:[file] }); return; }
      catch(e){ if(e.name==='AbortError') return; }
    }
    내려받기(blob, file.name);
    toast('갤러리에 저장했어요');
  }catch(e){ console.error(e); toast('사진을 꾹 눌러 저장해 주세요'); }
}

/* 공유 — 공유 시트만. 안 되는 기기면 내려받기로 */
async function ootdShare(){
  if(!S.ootd) return;
  const blob = await (await fetch(S.ootd.url)).blob();
  const file = ootd파일(blob, ootd날(S.ootd.wid));
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file] }); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  내려받기(blob, file.name);
  toast('공유를 못 열어 내려받았어요');
}

/* 찍은 사진을 앱에 남긴다(저장소 + body_photos). 한 번만 — 이미 남겼으면 그 id 를 돌려준다. 실패하면 null */
async function ootd앱저장(){
  const o = S.ootd; if(!o) return null; if(o.id) return o; if(o.저장중) return o.저장중;
  o.저장중 = (async () => {
    const w = D.workouts.find(z => z.id === o.wid), mid = w ? w.mid : S.mid;
    const id = 'od' + Date.now(), path = `ootd/${mid}/${id}.jpg`;
    const blob = await (await fetch(o.url)).blob();
    const r = await fetch(SB_URL+'/storage/v1/object/media/'+path, {
      method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'image/jpeg' }, body: blob });
    if(!r.ok){ console.error(await r.text()); o.저장중 = null; return null; }
    const 날 = (w && w.date) || TODAY;
    await sv(spost('body_photos',[{ id, member_id:mid, kind:'ootd', pose:'오운완', on_date:날, path, memo:o.wid||'' }]), '오운완 저장');
    (D.bph = D.bph || []).push({ id, mid, kind:'ootd', pose:'오운완', date:날, path, memo:o.wid||'' });
    try{ await 주소받기([path]); }catch(e){}      /* 방금 올린 사진 — 주소를 받아야 뜬다 */
    o.id = id; o.path = path; return o; })();
  return o.저장중;
}

/* ── 트레이너 인증샷 ── (2026-10-02 대표 「찍고 저장 누르면 일단 앱에 저장 … 회원이 지워도 트레이너는 볼 수 있게」)

function pairPick(wid){
  const w = D.workouts.find(z => z.id === wid); if(!w) return;
  if(w.date !== TODAY){ toast('지난 날짜 기록에는 찍을 수 없어요'); return; }
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.style.display='none'; document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    inp.remove(); if(!f) return;
    const img = new Image();
    img.onload = async () => { try{
      /* 긴 변 1600 으로만 줄인다 — 원본 느낌은 지키고 용량만 (사진 한 장 ≈ 300KB) */
      const N = 1600, 비 = Math.min(1, N / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth*비); cv.height = Math.round(img.naturalHeight*비);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
      S.pair = { wid, blob, url: URL.createObjectURL(blob) }; sheetPair();
    }catch(e){ console.error(e); toast('사진을 만들지 못했어요'); } };
    img.onerror = () => toast('사진을 읽지 못했어요');
    img.src = URL.createObjectURL(f);
  });
  inp.click();
}

function stampPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, MAX/Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      const x = cv.getContext('2d');
      x.drawImage(img, 0, 0, w, h);
      /* 아래쪽 띠 */
      const barH = Math.max(56, Math.round(h*0.09));
      const gr = x.createLinearGradient(0, h-barH*1.6, 0, h);
      gr.addColorStop(0,'rgba(10,10,9,0)'); gr.addColorStop(1,'rgba(10,10,9,.82)');
      x.fillStyle = gr; x.fillRect(0, h-barH*1.6, w, barH*1.6);
      const pad = Math.round(barH*0.42);
      const s1 = Math.round(barH*0.40), s2 = Math.round(barH*0.28);
      x.textBaseline='alphabetic';
      x.font = `700 ${s1}px "Noto Sans KR",sans-serif`;
      x.fillStyle = '#e6c487';
      x.letterSpacing = Math.round(s1*0.18)+'px';
      x.fillText('GLAD GYM', pad, h - pad - s2 - Math.round(barH*0.14));
      x.letterSpacing = '0px';
      const d = new Date();
      const two = n => String(n).padStart(2,'0');
      const stamp = `${d.getFullYear()}.${two(d.getMonth()+1)}.${two(d.getDate())}  ${two(d.getHours())}:${two(d.getMinutes())}`;
      x.font = `500 ${s2}px "Noto Sans KR",sans-serif`;
      x.fillStyle = '#fdfaf6';
      x.fillText(stamp, pad, h - pad);
      /* 오른쪽 아래 작은 표시 */
      x.font = `500 ${Math.round(s2*0.85)}px "Noto Sans KR",sans-serif`;
      x.fillStyle = 'rgba(253,250,246,.6)';
      const tx = '구산역촌점';
      x.fillText(tx, w - pad - x.measureText(tx).width, h - pad);
      res(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* 시작일을 새로 잡는다.
   ⭐ 지난 시작일과의 사이가 **21~40일**이면 그것을 이번 달 주기로 보고
      기존 길이와 **반씩 섞어** 따라간다 — 한 달 들쭉날쭉에 확 흔들리지 않게.
      (2026-10-01 대표 「빨리 시작했다면 … 그 시점에 맞춰 주기가 다시 바뀌기도 하는」) */
function 주기시작(mid, 날){
  D.cycle = D.cycle || {};
  const c = D.cycle[mid] || (D.cycle[mid] = { on:true, len:28, period:5 });
  const 앞 = c.last;
  c.last = 날; c.on = true;
  let 말 = dateTxt(날) + ' 로 기록했어요';
  if(앞 && 앞 < 날){
    const 사이 = Math.round((new Date(날+'T00:00:00') - new Date(앞+'T00:00:00')) / 86400000);
    if(사이 >= 21 && 사이 <= 45){
      const 새 = Math.round((c.len + 사이) / 2);
      if(새 !== c.len){ 말 += ' · 주기를 ' + c.len + '일 → ' + 새 + '일로 맞췄어요'; c.len = 새; }
    }

}
/* 주기를 네 토막으로 나눈다 — **배란은 「다음 생리 14일 전」** 이라
   주기가 길어지면 난포기가 늘고 황체기는 14일 그대로다 (2026-10-01 대표 「4단계로 … 찾아보고」).
   ⛔ 주기가 짧으면 토막이 뒤집힌다 — 겹치지 않게 눌러 맞춘다. */
function cycSeg(c){
  const ovul = Math.max(c.period + 2, c.len - 14);       /* 배란일 */
  const 배란시작 = Math.max(c.period + 1, ovul - 1);
  const 배란끝   = Math.min(c.len, ovul + 1);
  const 난포끝   = 배란시작 - 1;
  return [
    ['월경기', 1, Math.min(c.period, c.len), 'p'],
    ['난포기', c.period + 1, 난포끝, 'f'],
    ['배란기', 배란시작, 배란끝, 'o'],
    ['황체기', 배란끝 + 1, c.len, 'l'],
  ].filter(x => x[2] >= x[1]);
}
function cycToday(c){
  if(!c||!c.on) return null;
  /* ⛔ 2026-10-01 — 여기에 `new Date('2026-08-28')` 이 박혀 있었다.
     날짜가 그날에 멈춰, 오늘이 며칠이든 같은 일차가 나왔다. **오늘을 쓴다.** */
  const base=new Date(c.last+'T00:00:00'), now=new Date(TODAY+'T00:00:00');
  const diff=Math.floor((now-base)/86400000);
  const day=((diff % c.len)+c.len)%c.len + 1;
  const seg=cycSeg(c);
  const 지금=seg.find(x=>day>=x[1]&&day<=x[2]) || seg[seg.length-1];
  const ph=지금[0];
  const why={ '월경기':'가볍게 · 컨디션 우선',
              '난포기':'힘이 붙는 때 · 증량하기 좋아요',
              '배란기':'힘은 가장 좋지만 인대가 느슨해지는 때',
              '황체기':'붓고 무거운 때 · 무게보다 횟수로' }[ph];
  const left=c.len-day+1;
  /* 다음 생리 예정일 — 달력에 ● 로 찍는다 */
  const 다음=new Date(base); 다음.setDate(다음.getDate()+Math.ceil((diff+1)/c.len)*c.len);
  return {day, ph, why, left, ovul:c.len-14, 다음: ymd(다음)};
}

          ${q.다름.length > 1 ? `<button class="all" data-act="scanuse:all">전부 종이 값으로</button>` : ''}</span>` : ''}
        ${q.n < 6 && !(q.다름||[]).length ? `<span class="w">읽은 칸이 적어요 — 사진이 잘 안 나왔을 수 있어요</span><button class="rs" data-act="scanpaper:${mid}">다시 찍기</button>` : ''}
        ${(q.숫자||[]).length ? `<span class="num"><b>숫자는 종이와 꼭 맞춰 보세요</b>${q.숫자.map(p => `<i>${esc(p[0])} <em>${esc(p[1])}</em></i>`).join('')}</span>` : ''}
        ${q.모름.length ? `<span class="w">글씨 확인: ${esc(q.모름.join(' · '))}</span>` : ''}${q.다른 ? `<span class="w">종이의 이름이 「${esc(q.다른)}」예요 — 다른 분의 상담지가 아닌지 확인해 주세요</span>` : ''}</div>` : '') +
      상자('기본', `<div class="grid2">${F('birth')}${F('height')}</div>${F('sex')}${F('job')}${F('jobenv')}${F('shift')}`)
    + 상자('글래드짐을 알게 된 경로', F('route'))
    + 상자('운동 · 생활', F('expr') + F('stress') + F('stressLv') + F('relief')
        + `<div class="fld"><span class="fn">취침 시간</span><input class="search" type="text" data-k="ikm:취침" placeholder="예) 23시 30분" value="${esc(d.meals['취침']||'')}"></div>`)
    + 상자('건강', F('cond') + F('hist') + F('histEtc'))
    + 상자('운동 가능 시간', F('time') + F('timeTxt'))
    + 상자('나의 식습관', `<div class="grid2">${MEAL_KEYS.filter(k => k !== '취침').map(k=>`<div class="fld"><span class="fn">${k}</span>
        <input class="search" type="text" data-k="ikm:${k}" value="${esc(d.meals[k]||'')}"></div>`).join('')}</div>`)
    + (S.who==='tr' ? 상자('원하는 것 · 특이사항', F('needs') + F('notes')) : 상자('원하는 것', F('needs'))),
    foot: `<button class="btn main" style="flex:1" data-act="saveintake:${mid}">저장</button>` };
}

/* ── 칼로리 계산기 (글래드짐 계산 시트 그대로) ── */
const ACT = { '저활동':0.25, '가벼운활동':0.375, '보통의활동':0.555, '적극적인 활동':0.725, '매우 적극적인 활동':0.9 };
const ACT_EX = {
  '저활동':'종일 앉아 있고 운동은 안 함',
  '가벼운활동':'주 1~3회 가볍게 운동',
  '보통의활동':'주 3~5회 운동',
  '적극적인 활동':'주 6~7회 운동, 또는 몸 쓰는 일',
  '매우 적극적인 활동':'매일 강하게 · 하루 두 번 · 육체노동',
};
const DEF_WKMAX = 1;                     /* 주당 감량 상한 % — 고칠 수 있다 */
const addDays = (ymd0, n) => { const d=new Date(ymd0+'T00:00:00'); d.setDate(d.getDate()+Math.round(n)); return ymd(d); };
const FAT_KCAL = 7700;   /* 지방 1kg */

function nnum(v){ const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; }

const FOODS = [
  {n:'밥 한 공기', k:300}, {n:'닭가슴살 100g', k:140}, {n:'계란 1개', k:78},
  {n:'고구마 중간 1개', k:130}, {n:'아몬드 20알', k:139}, {n:'바나나 1개', k:105},
];
function foodTxt(kcal){
  if(!kcal || kcal<=0) return '';
  const f = FOODS[0];
  const n = Math.round(kcal / f.k * 10) / 10;
  return `${f.n} ${n}개쯤`;
}

/* 「3개월」 「12주」 「90일」 「12월 2일」 「2026-12-02」 → 2026-12-02 */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function goalDate(txt){
  const t = String(txt||'').trim(); if(!t) return '';
  const base = new Date(TODAY+'T00:00:00');   /* 언제나 오늘이 기준 */
  let m;
  if((m = t.match(/^(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/)))
    return ymd(new Date(+m[1], +m[2]-1, +m[3]));
  if((m = t.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일?$/)) || (m = t.match(/^(\d{1,2})[-.\/](\d{1,2})$/))){
    const y = base.getFullYear();
    let d = new Date(y, +m[1]-1, +m[2]);
    if(d < base) d = new Date(y+1, +m[1]-1, +m[2]);
    return ymd(d);
  }
  if((m = t.match(/^(\d+)\s*일$/))){ const d=new Date(base); d.setDate(d.getDate()+ +m[1]); return ymd(d); }
  if((m = t.match(/^(\d+)\s*주$/))){ const d=new Date(base); d.setDate(d.getDate()+ +m[1]*7); return ymd(d); }
  if((m = t.match(/^(\d+)\s*(개월|달|월)?$/))){
    const d=new Date(base), day=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + +m[1]);
    const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day,last)); return ymd(d);
  }
  return '';
}
function dLeft(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')) return null;
  return Math.round((new Date(date+'T00:00:00') - new Date(TODAY+'T00:00:00'))/86400000);
}
function goalLine(g){
  const d = (g.to && g.to.date) || '';
  if(!d) return '<div class="note" style="padding:8px 10px">달력에서 목표 날짜를 선택해 주세요. 그날까지 맞춰 섭취 칼로리를 잡아 드립니다.</div>';
  const n = dLeft(d);
  return `<div class="note" style="padding:8px 10px">오늘부터 <b style="color:var(--gold)">${n>0?n+'일':(n===0?'오늘':'지난 날짜')}</b>
    ${n>0?` · 약 ${Math.round(n/7)}주`:''}</div>`;
}

/* 「1992-03-15」 「1992.3.15」 「19920315」 「920315」 → 1992-03-15 */
function birthYmd(t){
  const s0 = String(t||'').trim();
  const cy = +TODAY.slice(2,4);
  const ok = (y,m,d) => (y>=1900 && y<=+TODAY.slice(0,4) && m>=1 && m<=12 && d>=1 && d<=31)
    ? y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0') : '';
  let m0;
  if((m0 = s0.match(/^(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/))) return ok(+m0[1], +m0[2], +m0[3]);
  if((m0 = s0.match(/^(\d{2})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})\D?$/))){
    const yy = +m0[1]; return ok(yy<=cy?2000+yy:1900+yy, +m0[2], +m0[3]);
  }
  const n = s0.replace(/[^0-9]/g,'');
  if(n.length === 8) return ok(+n.slice(0,4), +n.slice(4,6), +n.slice(6,8));
  if(n.length === 6){ const yy = +n.slice(0,2); return ok(yy<=cy?2000+yy:1900+yy, +n.slice(2,4), +n.slice(4,6)); }
  return '';
}
function ageFrom(t){
  const d = birthYmd(t); if(!d) return 0;
  const b = d.split('-').map(Number), n = TODAY.split('-').map(Number);
  if(b[0] < 1900 || b[0] > n[0] || b[1] < 1 || b[1] > 12 || b[2] < 1 || b[2] > 31) return 0;
  let a = n[0] - b[0];
  if(n[1] < b[1] || (n[1] === b[1] && n[2] < b[2])) a--;
  return (a >= 0 && a <= 120) ? a : 0;
}
function ageTag(c){
  const a = ageFrom(c && c.birth);
  if(a) return `<b style="color:var(--gold)">만 ${a}세</b>`;
  if(c && String(c.birth||'').trim()) return `<b style="color:var(--warn)">날짜를 다시 봐 주세요</b>`;
  return '';
}

function calcOf(g){
  const c = g.calc || (g.calc = {});
  const w  = nnum(g.now && g.now.w), gw = nnum(g.to && g.to.w);
  const fp = nnum(g.now && g.now.fp);                 /* 체지방률 % */
  const h  = nnum(c.height), age = ageFrom(c.birth), male = (c.sex === '남');
  let bmr  = nnum(c.bmr), how = '인바디 값';
  const auto = !bmr;
  if(auto && w && fp > 0 && fp < 60){                 /* 체지방률을 알면 이게 더 정확 */
    const lbm = w * (1 - fp/100);
    bmr = Math.round(370 + 21.6 * lbm);
    how = '체지방률 기준';
  } else if(auto && w && h && age){
    bmr = Math.round(10*w + 6.25*h - 5*age + (male ? 5 : -161));
    how = '키·몸무게 기준';
  } else if(auto){ how = ''; }
  const k     = ACT[c.act] != null ? ACT[c.act] : 0.375;
  const actC  = Math.round(bmr * k);
  const total = bmr + actC;             /* 활동량에 운동까지 들어 있다 */

  /* 목표 날짜까지 남은 날 · 그날까지 맞추려면 하루 얼마를 덜 먹어야 하는지 */
  const goal   = (g.to && g.to.date) || '';
  const left   = dLeft(goal);
  const daysTo = (left != null && left > 0) ? left : 0;
  const need0  = (w && gw) ? (w - gw) * FAT_KCAL : 0;
  const dayNeed = (daysTo && need0 > 0) ? Math.round(need0 / daysTo) : 0;

  const floor = nnum(c.floor) || (male ? 1500 : 1200);
  const wkMax = nnum(c.wkmax) || DEF_WKMAX;

  let kcal = nnum(c.kcal);
  const kcalAuto = !kcal;
  if(kcalAuto) kcal = dayNeed ? Math.max(floor, Math.floor((total - dayNeed)/10)*10)
                              : Math.max(floor, Math.round((total - 500)/10)*10);
  const day  = total - kcal;

  /* 안전하게 잡았을 때 언제쯤 닿는지 */
  const dSafe = Math.max(0, Math.min(w ? w*(wkMax/100)*FAT_KCAL/7 : 0, total - floor));
  const safeDays = (need0 > 0 && dSafe > 0) ? Math.ceil(need0/dSafe) : null;
  const safeDate = safeDays ? addDays(TODAY, safeDays) : '';
  const hitDays  = (need0 > 0 && day > 0) ? Math.ceil(need0/day) : null;
  const hitDate  = hitDays ? addDays(TODAY, hitDays) : '';
  const week = day*7, month = day*30;
  let rc = nnum(c.rc)||50, rp = nnum(c.rp)||25, rf = nnum(c.rf)||25;
  let kk, gg;
  if(c.macro === 'kg' && w){                 /* 체중 기준 — 단백질부터 잡는다 */
    const pg = nnum(c.pkg) || 1.2, fg = nnum(c.fkg) || 0.9;
    const P = Math.round(w * pg), F = Math.round(w * fg);
    const kP = P*4, kF = F*9;
    const kC = Math.max(0, kcal - kP - kF);
    const C = Math.round(kC/4);
    gg = { c:C, p:P, f:F };
    kk = { c:Math.round(kC), p:kP, f:kF };
    rc = kcal?Math.round(kC/kcal*100):0; rp = kcal?Math.round(kP/kcal*100):0; rf = kcal?Math.round(kF/kcal*100):0;
  } else {
    kk = { c:Math.round(kcal*rc/100), p:Math.round(kcal*rp/100), f:Math.round(kcal*rf/100) };
    gg = { c:Math.round(kk.c/4), p:Math.round(kk.p/4), f:Math.round(kk.f/9) };
  }
  const need = need0;
  const days = hitDays;
  const bmi = (w && h) ? Math.round(w / Math.pow(h/100,2) * 10)/10 : 0;
  const bmiTo = (gw && h) ? Math.round(gw / Math.pow(h/100,2) * 10)/10 : 0;
  const perKg = w ? Math.round(gg.p / w * 10)/10 : 0;     /* 단백질 g/kg */
  const water = w ? Math.round(w*33/10)*10 : 0;           /* 물 ml */
  const wkPct = w ? (week/FAT_KCAL)/w*100 : 0;            /* 주당 감량 % */
  const warn = [];
  if(kcal && kcal < floor) warn.push(`하루 ${floor}kcal 아래입니다 — 안전 가이드보다 낮게 잡으셨습니다`);
  else if(kcal && bmr && kcal < bmr) warn.push('권장 칼로리가 기초대사량보다 낮습니다 — 오래 끌면 근육이 빠집니다');
  if(wkPct > wkMax) warn.push(`한 주에 체중의 ${Math.round(wkPct*10)/10}%가 빠지는 속도입니다 (가이드 ${wkMax}%)`);
  if(dayNeed && dayNeed > total - floor)
    warn.push(`이 날짜에 맞추려면 하루 ${dayNeed.toLocaleString()}kcal 를 줄여야 하는데, 최소 섭취 ${floor.toLocaleString()}kcal 를 지키면 ${Math.max(0,total-floor).toLocaleString()}kcal 까지가 한계입니다`);
  if(perKg && perKg < 1.0) warn.push(`단백질이 체중 1kg당 ${perKg}g입니다 — 근육을 지키려면 1.2g 이상을 권합니다`);
  if(day <= 0 && kcal && gw && w > gw) warn.push('지금 설정으로는 살이 빠지지 않습니다 — 섭취를 낮추거나 활동량을 올려 보세요');
  const tough = !!(warn.length && safeDate && daysTo && safeDays > daysTo);
  return { w, gw, fp, bmr, auto, how, k, actC, keep: total, total, kcal, kcalAuto, day, week, month,
    wkKg: week/FAT_KCAL, moKg: month/FAT_KCAL, rc, rp, rf, kk, gg, need, days,
    goal, daysTo, dayNeed, floor, wkMax, dSafe, safeDays, safeDate, hitDays, hitDate, tough,
    bmi, bmiTo, perKg, water, wkPct, warn };
}

function calcBrief(g, ed){
  const r = calcOf(g);
  if(!r.bmr) return '';
  const c = g.calc || {};
  const kg = v => (Math.round(v*100)/100).toFixed(1);
  return `<div class="calc" style="gap:12px">
    <div class="crow" style="border:none;padding:0"><span class="ck" style="font-size:14px;font-weight:700;color:var(--cream)">이렇게 계획했어요</span></div>
    <div class="krow"><span class="k">① 하루에 쓰는 양</span><span class="v">${r.total.toLocaleString()} kcal</span></div>
    <div class="krow"><span class="k">② 이만큼 드시면</span>${ed
      ? `<span class="kedit">
          <button class="stp" data-act="kcalstep:-50">−</button>
          <input class="kin" type="text" inputmode="numeric" data-k="pc:kcal" value="${esc(c.kcal||'')}" placeholder="${r.kcal}">
          <button class="stp" data-act="kcalstep:50">＋</button>
          <span class="ku">kcal</span></span>`
      : `<span class="v" style="color:var(--gold)">${r.kcal.toLocaleString()} kcal</span>`}</div>
    <div class="krow"><span class="k">③ 한 달에</span><span class="v" style="color:var(--gold)">${kg(r.moKg)} kg</span></div>
    ${r.goal && r.gw ? `<div class="krow"><span class="k">④ ${esc(r.goal)} 까지</span>
      <span class="v" style="color:${r.hitDate && r.hitDate<=r.goal ? 'var(--gold)' : 'var(--warn)'}">${
        !r.hitDate ? '안 빠짐' : (r.hitDate<=r.goal ? `${r.gw}kg 도착` : `${Math.round((r.w - (r.day*r.daysTo)/FAT_KCAL)*10)/10}kg 쯤`)}</span></div>` : ''}
    ${ed?`<div class="note" style="padding:8px 10px">숫자를 바꾸면 아래가 모두 따라 바뀝니다. 비우면 자동으로 잡습니다.</div>`:''}
    <div class="note">차이 <b>${r.day>0?r.day:0}kcal</b> 는 ${esc(foodTxt(r.day>0?r.day:0))} 입니다.
      하루 그만큼만 덜 드시면 한 달에 ${kg(r.moKg)}kg 이 빠집니다.</div>
  </div>`;
}

/* 보기 화면용 — 숫자는 `calcOf()` 그대로, 보여 주는 꼴만 다르다 (2026-10-07 융합). 수정 화면은 calcBrief + calcHTML 을 쓴다 */
function calcView(g){
  const r = calcOf(g), kg = v => (Math.round(v*10)/10).toFixed(1);
  if(!r.bmr) return `<div class="cyfoot"><span>${!r.w ? '몸무게를 입력하면 계산해 드려요' : '체지방률, 또는 생년월일과 키를 입력하면 계산해 드려요'}</span></div>`;
  const 도착 = !r.gw ? '' : !r.hitDate ? '안 빠짐' : (r.goal && r.hitDate > r.goal ? dateTxt(r.hitDate) : (r.goal ? '날짜 안에' : dateTxt(r.hitDate)));
  const 합 = (r.kk.c + r.kk.p + r.kk.f) || 1;
  return `
    <div class="kcv">
      <span class="kl">하루 이만큼 드세요</span>
      <span class="kb">${r.kcal ? r.kcal.toLocaleString() : '—'}<small>kcal</small></span>
      <span class="ks">${r.day > 0 ? `유지 ${r.total.toLocaleString()}에서 <b>${r.day.toLocaleString()}kcal</b> 줄인 값 · ${esc(foodTxt(r.day))}` : `유지 칼로리 ${r.total.toLocaleString()}kcal 과 같아요`}</span>
    </div>
    <div class="sstat3">
      <div><span class="k">한 달 예상</span><span class="v">${r.moKg > 0 ? '−'+kg(r.moKg) : '0'}<small>kg</small></span></div>
      <div><span class="k">목표까지</span><span class="v">${r.daysTo ? r.daysTo : '—'}<small>${r.daysTo ? '일' : ''}</small></span></div>
      <div class="t"><span class="k">${r.gw ? r.gw+'kg 도착' : '도착 예상'}</span><span class="v cyv" style="${(도착==='안 빠짐' || (r.goal && r.hitDate && r.hitDate > r.goal)) ? 'color:var(--warn)' : ''}">${도착 || '—'}</span></div>
    </div>
    <div class="kmac">
      <div class="kbar"><i style="flex:${r.kk.c/합};background:var(--gold)"></i><i style="flex:${r.kk.p/합};background:var(--teal)"></i><i style="flex:${r.kk.f/합};background:#b08968"></i></div>
      <div class="kleg">
        <span><i style="background:var(--gold)"></i><small>탄수화물 ${r.rc}%</small><b>${r.gg.c}<u>g</u></b></span>
        <span><i style="background:var(--teal)"></i><small>단백질 ${r.rp}%</small><b>${r.gg.p}<u>g</u></b></span>
        <span><i style="background:#b08968"></i><small>지방 ${r.rf}%</small><b>${r.gg.f}<u>g</u></b></span>
      </div>
    </div>
    <div class="megrp ikg">${[['기초대사량', r.bmr.toLocaleString()+' kcal'], ['유지 칼로리', r.total.toLocaleString()+' kcal'],
        ['한 주에', r.week > 0 ? r.week.toLocaleString()+' kcal · '+kg(r.wkKg)+'kg' : ''], ['단백질', r.perKg ? '체중 1kg당 '+r.perKg+'g' : ''],
        ['BMI', r.bmi ? r.bmi + (r.bmiTo ? ' → 목표 '+r.bmiTo : '') : ''], ['하루 물', r.water ? (r.water/1000).toFixed(1)+' L' : '']].filter(p=>p[1])

/* 글자 칸을 고치면 화면을 다시 그리지 않고 결과만 새로 쓴다 */
function calcSync(){
  const box = document.getElementById('calcout');
  if(!box) return;
  const g = GOALS[subj()] || {}; g.calc = g.calc || {}; g.now = g.now || {}; g.to = g.to || {};
  const gv = k => { const el=document.querySelector('[data-k="'+k+'"]'); return el ? el.value.trim() : undefined; };
  ['birth','height','bmr','kcal','floor','wkmax','rc','rp','rf','pkg','fkg'].forEach(k=>{ const v=gv('pc:'+k); if(v!==undefined) g.calc[k]=v; });
  const nw = gv('plnow:w');  if(nw!==undefined) g.now.w  = nw;
  const nf = gv('plnow:fp'); if(nf!==undefined) g.now.fp = nf;
  const tw = gv('plto:w');    if(tw!==undefined) g.to.w    = tw;
  const td = gv('plto:date'); if(td!==undefined) g.to.date = td;
  const ae = document.activeElement, ak = (ae && box.contains(ae)) ? ae.getAttribute('data-k') : null;
  const pos = ak ? ae.selectionStart : null;
  box.innerHTML = calcBrief(g,1) + calcHTML(g,1);
  if(ak){ const el = box.querySelector('[data-k="'+ak+'"]');
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} } }
}

/* ⭐ 리포트 양식 그대로 **네 방향** (2026-09-30 대표 「채워」).
   레퍼런스 — 이채현님 자료.hwp 「촬영사진 : 전면( ) 후면( ) 좌측( ) 우측( )」
   ⛔ 앞서는 3방향(정면·측면·후면)이라 **좌측·우측을 못 채웠다.**
      `body_photos` 가 0줄이라 바꿔도 잃을 자료가 없었다(2026-09-29 백업 확인). */
const POSES = ['전면','후면','좌측','우측'];
const phURL = p => 사진주소(p);
function bphOf(mid, kind, pose){
  return (D.bph||[]).filter(x => x.mid===mid && x.kind===(kind||'body') && (!pose || x.pose===pose))
    .sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
const mdTxt = d => d ? d.slice(5).replace('-','.') : '';

const num0 = v => (v==null || v==='') ? 0 : Number(v);
const dDiff = (a,b) => Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00')) / 86400000);

/* 그 사진 찍은 날에 가장 가까운 몸 상태 */
function logNear(mid, date){
  const ls = (D.blog && D.blog[mid]) || []; if(!ls.length) return null;
  let best = null, bd = 1e9;
  ls.forEach(x => { const d = Math.abs(dDiff(x.date, date)); if(d < bd){ bd = d; best = x; } });
  return bd <= 21 ? best : null;
}

function spine3(c){
  c = c || {};
  const P = [[30,2],[38,-1],[46,-4],[55,-5],[66,-4],[75,-1],[84,2],[92,0],[98,-1]];
  const neck = (c.c1==='b' || c.c2==='a') ? 4 : (c.c1==='a' || c.c2==='b') ? -2 : 0;  /* 거북목 / 일자목 */
  const thx  = c.t1==='a' ? -4 : c.t1==='b' ? 3 : 0;                                  /* 라운드백 / 플랫백 */
  const lum  = c.l1==='a' ? 4 : c.l1==='b' ? -4 : 0;                                  /* 전방경사 / 후방경사 */
  return P.map(([y,z]) => {
    if(y <= 40) z += neck;
    else if(y <= 66) z += thx;
    else if(y <= 92) z += lum;
    return [50, y, z];
  });
}
function ring3(y, rx, rz, n){
  const a = [];
  for(let i=0;i<n;i++){ const t = i/n*Math.PI*2; a.push([50+Math.cos(t)*rx, y, Math.sin(t)*rz]); }
  a.push(a[0]); return a;
}

function lrScale(checks){
  const items = BODY_TESTS.filter(t => t.a==='L' && t.b==='R');

/* ⑤ 몸 상태 이력 그래프 — 값이 붙어 있어도 보이게 아래위를 잘라 그립니다 */
function lineChart2(pts, unit, dec){
  const W=320, H=126, PL=14, PR=14, PT=28, PB=20, id = 'lc2' + (++그래프번호);

  if(mx - mn < 0.0001){ mn -= 1; mx += 1; }
  const pad = (mx-mn)*0.28; mn -= pad; mx += pad;
  const x = i => PL + i*(W-PL-PR)/Math.max(1, pts.length-1);
  const y = v => PT + (1 - (v-mn)/(mx-mn))*(H-PT-PB);
  const xs = pts.map((_,i)=>x(i)), ys = pts.map(p=>y(p.v)), d = 곡선길(xs, ys), n = pts.length;
  const f = v => (dec ? v.toFixed(dec) : String(Math.round(v)));
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d3a0" stop-opacity=".3"/><stop offset="1" stop-color="#f0d3a0" stop-opacity="0"/></linearGradient></defs>
    <line x1="${PL}" x2="${W-PR}" y1="${H-PB}" y2="${H-PB}" stroke="#3a3832" stroke-width=".8"/>
    <path d="${d} L ${xs[n-1].toFixed(1)} ${H-PB} L ${xs[0].toFixed(1)} ${H-PB} Z" fill="url(#${id})"/>

        <circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="4" fill="#1b1a18" stroke="var(--gold)" stroke-width="2.2"/>`
        : `<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.3" fill="#1b1a18" stroke="var(--gold-2)" stroke-width="1.3"/>`}
      <text x="${xs[i].toFixed(1)}" y="${Math.max(11,ys[i]-9).toFixed(1)}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}"

  </svg>`;
}

function ib변화(ls){
  const K = ['w','m','f'], BH = 74, PB = 30, GAP = 50, PX = 26;
  const n = ls.length, W = Math.max(PX*2 + (n-1)*GAP, 272), H = BH*K.length + PB;
  const x = i => n === 1 ? W/2 : PX + i*Math.max(GAP, (W - PX*2)/(n-1));      /* 기록이 적으면 칸 너비에 맞춰 벌린다 (왼쪽이 비어 보였다) */
  let g = '';
  K.forEach((k, r) => {

    if(!pts.length) return;

    if(mx - mn < 0.5){ mn -= 0.5; mx += 0.5; }
    const y = v => top + 26 + (1 - (v-mn)/(mx-mn)) * (BH - 38);
    const 색 = k === 'm' ? '#a9d8e6' : '#f0d3a0', xs = pts.map(p=>x(p.i)), ys = pts.map(p=>y(p.v)), d = pts.length > 1 ? 곡선길(xs, ys) : '';

  });

  return `<div class="ibch">
    <div class="lb">${K.map(k=>`<span>${BL_M[k].n}<i>${BL_M[k].u}</i></span>`).join('')}</div>
    <div class="sc"><svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;max-width:none">
      <defs>${K.map(k=>`<linearGradient id="ibg_${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${k==='m'?'#a9d8e6':'#f0d3a0'}" stop-opacity=".24"/><stop offset="1" stop-color="${k==='m'?'#a9d8e6':'#f0d3a0'}" stop-opacity="0"/></linearGradient>`).join('')}</defs>
      ${g}</svg></div></div>`;
}

/* 서버가 루킨바디에서 그 회원의 지난 측정을 찾아 몸 기록에 넣는다.
   답: { state:'ok'|'none'|'already', n }. 서버 쪽이 아직 없거나(인바디 목록 권한 대기) 실패하면 준비중으로 보인다 */
const IB_PULL = 'https://dash.gladgym.co.kr/hook/inbody-pull';
async function 인바디가져오기(mid){
  const r = await fetch(IB_PULL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ member_id: mid }) });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function ibPull(mid){
  let pc = 0, 끝 = false;
  openSheet(()=>`<div class="ibpull"><div class="ttl">지난 기록 가져오는 중</div>
    <div class="bar"><i id="ibbar"></i></div><div class="pc" id="ibpc">0%</div>
    <div class="sub">루킨바디에서 찾고 있어요</div></div>`);
  const 칠 = v => { const b = document.getElementById('ibbar'), t = document.getElementById('ibpc');
    if(b) b.style.width = v + '%'; if(t) t.textContent = Math.round(v) + '%'; };
  /* 답을 기다리는 동안 90%까지 천천히 — 답이 오면 100% */
  const tm = setInterval(() => { if(끝) return; pc += (90 - pc) * 0.12; 칠(pc); }, 120);
  const 적어도 = new Promise(r => setTimeout(r, 1200));
  let res;
  try{ res = await 인바디가져오기(mid); }catch(e){ res = { state:'wait' }; }
  await 적어도; 끝 = true; clearInterval(tm); 칠(100);
  if(res.state === 'ok' && res.n){
    try{ const rows = await Promise.race([sget('body_logs?select=*&member_id=eq.' + encodeURIComponent(mid) + '&order=on_date'),
        new Promise((_, no) => setTimeout(() => no(new Error('늦음')), 4000))]);
      D.blog = D.blog || {};
      D.blog[mid] = rows.map(r => ({ id:r.id, mid:r.member_id, date:r.on_date, w:num0(r.w), m:num0(r.m), f:num0(r.f), fp:num0(r.fp), note:r.note||'' }));
      S.ibA = S.ibB = null; }catch(e){}
  }
  await new Promise(r => setTimeout(r, 350));
  const 결과 = {
    ok:      ['✅', '성공', `지난 기록 ${res.n||0}건을 가져왔어요`],
    none:    ['📭', '지난 기록 없음', '루킨바디에 이 회원의 측정 기록이 없어요'],
    already: ['👌', '이미 가져왔음', '루킨바디 기록이 모두 들어와 있어요'],
    wait:    ['⏳', '연결 준비중', '인바디 연결을 마무리하고 있어요. 새로 재는 기록은 자동으로 들어와요'],
  }[res.state === 'ok' && !res.n ? 'already' : res.state] || ['⏳', '연결 준비중', '잠시 뒤 다시 눌러 주세요'];
  openSheet(()=>`<div class="ibpull">
    <div class="ico">${결과[0]}</div><div class="res">${결과[1]}</div><div class="sub">${결과[2]}</div></div>
    <button class="btn main sm" data-act="close">확인</button>`);
  render();
}

/* ④ 사진 위 기준선 */
const MARKS = ['귀','어깨','골반','무릎','복사뼈'];
function markSvg(pts){
  if(!pts || !pts.length) return '';
  const P = pts.map(q => [q.x*75, q.y*100]);
  const d = P.map((q,i)=> (i?'L':'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  return `<svg class="ov" viewBox="0 0 75 100">
    <line x1="${P[0][0].toFixed(1)}" y1="0" x2="${P[0][0].toFixed(1)}" y2="100"
      stroke="#8bbdd2" stroke-width="0.45" stroke-dasharray="2 2" opacity=".85"/>
    ${P.length>1?`<path d="${d}" fill="none" stroke="#e6c487" stroke-width="0.8" stroke-linejoin="round"/>`:''}
    ${P.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="1.5"
      fill="#e6c487" stroke="#241d12" stroke-width="0.4"/>`).join('')}
  </svg>`;
}
function angV(a, b){
  const dx = (b.x-a.x)*75, dy = (b.y-a.y)*100;
  if(!dy) return null;
  return Math.round(Math.abs(Math.atan2(dx, dy)) * 180/Math.PI * 10)/10;
}
function markTxt(pts){
  if(!pts || pts.length < 2) return '';
  const seg = [];
  const put = (i,j,n) => { if(pts[i] && pts[j]){ const a = angV(pts[i], pts[j]); if(a!=null) seg.push(`${n} <b>${a}°</b>`); } };
  put(0,1,'목(귀–어깨)'); put(1,2,'몸통(어깨–골반)'); put(2,4,'다리(골반–복사뼈)');
  return seg.length ? `<div class="note">수직선에서 벗어난 각도 — ${seg.join(' · ')}
    <br>측면 사진에서 <b>귀–어깨가 수직에 가까울수록</b> 목 부담이 적습니다.</div>` : '';
}
function markTap(ev, el){
  const M = S.bpMark; if(!M) return;
  if(M.pts.length >= MARKS.length){ toast('다섯 점을 다 찍었어요'); return; }
  const r = el.getBoundingClientRect();
  M.pts.push({ x: Math.max(0, Math.min(1, (ev.clientX - r.left)/r.width)),
               y: Math.max(0, Math.min(1, (ev.clientY - r.top)/r.height)) });
  drawSheet();
}
function sheetBpMark(id){
  const x = (D.bph||[]).find(y=>y.id===id); if(!x) return;
  S.bpMark = { id, pts: ((x.marks && x.marks.pts) || []).map(q=>({x:q.x, y:q.y})) };
  openSheet(()=>{
    const M = S.bpMark, n = M.pts.length;
    return `<div class="h2">기준선 그리기 <small>${esc(dateTxt(x.date))} · ${esc(x.pose)}</small></div>
      <div class="mkwrap" onclick="markTap(event,this)">

  });
}
