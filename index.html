<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131312">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="글래드짐">
<title>글래드짐 운동기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">

<style>
:root{
  --dark:#131312; --dark-2:#1c1c1a; --dark-3:#262623; --dark-4:#333330;
  --brown:#412921; --gold:#e6c487; --gold-2:#c9a96e; --gold-dim:#211c14;
  --teal:#9dcedc; --teal-dim:#16262b;
  --cream:#fdfaf6; --sub:#b5aca2; --line:#2e2e2a;
  --warn:#c98b7a; --stage:#0a0a09;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--stage);color:var(--cream);
  font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:500;line-height:1.6;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

#frame{width:100%;max-width:400px;height:min(860px,100vh);background:var(--dark);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  border:1px solid var(--line);border-radius:26px}
@media (max-width:440px){ #frame{max-width:none;height:100vh;height:100dvh;border:none;border-radius:0} }
@supports (padding: env(safe-area-inset-bottom)){
  #tabs{padding-bottom:calc(13px + env(safe-area-inset-bottom))}
  #foot{padding-bottom:calc(11px + env(safe-area-inset-bottom))}
  #top{padding-top:calc(13px + env(safe-area-inset-top))}
}

#top{background:#0e0e0d;border-bottom:1px solid var(--line);padding:13px 16px;
  display:flex;align-items:center;gap:11px;flex:none;min-height:52px}
#top .ttl{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
#top .ttl small{display:block;font-size:11.5px;font-weight:500;color:var(--gold-2);letter-spacing:0}
#top .sub{font-size:13px;font-weight:500;color:var(--sub);margin-left:auto;text-align:right}
#top .tm{font-size:15px;font-weight:700;color:var(--gold);margin-left:auto}
#top .back{font-size:20px;color:var(--sub);width:22px;flex:none;line-height:1}
#top .logo{font-size:10.5px;letter-spacing:.2em;color:var(--gold-2);font-weight:700;
  border:1px solid var(--line);border-radius:7px;padding:5px 8px;flex:none}
#top .logo:active{background:var(--dark-3)}

.search{background:var(--dark-3);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;font-size:14.5px;font-weight:500;color:var(--cream);width:100%}
.search::placeholder{color:#6f6a63}
.fld{display:flex;flex-direction:column;gap:6px}
.fld .fn{font-size:12.5px;font-weight:500;color:var(--sub)}
.req{color:var(--gold)}

#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:13px}
#foot{flex:none;border-top:1px solid var(--line);background:#0e0e0d;padding:11px 14px;display:flex;gap:9px}
#tabs{flex:none;border-top:1px solid var(--line);background:#0e0e0d;display:flex}
#tabs button{flex:1;padding:11px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;font-weight:500;color:#6d6a65}
#tabs button.on{color:var(--gold)}
#tabs button .ic{font-size:17px;line-height:1}
#tabs button .bd{position:absolute;transform:translate(13px,-3px);width:7px;height:7px;border-radius:50%;background:var(--teal)}

.lbl{font-size:13px;font-weight:500;color:var(--sub)}
.h1{font-size:21px;font-weight:900;letter-spacing:-.03em;line-height:1.3}
.h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
.h2 small{font-weight:500;color:var(--sub);font-size:13px}

.card{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;padding:14px;
  display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.card.gold{border-color:var(--gold-2);background:var(--gold-dim)}
.card.teal{border-color:#3a5b66;background:var(--teal-dim)}
.card.dim{opacity:.45}
.card .nm{font-size:15px;font-weight:700}
.card .nm.g{color:var(--gold)}
.card .nm.t{color:var(--teal)}
.card .sm{font-size:13px;font-weight:500;color:var(--sub);line-height:1.65}
.rowc{display:flex;align-items:center;gap:11px}
.rowc .rt{margin-left:auto;text-align:right;font-size:13px;font-weight:500;color:var(--sub);flex:none}

.tile{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;padding:15px;
  display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:13px;font-weight:500;color:var(--sub)}
.tile .v{font-size:27px;font-weight:900;letter-spacing:-.03em}
.tile .v.g{color:var(--gold)}
.tile .v small{font-size:14px;font-weight:500;color:var(--sub);letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.btn{flex:1;text-align:center;border-radius:12px;padding:14px 10px;font-size:15.5px;font-weight:700;
  letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--teal);color:#0d2027}
.btn.gold{background:var(--gold);color:#241a08}
.btn.sub{background:var(--dark-3);color:var(--teal);border:1px solid var(--line)}
.btn.ghost{background:var(--dark-2);color:var(--sub);border:1px solid var(--line)}
.btn.kakao{background:#FEE500;color:#1c1a17}
.btn:active{opacity:.72}
.btn[disabled]{opacity:.3}
.btn.sm{padding:10px 8px;font-size:13.5px}

.set{background:var(--dark-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.set .i{font-size:13px;font-weight:500;color:var(--sub);min-width:46px;flex:none}
.set .n{font-size:20px;font-weight:700;margin-left:auto}
.set .u{font-size:12.5px;font-weight:500;color:var(--sub)}
.set .sl{color:#4c4c46;font-weight:700;padding:0 2px}
.set.done{opacity:.42}
.set.now{border-color:var(--gold);background:var(--gold-dim)}
.set.now .n{color:var(--gold)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--dark-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:500;color:var(--sub)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.chip.t{color:var(--teal);border-color:#3a5b66}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--gold-dim);color:var(--gold);
  border:1px solid var(--gold-2);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;flex:none}
.pill.q{background:var(--dark-3);color:var(--sub);border-color:var(--line)}
.pill.t{background:var(--teal-dim);color:var(--teal);border-color:#3a5b66}

.desc{background:var(--dark-3);border:1px solid var(--line);border-radius:12px;padding:14px;
  display:flex;flex-direction:column;gap:9px}
.desc .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.desc .hd b{font-size:13.5px;font-weight:700}
.desc .tx{font-size:14px;font-weight:500;color:#ded9d2;line-height:1.85;white-space:pre-wrap}

.cm{background:var(--dark-2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;
  padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.cm .who{font-size:12.5px;font-weight:500;color:var(--teal)}
.cm .tx{font-size:14px;font-weight:500;color:#e0dbd4;line-height:1.8;white-space:pre-wrap}

.fbbtn{width:100%;text-align:left;background:var(--dark-2);border:1px solid var(--line);
  border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:12px 14px;
  display:flex;align-items:center;gap:9px}
.fbbtn .l{font-size:14.5px;font-weight:700;color:var(--teal)}
.fbbtn .r{font-size:13px;font-weight:500;color:var(--sub);margin-left:auto}

.demo{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;height:126px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  position:relative;overflow:hidden;flex:none}
.demo .fig{width:34px;height:56px;position:relative}
.demo .bar{position:absolute;left:-13px;right:-13px;height:5px;border-radius:3px;background:var(--gold);
  top:16px;animation:lift 1.9s ease-in-out infinite}
.demo .bod{position:absolute;left:9px;right:9px;top:20px;bottom:0;border-radius:8px 8px 4px 4px;background:#3d3d38}
.demo .cap{font-size:12.5px;font-weight:500;color:var(--sub);z-index:2;text-align:center;padding:0 12px}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){.demo .bar{animation:none}}

.vbox{background:#0e0e0d;border:1px solid var(--line);border-radius:12px;height:120px;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.vbox .play{width:42px;height:42px;border-radius:50%;background:var(--teal);color:#0d2027;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.vbox .cap{font-size:12px;font-weight:500;color:var(--sub);text-align:center;padding:0 8px}
.vbox.on .play{background:var(--dark-3);color:var(--teal)}
.pbox{background:#0e0e0d;border:1px solid var(--line);border-radius:12px;height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:12.5px;font-weight:500;color:var(--sub)}
.pbox .ic{font-size:19px}
.media2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:8px;background:var(--dark-2);display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:500;color:#7a766f}
.cal div.on{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-2);font-weight:700}
.cal div.hd{background:none;color:#5d5a55;font-size:11px}
.cal div.pad{background:none}

.graph{display:flex;align-items:flex-end;gap:7px;height:86px}
.graph i{flex:1;background:var(--dark-3);border-radius:4px 4px 0 0;min-height:4px}
.graph i.g{background:var(--gold)}
.glbl{display:flex;gap:7px}
.glbl span{flex:1;text-align:center;font-size:10.5px;color:#75726c;font-weight:500}

#sheet{position:absolute;inset:0;background:rgba(6,6,5,.74);display:none;align-items:flex-end;z-index:20}
#sheet.open{display:flex}
#sheetbox{background:var(--dark-2);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:9px 16px 20px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
#sheetbox .grip{width:44px;height:4px;border-radius:2px;background:#43433e;align-self:center;margin-bottom:4px;flex:none}

.ring{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;margin:2px auto;background:var(--dark-3);border:6px solid var(--gold)}
.ring .t{font-size:34px;font-weight:900;color:var(--gold);letter-spacing:-.03em}
.ring .c{font-size:12.5px;font-weight:500;color:var(--sub)}

.step{display:flex;align-items:center;gap:11px;background:var(--dark-3);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px}
.step .k{font-size:13px;font-weight:500;color:var(--sub);flex:none;min-width:36px}
.step .v{font-size:23px;font-weight:900;flex:1;text-align:center;letter-spacing:-.02em}
.step .v small{font-size:13px;font-weight:500;color:var(--sub)}
.step button{width:42px;height:42px;border-radius:10px;background:var(--dark-4);font-size:20px;
  font-weight:700;flex:none;display:flex;align-items:center;justify-content:center}
.step button:active{background:#45453f}

textarea,input[type=text]{width:100%;background:var(--dark-3);border:1px solid var(--line);border-radius:12px;
  padding:12px;color:var(--cream);font-family:inherit;font-size:14.5px;font-weight:500;line-height:1.8}
textarea{min-height:92px;resize:vertical}
textarea.tall{min-height:170px}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.empty{padding:30px 10px;text-align:center;color:#6d6a65;font-size:14px;font-weight:500;line-height:1.8}
.note{background:var(--dark-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  font-size:12.5px;font-weight:500;color:var(--sub);line-height:1.75}
.note b{color:var(--gold);font-weight:700}
.hr{height:1px;background:var(--line);margin:3px 0}

/* 방금 담긴 것 — 눈에 띄게 */
@keyframes pop{0%{transform:scale(.97);opacity:.4}60%{transform:scale(1.01)}100%{transform:scale(1);opacity:1}}
.card.just{border-color:var(--gold);background:var(--gold-dim);animation:pop .32s ease-out}
.card.just .nm{color:var(--gold)}
.card.done2{border-color:#3a5b66;background:var(--teal-dim)}
.card.done2 .nm{color:var(--teal)}

/* 운동 중 돌아가기 띠 */
.backbar{background:var(--gold-dim);border:1px solid var(--gold-2);border-radius:12px;
  padding:12px 14px;display:flex;align-items:center;gap:9px;width:100%;text-align:left}
.backbar .l{font-size:14.5px;font-weight:700;color:var(--gold)}
.backbar .r{margin-left:auto;font-size:13px;font-weight:500;color:var(--gold-2)}

/* 스플래시 */
#splash{position:absolute;inset:0;background:var(--dark);z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;
  transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .logo{font-size:13px;letter-spacing:.34em;color:var(--gold-2);font-weight:700;margin-bottom:26px}
#splash .copy{font-size:25px;font-weight:900;letter-spacing:-.035em;line-height:1.5;text-align:center;color:var(--cream)}
#splash .rule{width:44px;height:1px;background:var(--gold-2);margin:26px 0}
#splash .mission{position:absolute;bottom:38px;left:0;right:0;text-align:center;
  font-size:12px;font-weight:500;color:#6f6a63;line-height:1.9}
#splash .mission b{display:block;font-size:10.5px;letter-spacing:.24em;color:#57534d;font-weight:700;margin-bottom:5px}

/* 체크리스트 · 폼 */
.frow{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.frow .fk{font-size:13px;font-weight:500;color:var(--sub);min-width:88px;flex:none;padding-top:2px}
.frow .fv{font-size:14px;font-weight:500;flex:1;line-height:1.7;white-space:pre-wrap}
.frow .fv.none{color:#5f5c57}
.ckrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.ckrow:last-child{border-bottom:none}
.ckrow .t{font-size:13.5px;font-weight:500;flex:1}
.ckrow .opts{display:flex;gap:6px;flex:none}
.ck{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--sub);background:var(--dark-3)}
.ck.on{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);font-weight:700}

/* 사진 슬롯 */
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.slot{background:#0e0e0d;border:1px dashed var(--line);border-radius:11px;height:112px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:12px;font-weight:500;color:var(--sub);text-align:center;padding:6px}
.slot.on{border-style:solid;border-color:var(--gold-2);background:var(--gold-dim);color:var(--gold)}
.slot .ic{font-size:19px}

/* 주기 막대 */
.cyc{display:flex;gap:3px;height:34px;border-radius:9px;overflow:hidden}
.cyc div{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#6f6a63;background:var(--dark-3)}
.cyc div.p{background:#2a1d1a;color:var(--warn)}
.cyc div.g{background:var(--gold-dim);color:var(--gold)}
.cyc div.l{background:var(--teal-dim);color:var(--teal)}
.cyc div.now{outline:2px solid var(--gold);outline-offset:-2px}
.cyclbl{display:flex;gap:3px}
.cyclbl span{flex:1;text-align:center;font-size:10.5px;color:#75726c;font-weight:500}

#toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--dark-4);
  border:1px solid var(--line);border-radius:11px;padding:11px 17px;font-size:13.5px;font-weight:700;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .22s;z-index:30}
#toast.on{opacity:1}
</style>

</head>
<body>
<div id="frame">
  <div id="splash">
    <div class="logo">GLAD GYM</div>
    <div class="copy">소중한 나를 위한<br>선택</div>
    <div class="rule"></div>
    <div class="mission"><b>MISSION</b>모든 사람이 운동을 잘하게 돕는다</div>
  </div>
  <div id="top"></div><div id="main"></div><div id="foot"></div><div id="tabs"></div>
  <div id="sheet"><div id="sheetbox"></div></div><div id="toast"></div>
</div>

<script>
"use strict";

/* ═══ 종목 사전 ═══
   종목 하나에 「벌」이 하나 이상. 잡는 법·타겟이 다르면 벌을 나눈다.
   벌마다 기본 설명과 시범 영상이 따로 붙는다.                        */
let EX = [];
const PARTS = ['가슴','등','어깨','하체','복근','팔','유산소','기타'];
const exOf = id => EX.find(x=>x.id===id) || {id:'?',n:'?',p:'?',vars:[{k:'a',n:'',desc:''}]};

let MEMBERS = [];
let TRAINER = '양인수';

/* 체형분석 체크리스트 — 플래너 7쪽 */
const BODY_TESTS = [
  {g:'경추', k:'c1', t:'하부경추 각도', a:'50도 이상 일자목', b:'50도 미만 거북목'},
  {g:'경추', k:'c2', t:'상부경추 각도', a:'145도 이상 거북목', b:'145도 미만 일자목'},
  {g:'경추', k:'c3', t:'좌우 회전', a:'L', b:'R'},
  {g:'경추', k:'c4', t:'경추 굴곡 / 신전', a:'굴곡', b:'신전'},
  {g:'어깨', k:'s1', t:'애플리 스크래치', a:'상방제한', b:'하방제한'},
  {g:'어깨', k:'s2', t:'충돌 테스트 엠프티 캔', a:'L', b:'R'},
  {g:'어깨', k:'s3', t:'충돌 테스트 풀 캔', a:'L', b:'R'},
  {g:'어깨', k:'s4', t:'라운드 숄더', a:'L', b:'R'},
  {g:'어깨', k:'s5', t:'상완골 전방 활주', a:'L', b:'R'},
  {g:'어깨', k:'s6', t:'내회전 / 외회전 제한', a:'내회전', b:'외회전'},
  {g:'흉추', k:'t1', t:'흉추 형태', a:'라운드백', b:'플랫백'},
  {g:'흉추', k:'t2', t:'회전 테스트 40도', a:'L', b:'R'},

function agoTxt(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  const dayOf = x => x.getFullYear()*10000 + (x.getMonth()+1)*100 + x.getDate();
  const gap = dayOf(now) - dayOf(d);
  if(gap === 0) return (now - d) < 3600000 ? '방금' : '오늘';
  if(gap === 1) return '어제';
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
}

/* ── ★ 운동 중 ── */
async function newLive(title, items, kind, rid){
  const id='w'+Date.now();
  D.live={ id, mid:S.mid, title, kind:kind||'개인운동', rid:rid||null, date:TODAY, startAt:Date.now(), items, cur:0 };
  save(); go('workout');
  await sv(spost('workouts',[{ id, member_id:S.mid, on_date:TODAY, kind:D.live.kind,
    routine_id:rid||null, title, dur:0, done:false }]), '운동 시작');
  for(let i=0;i<items.length;i++) await svNewItem(i);
  D.workouts.unshift({ id, mid:S.mid, date:TODAY, kind:D.live.kind, rid:rid||null, title, dur:0, done:false,
    items: items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, sec:0, locked:false, sets:[] })) });
  save(); render();
}
async function svNewItem(i){
  const w=D.live; if(!w) return; const it=w.items[i]; if(!it || it._id) return;
  const back = await sv(spost('workout_items',
    [{ workout_id:w.id, sort:i, variant_id:VID(it.ex,it.va), sec:0, locked:false }], {ret:true}), '종목 추가');
  if(back && back[0]) it._id = back[0].id;
  save();
}
async function svItem(i){
  const w=D.live; if(!w) return; const it=w.items[i]; if(!it) return;
  if(!it._id) await svNewItem(i);
  if(!it._id) return;
  await sv(spatch('workout_items','id=eq.'+it._id,
    { sec:Math.round(it.sec||0), locked:!!it.locked, sort:i }), '종목 저장');
  await sv(sdel('workout_sets','item_id=eq.'+it._id), '세트 정리');
  const rows = it.sets.filter(x=>x.done).map((x,k)=>({ item_id:it._id, sort:k,
    kg:x.kg, reps:x.reps, spd: x.spd==null ? null : x.spd, done:true }));
  if(rows.length) await sv(spost('workout_sets', rows), '세트 저장');
  const sw = D.workouts.find(x=>x.id===w.id);
  if(sw){ const si = sw.items.find(x=>x._id===it._id);
    if(si){ si.sec=Math.round(it.sec||0); si.locked=!!it.locked;
      si.sets = it.sets.filter(x=>x.done).map(x=>({kg:x.kg,reps:x.reps,spd:x.spd})); } }
  save();
}
function itemsFromRoutine(r){
  return r.items.map(it=>({ ex:it.ex, va:it.va, rest:it.rest||60, locked:false, sec:0, startAt:Date.now(),
    sets:[{kg:it.kg, reps:it.reps, spd:exOf(it.ex).cardio?6.5:undefined, done:false}] }));
}
function vWorkout(){
  const w=live(); if(!w) return vHome();
  if(!w.items.length) return {
    top: bar('운동 중', `<span class="tm" id="tm">${mmss((Date.now()-w.startAt)/1000)}</span>`, 'go:home'),
    body:`<div class="empty">종목을 담아 주세요</div>`,
    foot:`<button class="btn sub" data-act="go:pick">운동 추가</button><button class="btn ghost" data-act="askcancel">그만두기</button>` };
  const cur=w.items[w.cur]||w.items[0], e=exOf(cur.ex), v=varOf(cur.ex,cur.va);
  const openIdx=cur.sets.findIndex(s=>!s.done), times=partTimes(w);
  const cms=cmOf(S.mid,cur.ex,cur.va), nw=cms.filter(c=>!c.read).length, dsc=descOf(S.mid,cur.ex,cur.va);
  return {
    top: bar(e.n, `<span class="tm" id="tm">${mmss((Date.now()-w.startAt)/1000)}</span>`, 'go:home', v.n||''),
    keepScroll:true, body:`
    ${v.demo?`<div class="demo"><div class="fig"><div class="bar"></div><div class="bod"></div></div>
      <span class="cap">시범 영상 자리${v.n?` — ${esc(v.n)}`:''}</span></div>`:''}
    <button class="fbbtn" data-act="exd:${cur.ex}:${cur.va}">
      <span class="l">${nw?'새 코멘트가 있어요':'운동 설명 · 코멘트'}</span>
      ${nw?'<span class="pill t">NEW</span>':''}
      <span class="r">${dsc?'설명':'설명 없음'}${cms.length?` · 코멘트 ${cms.length}`:''} ›</span></button>
    <span class="lbl">${esc(e.p)} · ${w.cur+1}번째 종목 / 전체 ${w.items.length}</span>
    ${cur.sets.map((s,i)=>`<button class="set ${s.done?'done':(i===openIdx?'now':'')}" data-act="edit:${i}">
      <span class="i">${i+1}${e.cardio?'구간':'세트'}</span>
      ${e.cardio
        ? `<span class="n">${s.reps}</span><span class="u">분</span><span class="sl">/</span>
           <span class="n" style="margin-left:0">${s.spd||0}</span><span class="u">km/h</span>`
        : `<span class="n">${kgfmt(s.kg)}</span><span class="u">kg</span><span class="sl">/</span>
           <span class="n" style="margin-left:0">${s.reps}</span><span class="u">회</span>`}
    </button>`).join('')}
    <div style="display:flex;gap:9px">
      <button class="btn gold" data-act="rep">${e.cardio?'구간 ＋':'반복 ＋'}</button>
      <button class="btn ghost" data-act="undo" ${cur.sets.length<2?'disabled':''}>되돌리기</button></div>
    <div class="hr"></div><span class="lbl">오늘 종목</span>
    ${w.items.map((it,i)=>`<button class="card rowc ${it.locked?'dim':''} ${S.just===VID(it.ex,it.va)?'just':''}" data-act="jump:${i}" style="padding:11px 13px">
      <div><div class="nm" style="font-size:14px">${it.locked?'🔒 ':''}${esc(exName(it.ex,it.va))}</div>
      <div class="sm">${it.locked?`${mmss(it.sec)} · ${it.sets.length}세트 마침`:(i===w.cur?'하는 중':`${it.sets.length}세트`)}</div></div>
      ${i===w.cur&&!it.locked?'<span class="pill">지금</span>':'<span class="rt">›</span>'}</button>`).join('')}
    <button class="btn sub" data-act="go:pick" style="margin-top:2px">운동 추가</button>
    ${Object.keys(times).length?`<div class="note">${Object.entries(times).map(([k,val])=>`${k} ${durTxt(val)}`).join(' · ')} — <b>종목을 끝낼 때마다</b> 저절로 쌓입니다</div>`:''}
    <button class="btn ghost" data-act="askcancel" style="margin-top:4px">이 운동 취소</button>`,
    foot:`<button class="btn sub" data-act="rest">휴식 타이머</button>
          <button class="btn main" data-act="fin">${cur.locked?'운동 끝내기':'종목 종료'}</button>` };
}

/* ── 생리주기 ── */
function svCycle(mid){
  const c=D.cycle[mid]; if(!c) return;
  return sv(spost('cycles',[{ member_id:mid, enabled:!!c.on, last_start:c.last,
    cyc_len:c.len, period_len:c.period, updated_at:new Date().toISOString() }], {on:'member_id'}), '생리주기 저장');
}
function cycOf(mid){ return (D.cycle&&D.cycle[mid]) || null; }
function cycToday(c){
  if(!c||!c.on) return null;
  const base=new Date(c.last+'T00:00:00'), now=new Date('2026-08-28T00:00:00');
  const diff=Math.floor((now-base)/86400000);
  const day=((diff % c.len)+c.len)%c.len + 1;
  const ovul=c.len-14;
  let ph, why;
  if(day<=c.period){ ph='생리기'; why='가볍게 · 컨디션 우선'; }
  else if(day<=ovul+1){ ph='황금기'; why='힘이 가장 잘 나는 때 · 증량하기 좋아요'; }
  else { ph='황체기'; why='붓고 무거운 때 · 무게보다 횟수로'; }
  const left=c.len-day+1;
  return {day, ph, why, left, ovul};
}
function cycBar(c){
  const t=cycToday(c); if(!t) return '';
  let cells='', labels='';
  const seg=[['생리기',1,c.period,'p'],['황금기',c.period+1,t.ovul+1,'g'],['황체기',t.ovul+2,c.len,'l']];
  seg.forEach(([nm,a,b,cls])=>{
    const w=b-a+1, now=(t.day>=a&&t.day<=b);
    cells+=`<div class="${cls}${now?' now':''}" style="flex:${w}">${nm}</div>`;
    labels+=`<span style="flex:${w}">${a}~${b}일</span>`;
  });
  return `<div class="cyc">${cells}</div><div class="cyclbl">${labels}</div>`;
}

    <textarea data-k="${pre}:${f.k}">${esc(v||'')}</textarea></div>`;
  if(f.t==='one')   return `<div class="fld"><span class="fn">${esc(f.n)}</span>
    <div class="chips">${f.o.map(x=>`<button class="chip ${v===x?'on':''}" data-act="pick1:${pre}:${f.k}:${x}">${esc(x)}</button>`).join('')}</div></div>`;

  return `<div class="fld"><span class="fn">${esc(f.n)}</span>

/* ═══ 동작 ═══ */
document.addEventListener('input', ev=>{
  const f = ev.target.closest('[data-filter]');
  if(!f) return;
  const q = (f.value||'').trim().toLowerCase();
  document.querySelectorAll('[data-nm]').forEach(el=>{
    el.style.display = (!q || el.getAttribute('data-nm').toLowerCase().includes(q)) ? '' : 'none';
  });
});

document.addEventListener('click', ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.getAttribute('data-act'), [k,...rest]=a.split(':'), w=live();
  switch(k){
    case 'kakao': toast('실제 연동은 다음 단계입니다'); return;
    case 'retry': S.screen='boot'; render(); start(); return;
    case 'switch': S.stack=[]; S.who=null; go('login'); return;
    case 'back': goBack(); return;
    case 'sub2': S.subj=rest[1]; go(rest[0]); return;

    /* 상담일지 · 운동계획 편집 */
    case 'editintake': S.subj=rest[0]; go('intake_edit'); return;
    case 'editplan': S.subj=rest[0]; go('plan_edit'); return;
    case 'pick1': { const [pre,k,val]=rest;
      const d = pre==='ik' ? (D.intake[subj()]||(D.intake[subj()]={})) : (GOALS[subj()]||(GOALS[subj()]={}));
      d[k] = (d[k]===val) ? '' : val; render(); return; }
    case 'pickn': { const [pre,k,val]=rest;
      const d = pre==='ik' ? (D.intake[subj()]||(D.intake[subj()]={})) : (GOALS[subj()]||(GOALS[subj()]={}));
      const a = Array.isArray(d[k]) ? d[k] : (d[k]=[]);
      const i = a.indexOf(val); if(i>=0) a.splice(i,1); else a.push(val);
      render(); return; }
    case 'saveintake': {
      const mid=rest[0], d=D.intake[mid]||(D.intake[mid]={});
      INTAKE_FIELDS.forEach(f=>{
        if(f.t==='text'||f.t==='area'){
          const el=document.querySelector('[data-k="ik:'+f.k+'"]');
          if(el) d[f.k]=el.value.trim();
        }
      });
      d.meals=d.meals||{};
      MEAL_KEYS.forEach(k=>{ const el=document.querySelector('[data-k="ikm:'+k+'"]'); if(el) d.meals[k]=el.value.trim(); });
      if(S.draft) Object.keys(S.draft).forEach(k=>{ if(k.startsWith('ik:')||k.startsWith('ikm:')) delete S.draft[k]; });
      sv(spost('intake',[{ member_id:mid, data:d, updated_at:new Date().toISOString() }], {on:'member_id'}), '상담일지 저장');
      toast('저장했습니다'); S.subj=mid; go('intake'); return; }
    case 'saveplan': {
      const mid=rest[0], g=GOALS[mid]||(GOALS[mid]={});
      g.now=g.now||{}; g.to=g.to||{};
      const gv=k=>{ const el=document.querySelector('[data-k="'+k+'"]'); return el?el.value.trim():''; };
      ['goal','work','diet','kcal','ratio','wk','mo'].forEach(k=>{ g[k]=gv('pg:'+k); });
      ['date','w','m','f','fp'].forEach(k=>{ g.now[k]=gv('plnow:'+k); g.to[k]=gv('plto:'+k); });
      g.vows = gv('pg:vows').split('\n').map(x=>x.trim()).filter(Boolean);
      g.promises = gv('pg:promises').split('\n').map(x=>x.trim()).filter(Boolean);
      if(S.draft) Object.keys(S.draft).forEach(k=>{ if(k.startsWith('pg:')||k.startsWith('plnow:')||k.startsWith('plto:')) delete S.draft[k]; });
      sv(spost('plans',[{ member_id:mid, data:g, updated_at:new Date().toISOString() }], {on:'member_id'}), '운동계획 저장');
      toast('저장했습니다'); S.subj=mid; go('plan'); return; }

    /* 루틴 만들기 · 고치기 */
    case 'rblank': { const mid=S.tmid||'m1', rs=myRoutines(mid), id='r'+Date.now(), no=rs.length+1;
      D.routines.push({ id, mid, no, n:'새 루틴 '+no, purpose:'', items:[] });
      sv(spost('routines',[{ id, member_id:mid, no, name:'새 루틴 '+no, purpose:'' }]), '루틴 만들기');
      S.redit=id; toast('빈 루틴을 만들었어요'); go('t_redit'); return; }
    case 'rsavename': { const r=rOf(rest[0]); if(!r) return;
      const nEl=document.querySelector('[data-k="rn:'+r.id+'"]'), pEl=document.querySelector('[data-k="rp:'+r.id+'"]');
      if(nEl) r.n=nEl.value.trim()||r.n;
      if(pEl) r.purpose=pEl.value.trim();
      if(S.draft){ delete S.draft['rn:'+r.id]; delete S.draft['rp:'+r.id]; }
      sv(spatch('routines','id=eq.'+r.id,{ name:r.n, purpose:r.purpose }), '루틴 저장');
      toast('저장했습니다'); render(); return; }
    case 'raddex': S.redit=rest[0]; go('t_pickex'); return;
    case 'rpart': S.pickPart=rest[0]; render(); return;
    case 'raddv': { const [rid,ex,va]=rest, r=rOf(rid); if(!r) return;
      r.items.push({ ex, va, kg: exOf(ex).cardio?0:20, reps: exOf(ex).cardio?20:10, sets:3, rest:60 });
      svRoutineItems(rid);
      S.just = VID(ex,va);
      clearTimeout(S.justT);
      S.justT = setTimeout(()=>{ S.just=null; if(S.screen==='t_pickex') render(); }, 2600);
      toast(exName(ex,va)+' 담았어요 · ' + r.items.length + '개');
      render(); return; }
    case 'ritem': sheetRitem(rest[0], +rest[1]); return;
    case 'rd2': { const [rid,i,f,dv]=rest, r=rOf(rid); if(!r) return;
      const it=r.items[+i]; if(!it) return;
      if(f==='kg') it.kg=Math.max(0, Math.round((it.kg+(+dv))*10)/10);
      else if(f==='rest') it.rest=Math.max(0, (it.rest||0)+(+dv));
      else it[f]=Math.max(1, (it[f]||0)+(+dv));
      svRoutineItems(rid); drawSheet(); render(); return; }
    case 'rmove': { const [rid,i,dv]=rest, r=rOf(rid); if(!r) return;
      const a=+i, b=a+(+dv); if(b<0||b>=r.items.length) return;
      const tmp=r.items[a]; r.items[a]=r.items[b]; r.items[b]=tmp;
      svRoutineItems(rid); closeSheet(); render(); return; }
    case 'rdelitem': { const [rid,i]=rest, r=rOf(rid); if(!r) return;
      r.items.splice(+i,1); svRoutineItems(rid); closeSheet(); toast('뺐어요'); render(); return; }
    case 'rdone': { S.just=null; toast('루틴을 저장했어요'); go('t_routines'); return; }
    case 'rdel': { const rid=rest[0];
      D.routines = D.routines.filter(x=>x.id!==rid);
      Object.keys(D.today).forEach(m=>{ if(D.today[m].rid===rid) delete D.today[m]; });
      sv(sdel('routines','id=eq.'+rid), '루틴 지우기');
      toast('루틴을 지웠어요'); go('t_routines'); return; }
    case 'newmem': S.nm_sex='여'; go('newmem'); return;
    case 'nmsex': S.nm_sex=rest[0]; render(); return;
    case 'nmsave': {
      const g=k=>{ const el=document.querySelector('input[data-k="nm:'+k+'"]'); return (el&&el.value||'').trim(); };
      const name=g('name');
      if(!name){ toast('이름을 적어 주세요'); return; }
      const id='m'+Date.now(), tr=g('tr')||TRAINER;
      const intake={ age:g('age'), height:g('height'), sex:S.nm_sex||'', meals:{}, route:[], relief:[], cond:[], hist:[], time:[] };
      const plan={ goal:'', work:'', diet:'', purpose:[], now:{}, to:{}, vows:[], promises:[] };
      MEMBERS.push({id, n:name, tr});
      D.intake[id]=intake; GOALS[id]=plan;
      if(S.draft){ ['name','age','height','phone4','tr'].forEach(k=>delete S.draft['nm:'+k]); }
      sv(spost('members',[{ id, name, role:'member', trainer:tr, phone4:g('phone4')||null }])
        .then(()=>Promise.all([
          spost('intake',[{ member_id:id, data:intake }], {on:'member_id'}),
          spost('plans',[{ member_id:id, data:plan }], {on:'member_id'})
        ])), '회원 만들기');
      S.who='tr'; S.tmid=id; S.subj=id; toast(name+' 회원을 만들었어요');
      go('t_member'); return;
    }
    case 'as':
      if(rest[0]==='tr'){ S.who='tr'; go('t_members'); }
      else { S.who='m'; S.mid=rest[0]; S.tab='home'; go('home'); } return;
    case 'reset': reset(); toast('처음 상태로 되돌렸습니다'); return;
    case 'go': go(rest[0]); return;
    case 'tab': S.tab=rest[0]; go(rest[0]); return;
    case 'close': S.editDesc=null; closeSheet(); return;

    case 'rt': S.rid=rest[0]; go('routine'); return;
    case 'rec': S.wid=rest[0]; go('record'); return;
    case 'exd': S.vplay=null; S.editDesc=null; sheetExDesc(rest[0], rest[1], rest[2]); return;
    case 'editdesc': { const K=rest[0]+'|'+rest[1]; if(S.draft) delete S.draft['desc:'+K]; S.editDesc=K; drawSheet(); return; }
    case 'canceldesc': if(S.draft&&S.editDesc) delete S.draft['desc:'+S.editDesc]; S.editDesc=null; drawSheet(); return;
    case 'savedesc': {
      const [ex,va,mid]=rest, K=ex+'|'+va;
      const ta=document.querySelector('textarea[data-k="desc:'+K+'"]');
      const txt=(ta&&ta.value||'').trim();
      D.desc[dkey(mid,ex,va)]=txt;
      if(S.draft) delete S.draft['desc:'+K];
      S.editDesc=null;
      sv(spost('member_desc',[{ member_id:mid, variant_id:VID(ex,va), descr:txt,
        updated_at:new Date().toISOString() }], {on:'member_id,variant_id'}), '설명 저장');
      toast('이 회원용 설명으로 저장했습니다'); drawSheet(); return; }
    case 'att': { const A=att(rest[1]); A[rest[0]]=!A[rest[0]]; drawSheet(); return; }
    case 'sendcm': {
      const [ex,va,mid]=rest, K=ex+'|'+va;
      const ta=document.querySelector('textarea[data-k="cm:'+K+'"]');
      const tx=(ta&&ta.value||'').trim(), A=att(K);
      if(!tx && !A.pic && !A.vid){ toast('적거나 붙인 것이 없어요'); return; }
      const cid='c'+Date.now();
      D.cm.unshift({id:cid, mid, ex, va, tr:TRAINER, at:'방금',
        tx: tx||'영상 보고 자세 확인해 보세요', pics:A.pic?1:0, vids:A.vid?1:0, read:false});
      if(S.att) delete S.att[K]; if(S.draft) delete S.draft['cm:'+K]; if(ta) ta.value='';
      sv(spost('comments',[{ id:cid, member_id:mid, variant_id:VID(ex,va), trainer:TRAINER,
        body: tx||'영상 보고 자세 확인해 보세요', pics:A.pic?1:0, vids:A.vid?1:0 }]), '코멘트 보내기');
      toast('보냈습니다 · 회원 화면에 바로 떠요'); drawSheet(); return; }
    case 'play': S.vplay=rest[0]; drawSheet(); return;
    case 'fbm': S.fbMode=rest[0]; render(); return;
    case 'sub': S.subj=S.mid; go(rest[0]); return;
    case 'tsub': S.subj=rest[1]; S.tmid=rest[1]; go(rest[0]); return;
    case 'bck': { const [mid,tk,v]=rest;
      D.body=D.body||{}; const b=D.body[mid]||(D.body[mid]={date:'2026-08-28',checks:{},photos:{},memo:''});
      b.checks=b.checks||{};
      if(b.checks[tk]===v) delete b.checks[tk]; else b.checks[tk]=v;
      sv(spost('body_checks',[{ member_id:mid, on_date:b.date||TODAY, checks:b.checks,
        photos:b.photos||{}, memo:b.memo||'', updated_at:new Date().toISOString() }], {on:'member_id'}), '체형분석 저장');
      render(); return; }
    case 'ph': { const [w2,mid]=rest;
      D.body=D.body||{}; const b=D.body[mid]||(D.body[mid]={date:'2026-08-28',checks:{},photos:{},memo:''});
      b.photos=b.photos||{}; b.photos[w2]=b.photos[w2]?0:1;
      sv(spost('body_checks',[{ member_id:mid, on_date:b.date||TODAY, checks:b.checks||{},
        photos:b.photos, memo:b.memo||'', updated_at:new Date().toISOString() }], {on:'member_id'}), '사진 저장');
      toast(b.photos[w2]?'사진을 넣었어요':'뺐어요'); render(); return; }
    case 'cycon': { const mid=rest[0]; D.cycle=D.cycle||{};
      D.cycle[mid]={on:true, last:TODAY, len:28, period:5};
      svCycle(mid); toast('주기를 켰어요'); render(); return; }
    case 'cycoff': { const mid=rest[0];
      if(D.cycle&&D.cycle[mid]) D.cycle[mid].on=false;
      svCycle(mid); toast('껐어요 — 트레이너에게도 안 보입니다'); render(); return; }
    case 'cycstart': { const mid=rest[0]; D.cycle=D.cycle||{};
      const c=D.cycle[mid]||(D.cycle[mid]={on:true,len:28,period:5});
      c.last=TODAY; c.on=true; svCycle(mid); toast('오늘로 기록했어요'); render(); return; }
    case 'qa': go('qa'); return;
    case 'fbp': S.fbPart=rest[0]; render(); return;
    case 'newvar': sheetNewVar(rest[0]); return;
    case 'savevar': {
      const ex=rest[0];
      const ni=document.querySelector('input[data-k="vn:'+ex+'"]');
      const di=document.querySelector('textarea[data-k="vd:'+ex+'"]');
      const n=(ni&&ni.value||'').trim();
      if(!n){ toast('이름을 적어 주세요'); return; }
      const vk='x'+Date.now(), desc=(di&&di.value||'').trim();
      const e0=EX.find(x=>x.id===ex);
      if(e0) e0.vars.push({k:vk, n, desc, demo:0});
      if(S.draft){ delete S.draft['vn:'+ex]; delete S.draft['vd:'+ex]; }
      sv(spost('variants',[{ id:VID(ex,vk), ex_id:ex, vkey:vk, name:n, descr:desc,
        demo:false, sort:(e0?e0.vars.length:0) }]), '하는 법 추가');
      toast('추가했습니다'); closeSheet(); render(); return; }

    case 'startr': { const r=rOf(rest[0]), t=D.today[r.mid];
      newLive(`루틴 ${r.no} · ${r.n}`, itemsFromRoutine(r), (t&&t.rid===r.id)?t.kind:'개인운동', r.id); return; }
    case 'again': { const src=D.workouts.find(x=>x.id===rest[0]);
      newLive('지난 운동 그대로', src.items.map(it=>({ ex:it.ex, va:it.va, rest:60, locked:false, sec:0, startAt:Date.now(),
        sets:[{kg:it.sets[0].kg, reps:it.sets[0].reps, spd:it.sets[0].spd, done:false}] })), '개인운동'); return; }
    case 'empty': newLive('빈 운동', [], '개인운동'); return;

    case 'part': S.pickPart=rest[0]; render(); return;
    case 'pickvar': sheetPickVar(rest[0]); return;
    case 'add': { const [ex,va]=rest;
      if(!w) newLive('빈 운동', [], '개인운동');
      const last=lastSet(ex,va);
      live().items.push({ ex, va, rest:60, locked:false, sec:0, startAt:Date.now(),
        sets:[ exOf(ex).cardio ? {kg:0, reps:last?last.reps:20, spd:(last&&last.spd)?last.spd:6.5, done:false}
                               : {kg:last?last.kg:20, reps:last?last.reps:10, done:false} ] });
      live().cur=live().items.length-1; save();
      S.just = VID(ex,va); clearTimeout(S.justT);
      S.justT = setTimeout(()=>{ S.just=null; render(); }, 2600);
      toast(exName(ex,va)+' 추가했어요'); go('workout');
      svNewItem(live().items.length-1).then(()=>{
        const sw=D.workouts.find(x=>x.id===live().id);
        if(sw) sw.items.push({ _id:live().items[live().items.length-1]._id, ex, va, sec:0, locked:false, sets:[] });
      });
      return; }
    case 'jump': { const i=+rest[0];
      if(w.items[i].locked){ toast('끝난 종목입니다. 고치려면 한 번 더'); w.items[i].locked=false; save(); }
      w.cur=i; save(); render(); return; }
    case 'edit': sheetEdit(+rest[0]); return;
    case 'd': { const [f,i,dv]=rest, s=w.items[w.cur].sets[+i];
      if(f==='kg') s.kg=Math.max(0, Math.round((s.kg+(+dv))*10)/10);
      else if(f==='spd') s.spd=Math.max(0, Math.round(((s.spd||0)+(+dv))*10)/10);
      else s.reps=Math.max(1, s.reps+(+dv));
      save(); drawSheet(); render(); return; }
    case 'done': w.items[w.cur].sets[+rest[0]].done=true; save(); closeSheet(); render(); return;
    case 'undone': w.items[w.cur].sets[+rest[0]].done=false; save(); closeSheet(); render(); return;
    case 'rep': { const cur=w.items[w.cur], last=cur.sets[cur.sets.length-1];
      last.done=true; cur.sets.push({kg:last.kg, reps:last.reps, spd:last.spd, done:false});
      save(); render(); return; }
    case 'undo': { const cur=w.items[w.cur]; if(cur.sets.length<2) return;
      cur.sets.pop(); cur.sets[cur.sets.length-1].done=false; save(); toast('한 세트 되돌렸어요'); render(); return; }
    case 'rest': sheetRest(); return;
    case 'askcancel': sheetCancel(); return;
    case 'rp': S.rest={sec:+rest[0], until:null}; drawSheet(); return;
    case 'rd': { if(S.rest.until) S.rest.until+=(+rest[0])*1000; else S.rest.sec=Math.max(10,S.rest.sec+(+rest[0])); drawSheet(); return; }
    case 'rgo': S.rest.until=Date.now()+S.rest.sec*1000; drawSheet(); return;
    case 'rskip': S.rest=null; closeSheet(); return;
    case 'fin': { const cur=w.items[w.cur];
      if(!cur.locked){
        cur.sets.forEach(s=>s.done=true); cur.locked=true;
        cur.sec=(cur.sec||0)+(Date.now()-cur.startAt)/1000;
        const doneIdx=w.cur;
        const nxt=w.items.findIndex(it=>!it.locked);
        svItem(doneIdx);
        if(nxt>=0){ w.cur=nxt; w.items[nxt].startAt=Date.now(); save(); toast('잠갔습니다 · 다음 종목'); render(); return; }
        save(); render();
      }
      sheetFinish(); return; }
    case 'dofin': closeSheet(); finish(); return;
    case 'trec': S.wid=rest[0]; go('record'); return;
    case 'resume': {
      const i=D.workouts.findIndex(x=>x.id===rest[0]);
      if(i<0){ toast('되돌릴 수 없어요'); return; }
      const rec=D.workouts[i];
      D.workouts.splice(i,1);
      D.live={ id:rec.id, mid:rec.mid, title:rec.title||'이어서 하는 운동', kind:rec.kind, rid:rec.rid, date:rec.date,
        startAt: Date.now() - rec.dur*1000, cur: Math.max(0, rec.items.length-1),
        items: rec.items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, rest:60, locked:true, sec:it.sec, startAt:Date.now(),
          sets: it.sets.map(x=>({kg:x.kg, reps:x.reps, spd:x.spd, done:true})) })) };
      rec.done=false; D.workouts.unshift(rec);
      sv(spatch('workouts','id=eq.'+rec.id,{ done:false }), '이어서 하기');
      save(); toast('이어서 하실 수 있어요'); go('workout'); return; }
    case 'cancel': { const id=live()&&live().id;
      D.live=null; save();
      if(id){ D.workouts=D.workouts.filter(x=>x.id!==id); sv(sdel('workouts','id=eq.'+id), '운동 지우기'); }
      toast('운동을 취소했어요'); go('home'); return; }

    case 'tm': S.tmid=rest[0]; go('t_member'); return;
    case 'tlive': S.tmid=rest[0]; go('t_live'); return;
    case 'tw': S.twid=rest[0]; go('t_write'); return;
    case 'rm': S.tmid=rest[0]; render(); return;
    case 're': S.redit=rest[0]; go('t_redit'); return;
    case 'assign': { const r=rOf(rest[0]);
      D.today[r.mid]={rid:r.id, kind:rest[1], by:'트레이너'};
      sv(spost('assignments',[{ member_id:r.mid, on_date:TODAY, routine_id:r.id,
        kind:rest[1], assigned_by:'트레이너' }], {on:'member_id,on_date'}), '지정 저장');
      toast(`오늘 ${rest[1]}으로 지정했습니다`); render(); return; }
    case 'unassign': { const mid=rest[0]; delete D.today[mid];
      sv(sdel('assignments','member_id=eq.'+mid+'&on_date=eq.'+TODAY), '지정 풀기');
      toast('지정을 풀었습니다'); render(); return; }
    case 'rnew': { const mid=S.tmid||'m1', rs=myRoutines(mid), src=rs[0];
      if(!src){ toast('복제할 루틴이 없어요'); return; }
      const id='r'+Date.now(), nm=src.n+' (복제)';
      const items=JSON.parse(JSON.stringify(src.items));
      D.routines.push({id, mid, no:rs.length+1, n:nm, purpose:src.purpose, items});
      sv(spost('routines',[{ id, member_id:mid, no:rs.length+1, name:nm, purpose:src.purpose||'' }])
        .then(()=>spost('routine_items', items.map((it,i)=>({ routine_id:id, sort:i,
          variant_id:VID(it.ex,it.va), kg:it.kg, reps:it.reps, sets:it.sets, rest:it.rest })))), '루틴 만들기');
      S.redit=id; toast('복제했습니다'); go('t_redit'); return; }
  }
});

async function finish(){
  const w=live(), done=w.items.filter(it=>it.sets.some(s=>s.done)||it.locked);
  if(!done.length){
    await sv(sdel('workouts','id=eq.'+w.id), '운동 지우기');
    D.workouts=D.workouts.filter(x=>x.id!==w.id);
    D.live=null; save(); toast('기록할 세트가 없어요'); go('home'); return; }
  done.forEach(it=>{ if(!it.locked){ it.locked=true; it.sec=(it.sec||0)+(Date.now()-it.startAt)/1000; } });
  const dur=Math.round((Date.now()-w.startAt)/1000);
  for(let i=0;i<w.items.length;i++) await svItem(i);
  await sv(spatch('workouts','id=eq.'+w.id, { done:true, dur, kind:w.kind }), '운동 저장');
  const rec={ id:w.id, mid:w.mid, date:w.date||TODAY, kind:w.kind, rid:w.rid, title:w.title, dur, done:true,
    items: w.items.filter(it=>it.sets.some(s=>s.done)).map(it=>({ _id:it._id, ex:it.ex, va:it.va, locked:true,
      sec:Math.round(it.sec), sets: it.sets.filter(s=>s.done).map(s=>({kg:s.kg, reps:s.reps, spd:s.spd})) })) };
  const i0=D.workouts.findIndex(x=>x.id===w.id);
  if(i0>=0) D.workouts[i0]=rec; else D.workouts.unshift(rec);
  D.live=null; save(); S.wid=rec.id; go('summary');
}

function hideSplash(){
  const sp=document.getElementById('splash');
  if(!sp) return;
  sp.classList.add('out'); setTimeout(()=>{ if(sp.parentNode) sp.remove(); }, 600);
}

async function start(){
  try{
    const t0=Date.now();
    await boot();
    const wait=Math.max(0, 1500-(Date.now()-t0));
    setTimeout(hideSplash, wait);
    render();
  }catch(e){
    S.screen='err'; S.errMsg=String(e && e.message || e);
    hideSplash(); render();
  }
}

/* 서버에서 바뀐 것 따라오기 */
const isTyping = () => { const a=document.activeElement; return a && (a.tagName==='TEXTAREA'||a.tagName==='INPUT'); };
let pollSig='';
setInterval(async ()=>{
  if(document.hidden || S.screen==='boot' || S.screen==='err' || !MEMBERS.length) return;
  try{
    const [cms, wks] = await Promise.all([
      sget('comments?select=*&order=created_at.desc&limit=300'),
      sget('workouts?select=*&order=on_date.desc&limit=80')
    ]);
    const sig = cms.map(c=>c.id+(c.read_at?'1':'0')).join(',') + '|' +
                wks.map(w=>w.id+(w.done?'1':'0')+w.dur).join(',');
    if(sig===pollSig) return;
    const first = !pollSig;
    pollSig=sig;
    D.cm = mapCm(cms);
    const ids = wks.map(w=>"'"+w.id+"'").join(',');
    let witems=[], wsets=[];
    if(ids){
      witems = await sget('workout_items?select=*&workout_id=in.('+ids+')&order=sort');
      const iids = witems.map(i=>i.id).join(',');
      if(iids) wsets = await sget('workout_sets?select=*&item_id=in.('+iids+')&order=sort');
    }
    D.workouts = mapWorkouts(wks, witems, wsets);
    if(D.live){
      const mine = D.workouts.find(w=>w.id===D.live.id);
      if(!mine){ D.live=null; save(); }
    }
    if(!first && !isTyping()){ try{ render(); if(sheetRender) drawSheet(); }catch(e){ console.error('그리기', e); } }
  }catch(e){ console.error('poll', e); }
}, 4000);

render();
start();
</script>
