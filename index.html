/* ═══ 동작 ═══ */
document.addEventListener('input', ev=>{
  const k = ev.target.getAttribute && ev.target.getAttribute('data-k');
  if(k && (k.startsWith('pc:') || k==='plnow:w' || k==='plnow:fp' || k==='plto:w' || k==='plto:date')){ calcSync(); }
  if(k === 'pc:birth'){
    const el=document.getElementById('agenow');
    if(el) el.innerHTML = ageTag({ birth: ev.target.value.trim() });
  }
  if(k === 'plto:date'){
    const box=document.getElementById('godate');
    if(box) box.innerHTML = goalLine({ to:{ date: ev.target.value.trim() } });
  }
  const f = ev.target.closest('[data-filter]');
  if(!f) return;
  const q = (f.value||'').trim().toLowerCase();
  document.querySelectorAll('[data-nm]').forEach(el=>{
    el.style.display = (!q || el.getAttribute('data-nm').toLowerCase().includes(q)) ? '' : 'none';
  });
});

document.addEventListener('click', ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.getAttribute('data-act'), [k,...rest]=a.split(':'), w=live();
  switch(k){
    case 'kakao': toast('실제 연동은 다음 단계입니다'); return;
    case 'retry': S.screen='boot'; render(); start(); return;
    case 'switch': S.stack=[]; S.who=null; go('login'); return;
    case 'back': goBack(); return;
    case 'ttab': S.ttab=rest[0]; go(rest[0]); return;
    case 'tfm': S.tfeed=rest[0]; render(); return;
    case 'tfm2': S.tfeed=rest[0]; S.ttab='t_feed'; go('t_feed'); return;
    case 'pickmem': sheetPickMember(); return;
    case 'pickasg': sheetPickAssign(); return;
    case 'tassign': S.tmid=rest[0]; closeSheet(); go('t_routines'); return;
    case 'shot': shotPick(); return;
    case 'slot': S.shotSlot=rest[0]; drawSheet(); return;
    case 'shotup': uploadMeal(); return;
    case 'dday': S.dietDay=rest[0]; render(); return;
    case 'meal': sheetMeal(rest[0]); return;
    case 'mealkcal': { const id=rest[0], m=(D.meals||[]).find(x=>x.id===id); if(!m) return;
      const gv=k=>{ const el=document.querySelector('[data-k="'+k+':'+id+'"]'); return el?nnum(el.value):0; };
      m.kcal=gv('ek'); m.carb=gv('ec'); m.protein=gv('ep'); m.fat=gv('ef');
      sv(spatch('meals','id=eq.'+id,{ kcal:m.kcal||null, carb:m.carb||null, protein:m.protein||null, fat:m.fat||null }), '칼로리 저장');
      toast('저장했어요'); drawSheet(); render(); return; }
    case 'mealnote': { const id=rest[0], m=(D.meals||[]).find(x=>x.id===id); if(!m) return;
      const el=document.querySelector('[data-k="mn:'+id+'"]'); const txt=el?el.value.trim():'';
      m.note=txt;
      sv(spatch('meals','id=eq.'+id,{ trainer_note:txt }), '식단 코멘트');
      toast('보냈습니다'); drawSheet(); render(); return; }
    case 'mealdel': { const id=rest[0], m=(D.meals||[]).find(x=>x.id===id); if(!m) return;
      D.meals=D.meals.filter(x=>x.id!==id);
      sv(sdel('meals','id=eq.'+id), '식단 지우기');
      if(m.path) fetch(SB_URL+'/storage/v1/object/media/'+m.path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}).catch(()=>{});
      closeSheet(); toast('지웠어요'); render(); return; }
    case 'tstartask': S.tmid=rest[0]; sheetStartSession(rest[0]); return;
    case 'tstart': {
      const [mid, rid, kind] = rest;
      closeSheet(); S.tmid=mid; S.subj=mid;
      if(rid && rid!=='0'){ const r=rOf(rid);
        newLive(`루틴 ${r.no} · ${r.n}`, itemsFromRoutine(r), kind, r.id, mid, '트레이너'); }
      else newLive('수업', [], kind, null, mid, '트레이너');
      return; }
    case 'tgo': { const mid=rest[0];
      if(!adoptLive(mid)){ toast('진행 중인 운동이 없어요'); return; }
      S.tmid=mid; S.subj=mid; go('workout'); return; }
    case 'sub2': S.subj=rest[1]; go(rest[0]); return;

    /* 상담일지 · 운동계획 편집 */
    case 'editintake': S.subj=rest[0]; go('intake_edit'); return;
    case 'editplan': S.subj=rest[0]; go('plan_edit'); return;
    case 'pick1': { const [pre,k,val]=rest;
      const d = pre==='ik' ? (D.intake[subj()]||(D.intake[subj()]={})) : (GOALS[subj()]||(GOALS[subj()]={}));
      d[k] = (d[k]===val) ? '' : val; render(); return; }
    case 'pickn': { const [pre,k,val]=rest;
      const d = pre==='ik' ? (D.intake[subj()]||(D.intake[subj()]={})) : (GOALS[subj()]||(GOALS[subj()]={}));
      const a = Array.isArray(d[k]) ? d[k] : (d[k]=[]);
      const i = a.indexOf(val); if(i>=0) a.splice(i,1); else a.push(val);
      render(); return; }
    case 'saveintake': {
      const mid=rest[0], d=D.intake[mid]||(D.intake[mid]={});
      INTAKE_FIELDS.forEach(f=>{
        if(f.t==='text'||f.t==='area'){
          const el=document.querySelector('[data-k="ik:'+f.k+'"]');
          if(el) d[f.k]=el.value.trim();
        }
      });
      d.meals=d.meals||{};
      MEAL_KEYS.forEach(k=>{ const el=document.querySelector('[data-k="ikm:'+k+'"]'); if(el) d.meals[k]=el.value.trim(); });
      if(S.draft) Object.keys(S.draft).forEach(k=>{ if(k.startsWith('ik:')||k.startsWith('ikm:')) delete S.draft[k]; });
      sv(spost('intake',[{ member_id:mid, data:d, updated_at:new Date().toISOString() }], {on:'member_id'}), '상담일지 저장');
      toast('저장했습니다'); S.subj=mid; go('intake'); return; }
    case 'kcalstep': {
      const g=GOALS[subj()]||(GOALS[subj()]={}); g.calc=g.calc||{};
      calcSync();
      const cur=calcOf(g).kcal;
      const nv=String(Math.max(0, Math.round((cur+Number(rest[0]))/10)*10));
      g.calc.kcal=nv; S.draft=S.draft||{}; S.draft['pc:kcal']=nv;
      const box=document.getElementById('calcout');
      if(box) box.innerHTML = calcBrief(g,1)+calcHTML(g,1);
      return; }
    case 'pc1': { const [k,v]=rest;
      const g=GOALS[subj()]||(GOALS[subj()]={}); g.calc=g.calc||{};
      calcSync();
      g.calc[k] = (String(g.calc[k])===String(v)) ? '' : v;
      render(); return; }
    case 'saveplan': {
      const mid=rest[0], g=GOALS[mid]||(GOALS[mid]={});
      g.now=g.now||{}; g.to=g.to||{};
      const gv=k=>{ const el=document.querySelector('[data-k="'+k+'"]'); return el?el.value.trim():''; };
      ['goal','work','diet','kcal','ratio','wk','mo'].forEach(k=>{ g[k]=gv('pg:'+k); });
      const was = ['w','m','f','fp'].map(k=>String(g.now[k]==null?'':g.now[k]));
      ['w','m','f','fp'].forEach(k=>{ g.now[k]=gv('plnow:'+k); });
      const now2 = ['w','m','f','fp'].map(k=>String(g.now[k]==null?'':g.now[k]));
      if(!g.now.date || was.join('|')!==now2.join('|')) g.now.date = TODAY;   /* 잰 날 */
      g.to.w = gv('plto:w');
      g.to.date = gv('plto:date');
      ['m','f','fp','when'].forEach(k=>{ delete g.to[k]; });
      g.calc = g.calc || {};
      ['birth','height','bmr','kcal','floor','wkmax','rc','rp','rf','pkg','fkg'].forEach(k=>{ const el=document.querySelector('[data-k="pc:'+k+'"]'); if(el) g.calc[k]=el.value.trim(); });
      /* 상담일지에 비어 있으면 같이 채워 둔다 (있는 값은 덮어쓰지 않는다) */
      const ik = D.intake[mid] || (D.intake[mid] = {});
      let ikDirty = false;
      [['birth', g.calc.birth], ['height', g.calc.height], ['sex', g.calc.sex]].forEach(x=>{
        if(x[1] && !String(ik[x[0]]||'').trim()){ ik[x[0]] = String(x[1]); ikDirty = true; }
      });
      if(ikDirty) sv(spost('intake',[{ member_id:mid, data:ik, updated_at:new Date().toISOString() }], {on:'member_id'}), '상담일지 채우기');
      const rr = calcOf(g);
      g.kcal = String(rr.kcal||''); g.ratio = `${rr.rc} / ${rr.rp} / ${rr.rf}`;
      g.wk = (Math.round(rr.wkKg*100)/100)+'kg'; g.mo = (Math.round(rr.moKg*100)/100)+'kg';
      g.vows = gv('pg:vows').split('\n').map(x=>x.trim()).filter(Boolean);
      g.promises = gv('pg:promises').split('\n').map(x=>x.trim()).filter(Boolean);
      if(S.draft) Object.keys(S.draft).forEach(k=>{ if(k.startsWith('pg:')||k.startsWith('plnow:')||k.startsWith('plto:')||k.startsWith('pc:')) delete S.draft[k]; });
      sv(spost('plans',[{ member_id:mid, data:g, updated_at:new Date().toISOString() }], {on:'member_id'}), '운동계획 저장');
      toast('저장했습니다'); S.subj=mid; go('plan'); return; }

    /* 루틴 만들기 · 고치기 */
    case 'rblank': { const mid=S.tmid||'m1', rs=myRoutines(mid), id='r'+Date.now(), no=rs.length+1;
      D.routines.push({ id, mid, no, n:'새 루틴 '+no, purpose:'', items:[] });
      sv(spost('routines',[{ id, member_id:mid, no, name:'새 루틴 '+no, purpose:'' }]), '루틴 만들기');
      S.redit=id; toast('빈 루틴을 만들었어요'); go('t_redit'); return; }
    case 'rsavename': { const r=rOf(rest[0]); if(!r) return;
      const nEl=document.querySelector('[data-k="rn:'+r.id+'"]'), pEl=document.querySelector('[data-k="rp:'+r.id+'"]');
      if(nEl) r.n=nEl.value.trim()||r.n;
      if(pEl) r.purpose=pEl.value.trim();
      if(S.draft){ delete S.draft['rn:'+r.id]; delete S.draft['rp:'+r.id]; }
      sv(spatch('routines','id=eq.'+r.id,{ name:r.n, purpose:r.purpose }), '루틴 저장');
      toast('저장했습니다'); render(); return; }
    case 'raddex': S.redit=rest[0]; go('t_pickex'); return;
    case 'rpart': S.pickPart=rest[0]; render(); return;
    case 'raddv': { const [rid,ex,va]=rest, r=rOf(rid); if(!r) return;
      r.items.push({ ex, va, kg: exOf(ex).cardio?0:20, reps: exOf(ex).cardio?20:10, sets:3, rest:60 });
      svRoutineItems(rid);
      S.just = VID(ex,va);
      clearTimeout(S.justT);
      S.justT = setTimeout(()=>{ S.just=null; if(S.screen==='t_pickex') render(); }, 2600);
      toast(exName(ex,va)+' 담았어요 · ' + r.items.length + '개');
      render(); return; }
    case 'ritem': sheetRitem(rest[0], +rest[1]); return;
    case 'rd2': { const [rid,i,f,dv]=rest, r=rOf(rid); if(!r) return;
      const it=r.items[+i]; if(!it) return;
      if(f==='kg') it.kg=Math.max(0, Math.round((it.kg+(+dv))*10)/10);
      else if(f==='rest') it.rest=Math.max(0, (it.rest||0)+(+dv));
      else it[f]=Math.max(1, (it[f]||0)+(+dv));
      svRoutineItems(rid); drawSheet(); render(); return; }
    case 'rmove': { const [rid,i,dv]=rest, r=rOf(rid); if(!r) return;
      const a=+i, b=a+(+dv); if(b<0||b>=r.items.length) return;
      const tmp=r.items[a]; r.items[a]=r.items[b]; r.items[b]=tmp;
      svRoutineItems(rid); closeSheet(); render(); return; }
    case 'rdelitem': { const [rid,i]=rest, r=rOf(rid); if(!r) return;
      r.items.splice(+i,1); svRoutineItems(rid); closeSheet(); toast('뺐어요'); render(); return; }
    case 'rdone': { S.just=null; toast('루틴을 저장했어요'); go('t_routines'); return; }
    case 'rdel': { const rid=rest[0];
      D.routines = D.routines.filter(x=>x.id!==rid);
      Object.keys(D.today).forEach(m=>{ if(D.today[m].rid===rid) delete D.today[m]; });
      sv(sdel('routines','id=eq.'+rid), '루틴 지우기');
      toast('루틴을 지웠어요'); go('t_routines'); return; }
    case 'newmem': S.nm_sex='여'; go('newmem'); return;
    case 'nmsex': S.nm_sex=rest[0]; render(); return;
    case 'nmsave': {
      const g=k=>{ const el=document.querySelector('input[data-k="nm:'+k+'"]'); return (el&&el.value||'').trim(); };
      const name=g('name');
      if(!name){ toast('이름을 적어 주세요'); return; }
      const id='m'+Date.now(), tr=g('tr')||TRAINER;
      const intake={ age:g('age'), height:g('height'), sex:S.nm_sex||'', meals:{}, route:[], relief:[], cond:[], hist:[], time:[] };
      const plan={ goal:'', work:'', diet:'', purpose:[], now:{}, to:{}, vows:[], promises:[] };
      MEMBERS.push({id, n:name, tr});
      D.intake[id]=intake; GOALS[id]=plan;
      if(S.draft){ ['name','age','height','phone4','tr'].forEach(k=>delete S.draft['nm:'+k]); }
      sv(spost('members',[{ id, name, role:'member', trainer:tr, phone4:g('phone4')||null }])
        .then(()=>Promise.all([
          spost('intake',[{ member_id:id, data:intake }], {on:'member_id'}),
          spost('plans',[{ member_id:id, data:plan }], {on:'member_id'})
        ])), '회원 만들기');
      S.who='tr'; S.ttab='t_members'; S.tmid=id; S.subj=id; toast(name+' 회원을 만들었어요');
      go('t_member'); return;
    }
    case 'as':
      if(rest[0]==='tr'){ S.who='tr'; S.ttab='t_today'; go('t_today'); }
      else { S.who='m'; S.mid=rest[0]; S.tab='home'; go('home'); } return;
    case 'reset': reset(); toast('처음 상태로 되돌렸습니다'); return;
    case 'go': { if(rest[0]==='workout' && !D.live) adoptLive(S.mid); go(rest[0]); return; }
    case 'dpick': S.day = rest[0]; render(); return;
    case 'anap': S.anaP = rest[0]; render(); return;
    case 'anag': S.anaG = rest[0]; render(); return;
    case 'anab': S.anaB = rest[0]; render(); return;
    case 'dmove': {
      const d = new Date((S.day||TODAY)+'T00:00:00');
      d.setDate(d.getDate() + Number(rest[0]));
      const n = ymd(d);
      if(n > TODAY) return;                 /* 앞날은 안 봅니다 */
      S.day = n; render(); return; }
    case 'tab': S.tab=rest[0]; go(rest[0]); return;
    case 'close': S.editDesc=null; closeSheet(); return;

    case 'rt': S.rid=rest[0]; go('routine'); return;
    case 'rec': S.wid=rest[0]; go('record'); return;
    case 'exd': S.vplay=null; S.editDesc=null; sheetExDesc(rest[0], rest[1], rest[2]); return;
    case 'editdesc': { const K=rest[0]+'|'+rest[1]; if(S.draft) delete S.draft['desc:'+K]; S.editDesc=K; drawSheet(); return; }
    case 'canceldesc': if(S.draft&&S.editDesc) delete S.draft['desc:'+S.editDesc]; S.editDesc=null; drawSheet(); return;
    case 'savedesc': {
      const [ex,va,mid]=rest, K=ex+'|'+va;
      const ta=document.querySelector('textarea[data-k="desc:'+K+'"]');
      const txt=(ta&&ta.value||'').trim();
      D.desc[dkey(mid,ex,va)]=txt;
      if(S.draft) delete S.draft['desc:'+K];
      S.editDesc=null;
      sv(spost('member_desc',[{ member_id:mid, variant_id:VID(ex,va), descr:txt,
        updated_at:new Date().toISOString() }], {on:'member_id,variant_id'}), '설명 저장');
      toast('이 회원용 설명으로 저장했습니다'); drawSheet(); return; }
    case 'att': { const A=att(rest[1]); A[rest[0]]=!A[rest[0]]; drawSheet(); return; }
    case 'sendcm': {
      const [ex,va,mid]=rest, K=ex+'|'+va;
      const ta=document.querySelector('textarea[data-k="cm:'+K+'"]');
      const tx=(ta&&ta.value||'').trim(), A=att(K);
      if(!tx && !A.pic && !A.vid){ toast('적거나 붙인 것이 없어요'); return; }
      const cid='c'+Date.now();
      D.cm.unshift({id:cid, mid, ex, va, tr:TRAINER, at:'방금',
        tx: tx||'영상 보고 자세 확인해 보세요', pics:A.pic?1:0, vids:A.vid?1:0, read:false});
      if(S.att) delete S.att[K]; if(S.draft) delete S.draft['cm:'+K]; if(ta) ta.value='';
      sv(spost('comments',[{ id:cid, member_id:mid, variant_id:VID(ex,va), trainer:TRAINER,
        body: tx||'영상 보고 자세 확인해 보세요', pics:A.pic?1:0, vids:A.vid?1:0 }]), '코멘트 보내기');
      toast('보냈습니다 · 회원 화면에 바로 떠요'); drawSheet(); return; }
    case 'play': S.vplay=rest[0]; drawSheet(); return;
    case 'fbm': S.fbMode=rest[0]; render(); return;
    case 'sub': S.subj=S.mid; go(rest[0]); return;
    case 'tsub': S.subj=rest[1]; S.tmid=rest[1]; go(rest[0]); return;
    case 'bck': { const [mid,tk,v]=rest;
      D.body=D.body||{}; const b=D.body[mid]||(D.body[mid]={date:'2026-08-28',checks:{},photos:{},memo:''});
      b.checks=b.checks||{};
      if(b.checks[tk]===v) delete b.checks[tk]; else b.checks[tk]=v;
      sv(spost('body_checks',[{ member_id:mid, on_date:b.date||TODAY, checks:b.checks,
        photos:b.photos||{}, memo:b.memo||'', updated_at:new Date().toISOString() }], {on:'member_id'}), '체형분석 저장');
      render(); return; }
    case 'ph': { const [w2,mid]=rest;
      D.body=D.body||{}; const b=D.body[mid]||(D.body[mid]={date:'2026-08-28',checks:{},photos:{},memo:''});
      b.photos=b.photos||{}; b.photos[w2]=b.photos[w2]?0:1;
      sv(spost('body_checks',[{ member_id:mid, on_date:b.date||TODAY, checks:b.checks||{},
        photos:b.photos, memo:b.memo||'', updated_at:new Date().toISOString() }], {on:'member_id'}), '사진 저장');
      toast(b.photos[w2]?'사진을 넣었어요':'뺐어요'); render(); return; }
    case 'cycon': { const mid=rest[0]; D.cycle=D.cycle||{};
      D.cycle[mid]={on:true, last:TODAY, len:28, period:5};
      svCycle(mid); toast('주기를 켰어요'); render(); return; }
    case 'cycoff': { const mid=rest[0];
      if(D.cycle&&D.cycle[mid]) D.cycle[mid].on=false;
      svCycle(mid); toast('껐어요 — 트레이너에게도 안 보입니다'); render(); return; }
    case 'cycstart': { const mid=rest[0]; D.cycle=D.cycle||{};
      const c=D.cycle[mid]||(D.cycle[mid]={on:true,len:28,period:5});
      c.last=TODAY; c.on=true; svCycle(mid); toast('오늘로 기록했어요'); render(); return; }
    case 'qa': go('qa'); return;
    case 'fbp': S.fbPart=rest[0]; render(); return;
    case 'newvar': sheetNewVar(rest[0]); return;
    case 'savevar': {
      const ex=rest[0];
      const ni=document.querySelector('input[data-k="vn:'+ex+'"]');
      const di=document.querySelector('textarea[data-k="vd:'+ex+'"]');
      const n=(ni&&ni.value||'').trim();
      if(!n){ toast('이름을 적어 주세요'); return; }
      const vk='x'+Date.now(), desc=(di&&di.value||'').trim();
      const e0=EX.find(x=>x.id===ex);
      if(e0) e0.vars.push({k:vk, n, desc, demo:0});
      if(S.draft){ delete S.draft['vn:'+ex]; delete S.draft['vd:'+ex]; }
      sv(spost('variants',[{ id:VID(ex,vk), ex_id:ex, vkey:vk, name:n, descr:desc,
        demo:false, sort:(e0?e0.vars.length:0) }]), '하는 법 추가');
      toast('추가했습니다'); closeSheet(); render(); return; }

    case 'startr': { const r=rOf(rest[0]), t=D.today[r.mid];
      newLive(`루틴 ${r.no} · ${r.n}`, itemsFromRoutine(r), (t&&t.rid===r.id)?t.kind:'개인운동', r.id); return; }
    case 'again': { const src=D.workouts.find(x=>x.id===rest[0]);
      newLive('지난 운동 그대로', src.items.map(it=>({ ex:it.ex, va:it.va, rest:60, locked:false, sec:0, startAt:Date.now(),
        sets:[{kg:it.sets[0].kg, reps:it.sets[0].reps, spd:it.sets[0].spd, done:false}] })), '개인운동'); return; }
    case 'empty': newLive('빈 운동', [], '개인운동'); return;

    case 'part': S.pickPart=rest[0]; render(); return;
    case 'pickvar': sheetPickVar(rest[0]); return;
    case 'add': { const [ex,va]=rest;
      if(!w) newLive('빈 운동', [], '개인운동');
      const last=lastSet(ex,va);
      live().items.push({ ex, va, rest:60, locked:false, sec:0, startAt:Date.now(),
        sets:[ exOf(ex).cardio ? {kg:0, reps:last?last.reps:20, spd:(last&&last.spd)?last.spd:6.5, done:false}
                               : {kg:last?last.kg:20, reps:last?last.reps:10, done:false} ] });
      live().cur=live().items.length-1; save();
      S.just = VID(ex,va); clearTimeout(S.justT);
      S.justT = setTimeout(()=>{ S.just=null; render(); }, 2600);
      toast(exName(ex,va)+' 추가했어요'); go('workout');
      svNewItem(live().items.length-1).then(()=>{
        const sw=D.workouts.find(x=>x.id===live().id);
        if(sw) sw.items.push({ _id:live().items[live().items.length-1]._id, ex, va, sec:0, locked:false, sets:[] });
      });
      return; }
    case 'jump': { const i=+rest[0];
      if(w.items[i].locked){ toast('끝난 종목입니다. 고치려면 한 번 더'); w.items[i].locked=false; save(); }
      w.cur=i; save(); render(); return; }
    case 'edit': sheetEdit(+rest[0]); return;
    case 'd': { const [f,i,dv]=rest, s=w.items[w.cur].sets[+i];
      if(f==='kg') s.kg=Math.max(0, Math.round((s.kg+(+dv))*10)/10);
      else if(f==='spd') s.spd=Math.max(0, Math.round(((s.spd||0)+(+dv))*10)/10);
      else s.reps=Math.max(1, s.reps+(+dv));
      save(); drawSheet(); render(); return; }
    case 'done': w.items[w.cur].sets[+rest[0]].done=true; save(); closeSheet(); render(); return;
    case 'undone': w.items[w.cur].sets[+rest[0]].done=false; save(); closeSheet(); render(); return;
    case 'rep': { const cur=w.items[w.cur], last=cur.sets[cur.sets.length-1];
      last.done=true; cur.sets.push({kg:last.kg, reps:last.reps, spd:last.spd, done:false});
      save(); render(); return; }
    case 'undo': { const cur=w.items[w.cur]; if(cur.sets.length<2) return;
      cur.sets.pop(); cur.sets[cur.sets.length-1].done=false; save(); toast('한 세트 되돌렸어요'); render(); return; }
    case 'rest': sheetRest(); return;
    case 'askcancel': sheetCancel(); return;
    case 'rp': S.rest={sec:+rest[0], until:null}; drawSheet(); return;
    case 'rd': { if(S.rest.until) S.rest.until+=(+rest[0])*1000; else S.rest.sec=Math.max(10,S.rest.sec+(+rest[0])); drawSheet(); return; }
    case 'rgo': S.rest.until=Date.now()+S.rest.sec*1000; drawSheet(); return;
    case 'rskip': S.rest=null; closeSheet(); return;
    case 'fin': { const cur=w.items[w.cur];
      if(!cur.locked){
        cur.sets.forEach(s=>s.done=true); cur.locked=true;
        cur.sec=(cur.sec||0)+(Date.now()-cur.startAt)/1000;
        const doneIdx=w.cur;
        const nxt=w.items.findIndex(it=>!it.locked);
        svItem(doneIdx);
        if(nxt>=0){ w.cur=nxt; w.items[nxt].startAt=Date.now(); save(); toast('잠갔습니다 · 다음 종목'); render(); return; }
        save(); render();
      }
      sheetFinish(); return; }
    case 'askfin': sheetFinish(); return;
    case 'dofin': closeSheet(); finish(); return;
    case 'trec': S.wid=rest[0]; go('record'); return;
    case 'resume': {
      const i=D.workouts.findIndex(x=>x.id===rest[0]);
      if(i<0){ toast('되돌릴 수 없어요'); return; }
      const rec=D.workouts[i];
      D.workouts.splice(i,1);
      D.live={ id:rec.id, mid:rec.mid, title:rec.title||'이어서 하는 운동', kind:rec.kind, rid:rec.rid, date:rec.date,
        startAt: Date.now() - rec.dur*1000, cur: Math.max(0, rec.items.length-1),
        items: rec.items.map(it=>({ _id:it._id, ex:it.ex, va:it.va, rest:60, locked:true, sec:it.sec, startAt:Date.now(),
          sets: it.sets.map(x=>({kg:x.kg, reps:x.reps, spd:x.spd, done:true})) })) };
      rec.done=false; D.workouts.unshift(rec);
      sv(spatch('workouts','id=eq.'+rec.id,{ done:false }), '이어서 하기');
      save(); toast('이어서 하실 수 있어요'); go('workout'); return; }
    case 'cancel': { const id=live()&&live().id;
      D.live=null; save();
      if(id){ D.workouts=D.workouts.filter(x=>x.id!==id); sv(sdel('workouts','id=eq.'+id), '운동 지우기'); }
      toast('운동을 취소했어요'); go('home'); return; }

    case 'tm': S.tmid=rest[0]; go('t_member'); return;
    case 'tlive': S.tmid=rest[0]; go('t_live'); return;
    case 'tw': S.twid=rest[0]; go('t_write'); return;
    case 'rm': S.tmid=rest[0]; render(); return;
    case 're': S.redit=rest[0]; go('t_redit'); return;
    case 'assign': { const r=rOf(rest[0]);
      D.today[r.mid]={rid:r.id, kind:rest[1], by:'트레이너'};
      sv(spost('assignments',[{ member_id:r.mid, on_date:TODAY, routine_id:r.id,
        kind:rest[1], assigned_by:'트레이너' }], {on:'member_id,on_date'}), '지정 저장');
      toast(`오늘 ${rest[1]}으로 지정했습니다`); render(); return; }
    case 'unassign': { const mid=rest[0]; delete D.today[mid];
      sv(sdel('assignments','member_id=eq.'+mid+'&on_date=eq.'+TODAY), '지정 풀기');
      toast('지정을 풀었습니다'); render(); return; }
    case 'rnew': { const mid=S.tmid||'m1', rs=myRoutines(mid), src=rs[0];
      if(!src){ toast('복제할 루틴이 없어요'); return; }
      const id='r'+Date.now(), nm=src.n+' (복제)';
      const items=JSON.parse(JSON.stringify(src.items));
      D.routines.push({id, mid, no:rs.length+1, n:nm, purpose:src.purpose, items});
      sv(spost('routines',[{ id, member_id:mid, no:rs.length+1, name:nm, purpose:src.purpose||'' }])
        .then(()=>spost('routine_items', items.map((it,i)=>({ routine_id:id, sort:i,
          variant_id:VID(it.ex,it.va), kg:it.kg, reps:it.reps, sets:it.sets, rest:it.rest })))), '루틴 만들기');
      S.redit=id; toast('복제했습니다'); go('t_redit'); return; }
  }
});

async function finish(){
  const w=live(), done=w.items.filter(it=>it.sets.some(s=>s.done));
  if(!done.length){
    await sv(sdel('workouts','id=eq.'+w.id), '운동 지우기');
    D.workouts=D.workouts.filter(x=>x.id!==w.id);
    D.live=null; save(); toast('기록할 세트가 없어요'); go('home'); return; }
  done.forEach(it=>{ if(!it.locked){ it.locked=true; it.sec=(it.sec||0)+(Date.now()-it.startAt)/1000; } });
  w.items.forEach(it=>{ it.sec = capSec(it.sec, CAP_EX); });
  const dur=capSec((Date.now()-w.startAt)/1000, CAP_W);
  for(let i=0;i<w.items.length;i++) await svItem(i);
  await sv(spatch('workouts','id=eq.'+w.id, { done:true, dur, kind:w.kind }), '운동 저장');
  const rec={ id:w.id, mid:w.mid, date:w.date||TODAY, kind:w.kind, rid:w.rid, title:w.title, dur, done:true,
    items: w.items.filter(it=>it.sets.some(s=>s.done)).map(it=>({ _id:it._id, ex:it.ex, va:it.va, locked:true,
      sec:Math.round(it.sec), sets: it.sets.filter(s=>s.done).map(s=>({kg:s.kg, reps:s.reps, spd:s.spd})) })) };
  const i0=D.workouts.findIndex(x=>x.id===w.id);
  if(i0>=0) D.workouts[i0]=rec; else D.workouts.unshift(rec);
  D.live=null; save(); S.wid=rec.id; go('summary');
}

function hideSplash(){
  const sp=document.getElementById('splash');
  if(!sp) return;
  sp.classList.add('out'); setTimeout(()=>{ if(sp.parentNode) sp.remove(); }, 600);
}

async function start(){
  try{
    const t0=Date.now();
    await boot();
    const wait=Math.max(0, 1500-(Date.now()-t0));
    setTimeout(hideSplash, wait);
    render();
  }catch(e){
    S.screen='err'; S.errMsg=String(e && e.message || e);
    hideSplash(); render();
  }
}

/* 서버에서 바뀐 것 따라오기 */
const isTyping = () => { const a=document.activeElement; return a && (a.tagName==='TEXTAREA'||a.tagName==='INPUT'); };
let pollSig='';
setInterval(async ()=>{
  if(document.hidden || S.screen==='boot' || S.screen==='err' || !MEMBERS.length) return;
  try{
    const [cms, wks, mls] = await Promise.all([
      sget('comments?select=*&order=created_at.desc&limit=300'),
      sget('workouts?select=*&order=on_date.desc&limit=80'),
      sget('meals?select=*&order=created_at.desc&limit=300')
    ]);
    D.meals = (mls||[]).map(m => ({ id:m.id, mid:m.member_id, date:m.on_date, slot:m.slot,
      path:m.path, memo:m.memo||'', note:m.trainer_note||'',
    kcal:m.kcal||0, carb:m.carb||0, protein:m.protein||0, fat:m.fat||0 }));
    const sig = cms.map(c=>c.id+(c.read_at?'1':'0')).join(',') + '|' +
                wks.map(w=>w.id+(w.done?'1':'0')+w.dur).join(',') + '|' +
                (mls||[]).map(m=>m.id+(m.trainer_note?'1':'0')).join(',');
    if(sig===pollSig) return;
    const first = !pollSig;
    pollSig=sig;
    D.cm = mapCm(cms);
    const ids = wks.map(w=>"'"+w.id+"'").join(',');
    let witems=[], wsets=[];
    if(ids){
      witems = await sget('workout_items?select=*&workout_id=in.('+ids+')&order=sort');
      const iids = witems.map(i=>i.id).join(',');
      if(iids) wsets = await sget('workout_sets?select=*&item_id=in.('+iids+')&order=sort');
    }
    D.workouts = mapWorkouts(wks, witems, wsets);
    if(D.live){
      const mine = D.workouts.find(w=>w.id===D.live.id);
      if(!mine){ D.live=null; save(); }
    }
    if(!first && !isTyping()){ try{ render(); if(sheetRender) drawSheet(); }catch(e){ console.error('그리기', e); } }
  }catch(e){ console.error('poll', e); }
}, 4000);

render();
start();
</script>
