<style>
:root{
  --bg:#171614; --panel:#201f1c; --card:#26241f; --line:#3a372f; --line2:#4a463f;
  --text:#ece6da; --sub:#b9b2a4; --gold:#ffb020; --gold-ink:#1a1408;
  --blue:#9cc8ff; --blue-line:#3a6aa0; --blue-bg:#1d2a3a; --cream:#efe6d2; --done:#7fd19b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px}
.top h1{margin:0;font-size:19px}
.top .meta{color:var(--sub);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .2s}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:0;min-height:calc(100vh - 80px)}
nav{border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto;max-height:calc(100vh - 80px);position:sticky;top:80px}
nav h3{margin:14px 6px 6px;font-size:13px;color:var(--sub);font-weight:700}
nav h3:first-child{margin-top:2px}
nav button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:7px 9px;margin:3px 0;font-size:14px}
nav button .n{min-width:24px;height:24px;border-radius:12px;background:#2e2d29;border:1px solid var(--line2);
  display:inline-flex;align-items:center;justify-content:center;font-size:13px}
nav button.on{border-color:var(--blue-line);color:var(--blue);background:var(--blue-bg)}
nav button.ok .n{background:var(--done);border-color:var(--done);color:#10210f}
main{padding:20px 24px 40px;max-width:1240px}
.part{color:var(--sub);font-size:13px;font-weight:700}
.step h2{margin:2px 0 10px;font-size:22px}
.intro{color:var(--sub);margin:0 0 12px}
ol.do{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ol.do li{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px}
ol.do li b.k{flex:none;min-width:26px;height:26px;border-radius:13px;background:var(--gold);color:var(--gold-ink);
  display:inline-flex;align-items:center;justify-content:center;font-size:14px}
ol.do li em{font-style:normal;color:var(--cream);font-weight:700}
.shot{display:block;width:100%;border:1px solid var(--line2);border-radius:10px;cursor:zoom-in;background:#000}
.tip{margin:12px 0 0;padding:10px 14px;border:1px solid var(--blue-line);background:var(--blue-bg);border-radius:8px;color:#dce9fb;font-size:14px}
.warn{margin:12px 0 0;padding:10px 14px;border:1px solid #8a6a2a;background:#2c2416;border-radius:8px;color:#f3dfb4;font-size:14px}
.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:#2e2d29;color:var(--text);border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ed{border-color:#d9d2c3}
.btn:disabled{opacity:.45;cursor:default}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:20px;height:20px;accent-color:var(--done)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:12px}
.zoom img{max-width:100%;max-height:100%}
.zoom.on{display:flex}
.end{padding:30px 0}
.end h2{font-size:22px}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:none}
  nav.open{display:block}
  .menu{display:inline-block !important}
  main{padding:14px 16px 30px}
}
.menu{display:none;margin-top:8px}
/* 직접 눌러 보기 (11/17 19:15 대표 「연습프로그램을 메뉴얼에 · 10분컷」) */
.mode{display:inline-flex;gap:6px;margin-top:8px}
.mode button{border:1px solid var(--line2);background:#2e2d29;color:var(--text);border-radius:8px;padding:6px 14px;font-weight:700;font-size:14px}
.mode button.on{border-color:var(--blue-line);color:var(--blue);background:var(--blue-bg)}
.pr{position:relative;cursor:crosshair}
.pr .shot{cursor:crosshair}
.hs{position:absolute;border-radius:8px;pointer-events:none}
.hs.ok{border:3px solid var(--done);background:rgba(127,209,155,.15)}
.hs.hint{border:4px solid var(--gold);box-shadow:0 0 0 4px rgba(255,176,32,.35);animation:blink .5s 3}
@keyframes blink{50%{opacity:.2}}
ol.do li.now{border-color:var(--gold)}
ol.do li.done{opacity:.55}
.say{margin-top:10px;font-weight:700;min-height:24px;color:var(--cream)}
</style>

const 자리 = {"s01":[[0.52,9.23,9.38,4.49],[92.08,14.96,5.94,5.99]],"s02":[[4.31,14.13,28.45,8.27],[32.93,14.13,14.31,8.27],[4.31,28.8,42.93,8.27],[4.31,42.93,42.93,8.27],[51.21,12.8,15.52,6.4]],"s03":[[4.31,70.13,42.93,7.47],[50.86,61.33,10.0,5.33],[83.97,86.67,11.72,8.27]],"s04":[[2.07,41.95,6.74,5.37]],"s05":[[63.8,5.61,7.17,4.63],[8.37,11.22,3.91,4.39],[53.8,17.32,16.3,33.41]],"s06":[[2.4,63.33,18.68,23.33],[84.67,88.97,12.46,7.95]],"s07":[[86.74,20.98,4.78,3.9],[43.37,38.54,18.91,7.32],[43.7,48.29,18.59,7.8],[37.72,61.22,24.57,8.05]],"s08":[[72.5,85.12,23.7,7.56]],"s09":[[25.54,68.78,10.33,4.88],[7.07,78.78,13.7,4.63],[74.89,31.22,18.91,4.63],[53.48,56.83,19.35,7.56],[84.13,86.83,10.11,6.34]],"s10":[[10.0,9.46,7.02,5.41],[5.26,17.03,17.54,28.65]],"s11":[[27.86,30.59,43.33,21.96],[2.02,85.75,13.21,5.23],[70.48,84.18,12.26,13.33],[83.21,84.18,15.0,13.33],[87.14,1.83,11.07,7.32]],"s12":[[27.74,33.46,12.14,10.2]],"s13":[[23.57,38.95,21.9,6.8]],"s14":[[67.86,25.62,7.5,12.55],[67.86,38.95,7.5,13.59]],"s15":[[29.64,16.73,40.71,59.08],[49.76,77.12,20.6,6.27]],"s16":[[87.38,3.4,12.98,7.84]],"s17":[[50.91,88.21,48.3,8.72]],"s18":[[23.59,12.68,6.09,4.88],[23.59,19.02,55.0,23.17],[23.04,62.68,35.98,35.61]],"s22":[[17.17,1.22,3.26,6.34]],"s19":[[13.85,45.79,27.54,6.15]],"s20":[[57.28,83.41,5.76,7.07]],"s21":[[1.2,1.46,19.67,31.95]]};
let 연습 = /^#(연습|practice)$/.test(decodeURIComponent(location.hash)), 맞춘 = 0;
const 상자 = (r, c) => `<i class="hs ${c}" style="left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%"></i>`;

function 목록(){
  let h = '', 부 = '';
  단계.forEach((s, i) => {
    if(s.부 !== 부){ 부 = s.부; h += `<h3>${부}</h3>`; }
    h += `<button class="${i === 지금 ? 'on' : ''}" data-i="${i}"><span class="n">${i + 1}</span>${s.제목}</button>`;
  });
  $('nav').innerHTML = h;
  $('bar').style.width = ((지금 + 1) / 단계.length * 100) + '%';
}
function 그리기(){
  목록();
  const s = 단계[지금];
  $('main').innerHTML = `<div class="step">
    <div class="part">${s.부} · ${지금 + 1} / ${단계.length}</div>
    <h2>${s.제목}</h2>
    ${s.안내 ? `<p class="intro">${s.안내}</p>` : ''}
    <ol class="do">${s.할일.map((t, k) => `<li class="${연습 ? (k < 맞춘 ? 'done' : k === 맞춘 ? 'now' : '') : ''}"><b class="k">${k + 1}</b><span>${t}</span></li>`).join('')}</ol>
    ${연습 ? `<div class="pr" id="pr"><img class="shot" src="CRM연습/${s.그림}c.jpg" alt="${s.제목} 화면 — 누를 곳을 직접 눌러요">${(자리[s.그림] || []).slice(0, 맞춘).map(r => 상자(r, 'ok')).join('')}</div>
      <div class="say" id="say">${맞춘 >= s.할일.length ? '잘했어요 · 다음 단계로 넘어가요' : (맞춘 + 1) + '번 — 화면에서 그 자리를 눌러요'}</div>`
    : `<img class="shot" src="CRM연습/${s.그림}.jpg" alt="${s.제목} 화면 — 번호 상자가 누를 곳">`}
    ${s.팁 ? `<div class="tip">${s.팁}</div>` : ''}
    ${s.주의 ? `<div class="warn">⚠ ${s.주의}</div>` : ''}
    <div class="foot">
      <button class="btn" id="prev" ${지금 === 0 ? 'disabled' : ''}>‹ 이전</button>
      ${지금 < 단계.length - 1 ? '<button class="btn gold" id="next">다음 ›</button>' : '<button class="btn ed" id="next">처음으로</button>'}
    </div></div>`;
  $('prev').onclick = () => { if(지금 > 0){ 지금--; 맞춘 = 0; 그리기(); 위로(); } };
  $('next').onclick = () => { 지금 = 지금 < 단계.length - 1 ? 지금 + 1 : 0; 맞춘 = 0; 그리기(); 위로(); };
  if(!연습){ document.querySelector('.shot').onclick = e => { $('zimg').src = e.target.src; $('zoom').classList.add('on'); }; return; }
  const 자 = 자리[s.그림] || [];
  $('pr').onclick = e => {
    if(맞춘 >= 자.length) return;
    const b = $('pr').getBoundingClientRect(), x = (e.clientX - b.left) / b.width * 100, y = (e.clientY - b.top) / b.height * 100;
    const r = 자[맞춘], 여 = 1.5;
    if(x >= r[0] - 여 && x <= r[0] + r[2] + 여 && y >= r[1] - 여 && y <= r[1] + r[3] + 여){
      맞춘++; 그리기();
      if(맞춘 >= 자.length && 지금 < 단계.length - 1) setTimeout(() => { 지금++; 맞춘 = 0; 그리기(); 위로(); }, 900);
    } else {
      $('pr').insertAdjacentHTML('beforeend', 상자(r, 'hint'));
      $('say').textContent = '여기를 눌러요 — 반짝이는 자리';
      setTimeout(() => { const h = document.querySelector('.hs.hint'); if(h) h.remove(); }, 1600);
    }
  };
}
const 위로 = () => window.scrollTo(0, 0);
$('nav').onclick = e => { const b = e.target.closest('button'); if(!b) return; 지금 = +b.dataset.i; 그리기(); 위로(); $('nav').classList.remove('open'); };
$('zoom').onclick = () => $('zoom').classList.remove('on');
$('menu').onclick = () => $('nav').classList.toggle('open');
const 모드표시 = () => document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', +b.dataset.m === +연습));
$('mode').onclick = e => { const b = e.target.closest('button'); if(!b) return; 연습 = b.dataset.m === '1'; 맞춘 = 0; 모드표시(); 그리기(); };
모드표시();
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ $('zoom').classList.remove('on'); return; }
  if($('zoom').classList.contains('on')) return;
  if(e.key === 'ArrowRight' && 지금 < 단계.length - 1){ 지금++; 그리기(); }
  if(e.key === 'ArrowLeft' && 지금 > 0){ 지금--; 그리기(); }
});
그리기();
</script>
