<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>글래드짐 트레이너 데스크</title>
<style>
:root{
  --dark:#131312; --dark-2:#1a1a18; --dark-3:#222220; --dark-4:#2c2c29;
  --line:#33332f; --cream:#fdfaf6; --sub:#8f8a83;
  --gold:#e6c487; --gold-2:#c9a86a; --gold-dim:#2a2318;
  --teal:#9dcedc; --teal-dim:#16262b; --brown:#412921; --warn:#e8927c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--dark);color:var(--cream);
  font-family:Pretendard,-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

.app{display:flex;min-height:100vh}

/* 좌측 메뉴 */
.side{width:216px;flex:none;background:var(--dark-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px;gap:3px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 8px 16px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:11px;font-weight:600;color:var(--gold-2)}
.nav{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  font-size:13.5px;font-weight:600;color:var(--sub);text-align:left;width:100%}
.nav:hover{background:var(--dark-3);color:var(--cream)}
.nav.on{background:var(--gold-dim);color:var(--gold)}
.nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.nav .soon{margin-left:auto;font-size:10.5px;font-weight:600;color:#5f5b55}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.who{background:var(--dark-3);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.who .l{font-size:10.5px;font-weight:600;color:var(--sub)}
.who select{width:100%;background:none;border:0;font-size:13.5px;font-weight:700;
  color:var(--gold);margin-top:2px;outline:none}
.who select option{background:var(--dark-3);color:var(--cream)}
.svcbtn{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;
  border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--sub);width:100%}
.svcbtn:hover{background:var(--dark-3);color:var(--cream)}

/* 본문 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 26px 14px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--dark);z-index:5}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.03em}
.top .cnt{font-size:12.5px;font-weight:600;color:var(--sub)}
.top .sp{margin-left:auto;display:flex;gap:9px;align-items:center}
.srch{background:var(--dark-3);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;width:230px;outline:none}
.srch::placeholder{color:#6f6a63}
.srch:focus{border-color:var(--gold-2)}
.body{padding:20px 26px 40px;flex:1}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--sub);background:var(--dark-2)}
.chip:hover{color:var(--cream)}
.chip.on{border-color:var(--gold-2);color:var(--gold);background:var(--gold-dim)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.mcard{background:var(--dark-2);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;text-align:left;display:flex;flex-direction:column;gap:11px;
  transition:border-color .12s,transform .12s}
.mcard:hover{border-color:#4a4a44;transform:translateY(-1px)}
.mcard .hd{display:flex;align-items:baseline;gap:8px}
.mcard .nm{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.mcard .tr{font-size:11.5px;font-weight:600;color:var(--sub)}
.mcard .rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.row .k{color:var(--sub);font-weight:500;min-width:52px;flex:none}
.row .v{font-weight:700;color:#ded7cd}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;
  background:var(--dark-4);color:var(--sub)}
.tag.gold{background:var(--gold-dim);color:var(--gold)}
.tag.teal{background:var(--teal-dim);color:var(--teal)}
.tag.warn{background:#2e1c18;color:var(--warn)}

.empty{padding:60px 20px;text-align:center;color:var(--sub);font-weight:600}
.note{background:var(--dark-2);border:1px solid var(--line);border-left:3px solid var(--gold-2);
  border-radius:0 11px 11px 0;padding:13px 15px;font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:18px}
.note b{color:var(--gold-2)}

/* 서비스 선택 */
.svc{position:fixed;inset:0;background:rgba(8,8,7,.72);display:none;
  align-items:center;justify-content:center;z-index:50}
.svc.on{display:flex}
.svcbox{background:var(--dark-2);border:1px solid var(--line);border-radius:18px;
  padding:22px;width:min(420px,92vw)}
.svcbox h2{font-size:15px;font-weight:800;margin-bottom:16px}
.svcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svcitem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;
  border-radius:13px;border:1px solid var(--line);background:var(--dark-3);
  text-decoration:none;color:inherit}
.svcitem:hover{border-color:var(--gold-2)}
.svcitem .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:19px}
.svcitem .nm2{font-size:12px;font-weight:700}
.svcitem .sm2{font-size:10.5px;color:var(--sub)}

@media (max-width:820px){
  .side{position:fixed;left:-216px;z-index:40;transition:left .2s}
  .side.open{left:0}
  .top{padding:14px 16px 12px}
  .body{padding:16px}
  .srch{width:150px}
}
</style></head><body>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>GLAD GYM</b><span>트레이너 데스크</span></div>

    <button class="nav on" data-v="members">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      회원</button>
    <button class="nav" data-v="routines">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      루틴<span class="soon">준비 중</span></button>
    <button class="nav" data-v="comments">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      코멘트<span class="soon">준비 중</span></button>
    <button class="nav" data-v="work">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      업무<span class="soon">준비 중</span></button>

    <div class="foot">
      <div class="who"><div class="l">지금 보는 사람</div>
        <select id="whosel"></select></div>
      <button class="svcbtn" id="svcopen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/>
          <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
          <circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/>
        </svg>서비스 선택</button>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <h1 id="title">회원</h1><span class="cnt" id="cnt"></span>
      <div class="sp"><input class="srch" id="q" type="text" placeholder="회원 이름으로 찾기"></div>
    </div>
    <div class="body" id="body"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<div class="svc" id="svc"><div class="svcbox">
  <h2>서비스 선택</h2>
  <div class="svcgrid">
    <a class="svcitem" href="https://mofma01-bit.github.io/gladgym-app/" target="_blank" rel="noopener">
      <span class="ic" style="background:var(--gold-dim);color:var(--gold)">▤</span>
      <span class="nm2">회원 앱</span><span class="sm2">운동기록</span></a>
    <button class="svcitem" style="opacity:.45;cursor:default">
      <span class="ic" style="background:var(--dark-4);color:var(--sub)">▦</span>
      <span class="nm2">관리 대시보드</span><span class="sm2">연결 예정</span></button>
    <button class="svcitem" style="opacity:.45;cursor:default">
      <span class="ic" style="background:var(--dark-4);color:var(--sub)">✎</span>
      <span class="nm2">업무</span><span class="sm2">준비 중</span></button>
  </div>
</div></div>

<script>
"use strict";
const BUILD = '1';
const SB_URL = 'https://mylzxiahksgloxzabpqk.supabase.co';
const SB_KEY = 'sb_publishable_AwOEXYRkjO1FASdu7i4Mzg_tw7ewPZ3';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TODAY = (()=>{ const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); })();

async function sget(path){
  const r = await fetch(SB_URL+'/rest/v1/'+path,
    { headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY }, cache:'no-store' });
  if(!r.ok) throw new Error(path.split('?')[0]+' → '+r.status);
  return r.json();
}

const D = { m:[], w:[], r:[], c:[], a:[] };
const S = { view:'members', who:'전체', q:'' };

const daysAgo = ymd => {
  if(!ymd) return null;
  const a=new Date(TODAY+'T00:00:00'), b=new Date(ymd+'T00:00:00');
  return Math.round((a-b)/86400000);
};
const dayText = ymd => {
  if(!ymd) return '기록 없음';
  const n=daysAgo(ymd);
  if(n===0) return '오늘';
  if(n===1) return '어제';
  if(n<7) return n+'일 전';
  const p=ymd.split('-');
  return (+p[1])+'월 '+(+p[2])+'일';
};

/* 회원 목록 */
function vMembers(){
  const q = S.q.trim().toLowerCase();
  const all = D.m.filter(x => (x.role||'member')==='member');
  let list = all.slice();
  if(S.who!=='전체') list = list.filter(x => (x.trainer||'')===S.who);
  if(q) list = list.filter(x => (x.name||'').toLowerCase().includes(q));

  const info = m => {
    const ws = D.w.filter(w => w.member_id===m.id && w.done)
                  .sort((a,b)=> a.on_date < b.on_date ? 1 : -1);
    const last = ws[0] ? ws[0].on_date : null;
    return {
      last, gap: daysAgo(last),
      week: ws.filter(w => daysAgo(w.on_date) < 7).length,
      routines: D.r.filter(r => r.member_id===m.id).length,
      newcm: D.c.filter(c => c.member_id===m.id && !c.read_at).length,
      today: D.a.find(a => a.member_id===m.id) || null,
    };
  };
  const rows = list.map(m => ({ m, i: info(m) }));
  rows.sort((a,b)=>{
    const A = a.i.gap===null ? 9999 : a.i.gap, B = b.i.gap===null ? 9999 : b.i.gap;
    return B-A;
  });

  $('#cnt').textContent = rows.length + '명';

  const trs = [...new Set(all.map(x=>x.trainer).filter(Boolean))];
  const chips = '<div class="chips">'
    + '<button class="chip ' + (S.who==='전체'?'on':'') + '" data-who="전체">전체 ' + all.length + '</button>'
    + trs.map(t => '<button class="chip ' + (S.who===t?'on':'') + '" data-who="' + esc(t) + '">'
        + esc(t) + ' ' + all.filter(x=>x.trainer===t).length + '</button>').join('')
    + '</div>';

  if(!rows.length) return chips + '<div class="empty">해당하는 회원이 없어요</div>';

  const cards = rows.map(function(o){
    const m=o.m, i=o.i;
    return '<button class="mcard" data-m="' + esc(m.id) + '">'
      + '<div class="hd"><span class="nm">' + esc(m.name) + '</span>'
      + '<span class="tr">' + esc(m.trainer||'담당 없음') + '</span></div>'
      + '<div class="rows">'
      + '<div class="row"><span class="k">마지막</span><span class="v">' + dayText(i.last) + '</span></div>'
      + '<div class="row"><span class="k">이번 주</span><span class="v">' + i.week + '번</span></div>'
      + '<div class="row"><span class="k">루틴</span><span class="v">' + i.routines + '개</span></div>'
      + '</div><div class="tags">'
      + (i.today ? '<span class="tag gold">오늘 ' + esc(i.today.kind||'지정') + '</span>' : '')
      + (i.newcm ? '<span class="tag teal">새 코멘트 ' + i.newcm + '</span>' : '')
      + (i.gap!==null && i.gap>=7 ? '<span class="tag warn">' + i.gap + '일째 안 옴</span>' : '')
      + (i.gap===null ? '<span class="tag">기록 없음</span>' : '')
      + '</div></button>';
  }).join('');

  return chips + '<div class="grid">' + cards + '</div>'
    + '<div class="note"><b>안 온 지 오래된 회원이 위로</b> 옵니다. '
    + '회원을 누르면 루틴·기록·코멘트를 보는 화면이 열립니다 — <b>다음 단계에서 만듭니다.</b></div>';
}

function render(){
  const b = $('#body');
  if(S.view==='members'){ $('#title').textContent='회원'; b.innerHTML = vMembers(); }
  else { $('#title').textContent='준비 중'; $('#cnt').textContent='';
    b.innerHTML = '<div class="empty">아직 만들지 않았어요</div>'; }
}

async function load(){
  try{
    const got = await Promise.all([
      sget('members?select=*&order=name'),
      sget('workouts?select=id,member_id,on_date,done,title,kind&order=on_date.desc&limit=800'),
      sget('routines?select=id,member_id,no,name'),
      sget('comments?select=id,member_id,read_at&limit=800'),
      sget('assignments?select=member_id,on_date,routine_id,kind&on_date=eq.'+TODAY),
    ]);
    D.m=got[0]; D.w=got[1]; D.r=got[2]; D.c=got[3]; D.a=got[4];
    const trs = [...new Set(D.m.map(x=>x.trainer).filter(Boolean))];
    $('#whosel').innerHTML = ['전체'].concat(trs)
      .map(t => '<option value="' + esc(t) + '">'
        + esc(t==='전체' ? '전체 보기' : t+' 트레이너') + '</option>').join('');
    $('#whosel').value = S.who;
    render();
  }catch(e){
    $('#body').innerHTML = '<div class="empty">자료를 못 불러왔어요<br>'
      + '<span style="font-size:12px">' + esc(e.message) + '</span></div>';
  }
}

document.addEventListener('click', function(ev){
  const nav = ev.target.closest('.nav');
  if(nav){ S.view = nav.dataset.v;
    document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b===nav));
    render(); return; }
  const chip = ev.target.closest('[data-who]');
  if(chip){ S.who = chip.dataset.who; $('#whosel').value = S.who; render(); return; }
  const card = ev.target.closest('[data-m]');
  if(card){ const m = D.m.find(x=>x.id===card.dataset.m);
    alert((m?m.name:'') + ' — 회원 상세 화면은 다음 단계에서 만듭니다'); return; }
  if(ev.target.closest('#svcopen')){ $('#svc').classList.add('on'); return; }
  if(ev.target.id==='svc'){ $('#svc').classList.remove('on'); return; }
});
$('#whosel').addEventListener('change', function(e){ S.who = e.target.value; render(); });
$('#q').addEventListener('input', function(e){ S.q = e.target.value; render(); });
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') $('#svc').classList.remove('on'); });

load();
setInterval(load, 60000);
</script>
</body></html>
