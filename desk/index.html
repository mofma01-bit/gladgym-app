<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>글래드짐 트레이너 데스크</title>
<style>
:root{
  --dark:#131312; --dark-2:#1a1a18; --dark-3:#222220; --dark-4:#2c2c29;
  --line:#33332f; --cream:#fdfaf6; --sub:#8f8a83;
  --gold:#e6c487; --gold-2:#c9a86a; --gold-dim:#2a2318;
  --teal:#9dcedc; --teal-dim:#16262b; --brown:#412921; --warn:#e8927c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--dark);color:var(--cream);
  font-family:Pretendard,-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{max-width:100%;display:block}

/* 맨 위 띠 — 공지 · 알림 · 내 정보 */
.gnb{height:46px;flex:none;background:#0e0e0d;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:30}
.gnb .ev{font-size:10.5px;font-weight:800;color:#7ddba0;background:#12251a;
  border-radius:5px;padding:3px 7px;flex:none;letter-spacing:.02em}
.gnb .msg{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#c9c2b8;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gnb .rt2{display:flex;align-items:center;gap:4px;flex:none}
.gbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--sub);position:relative}
.gbtn:hover{background:var(--dark-3);color:var(--cream)}
.gbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.gbtn .dot{position:absolute;top:6px;right:6px;min-width:15px;height:15px;border-radius:8px;
  background:var(--warn);color:#241310;font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px}
.gsep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.gme{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 7px;border-radius:9px;
  font-size:12.5px;font-weight:700}
.gme:hover{background:var(--dark-3)}
.gme .av{width:24px;height:24px;border-radius:50%;background:var(--gold-dim);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;flex:none}
.gme .sub2{font-size:11.5px;font-weight:500;color:var(--sub)}

.wrap{display:flex;flex-direction:column;min-height:100vh}
.app{display:flex;flex:1;min-height:0}

/* 좌측 메뉴 */
.side{width:216px;flex:none;background:var(--dark-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px;gap:3px;position:sticky;top:46px;
  height:calc(100vh - 46px)}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 8px 16px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:11px;font-weight:600;color:var(--gold-2)}
.nav{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  font-size:13.5px;font-weight:600;color:var(--sub);text-align:left;width:100%}
.nav:hover{background:var(--dark-3);color:var(--cream)}
.nav.on{background:var(--gold-dim);color:var(--gold)}
.nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.nav .bdg{margin-left:auto;font-size:11px;font-weight:800;color:var(--teal);
  background:var(--teal-dim);border-radius:6px;padding:1px 7px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.who{background:var(--dark-3);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.who .l{font-size:10.5px;font-weight:600;color:var(--sub)}
.who select{width:100%;background:none;border:0;font-size:13.5px;font-weight:700;
  color:var(--gold);margin-top:2px;outline:none}
.who select option{background:var(--dark-3);color:var(--cream)}
.svcbtn{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;
  border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--sub);width:100%}
.svcbtn:hover{background:var(--dark-3);color:var(--cream)}

/* 본문 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 26px;background:var(--dark);
  position:sticky;top:46px;z-index:5;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .chips{margin:0}
.topline{border-bottom:1px solid var(--line);padding:0 26px;background:var(--dark)}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.03em}
.top .cnt{font-size:12.5px;font-weight:600;color:var(--sub)}
.top .sp{margin-left:auto;display:flex;gap:9px;align-items:center}
.back{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--sub);font-size:17px;flex:none}
.back:hover{background:var(--dark-3);color:var(--cream)}
.srch{background:var(--dark-3);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;width:230px;outline:none}
.srch::placeholder{color:#6f6a63}
.srch:focus{border-color:var(--gold-2)}
.body{padding:20px 26px 48px;flex:1}
@media (min-width:1500px){
  .top,.topline,.body{padding-left:38px;padding-right:38px}
}

.tabs{display:flex;gap:2px;padding-top:12px}
.tabs button{padding:9px 14px 11px;font-size:13px;font-weight:700;color:var(--sub);
  border-bottom:2px solid transparent}
.tabs button:hover{color:var(--cream)}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--sub);background:var(--dark-2)}
.chip:hover{color:var(--cream)}
.chip.on{border-color:var(--gold-2);color:var(--gold);background:var(--gold-dim)}
.chip.t{color:var(--teal);border-color:#3a5b66}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px}
.mcard{background:var(--dark-2);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;text-align:left;display:flex;flex-direction:column;gap:11px;
  transition:border-color .12s,transform .12s}
.mcard:hover{border-color:#4a4a44;transform:translateY(-1px)}
.mcard .hd{display:flex;align-items:baseline;gap:8px}
.mcard .nm{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.mcard .tr{font-size:11.5px;font-weight:600;color:var(--sub)}
.mcard .rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.row .k{color:var(--sub);font-weight:500;min-width:52px;flex:none}
.row .v{font-weight:700;color:#ded7cd}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;
  background:var(--dark-4);color:var(--sub)}
.tag.gold{background:var(--gold-dim);color:var(--gold)}
.tag.teal{background:var(--teal-dim);color:var(--teal)}
.tag.warn{background:#2e1c18;color:var(--warn)}

.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
@media (max-width:1240px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1080px){.cols{grid-template-columns:1fr}}
.sec{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.02em;
  display:flex;align-items:center;gap:8px}
.lbl .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.card{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;text-align:left;width:100%}
.card.click:hover{border-color:#4a4a44}
.card .t1{font-size:14.5px;font-weight:700}
.card .t2{font-size:12px;color:var(--sub);margin-top:3px}
.card.gold{border-color:var(--gold-2);background:var(--gold-dim)}
.card.gold .t1{color:var(--gold)}
.card.teal{border-color:#3a5b66;background:var(--teal-dim)}
.rowc{display:flex;align-items:center;gap:11px}
.rowc>div{flex:1;min-width:0}
.rt{color:var(--sub);font-size:13px;flex:none}

.btn{border-radius:10px;padding:10px 15px;font-weight:700;font-size:13px;text-align:center}
.btn.main{background:var(--teal);color:#0d2027}
.btn.gold{background:var(--gold);color:#2a1c14}
.btn.sub{background:var(--dark-3);color:var(--teal);border:1px solid var(--line)}
.btn.ghost{background:var(--dark-3);color:var(--sub);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:default}

.hr2{height:1px;background:var(--line);margin:3px 0}
.fld{display:flex;flex-direction:column;gap:5px}
.fld .fn{font-size:11.5px;font-weight:600;color:var(--sub)}
.inp,textarea.inp{background:var(--dark-3);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;outline:none;width:100%}
.inp:focus{border-color:var(--gold-2)}
textarea.inp{min-height:76px;resize:vertical;line-height:1.6}
.num{width:70px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* 루틴 종목 줄 */
.item{background:var(--dark-2);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.item .l1{display:flex;align-items:center;gap:9px}
.item .l2{display:flex;align-items:center;gap:9px;padding-left:27px;flex-wrap:wrap}
.item .no{font-size:12px;font-weight:800;color:var(--sub);min-width:18px;flex:none}
.item .nm2{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.item .nm2 small{font-size:11.5px;font-weight:600;color:var(--gold-2);margin-left:5px}
.item .set{display:flex;align-items:center;gap:5px;flex:none}
.item .u{font-size:11px;color:var(--sub);font-weight:600}
.item .num{width:60px}
.ib{width:28px;height:28px;border-radius:7px;background:var(--dark-4);
  font-size:13px;font-weight:800;color:var(--cream);flex:none}
.ib:hover{background:#3a3a35}
.ib:disabled{opacity:.3}

/* 코멘트 */
.cm{background:var(--dark-2);border:1px solid var(--line);border-left:3px solid var(--teal);
  border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cm .who2{font-size:12px;font-weight:600;color:var(--teal);display:flex;align-items:center;gap:8px}
.cm .who2 .del{margin-left:auto;font-size:11.5px;color:var(--sub)}
.cm .who2 .del:hover{color:var(--warn)}
.cm .ex{font-size:12px;font-weight:700;color:var(--gold-2)}
.cm .tx{font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.cm.new{border-left-color:var(--gold)}

/* 표 */
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:11.5px;font-weight:700;color:var(--sub);
  padding:8px 10px;border-bottom:1px solid var(--line)}
.tb td{padding:9px 10px;border-bottom:1px solid #262622}
.tb tr:last-child td{border-bottom:0}
.tb .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tb tbody tr:hover{background:var(--dark-2)}

/* 회원 표 */
.mwrap{background:var(--dark-2);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.mtb{width:100%;border-collapse:collapse;font-size:13px}
.mtb th{text-align:left;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.02em;
  padding:10px 12px;border-bottom:1px solid var(--line);background:#191917;white-space:nowrap}
.mtb th.n,.mtb td.n{text-align:right;font-variant-numeric:tabular-nums}
.mtb td{padding:11px 12px;border-bottom:1px solid #232320;vertical-align:middle}
.mtb tbody tr:last-child td{border-bottom:0}
.mtb tbody tr{cursor:pointer}
.mtb tbody tr:hover{background:var(--dark-3)}
.mtb .nm2{font-size:14px;font-weight:800;letter-spacing:-.01em}
.mtb .sub3{font-size:11.5px;color:var(--sub);font-weight:600}
.dot2{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block;background:#4a463f}
.dot2.gold{background:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.dot2.teal{background:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.dot2.warn{background:var(--warn);box-shadow:0 0 0 3px #2e1c18}
.numbig{font-size:14px;font-weight:800}
.numbig.zero{color:#5d5952;font-weight:600}
.mtb .tag{font-size:10.5px;padding:2px 7px}

/* 위 요약 띠 */
.sumbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}
.sumit{flex:1;min-width:118px;background:var(--dark-2);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.sumit .k2{font-size:11px;font-weight:700;color:var(--sub)}
.sumit .v2{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sumit.gold{border-color:#4a3d22} .sumit.gold .v2{color:var(--gold)}
.sumit.teal{border-color:#2d4750} .sumit.teal .v2{color:var(--teal)}
.sumit.warn{border-color:#4d2f27} .sumit.warn .v2{color:var(--warn)}

/* 체형 체크 — 세 갈래 버튼 */
/* 달력 */
.cal{background:var(--dark-2);border:1px solid var(--line);border-radius:11px;padding:8px 9px}
.calhd{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.calhd .m{font-size:12px;font-weight:800;flex:1}
.calhd .ib{width:21px;height:21px;font-size:11px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.calgrid .wd{font-size:9.5px;font-weight:700;color:#605b54;text-align:center;padding:1px 0}
.cd{height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#4f4b45;border:1px solid transparent;position:relative}
.cd.in{color:#948e86}
.cd:hover{background:var(--dark-3)}
.cd.has{color:var(--gold);font-weight:800}
.cd.sel{border-color:var(--teal);background:var(--teal-dim);color:var(--teal)}
.cd.today{background:var(--dark-4);color:var(--cream)}
.cd.today.has{color:var(--gold)}
.cd .dt{display:none}

/* 아래로 길게 — 스크롤로 다 본다 */
.listbox{max-height:calc(100vh - 430px);min-height:200px;overflow-y:auto;
  display:flex;flex-direction:column;gap:7px;padding-right:3px}
.listbox::-webkit-scrollbar{width:7px}
.listbox::-webkit-scrollbar-thumb{background:#34342f;border-radius:4px}
.listbox::-webkit-scrollbar-track{background:transparent}

/* 최근 7일 */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.wk{gap:5px}
.wkd{background:var(--dark-2);border:1px solid var(--line);border-radius:9px;
  padding:6px 3px;text-align:center;display:flex;flex-direction:column;gap:1px}
.wkd .d1{font-size:10px;font-weight:700;color:var(--sub)}
.wkd .d2{font-size:14px;font-weight:800;line-height:1.25}
.wkd .d3{font-size:9.5px;font-weight:700;color:var(--gold);line-height:1.2}
.wkd.on{border-color:var(--gold-2);background:var(--gold-dim)}
.wkd.today{border-color:var(--teal)}
.wkd.sel{border-color:var(--teal);background:var(--teal-dim)}
.wkd.sel .d2,.wkd.sel .d1{color:var(--teal)}
.wkd.off{opacity:.45}
.mealgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.mealph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--dark-3)}

/* 체형 사진 */
.bpcmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bpcell{background:var(--dark-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bpcell .cap{display:flex;align-items:center;gap:7px;padding:8px 11px;font-size:11.5px;font-weight:700}
.bpcell .cap .w{color:var(--sub);font-weight:600;margin-left:auto}
.bpcell.b .cap{color:var(--sub)} .bpcell.a .cap{color:var(--gold)}
.bpimg{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--dark-3)}
.bpnone{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
  background:var(--dark-3);color:#5d5952;font-size:12px;font-weight:700}
.bpstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bpth{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--dark-3)}
.bpth img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.bpth .d{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10.5px;font-weight:700;
  background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.bpth .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;
  background:rgba(20,20,18,.85);color:var(--warn);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:5px}
.seg button{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--sub);background:var(--dark-3)}
.seg button.on{border-color:var(--gold-2);color:var(--gold);background:var(--gold-dim)}

/* 회차 체크 알갱이 */
.chk{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chk span{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;
  background:#2e1c18;color:var(--warn);border:1px solid #4d2f27}
.nophoto{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  background:var(--dark-3);color:var(--sub);font-size:12px;font-weight:700}
.prevbtn{font-size:11.5px;font-weight:700;color:var(--sub);padding:4px 0;text-align:left}
.prevbtn:hover{color:var(--gold-2)}

.tri{display:flex;gap:5px;flex-wrap:wrap}
.tri button{padding:4px 10px;border-radius:7px;border:1px solid var(--line);
  font-size:11.5px;font-weight:700;color:var(--sub);background:var(--dark-3)}
.tri button:hover{color:var(--cream)}
.tri button.on{border-color:var(--warn);color:var(--warn);background:#2e1c18}
.tri button.on.ok{border-color:#3f5c46;color:#8fca9e;background:#16241a}
/* 잠금 — 수정 버튼을 눌러야 고칠 수 있다 */
.inp:disabled,.mini:disabled,textarea.inp:disabled,select.inp:disabled{
  background:transparent;border-color:transparent;color:#c8c2b9;cursor:default;
  padding-left:2px;padding-right:2px}
.tri button:disabled{opacity:.55;cursor:default}
.tri button.on:disabled{opacity:1}
.editbtn{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;
  border:1px solid var(--line);color:var(--sub);background:var(--dark-3)}
.editbtn:hover{color:var(--cream)}
.editbtn.on{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.locked .ib,.locked .editonly{display:none}

.mini{width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--dark-3);border:1px solid var(--line);border-radius:8px;padding:6px 4px;outline:none}
.mini:focus{border-color:var(--gold-2)}

.ph{border-radius:10px;border:1px solid var(--line);background:var(--dark-3);overflow:hidden}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

    if(/사이드|우드찹|트위스트|팔로프|안티로테이션|벤드/.test(e.name)) t += ' 옆구리 복사근 oblique';
  }
  return 검색키(t);
}

const plusDays = (ymd, n) => { const d = new Date(ymd+'T00:00:00');
  d.setDate(d.getDate()+n); const p=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
const daysAgo = ymd => { if(!ymd) return null;
  return Math.round((new Date(TODAY+'T00:00:00') - new Date(ymd+'T00:00:00'))/86400000); };
const dayText = ymd => { if(!ymd) return '기록 없음';
  const n=daysAgo(ymd); if(n===0) return '오늘'; if(n===1) return '어제';
  if(n<7) return n+'일 전'; const p=ymd.split('-'); return (+p[1])+'월 '+(+p[2])+'일'; };
const dateFull = ymd => { if(!ymd) return ''; const p=ymd.split('-');
  return p[0]+'. '+(+p[1])+'. '+(+p[2]); };
const mmss = s => { s=Math.max(0,Math.round(s||0));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const kgfmt = v => (v==null?'':(Math.round(v*10)/10));

const vaName = vid => { const v=vaOf(vid); if(!v) return vid;

/* ── 회원 목록 ── */
function vMembers(){
  const q = S.q.trim().toLowerCase();
  const all = D.m.filter(x => (x.role||'member')==='member');
  let list = all.slice();
  if(S.who!=='전체') list = list.filter(x => (x.trainer||'')===S.who);
  if(q) list = list.filter(x => (x.name||'').toLowerCase().includes(q));

  const info = m => {
    const ws = D.w.filter(w => w.member_id===m.id && w.done)
                  .sort((a,b)=> a.on_date < b.on_date ? 1 : -1);
    const last = ws[0] ? ws[0].on_date : null;
    return { last, gap: daysAgo(last),
      week: ws.filter(w => daysAgo(w.on_date) < 7).length,
      routines: D.r.filter(r => r.member_id===m.id).length,
      newcm: D.c.filter(c => c.member_id===m.id && !c.read_at).length,
      ask: D.asks.filter(a => a.member_id===m.id && !a.done_at).length,
      today: D.a.find(a => a.member_id===m.id) || null };
  };
  const rows = list.map(m => ({ m, i: info(m) }));
  rows.sort((a,b)=>{ const A=a.i.gap===null?9999:a.i.gap, B=b.i.gap===null?9999:b.i.gap; return B-A; });

  /* 위 요약 띠 — 오늘 볼 것부터 */
  const 오늘수 = rows.filter(o=>o.i.today).length;
  const 요청수 = rows.reduce((a,o)=>a+o.i.ask, 0);
  const 안읽음 = rows.reduce((a,o)=>a+o.i.newcm, 0);
  const 뜸한수 = rows.filter(o=>o.i.gap!==null && o.i.gap>=14).length;
  const 요약 = '<div class="sumbar">'
    + '<div class="sumit"><span class="k2">회원</span><span class="v2">' + rows.length + '</span></div>'
    + '<div class="sumit gold"><span class="k2">오늘 지정</span><span class="v2">' + 오늘수 + '</span></div>'
    + '<div class="sumit warn"><span class="k2">코멘트 요청</span><span class="v2">' + 요청수 + '</span></div>'
    + '<div class="sumit teal"><span class="k2">안 읽은 코멘트</span><span class="v2">' + 안읽음 + '</span></div>'
    + '<div class="sumit warn"><span class="k2">2주 넘게 안 옴</span><span class="v2">' + 뜸한수 + '</span></div>'
    + '</div>';

  if(!rows.length) return 요약 + '<div class="empty">해당하는 회원이 없어요</div>';

  const 상태 = i => i.today ? 'gold' : (i.gap===null ? '' : (i.gap>=14 ? 'warn' : (i.gap>=7 ? 'warn' : 'teal')));
  const 표 = '<div class="mwrap"><table class="mtb"><thead><tr>'
    + '<th style="width:26px"></th><th>이름</th><th>담당</th><th>마지막 운동</th>'
    + '<th class="n">이번 주</th><th class="n">루틴</th><th>봐 주세요</th><th>오늘</th>'
    + '</tr></thead><tbody>'
    + rows.map(function(o){ const m=o.m, i=o.i;
        return '<tr data-m="' + esc(m.id) + '">'
        + '<td><span class="dot2 ' + 상태(i) + '"></span></td>'
        + '<td><div class="nm2">' + esc(m.name) + '</div></td>'
        + '<td><span class="sub3">' + esc(m.trainer||'담당 없음') + '</span></td>'
        + '<td>' + (i.gap===null
            ? '<span class="sub3">기록 없음</span>'
            : '<span style="font-weight:700">' + dayText(i.last) + '</span>'
              + (i.gap>=7 ? ' <span class="tag warn">' + i.gap + '일째</span>' : ''))
          + '</td>'
        + '<td class="n"><span class="numbig ' + (i.week?'':'zero') + '">' + i.week + '</span>'
          + '<span class="sub3">번</span></td>'
        + '<td class="n"><span class="numbig ' + (i.routines?'':'zero') + '">' + i.routines + '</span>'
          + '<span class="sub3">개</span></td>'
        + '<td>' + (i.ask ? '<span class="tag warn">요청 ' + i.ask + '</span> ' : '')
          + (i.newcm ? '<span class="tag teal">안 읽음 ' + i.newcm + '</span>' : '')
          + (!i.ask && !i.newcm ? '<span class="sub3">—</span>' : '') + '</td>'
        + '<td>' + (i.today ? '<span class="tag gold">' + esc(i.today.kind||'지정') + '</span>'
            : '<span class="sub3">—</span>') + '</td>'
        + '</tr>'; }).join('')
    + '</tbody></table></div>';

  return 요약 + 표;
}

/* ── 회원 상세 · 운동 기록 ── 최근 7일 · 달력 · 세트 고치기 */
function weekStrip(){
  const days = [];
  for(let i=6;i>=0;i--) days.push(plusDays(TODAY, -i));
  const WD = ['일','월','화','수','목','금','토'];
  return '<div class="wk">' + days.map(function(d){
    const ws = D.w.filter(w=>w.member_id===S.mid && w.on_date===d);
    const done = ws.filter(w=>w.done);
    const w0 = done[0] || ws[0];
    const wd = WD[new Date(d+'T00:00:00').getDay()];
    return '<button class="wkd ' + (w0?'on':'') + ' ' + (d===TODAY?'today':'') + '"'
      + (w0 ? ' data-day="' + esc(w0.id) + '"' : '') + '>'
      + '<span class="d1">' + wd + '</span>'
      + '<span class="d2">' + (+d.split('-')[2]) + '</span>'
      + '<span class="d3">' + (w0 ? (done.length?'✓':'중') : '&nbsp;') + '</span></button>'; }).join('')
    + '</div>';
}
function calendar(){
  const base = S.calMonth || TODAY.slice(0,7);
  const y = +base.split('-')[0], mo = +base.split('-')[1];
  const first = new Date(y, mo-1, 1), last = new Date(y, mo, 0);
  const pad = first.getDay(), n = last.getDate();
  const p2 = x => String(x).padStart(2,'0');
  const cells = [];
  for(let i=0;i<pad;i++) cells.push(null);
  for(let d=1;d<=n;d++) cells.push(y+'-'+p2(mo)+'-'+p2(d));
  while(cells.length % 7) cells.push(null);
  const WD = ['일','월','화','수','목','금','토'];
  return '<div class="cal"><div class="calhd">'
    + '<span class="m">' + y + '년 ' + mo + '월</span>'
    + '<button class="ib" data-cal="-1">‹</button>'
    + '<button class="ib" data-cal="0">오늘</button>'
    + '<button class="ib" data-cal="1">›</button></div>'
    + '<div class="calgrid">' + WD.map(w=>'<div class="wd">'+w+'</div>').join('')
    + cells.map(function(d){
        if(!d) return '<div></div>';
        const ws = D.w.filter(w=>w.member_id===S.mid && w.on_date===d);
        const as = D.aAll.find(x=>x.member_id===S.mid && x.on_date===d);
        const w0 = ws.filter(w=>w.done)[0] || ws[0];
        const sel = S.day && D.w.find(w=>w.id===S.day && w.on_date===d);
        return '<button class="cd in ' + (w0?'has':'') + ' ' + (sel?'sel':'')
          + ' ' + (d===TODAY?'today':'') + '"'
          + (w0 ? ' data-day="' + esc(w0.id) + '"' : '') + '>'
          + '<span>' + (+d.split('-')[2]) + '</span>'
          + (w0 ? '<span class="dt"></span>' : (as ? '<span class="dt as"></span>' : ''))
          + '</button>'; }).join('')
    + '</div></div>';
}
/* ── 날짜 고르기 — 최근 7일 · 달력 (코멘트 · 식단이 같이 쓴다) ── */
const WDN = ['일','월','화','수','목','금','토'];
function dayWeek(있는날, sel, attr){
  const out = [];
  for(let i=6;i>=0;i--) out.push(plusDays(TODAY, -i));
  return '<div class="wk">' + out.map(function(d){
    const on = 있는날.has(d);
    return '<button class="wkd ' + (on?'on':'off') + ' ' + (d===sel?'sel':'')
      + ' ' + (d===TODAY?'today':'') + '" data-' + attr + '="' + d + '">'
      + '<span class="d1">' + WDN[new Date(d+'T00:00:00').getDay()] + '</span>'
      + '<span class="d2">' + (+d.split('-')[2]) + '</span>'
      + '<span class="d3">' + (on?'●':'&nbsp;') + '</span></button>'; }).join('')
    + '</div>';
}
function dayCal(있는날, sel, attr){
  const base = S.calMonth || (sel||TODAY).slice(0,7);
  const y = +base.split('-')[0], mo = +base.split('-')[1];
  const first = new Date(y, mo-1, 1), last = new Date(y, mo, 0);
  const pad = first.getDay(), n = last.getDate();
  const p2 = x => String(x).padStart(2,'0');
  const cells = [];
  for(let i=0;i<pad;i++) cells.push(null);
  for(let d=1;d<=n;d++) cells.push(y+'-'+p2(mo)+'-'+p2(d));
  while(cells.length % 7) cells.push(null);
  return '<div class="cal"><div class="calhd">'
    + '<span class="m">' + y + '년 ' + mo + '월</span>'
    + '<button class="ib" data-cal="-1">‹</button>'
    + '<button class="ib" data-cal="0">오늘</button>'
    + '<button class="ib" data-cal="1">›</button></div>'
    + '<div class="calgrid">' + WDN.map(w=>'<div class="wd">'+w+'</div>').join('')
    + cells.map(function(d){
        if(!d) return '<div></div>';
        const on = 있는날.has(d);
        return '<button class="cd in ' + (on?'has':'') + ' ' + (d===sel?'sel':'')
          + ' ' + (d===TODAY?'today':'') + '" data-' + attr + '="' + d + '">'
          + '<span>' + (+d.split('-')[2]) + '</span>'
          + (on ? '<span class="dt"></span>' : '')
          + '</button>'; }).join('')
    + '</div></div>';
}

function tabComment(){

                .sort((a,b)=> a.on_date < b.on_date ? 1 : -1);

  const 있는날 = new Set(ws.map(w=>w.on_date));

/* 사진 올리기 — 긴 변 1280px JPEG 로 줄여서 */
async function bpUpload(file){
  if(!file || !S.mid) return;
  if(!/^image\//.test(file.type)){ toast('사진 파일만 넣을 수 있어요'); return; }
  toast('사진을 줄이는 중이에요');
  let blob;
  try{ blob = await 줄이기(file); }catch(e){ toast('사진을 읽지 못했어요'); return; }
  const kind = S.bpKind || 'body';
  const pose = kind==='ai' ? '장비' : (S.bpPose || '정면');
  const de = $('#bpdate');
  const 날 = (de && de.value) || TODAY;
  const id = 'bp' + Date.now();
  const path = 'body/' + S.mid + '/' + id + '.jpg';
  toast('올리는 중이에요');
  try{
    const r = await fetch(SB_URL+'/storage/v1/object/media/'+path, {
      method:'POST',
      headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'image/jpeg' },
      body: blob });
    if(!r.ok) throw new Error(await r.text());
    await ssend('body_photos', 'POST',
      [{ id, member_id:S.mid, kind, pose, on_date:날, path, memo:'' }]);
    M.bph = M.bph || [];
    M.bph.push({ id, member_id:S.mid, kind, pose, on_date:날, path, memo:'' });
    toast('넣었습니다'); render();
  }catch(e){ toast('사진 올리기 실패 — ' + String(e.message||e).slice(0,60)); }
}
function 줄이기(file){
  return new Promise(function(ok, no){
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      const 긴 = Math.max(img.width, img.height), 배 = 긴 > 1280 ? 1280/긴 : 1;
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*배); c.height = Math.round(img.height*배);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : no(new Error('변환 실패')), 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); no(new Error('읽기 실패')); };
    img.src = url;
  });
}
function phBad(el){ const d = document.createElement('div');
  d.className='nophoto'; d.textContent='사진을 불러오지 못했어요';
  el.replaceWith(d); }

/* ── 회원 상세 · 정보 ── 보기 + 고치기 */

  const 짧은칸 = 순서.concat(나머지).filter(k=>짧은.indexOf(k)>=0);
  const 긴칸 = 순서.concat(나머지).filter(k=>짧은.indexOf(k)<0);
  const 식사 = ik.meals && typeof ik.meals==='object' ? Object.keys(ik.meals) : [];

  const 회원 = '<div class="card" style="display:flex;flex-direction:column;gap:9px">'

    + '<div class="fld"><span class="fn">담당 트레이너</span>'
      + '<select class="inp" id="mtr"' + dis('minfo') + '>' + [''].concat(trs).map(t =>

        + esc(t || '담당 없음') + '</option>').join('') + '</select></div>'
    + '</div>'
    + (짧은칸.length ? '<div class="g3">' + 짧은칸.map(ikf).join('') + '</div>' : '')
    + (긴칸.length ? '<div class="g2">' + 긴칸.map(ikf).join('') + '</div>' : '')
    + (식사.length ? '<div class="g3">' + 식사.map(k=>'<div class="fld">'

    + cy.period_len + '일</div></div>' : '';

/* 이 회원에게 이미 지정된 날들 */
function recosOf(mid){
  const g = d => D.aAll.find(x=>x.member_id===mid && x.on_date===d) || null;
  return [ {slot:'먼저 추천', at:RECO1, row:g(RECO1)}, {slot:'나중 추천', at:RECO2, row:g(RECO2)} ]
         .filter(x=>x.row);
}
function assignedList(mid){
  const recos = recosOf(mid);
  const rows = D.aAll.filter(x=>x.member_id===mid && !isReco(x.on_date) && x.on_date>=TODAY)
    .sort((a,b)=> a.on_date < b.on_date ? -1 : 1);

  const 추천 = '<div class="lbl" style="margin-top:8px">다음 개인운동 추천 ' + recos.length + '/2</div>'
    + (recos.length ? recos.map(function(x){ const r0 = D.r.find(y=>y.id===x.row.routine_id);
        return '<div class="card gold rowc" style="padding:9px 11px"><div>'
          + '<div class="t1" style="font-size:13px">' + x.slot + '</div>'
          + '<div class="t2">' + (r0 ? '루틴 ' + r0.no + ' · ' + esc(r0.name) : '루틴 없음') + '</div></div>'
          + '<button class="ib" data-act="asdel" data-d="' + x.at + '">✕</button></div>'; }).join('')
      : '<div class="t2">추천해 둔 루틴이 없어요.</div>');

  const 날짜 = '<div class="lbl" style="margin-top:10px">날짜로 지정해 둔 날</div>'
    + (rows.length ? rows.map(function(x){ const r0 = D.r.find(y=>y.id===x.routine_id);
        return '<div class="card rowc" style="padding:9px 11px"><div>'
          + '<div class="t1" style="font-size:13px">' + dateFull(x.on_date)
          + (x.on_date===TODAY?' · 오늘':'') + '</div>'
          + '<div class="t2">' + esc(x.kind||'') + (r0 ? ' · 루틴 ' + r0.no + ' ' + esc(r0.name) : '')
          + '</div></div>'
          + '<button class="ib" data-act="asdel" data-d="' + esc(x.on_date) + '">✕</button></div>'; }).join('')
      : '<div class="t2">아직 지정한 날이 없어요.</div>');

  return 추천 + 날짜;
}

/* ── 코멘트 모아보기 ── */
function vCmAll(){
  const mine = m => S.who==='전체' || (memOf(m).trainer||'')===S.who;
  const asks = D.asks.filter(a=>!a.done_at && mine(a.member_id));
  const cs = D.c.filter(c=>mine(c.member_id))
    .sort((a,b)=> (a.created_at||'') < (b.created_at||'') ? 1 : -1);

  /* 회원별로 묶는다 */
  const 회원들 = D.m.filter(x=>(x.role||'member')==='member' && mine(x.id));
  const rows = 회원들.map(function(m){
    const mine2 = cs.filter(c=>c.member_id===m.id);
    return { m,
      n: mine2.length,
      unread: mine2.filter(c=>!c.read_at).length,
      ask: asks.filter(a=>a.member_id===m.id).length,
      last: mine2[0] || null };
  }).sort((a,b)=> (b.ask-a.ask) || (b.unread-a.unread)
      || ((b.last?b.last.created_at:'') < (a.last?a.last.created_at:'') ? -1 : 1));

  const 요약 = '<div class="sumbar">'
    + '<div class="sumit warn"><span class="k2">봐 달라는 요청</span><span class="v2">' + asks.length + '</span></div>'
    + '<div class="sumit teal"><span class="k2">안 읽은 코멘트</span><span class="v2">'
      + cs.filter(c=>!c.read_at).length + '</span></div>'
    + '<div class="sumit"><span class="k2">전체 코멘트</span><span class="v2">' + cs.length + '</span></div>'
    + '<div class="sumit gold"><span class="k2">코멘트 없는 회원</span><span class="v2">'
      + rows.filter(x=>!x.n).length + '</span></div>'
    + '</div>';

  const 표 = '<div class="mwrap"><table class="mtb"><thead><tr>'
    + '<th style="width:26px"></th><th>이름</th><th>담당</th><th>마지막 코멘트</th>'
    + '<th class="n">코멘트</th><th class="n">안 읽음</th><th>요청</th>'
    + '</tr></thead><tbody>'
    + rows.map(function(o){ const m=o.m;
        const 점 = o.ask ? 'warn' : (o.unread ? 'teal' : (o.n ? '' : ''));
        return '<tr data-m="' + esc(m.id) + '" data-tab="comment">'
        + '<td><span class="dot2 ' + 점 + '"></span></td>'
        + '<td><div class="nm2">' + esc(m.name) + '</div></td>'
        + '<td><span class="sub3">' + esc(m.trainer||'담당 없음') + '</span></td>'
        + '<td>' + (o.last
            ? '<div style="font-weight:700">' + dateFull((o.last.created_at||'').slice(0,10)) + '</div>'
              + '<div class="sub3" style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
              + esc(vaName(o.last.variant_id)) + ' — ' + esc(o.last.body||'') + '</div>'
            : '<span class="sub3">아직 없음</span>') + '</td>'
        + '<td class="n"><span class="numbig ' + (o.n?'':'zero') + '">' + o.n + '</span></td>'
        + '<td class="n">' + (o.unread ? '<span class="tag teal">' + o.unread + '</span>'
            : '<span class="sub3">—</span>') + '</td>'
        + '<td>' + (o.ask ? '<span class="tag warn">요청 ' + o.ask + '</span>'
            : '<span class="sub3">—</span>') + '</td>'
        + '</tr>'; }).join('')
    + '</tbody></table></div>';

  const 요청 = asks.length ? '<div class="listbox">' + asks.map(a=>'<button class="card click gold rowc" data-m="'
      + esc(a.member_id) + '" data-tab="comment"><div>'
      + '<div class="t1">' + esc(memOf(a.member_id).name) + ' — ' + esc(vaName(a.variant_id)) + '</div>'
      + '<div class="t2">' + esc(a.note||'따로 적은 말은 없습니다') + '</div></div>'
      + '<span class="rt">&rsaquo;</span></button>').join('') + '</div>'
    : '<div class="empty">지금은 요청이 없어요</div>';

  const 최근 = cs.length ? '<div class="listbox">' + cs.slice(0,60).map(c=>'<div class="cm '
      + (c.read_at?'':'new') + '">'
      + '<div class="who2">' + esc(memOf(c.member_id).name) + ' · '
      + dateFull((c.created_at||'').slice(0,10)) + (c.read_at?'':' · 아직 안 읽음')
      + '<button class="del" data-act="cmdel" data-c="' + esc(c.id) + '">지우기</button></div>'
      + '<div class="ex">' + esc(vaName(c.variant_id)) + '</div>'
      + '<div class="tx">' + esc(c.body||'') + '</div></div>').join('') + '</div>'
    : '<div class="empty">아직 코멘트가 없어요</div>';

  return 요약
    + '<div class="cols">'
    + '<div class="sec"><div class="lbl">회원별 코멘트 — 줄을 누르면 그 회원 코멘트로 갑니다</div>'
    + 표 + '</div>'
    + '<div class="sec"><div class="lbl">봐 달라는 요청 ' + asks.length + '건</div>' + 요청
    + '<div class="lbl" style="margin-top:12px">최근 코멘트</div>' + 최근 + '</div></div>';
}

}

/* ── 종목 고르기 팝업 ── */
function popPick(){
  const q = 검색키(S.exq);
  let list = D.ex.slice();
  if(!q && S.part!=='전체') list = list.filter(e=>e.part===S.part);
  if(S.eq!=='전체') list = list.filter(e=>(e.equip||'')===S.eq);
  if(q) list = list.filter(e => exKey(e).includes(q));
  return '<h2>종목 추가 <span style="font-size:12px;font-weight:600;color:var(--sub)">'
    + list.length + '개</span></h2>'
    + '<input class="inp" id="exq" type="text" value="' + esc(S.exq) + '"'
    + ' placeholder="찾기 — 스쿼트 · 레그컬 · bp · 코어 · 햄스트링 · 맨몸">'
    + '<div class="chips" style="margin:0">' + PARTS.map(p =>
        '<button class="chip ' + (S.part===p?'on':'') + '" data-part="' + p + '">' + p + '</button>').join('') + '</div>'
    + '<div class="chips" style="margin:0">' + EQS().map(p =>
        '<button class="chip ' + (S.eq===p?'on':'') + '" data-eq="' + esc(p) + '">' + esc(p) + '</button>').join('') + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:7px">'
    + (list.length ? list.map(function(e){
        const vs = D.va.filter(v=>v.ex_id===e.id).sort((a,b)=>a.sort-b.sort);
        const v0 = vs[0]; if(!v0) return '';
        return '<button class="card click rowc" data-add="' + esc(v0.id) + '">'
          + '<div><div class="t1">' + esc(e.name) + '</div>'
          + '<div class="t2">' + esc(e.part) + ' · ' + esc(e.equip||'')
          + (vs.length>1 ? ' · <span style="color:var(--gold-2)">하는 법 ' + vs.length
              + '가지 — 기록에서 고릅니다</span>' : '') + '</div></div>'
          + '<span class="rt">＋</span></button>'; }).join('')
      : '<div class="empty">찾는 종목이 없어요</div>')
    + '</div><button class="btn ghost" data-act="popclose">닫기</button>';
}

/* ── 그리기 ── */

              ['meal','식단'],['body','체형'],['info','정보']];
function render(){
  const top = $('#top'), line = $('#topline'), b = $('#body');

      + '<div class="chips">'

    top.innerHTML = '<button class="back" data-act="toList">‹</button><h1>' + esc(m.name) + '</h1>'
      + '<span class="cnt">' + esc(m.trainer||'담당 없음') + '</span>';
    top.innerHTML += '<div class="sp">'
      + '<button class="btn sub sm" data-act="wnew">＋ 오늘 운동 기록</button>'
      + '<button class="btn gold sm" data-act="aspick">루틴 지정 · 예약</button></div>';
    line.innerHTML = '<div class="tabs">' + TABS.map(t =>
      '<button class="' + (S.tab===t[0]?'on':'') + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('')
      + '</div>';
    b.innerHTML = S.tab==='routine' ? tabRoutine()
      : S.tab==='record' ? tabRecord()
      : S.tab==='comment' ? tabComment()
      : S.tab==='meal' ? tabMeal()
      : S.tab==='body' ? tabBody() : tabInfo();
  } else if(S.view==='routine'){
    const r = D.r.find(x=>x.id===S.rid) || {no:'',name:''};
    top.innerHTML = '<button class="back" data-act="toMember">‹</button><h1>루틴 ' + r.no + ' · '
      + esc(r.name) + '</h1>';
    b.innerHTML = vRoutine();
  } else if(S.view==='cmall'){
    top.innerHTML = '<h1>코멘트</h1>';
    b.innerHTML = vCmAll();
  } else if(S.view==='today'){
    top.innerHTML = '<h1>오늘</h1><span class="cnt">' + dateFull(TODAY) + '</span>';
    b.innerHTML = vToday();
  }
  const n = D.asks.filter(a=>!a.done_at).length;
  const bd = $('#cmbdg');
  if(n){ bd.textContent = n; bd.style.display=''; } else bd.style.display='none';
  gnbDraw();
}

/* 맨 위 띠 — 누가 보고 있는지 · 알림 개수 */
function alerts(){
  const mine = id => S.who==='전체' || (memOf(id).trainer||'')===S.who;
  const ask = D.asks.filter(a=>!a.done_at && mine(a.member_id));
  const all = D.m.filter(x=>(x.role||'member')==='member' && mine(x.id));
  const cold = all.filter(function(m){
    const ws = D.w.filter(w=>w.member_id===m.id && w.done).sort((a,b)=> a.on_date<b.on_date?1:-1);
    const g = ws[0] ? daysAgo(ws[0].on_date) : null;
    return g===null || g>=7; });
  const unread = D.c.filter(c=>!c.read_at && mine(c.member_id));
  const today = D.w.filter(w=>w.on_date===TODAY && mine(w.member_id));
  return { ask:ask, cold:cold, unread:unread, today:today };
}
function gnbDraw(){
  const a = alerts();
  const n = a.ask.length + a.cold.length;
  const dot = $('#belldot');
  if(n){ dot.textContent = n>99?'99+':n; dot.style.display=''; } else dot.style.display='none';
  $('#gnm').textContent = S.who==='전체' ? '전체 보기' : S.who;
  $('#gav').textContent = S.who==='전체' ? '전' : S.who.slice(-2);
}
function popOpen(html){ $('#popbox').innerHTML = html; $('#pop').classList.add('on'); }
function popClose(){ $('#pop').classList.remove('on'); }

/* ── 불러오기 ── */
async function load(){
  try{
    const g = await Promise.all([
      sget('members?select=*&order=name'),
      sget('workouts?select=id,member_id,on_date,done,title,kind&order=on_date.desc&limit=600'),
      sget('workout_items?select=id,workout_id,variant_id,sort&limit=3000'),
      sget('routines?select=*'),
      sget('routine_items?select=*&order=sort'),
      sget('comments?select=*&order=created_at.desc&limit=600'),
      sget('assignments?select=member_id,on_date,routine_id,kind&on_date=gte.'+TODAY+'&order=on_date'),
      sget('exercises?select=*&order=part,sort'),
      sget('variants?select=*&order=sort'),
      sget('asks?select=*&limit=300').catch(()=>[]),
    ]);
    D.m=g[0]; D.w=g[1]; D.wi=g[2]; D.r=g[3]; D.ri=g[4]; D.c=g[5];
    D.aAll=g[6]; D.a=g[6].filter(x=>x.on_date===TODAY);
    D.ex=g[7]; D.va=g[8]; D.asks=g[9]||[];
    const trs = [...new Set(D.m.map(x=>x.trainer).filter(Boolean))];
    $('#whosel').innerHTML = ['전체'].concat(trs).map(t =>
      '<option value="' + esc(t) + '">' + esc(t==='전체'?'전체 보기':t+' 트레이너') + '</option>').join('');
    $('#whosel').value = S.who;
    render();
  }catch(e){
    $('#body').innerHTML = '<div class="empty">자료를 못 불러왔어요<br>'
      + '<span style="font-size:12px">' + esc(e.message) + '</span></div>';
  }
}

async function loadMember(mid){
  const ws = D.w.filter(w=>w.member_id===mid).map(w=>w.id);
  const inList = a => '(' + a.map(x=>'"'+x+'"').join(',') + ')';
  try{
    const wi = ws.length ? await sget('workout_items?select=*&workout_id=in.'+inList(ws)+'&limit=3000') : [];
    const ids = wi.map(x=>x.id);
    const wsets = ids.length
      ? await sget('workout_sets?select=*&item_id=in.(' + ids.join(',') + ')&limit=9000') : [];
    const g = await Promise.all([
      sget('meals?select=*&member_id=eq.'+mid+'&order=on_date.desc&limit=120'),
      sget('body_logs?select=*&member_id=eq.'+mid),
      sget('body_rounds?select=*&member_id=eq.'+mid),
      sget('body_checks?select=*&member_id=eq.'+mid),
      sget('plans?select=*&member_id=eq.'+mid),
      sget('intake?select=*&member_id=eq.'+mid).catch(()=>[]),
      sget('cycles?select=*&member_id=eq.'+mid).catch(()=>[]),
      sget('body_photos?select=*&member_id=eq.'+mid+'&order=on_date').catch(()=>[]),
    ]);
    const mealIds = g[0].map(x=>x.id);
    const mi = mealIds.length
      ? await sget('meal_items?select=*&meal_id=in.'+inList(mealIds)+'&limit=2000') : [];
    M.wi=wi; M.ws=wsets; M.meals=g[0]; M.mi=mi; M.bl=g[1]; M.br=g[2];
    M.bc=g[3][0]||null; M.plan=g[4][0]||null; M.intake=(g[5]||[])[0]||null; M.cyc=(g[6]||[])[0]||null;
    M.bph=g[7]||[];
  }catch(e){ toast('회원 자료 일부를 못 불러왔어요'); }
  render();
}

/* ── 저장 ── */
async function saveBodyCheck(patch){
  const base = M.bc || { member_id:S.mid, on_date:TODAY, checks:{}, photos:{}, memo:'' };
  const next = Object.assign({}, base, patch, { member_id:S.mid, on_date: base.on_date || TODAY });
  try{
    if(M.bc) await ssend('body_checks?member_id=eq.'+S.mid, 'PATCH',
      { checks:next.checks, memo:next.memo, on_date:next.on_date });
    else await ssend('body_checks', 'POST', [{ member_id:S.mid, on_date:next.on_date,
      checks:next.checks, photos:next.photos||{}, memo:next.memo||'' }]);
    M.bc = next;
  }catch(e){ toast('체형 저장 실패 — ' + e.message); }
}
async function saveItemField(id, f, v){
  const it = D.ri.find(x=>x.id===id); if(!it) return;
  it[f] = v; const body = {}; body[f] = v;
  try{ await ssend('routine_items?id=eq.'+id, 'PATCH', body); }
  catch(e){ toast('저장 실패 — ' + e.message); }
}

/* ── 눌림 ── */
document.addEventListener('click', async function(ev){
  const t = ev.target;

  const nav = t.closest('.nav');
  if(nav){ S.view = nav.dataset.v;
    document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b===nav));
    render(); return; }

  const chip = t.closest('[data-who]');
  if(chip){ S.who = chip.dataset.who; $('#whosel').value = S.who; render(); return; }

  const sw = t.closest('[data-setwho]');
  if(sw){ S.who = sw.dataset.setwho; $('#whosel').value = S.who; popClose();
    if(S.view==='member' || S.view==='routine') S.view='members';
    render(); return; }

  const tab = t.closest('[data-tab]');
  if(tab && !tab.dataset.m){ S.tab = tab.dataset.tab;
    S.edit = { record:false, routine:false, body:false, meal:false, plan:false, minfo:false };
    render(); return; }

  const card = t.closest('[data-m]');
  if(card){ S.mid = card.dataset.m; S.view='member';
    S.tab = card.dataset.tab || 'routine'; S.day=null; S.cmex=null; S.cmw=null; S.cmopen=null;
    S.cday=null; S.mday=null; S.cmprev=null; S.calMonth=null;
    S.edit = { record:false, routine:false, body:false, meal:false, plan:false, minfo:false };
    M.wi=[];M.ws=[];M.meals=[];M.mi=[];M.bl=[];M.br=[];M.bc=null;M.plan=null;M.intake=null;M.cyc=null;M.bph=[];
    render(); loadMember(S.mid); return; }

  const day = t.closest('[data-day]');
  if(day){ S.day = day.dataset.day; render(); return; }

  const rcard = t.closest('[data-r]');
  if(rcard && rcard.tagName!=='INPUT' && rcard.dataset.r && rcard.dataset.r.indexOf('r')===0){
    S.rid = rcard.dataset.r; S.view='routine'; render(); return; }

  const chk = t.closest('[data-chk]');
  if(chk){
    const k = chk.dataset.chk, v = chk.dataset.val;
    const cur = Object.assign({}, (M.bc && M.bc.checks) || {});
    if(v) cur[k] = v; else delete cur[k];
    await saveBodyCheck({ checks: cur });
    render(); return;
  }

  const kd = t.closest('[data-kind]');
  if(kd){ S.kind = kd.dataset.kind;
    if($('#pop').classList.contains('on')){
      const box=$('#popbox');
      box.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('on', b===kd));
    } else render();
    return; }

  const bpk = t.closest('[data-bpk]');
  if(bpk){ S.bpKind = bpk.dataset.bpk; render(); return; }
  const bpp = t.closest('[data-bpp]');
  if(bpp){ S.bpPose = bpp.dataset.bpp; render(); return; }

  const cd = t.closest('[data-cday]');
  if(cd){ S.cday = cd.dataset.cday; S.cmw = null; S.cmopen = null; S.cmprev = null; render(); return; }
  const md = t.closest('[data-mday]');
  if(md){ S.mday = md.dataset.mday; render(); return; }

  const cw = t.closest('[data-cmw]');
  if(cw){ S.cmw = cw.dataset.cmw; S.cmopen = null; S.cmprev = null;
    const w0 = D.w.find(x=>x.id===S.cmw);
    if(w0){ S.cday = w0.on_date; S.calMonth = w0.on_date.slice(0,7); }
    render(); return; }

  const eb = t.closest('[data-edit]');
  if(eb){ const k = eb.dataset.edit; S.edit[k] = !S.edit[k];
    if(!S.edit[k]) toast('잠갔습니다'); render(); return; }

  const cal = t.closest('[data-cal]');
  if(cal){
    const d = +cal.dataset.cal;
    const base = S.calMonth || TODAY.slice(0,7);
    if(d===0) S.calMonth = TODAY.slice(0,7);
    else { const y=+base.split('-')[0], m=+base.split('-')[1]+d;
      const dt=new Date(y, m-1, 1);
      S.calMonth = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
    render(); return;
  }

  const wr = t.closest('[data-wr]');
  if(wr){
    const rid = wr.dataset.wr;
    const r0 = rid ? D.r.find(x=>x.id===rid) : null;
    const wid = 'w'+Date.now();
    try{
      await ssend('workouts', 'POST', [{ id:wid, member_id:S.mid, on_date:TODAY,
        kind:S.kind, routine_id: rid||null, title: r0 ? ('루틴 '+r0.no+' · '+r0.name) : '빈 운동',
        dur:0, done:false }]);
      const items = r0 ? D.ri.filter(x=>x.routine_id===rid).sort((a2,b)=>a2.sort-b.sort) : [];
      if(items.length){
        const made = await ssend('workout_items', 'POST', items.map((it,i)=>({
          workout_id:wid, sort:i, variant_id:it.variant_id, sec:0, locked:false })),
          'return=representation');
        const rows = [];
        made.forEach(function(mi,i){
          const src = items[i], n = Math.max(1, src.sets||1);
          for(let k=0;k<n;k++) rows.push({ item_id:mi.id, sort:k,
            kg:src.kg, reps:src.reps, spd:null, done:false });
        });
        if(rows.length) await ssend('workout_sets', 'POST', rows);
      }
      popClose(); toast('오늘 운동을 만들었어요');
      D.w.unshift({ id:wid, member_id:S.mid, on_date:TODAY, done:false,
        title: r0 ? ('루틴 '+r0.no+' · '+r0.name) : '빈 운동', kind:S.kind });
      S.tab='record'; S.day=wid; render(); await loadMember(S.mid);
    }catch(e){ toast('만들기 실패 — ' + e.message); }
    return;
  }

  const ad = t.closest('[data-adate]');
  if(ad){ S.asDate = ad.dataset.adate; render(); return; }

  const part = t.closest('[data-part]');
  if(part){ S.part = part.dataset.part; popOpen(popPick()); return; }
  const eqc = t.closest('[data-eq]');
  if(eqc){ S.eq = eqc.dataset.eq; popOpen(popPick()); return; }

  const add = t.closest('[data-add]');
  if(add){
    const vid = add.dataset.add;
    const items = D.ri.filter(x=>x.routine_id===S.rid);
    try{
      const made = await ssend('routine_items', 'POST',
        [{ routine_id:S.rid, sort:items.length, variant_id:vid, kg:20, reps:10, sets:3, rest:60 }],
        'return=representation');
      D.ri.push(made[0]); toast(vaName(vid) + ' 담았어요'); render();
    }catch(e){ toast('추가 실패 — ' + e.message); }
    return;
  }

  const act = t.closest('[data-act]');
  if(!act){ if(t.id==='pop') popClose(); return; }
  const a = act.dataset.act, id = +act.dataset.i;

  if(a==='toList'){ S.view='members'; render(); return; }
  if(a==='toMember'){ S.view='member'; render(); return; }
  if(a==='popclose'){ popClose(); return; }
  if(a==='expick'){ S.exq=''; S.part='전체'; S.eq='전체'; popOpen(popPick()); return; }

  /* 체형 — 검사 체크 */
  if(a==='bcmemo'){
    const el = $('#bcmemo'); if(!el) return;
    await saveBodyCheck({ memo: el.value });
    S.edit.body = false;
    toast('메모를 저장하고 잠갔어요'); render(); return;
  }
  if(a==='brsave'){
    const bc = M.bc;
    if(!bc || !bc.checks || !Object.keys(bc.checks).length){ toast('먼저 검사를 체크해 주세요'); return; }
    const id = 'br_' + S.mid + '_' + Date.now();
    try{
      await ssend('body_rounds', 'POST', [{ id:id, member_id:S.mid, on_date:TODAY,
        checks: bc.checks, note: bc.memo || '' }]);
      M.br.push({ id:id, member_id:S.mid, on_date:TODAY, checks:bc.checks, note:bc.memo||'' });
      S.edit.body = false;
      toast('오늘 회차로 남기고 잠갔어요'); render();
    }catch(e){ toast('저장 실패 — ' + e.message); }
    return;
  }
  if(a==='brload'){
    const r0 = M.br.find(x=>x.id===act.dataset.b); if(!r0) return;
    await saveBodyCheck({ checks: r0.checks, memo: r0.note || '' });
    toast('그 회차를 지금 검사로 불러왔어요'); render(); return;
  }
  /* 인바디 */
  if(a==='bpadd'){
    const f = $('#bpfile'); if(!f) return;
    f.value = ''; f.onchange = () => bpUpload(f.files[0]);
    f.click(); return;
  }
  if(a==='bpdel'){
    const id = act.dataset.b;
    const x = (M.bph||[]).find(y=>y.id===id); if(!x) return;
    if(!confirm(dateFull(x.on_date) + ' 사진을 지울까요? 되돌릴 수 없습니다.')) return;
    try{
      await ssend('body_photos?id=eq.'+id, 'DELETE');
      fetch(SB_URL+'/storage/v1/object/media/'+x.path,
        { method:'DELETE', headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY } }).catch(()=>{});
      M.bph = M.bph.filter(y=>y.id!==id);
      toast('지웠습니다'); render();
    }catch(e){ toast('지우기 실패 — ' + e.message); }
    return;
  }
  if(a==='blnew'){
    const id = 'bl_' + S.mid + '_' + Date.now();
    try{
      await ssend('body_logs', 'POST', [{ id:id, member_id:S.mid, on_date:TODAY,
        w:null, m:null, f:null, fp:null, note:'' }]);
      M.bl.push({ id:id, member_id:S.mid, on_date:TODAY, w:null, m:null, f:null, fp:null, note:'' });
      toast('줄을 하나 만들었어요 · 숫자를 적어 주세요'); render();
    }catch(e){ toast('만들기 실패 — ' + e.message); }
    return;
  }
  if(a==='bldel'){
    const bid = act.dataset.b;
    if(!confirm('이 인바디 기록을 지울까요?')) return;
    try{ await ssend('body_logs?id=eq.'+bid, 'DELETE');
      M.bl = M.bl.filter(x=>x.id!==bid); toast('지웠습니다'); render(); }
    catch(e){ toast('지우기 실패 — ' + e.message); }
    return;
  }
  /* 운동계획 */
  if(a==='plsave'){
    const g = k => { const el=document.querySelector('[data-pl="'+k+'"]'); return el?el.value.trim():''; };
    const num = v => { const n=parseFloat(String(v).replace(/[^0-9.]/g,'')); return isNaN(n)?null:n; };
    const data = Object.assign({}, (M.plan && M.plan.data) || {});
    data.goal = g('goal'); data.wk = g('wk'); data.mo = g('mo'); data.diet = g('diet');
    data.now = Object.assign({}, data.now||{}, { w:num(g('now.w')), m:num(g('now.m')), fp:num(g('now.fp')) });
    data.to  = Object.assign({}, data.to||{},  { w:num(g('to.w')), fp:num(g('to.fp')), date:g('to.date') });
    try{
      if(M.plan) await ssend('plans?member_id=eq.'+S.mid, 'PATCH', { data:data });
      else await ssend('plans', 'POST', [{ member_id:S.mid, data:data }]);
      M.plan = { member_id:S.mid, data:data };
      S.edit.plan = false;
      toast('운동계획을 저장하고 잠갔어요'); render();
    }catch(e){ toast('저장 실패 — ' + e.message); }
    return;
  }
  /* 회원 정보 */
  if(a==='msave'){
    const tr = $('#mtr') ? $('#mtr').value : '', nm = $('#mnm') ? $('#mnm').value.trim() : '';
    const m = D.m.find(x=>x.id===S.mid); if(!m) return;
    /* 문진 — 화면에 있는 칸을 그대로 담는다 */
    const 원래 = (M.intake && M.intake.data) ? M.intake.data : {};
    const data = Object.assign({}, 원래);
    document.querySelectorAll('[data-ik]').forEach(function(el){
      const k = el.dataset.ik, v = el.value.trim();
      if(Array.isArray(원래[k])) data[k] = v ? v.split('·').map(x=>x.trim()).filter(Boolean) : [];
      else if(typeof 원래[k] === 'number'){ const n = parseFloat(v.replace(/[^0-9.]/g,'')); data[k] = isNaN(n)?null:n; }
      else data[k] = v;
    });
    const ml = {};
    document.querySelectorAll('[data-ikm]').forEach(el => { ml[el.dataset.ikm] = el.value.trim(); });
    if(Object.keys(ml).length) data.meals = ml;
    try{
      await ssend('members?id=eq.'+S.mid, 'PATCH', { trainer:tr, name:nm||m.name });
      m.trainer = tr; if(nm) m.name = nm;
      if(document.querySelector('[data-ik],[data-ikm]')){
        if(M.intake) await ssend('intake?member_id=eq.'+S.mid, 'PATCH', { data:data });
        else await ssend('intake', 'POST', [{ member_id:S.mid, data:data }]);
        M.intake = { member_id:S.mid, data:data };
      }
      S.edit.minfo = false;
      toast('회원 정보를 저장하고 잠갔어요'); render();
    }catch(e){ toast('저장 실패 — ' + e.message); }
    return;
  }

  /* 달력 넘기기 */
  if(act.dataset.cal!==undefined){ }
  /* 오늘 운동 만들기 */
  if(a==='wnew'){
    const rs = D.r.filter(x=>x.member_id===S.mid).sort((a2,b)=>a2.no-b.no);
    popOpen('<h2>오늘 운동 기록 만들기</h2>'
      + '<div class="note">루틴을 고르면 그 종목과 세트가 그대로 담깁니다. 빈 운동으로 시작해도 됩니다.</div>'
      + '<div class="chips" style="margin:0">'
      + ['수업','개인운동'].map(k=>'<button class="chip ' + (S.kind===k?'on':'') + '" data-kind="'
          + k + '">' + k + '</button>').join('') + '</div>'
      + rs.map(r0=>'<button class="card click rowc" data-wr="' + esc(r0.id) + '"><div>'
          + '<div class="t1">루틴 ' + r0.no + ' · ' + esc(r0.name) + '</div>'
          + '<div class="t2">' + D.ri.filter(x=>x.routine_id===r0.id).length + '종목</div></div>'
          + '<span class="rt">&rsaquo;</span></button>').join('')
      + '<button class="card click rowc" data-wr=""><div><div class="t1">빈 운동으로</div>'
      + '<div class="t2">종목 없이 만들고 나중에 담기</div></div><span class="rt">&rsaquo;</span></button>'
      + '<button class="btn ghost" data-act="popclose">닫기</button>');
    return;
  }
  /* 루틴 골라 지정 */
  if(a==='aspick'){
    const rs = D.r.filter(x=>x.member_id===S.mid).sort((a2,b)=>a2.no-b.no);
    if(!rs.length){ toast('먼저 루틴을 만들어 주세요'); return; }
    popOpen('<h2>루틴 지정 · 예약</h2>'
      + '<div class="note">루틴을 고르면 그 루틴 화면에서 <b>날짜와 종류</b>를 정합니다.</div>'
      + rs.map(r0=>'<button class="card click rowc" data-r="' + esc(r0.id) + '"><div>'
          + '<div class="t1">루틴 ' + r0.no + ' · ' + esc(r0.name) + '</div>'
          + '<div class="t2">' + esc(r0.purpose||'') + '</div></div>'
          + '<span class="rt">&rsaquo;</span></button>').join('')
      + '<button class="btn ghost" data-act="popclose">닫기</button>');
    return;
  }
  /* 세트 */
  if(a==='setadd'){
    const itId = +act.dataset.it;
    const sets = M.ws.filter(x=>x.item_id===itId);
    const last = sets[sets.length-1];
    try{
      const made = await ssend('workout_sets', 'POST', [{ item_id:itId, sort:sets.length,
        kg:last?last.kg:20, reps:last?last.reps:10, spd:null, done:true }], 'return=representation');
      M.ws.push(made[0]); toast('세트를 넣었어요'); render();
    }catch(e){ toast('넣기 실패 — ' + e.message); }
    return;
  }
  if(a==='setdel'){
    const sid = +act.dataset.s;
    M.ws = M.ws.filter(x=>x.id!==sid); render();
    try{ await ssend('workout_sets?id=eq.'+sid, 'DELETE'); }catch(e){ toast('지우기 실패'); }
    return;
  }
  if(a==='asdel'){
    const r = D.r.find(x=>x.id===S.rid); if(!r) return;
    const day = act.dataset.d;
    try{
      await ssend('assignments?member_id=eq.'+r.member_id+'&on_date=eq.'+day, 'DELETE');
      D.aAll = D.aAll.filter(x=>!(x.member_id===r.member_id && x.on_date===day));
      D.a = D.aAll.filter(x=>x.on_date===TODAY);
      toast('지정을 풀었습니다'); render();
    }catch(e){ toast('풀기 실패 — ' + e.message); }
    return;
  }
  if(a==='cmopen'){
    const v = act.dataset.v;
    S.cmopen = (S.cmopen===v) ? null : v;
    render();
    const ta = $('#cmtx'); if(ta) ta.focus();
    return;
  }
  if(a==='cmprev'){
    const v = act.dataset.v; S.cmprev = (S.cmprev===v) ? null : v; render(); return;
  }
  if(a==='cmdel'){
    const cid = act.dataset.c;
    if(!confirm('이 코멘트를 지울까요?')) return;
    try{ await ssend('comments?id=eq.'+cid, 'DELETE');
      D.c = D.c.filter(x=>x.id!==cid); toast('지웠습니다'); render(); }
    catch(e){ toast('지우기 실패 — ' + e.message); }
    return;
  }
  if(a==='cmsend'){
    const ta = $('#cmtx');
    const vid = act.dataset.v || S.cmopen;
    const tx = ta ? ta.value.trim() : '';
    if(!vid || !tx){ toast('내용을 적어 주세요'); return; }
    const who = S.who==='전체' ? (memOf(S.mid).trainer||'트레이너') : S.who;
    const cid = 'c'+Date.now();
    try{
      await ssend('comments', 'POST', [{ id:cid, member_id:S.mid, variant_id:vid,
        workout_id: S.cmw || null, trainer:who, body:tx, pics:0, vids:0 }]);
      D.c.unshift({ id:cid, member_id:S.mid, variant_id:vid, workout_id:S.cmw||null,
        trainer:who, body:tx, read_at:null, created_at:new Date().toISOString() });
      const open = D.asks.filter(x=>x.member_id===S.mid && x.variant_id===vid && !x.done_at);
      if(open.length){
        await ssend('asks?id=in.(' + open.map(x=>x.id).join(',') + ')', 'PATCH',
          { done_at: new Date().toISOString() });
        open.forEach(x=>x.done_at = new Date().toISOString());
      }
      if(ta) ta.value=''; S.cmopen=null;
      toast('보냈습니다 · 회원 화면에 바로 떠요'); render();
    }catch(e){ toast('보내기 실패 — ' + e.message); }
    return;
  }

  if(a==='up' || a==='down'){
    const items = D.ri.filter(x=>x.routine_id===S.rid).sort((a2,b)=>a2.sort-b.sort);
    const i = items.findIndex(x=>x.id===id), j = i + (a==='up'?-1:1);
    if(i<0 || j<0 || j>=items.length) return;
    const s1 = items[i].sort; items[i].sort = items[j].sort; items[j].sort = s1;
    render();
    try{
      await ssend('routine_items?id=eq.'+items[i].id, 'PATCH', {sort:items[i].sort});
      await ssend('routine_items?id=eq.'+items[j].id, 'PATCH', {sort:items[j].sort});
    }catch(e){ toast('순서 저장 실패'); }
    return;
  }
  if(a==='del'){
    D.ri = D.ri.filter(x=>x.id!==id); render();
    try{ await ssend('routine_items?id=eq.'+id, 'DELETE'); }catch(e){ toast('빼기 실패'); }
    return;
  }
  if(a==='rsave'){
    const r = D.r.find(x=>x.id===S.rid); if(!r) return;
    const get = k => { const el=document.querySelector('[data-r="'+k+'"]'); return el?el.value.trim():''; };
    const no = parseInt(get('no').replace(/[^0-9]/g,''),10);
    if(!isNaN(no) && no>0){
      const dup = D.r.find(x=>x.member_id===r.member_id && x.id!==r.id && x.no===no);
      if(dup){ toast('루틴 ' + no + '번은 「' + dup.name + '」이 쓰고 있어요'); return; }
      r.no = no;
    }
    r.name = get('name') || r.name; r.purpose = get('purpose'); r.grp = get('grp');
    try{ await ssend('routines?id=eq.'+r.id, 'PATCH',
        { no:r.no, name:r.name, purpose:r.purpose, grp:r.grp });
      S.edit.routine = false;
      toast('저장하고 잠갔어요'); render();
    }catch(e){ toast('저장 실패 — ' + e.message); }
    return;
  }
  if(a==='rnew'){
    const rs = D.r.filter(x=>x.member_id===S.mid);
    const used = rs.map(x=>x.no); let no=1; while(used.includes(no)) no++;
    const id2 = 'r'+Date.now();
    try{
      await ssend('routines', 'POST',
        [{ id:id2, member_id:S.mid, no:no, name:'새 루틴 '+no, purpose:'', grp:'' }]);
      D.r.push({ id:id2, member_id:S.mid, no:no, name:'새 루틴 '+no, purpose:'', grp:'' });
      S.rid = id2; S.view='routine'; toast('새 루틴을 만들었어요'); render();
    }catch(e){ toast('만들기 실패 — ' + e.message); }
    return;
  }
  if(a==='rdel'){
    const r = D.r.find(x=>x.id===S.rid); if(!r) return;
    if(!confirm('루틴 ' + r.no + ' · ' + r.name + ' 을 지울까요? 되돌릴 수 없습니다.')) return;
    try{
      await ssend('routine_items?routine_id=eq.'+r.id, 'DELETE');
      await ssend('routines?id=eq.'+r.id, 'DELETE');
      D.ri = D.ri.filter(x=>x.routine_id!==r.id);
      D.r = D.r.filter(x=>x.id!==r.id);
      S.view='member'; S.tab='routine'; toast('지웠습니다'); render();
    }catch(e){ toast('지우기 실패 — ' + e.message); }
    return;
  }
  if(a==='reco'){
    const r = D.r.find(x=>x.id===S.rid); if(!r) return;
    const mid = r.member_id;
    const 먼저 = D.aAll.find(x=>x.member_id===mid && x.on_date===RECO1);
    const 나중 = D.aAll.find(x=>x.member_id===mid && x.on_date===RECO2);
    if((먼저 && 먼저.routine_id===r.id) || (나중 && 나중.routine_id===r.id)){
      toast('이미 추천해 둔 루틴이에요'); return; }
    const 자리 = 먼저 ? RECO2 : RECO1;
    const 밀림 = (자리===RECO2 && 나중) ? D.r.find(x=>x.id===나중.routine_id) : null;
    try{
      await ssend('assignments', 'POST',
        [{ member_id:mid, on_date:자리, routine_id:r.id, kind:'개인운동', assigned_by:'트레이너' }],
        'resolution=merge-duplicates');
      D.aAll = D.aAll.filter(x=>!(x.member_id===mid && x.on_date===자리));
      D.aAll.push({ member_id:mid, on_date:자리, routine_id:r.id, kind:'개인운동' });
      toast(밀림 ? '나중 자리를 「' + 밀림.name + '」에서 바꿨어요'
                 : (자리===RECO1 ? '먼저 추천으로 담았어요' : '나중 추천으로 담았어요'));
      render();
    }catch(e){ toast('추천 실패 — ' + e.message); }
    return;
  }
  if(a==='assign'){
    const r = D.r.find(x=>x.id===S.rid); if(!r) return;
    try{
      const el = document.getElementById('asdate');
      const day = (el && el.value) || S.asDate || TODAY;
      await ssend('assignments', 'POST',
        [{ member_id:r.member_id, on_date:day, routine_id:r.id, kind:S.kind, assigned_by:'트레이너' }],
        'resolution=merge-duplicates');
      D.aAll = D.aAll.filter(x=>!(x.member_id===r.member_id && x.on_date===day));
      D.aAll.push({ member_id:r.member_id, on_date:day, routine_id:r.id, kind:S.kind });
      D.a = D.aAll.filter(x=>x.on_date===TODAY);
      S.asDate = day;
      toast((day===TODAY?'오늘 ':dateFull(day)+' ') + S.kind + '으로 지정했습니다'); render();
    }catch(e){ toast('지정 실패 — ' + e.message); }
    return;
  }
});

/* 입력 */
let mnT = null;
document.addEventListener('input', function(ev){
  const el = ev.target;
  if(el.id==='q'){ S.q = el.value; $('#body').innerHTML = vMembers(); return; }
  if(el.id==='exq'){ S.exq = el.value;
    const box=$('#popbox'), pos=el.selectionStart;
    box.innerHTML = popPick();
    const n=box.querySelector('#exq'); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
    return; }
  if(el.dataset.mn){
    const id = el.dataset.mn, v = el.value;
    clearTimeout(mnT);
    mnT = setTimeout(async function(){
      try{ await ssend('meals?id=eq.'+id, 'PATCH', { trainer_note: v });
        const m = M.meals.find(x=>x.id===id); if(m) m.trainer_note = v;
        toast('한마디 저장했어요');
      }catch(e){ toast('저장 실패'); }
    }, 700);
    return; }
  if(el.dataset.bl){                       /* 인바디 줄 */
    const id = el.dataset.bl, fld = el.dataset.bf, raw = el.value;
    const row = M.bl.find(x=>x.id===id); if(!row) return;
    let v;
    if(fld==='note' || fld==='on_date') v = raw.trim();
    else { const n = parseFloat(raw.replace(/[^0-9.]/g,'')); v = isNaN(n) ? null : n; }
    row[fld] = v;
    clearTimeout(mnT);
    mnT = setTimeout(async function(){
      const body = {}; body[fld] = v;
      try{ await ssend('body_logs?id=eq.'+id, 'PATCH', body); }catch(e){ toast('저장 실패'); }
    }, 600);
    return;
  }
  if(el.dataset.st){                       /* 세트 값 */
    const id = +el.dataset.st, fld = el.dataset.sf;
    const n = parseFloat((el.value||'').replace(/[^0-9.]/g,''));
    const v = isNaN(n) ? null : (fld==='kg' ? Math.round(n*10)/10 : Math.round(n));
    const row = M.ws.find(x=>x.id===id); if(row) row[fld] = v;
    clearTimeout(mnT);
    mnT = setTimeout(async function(){
      const body = {}; body[fld] = v; body.done = true;
      try{ await ssend('workout_sets?id=eq.'+id, 'PATCH', body); }catch(e){ toast('저장 실패'); }
    }, 600);
    return;
  }
  if(el.dataset.ml){                       /* 식단 영양 */
    const id = el.dataset.ml, fld = el.dataset.mf;
    const n = parseFloat((el.value||'').replace(/[^0-9.]/g,''));
    const v = isNaN(n) ? null : n;
    const row = M.meals.find(x=>x.id===id); if(row) row[fld] = v;
    clearTimeout(mnT);
    mnT = setTimeout(async function(){
      const body = {}; body[fld] = v;
      try{ await ssend('meals?id=eq.'+id, 'PATCH', body); }catch(e){ toast('저장 실패'); }
    }, 600);
    return;
  }
  const f = el.dataset.f, i = +el.dataset.i;
  if(f && i){
    const v = parseFloat((el.value||'').replace(/[^0-9.]/g,''));
    if(!isNaN(v)) saveItemField(i, f, f==='kg' ? Math.round(v*10)/10 : Math.round(v));
  }
});
document.addEventListener('change', function(ev){
  if(ev.target.id==='cmex'){ S.cmex = ev.target.value; }
});
$('#whosel').addEventListener('change', function(e){ S.who = e.target.value;
  if(S.view!=='member' && S.view!=='routine') render(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') popClose(); });
$('#pop').addEventListener('click', function(e){ if(e.target.id==='pop') popClose(); });

/* ── 뒤로가기 ── 브라우저 뒤로 버튼으로 앞 화면으로 돌아간다 */
function stamp(){
  return { view:S.view, mid:S.mid, rid:S.rid, tab:S.tab, who:S.who, day:S.day };
}
function 되돌리기(st){
  if(!st) return;
  const 회원바뀜 = st.mid !== S.mid;
  S.view=st.view; S.mid=st.mid; S.rid=st.rid; S.tab=st.tab||'routine';
  S.who=st.who||S.who; S.day=st.day||null;
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',
    b.dataset.v===(st.view==='member'||st.view==='routine' ? 'members' : st.view)));
  render();
  if(st.mid && 회원바뀜) loadMember(st.mid);
}
let 첫칸 = true;
function push(){
  const st = stamp();
  const 지금 = history.state;
  if(지금 && 지금.view===st.view && 지금.mid===st.mid && 지금.rid===st.rid && 지금.tab===st.tab) return;
  if(첫칸){ history.replaceState(st, ''); 첫칸=false; }
  else history.pushState(st, '');
}
window.addEventListener('popstate', function(e){
  if(e.state) 되돌리기(e.state);
  else { S.view='members'; S.mid=null; S.rid=null; render(); }
});

/* 화면을 그릴 때마다 자리를 남긴다 */
const _render = render;
render = function(){ _render(); push(); };

load();
setInterval(function(){ if(S.view==='members'||S.view==='today'||S.view==='cmall') load(); }, 60000);
</script>
